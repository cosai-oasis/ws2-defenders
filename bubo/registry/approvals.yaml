# Governance mail threads, curated: what each call decides, and for publications, which
# works it approves and in what role. Read by `python -m bubo_graphrag.ingest.approvals`,
# which writes reports/approvals.md. Its proposals are in approvals.seed.yaml, which it
# regenerates on every run; this file it only reads.
#
# Keys are thread keys: a call's subject lowercased, with list tags, reply prefixes,
# "Action Required", reminders, deadlines and punctuation removed. A key no longer found
# in the archive is reported, so a subject change cannot silently drop a link.
#
# subject_matter: publication | blog | people | governance | other
#
# For a publication thread, each entry under `works` gives the work and its role:
#   as: new       the call approves the work itself, first time
#   as: revision  the call approves a revision of an already approved work. Per the
#                 MCP v2 call, a revision "is not a new work item" and needs only TSC
#                 consensus, so it never stands in for the original approval.
#   as: addition  the call approves the work as an addition to another approved work,
#                 named by `to:`. Like a revision it needs only TSC consensus, and the
#                 work takes its standing from the one it is added to.
# The thread's stage (review period, ballot, call for consensus, notice) comes from the
# subject, so a review period links its works without counting as an approval.
#
# `unregistered` names a work the calls approve that publications.yaml does not hold
# yet, by title, so the report can say so.
#
# Where a link needed more than the subject, the basis is given. Bodies were read to
# curate but are never copied here.

