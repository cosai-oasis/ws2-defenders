    canonical_name: Thomson Reuters
    email_domains: [thomsonreuters.com]

  # "Trend AI" is a recent rebranding and a subcompany of the parent that owns Trend
  # Micro: one organization for attribution. Confirmed by the maintainer 2026-09-11 --
  # no evidence in the corpus establishes this, since "Trend AI" appears exactly once
  # (Parthy Chandransekakan in zero-trust-for-ai-systems) with no address, so the
  # string comparison correctly refused to merge it and a human supplied the fact.
  #
  # If the subsidiary structure ever needs to be distinguished rather than collapsed,
  # CCO has the predicate for it: cco:ont00001992 "has organizational context" relates
  # a subcompany to its parent without asserting they are the same organization.
  - id: trend-micro
    canonical_name: Trend Micro
    variants: [Trend Micro, TrendMicro, Trend AI]
    email_domains: [trendmicro.com]
    merge_provenance:
      - variant: Trend AI
        basis: maintainer-confirmed
        date: 2026-09-11
        note: recent rebranding; subcompany of the Trend Micro parent

  - id: wiz
    canonical_name: Wiz
    email_domains: [wiz.io]

  - id: zscaler
    canonical_name: Zscaler
