# Reviewed organization registry. Promoted from organizations.seed.yaml with the
# judgment calls made by hand -- see the notes on individual entries.
#
# `variants` are credit-line spellings that name this organization. `email_domains`
# are domains whose addresses imply affiliation with it. Both are used as merge
# evidence; neither is inferred at build time.

# Domains belonging to an individual rather than an employer. An address at one of
# these is NOT affiliation evidence: Anton Chuvakin writes from his own domain while
# employed elsewhere, so treating chuvakin.org as his employer would be wrong. Listed
# separately from the generic free-mail providers in resolve/identity.py because these
# are specific to this corpus.
personal_domains:
  - chuvakin.org

organizations:
  - id: adversa-ai
    canonical_name: Adversa AI
    email_domains: [adversa.ai]

  - id: ai-identity
    canonical_name: AI Identity

  - id: amazon
    canonical_name: Amazon
    email_domains: [amazon.com]

  - id: anthropic
    canonical_name: Anthropic
    email_domains: [anthropic.com]

