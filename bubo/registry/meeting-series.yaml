# Curated meeting series. Reviewed once; thereafter every build is deterministic.
#
# Series names drift, so identity cannot be derived from a title. This registry is the
# same human-review gate registry/people.yaml and organizations.yaml pass through, for
# the same reason: a wrong merge is a wrong fact, and here it would silently combine
# two groups' meeting histories.
#
# Two evidence sources are kept separate on purpose:
#
#   name_variants      Observed verbatim in list-mail subjects. The audit trail.
#   drive_title_forms  Declared by cosai-tsc scripts/fetch_meeting_minutes.py, which
#                      resolves the same drift independently -- it documents WS1 as
#                      "renamed from CoSAI WS1 Weekly Meeting to CoSAI WS1 Meeting
#                      (updated)". Corroboration for a merge, and the match key for
#                      the Drive minutes of B-double-prime.
#
# Where the two disagree, neither is overwritten. `review` records what a human still
# has to confirm.
#
# What a merge rests on. Every entry was reviewed against the full list archives
# (2,886 messages, 2024-06-20 to 2026-09-24) by list, weekday and first and last date:
#
#   * Same group, same weekday, overlapping dates, the name differing only in prefix,
#     word order or case: one series.
#   * A rename in sequence with no overlap, where the group's main meeting ends under
#     one name and begins under the next: one series. `meeting_rhythm` detects the
#     cadence change inside a series, so merging loses nothing, and "how often does
#     WS3 meet" is answered across the whole history instead of per name.
#   * Two series running in the same weeks: kept apart, whatever the names share.
#
# `workstream`, `kind` and `cadence` here override what the mail implies. A series'
# convener would otherwise be taken from whichever message arrived first, and for a
# series first seen on the project-wide `cosai-op` list that is no group at all. A
# series whose `kind` is `sig` gets a SIG node; any other kind does not, whatever its
# title says. `cadence` is the current one: a merged series carries every era's RRULE.
#
# `lists` is where the group announces, and its first entry is the series' source list,
# the one `how_to_get_involved` tells a newcomer to join. It never names `cosai-op`: that
# list is project-wide and carries cross-posted cancellations, so a series seen there
# was not announced there.
#
# `status` and `succeeded_by` are curator statements, not evidence from mail: a group
# whose announcements stop may have ended or may only have stopped announcing, and
# the mail cannot tell the two apart. `status: inactive` carries `status_as_of`, the
# date it was stated. `succeeded_by` names the series whose group continues this one.
#
# `workstream: general` marks a project-wide event cross-posted to every list, which
# no single group convenes. It is left without a convener rather than given a guess.

meeting_series:

