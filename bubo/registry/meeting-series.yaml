    # to 2025-04-02, "normal meeting - bi-weekly" from 2025-04-09 to 2025-06-18
    # (alternating with the two SIGs below), then "WS1 Meeting" from 2025-06-25.
    # Upstream's pattern covers the last two spellings explicitly --
    # "(?:Weekly )?Meeting(?: \(updated\))?" -- which corroborates that part. "WS1
    # Meeting" is the bare form used in cancellation notices ("No WS1 Meeting today"),
    # and "WS1 Weekly Meeting" arrived once, as a cosai-op cancellation on 2026-03-25.
    name_variants:
      - CoSAI WS1 Meeting (updated link)
      - CoSAI WS1 Weekly Meeting
      - WS1 Meeting
      - WS1 Weekly Meeting
      - CoSAI WS1 recurring weekly meeting
      - CoSAI WS1 normal meeting - bi-weekly
    drive_title_forms:
      - CoSAI WS1 Weekly Meeting
      - CoSAI WS1 Meeting (updated)
    drive_folder_id: 1L7A46unF12D3Tk68_QVP53M9cGjJUMA3
    cadence: FREQ=WEEKLY
    ics_uids: 1

