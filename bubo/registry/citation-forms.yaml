# Every surface form by which a document might be cited.
#
# Citations in the wild do not use one canonical URL. The TSC dataset shows references
# via GitHub blob links (some pinned to a sha), raw links, the PDF, the repository root,
# the OASIS or coalitionforsecureai.org announcement, and bare titles or short titles in
# prose. A search for only the blob URL would miss most of them.
#
# `url_patterns` below are generated per document from publications.yaml, so only the
# forms that cannot be derived are listed here: short titles, off-GitHub landing pages,
# `website_pdfs` (copies the CoSAI website hosts, and the staging host's copies the mail
# circulated), and `former_urls` (where a file was before it was renamed or moved, or on
# a branch since deleted). Website PDFs are reported as pdf-url forms and former URLs
# as blob-url forms, which is what they are.

# Derived automatically for every publication; listed for documentation.
derived_url_forms:
  - https://github.com/{repo}/blob/main/{md_path}
  - https://github.com/{repo}/blob/{commit_sha}/{md_path}
  - https://github.com/{repo}/blob/main/{pdf_path}
  - https://raw.githubusercontent.com/{repo}/main/{md_path}
  - https://github.com/{repo}
  - https://github.com/{repo}/tree/main/{dirname}

