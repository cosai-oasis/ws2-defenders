# CoSAI publications in scope. Markdown is authoritative; PDF is derived by automated
# conversion. Curated, not generated -- three facts here cannot be derived from the files:
#
#   1. workstream: the repo is authoritative, NOT front-matter `author`. The WS3 Shared
#      Responsibility Framework declares `author: "Workstream 2: ..."` but is a WS3 document.
#   2. pdf_path: not derivable from the md basename. The WS3 PDF is named
#      AI-Shared-Responsibility-Framework.pdf against CoSAI Shared Responsibility Framework.md,
#      and three documents have no PDF at all.
#   3. original_date vs revised_date: model-context-protocol-security.md was revised to v2.0
#      on 2026-08-12 WITHOUT refreshing its credit list, so its credits are evidence about
#      2026-01-08, not about 2026-08-12. See ADR-WS2-001 D4.
#
# To add a document (e.g. the Telemetry RFC once reviewed), append an entry and re-run
# `python -m bubo_graphrag.ingest.fetch && python -m bubo_graphrag.ingest.seed`.

