# Bodies that govern the project rather than produce publications. They convene
# meetings and approve work, so they are groups the meetings graph attaches to, but no
# publication names one as its producer.
governing_bodies:
  tsc:
    title: "CoSAI Technical Steering Committee"
    repo: cosai-oasis/cosai-tsc
  pgb:
    title: "CoSAI Project Governing Board"

# Standing groups that do project work which is neither technical nor governance. They
# convene meetings, so the meetings graph attaches to them, but they neither approve
# work nor produce publications. The Marketing Committee's subcommittees (content,
# events) are its series, not separate groups: none has a list of its own.
committees:
  marketing:
    title: "CoSAI Marketing Committee"
