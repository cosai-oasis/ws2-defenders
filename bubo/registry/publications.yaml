    subtitle: "Secure by Design: Telemetry Field Selection for AI Systems"
    workstream: ws2
    repo: cosai-oasis/ws2-defenders
    md_path: telemetry/CoSAI-AI-Telemetry-RFC.md
    pdf_path: null
    commit_sha: 0b0ebefe67e43419e1140791aeaccce8a7652dd7
    original_date: 2026-09-10       # no date in the document; last commit to the RFC
    version: "0.5"
    approval_status: working-draft
    # Three things make this document structurally unlike the other twelve:
    #   1. No YAML front matter. Metadata is a bold-label header block
    #      (`**Status:**`, `**Origin:**`, `**Disclosure:**`) under an h1 carrying
    #      the version inline: `# Telemetry for AI Security {**Working Draft v0.5**}`.
    #   2. No acknowledgements section and no role labels anywhere, so it yields
    #      ZERO credited contributors. Attribution for this document can only come
    #      from step 6 (GitHub commit/PR history).
    #   3. It carries 109 distinct Risk Map ids in 188 references -- by far the
    #      richest Risk Map (step 5) seam in the corpus, and the reason it was worth adding.
    has_credit_section: false
    metadata_style: bold-header-block
    references_risk_map_ids: true

