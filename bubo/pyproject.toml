[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubo-graphrag-mcp"
version = "0.1.0"
description = "MCP server over a BFO/CCO-grounded graph of CoSAI contributions, publications and citations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "rdflib>=7.0",
    "pyoxigraph>=0.4",
    "mcp>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyshacl>=0.30"]
# notebooks/prototype.ipynb drives the graph from remote models. Declared rather than
# pip-installed ad hoc, so the environment is reproducible; not needed by the server,
# which makes no LLM call and holds no key.
notebooks = ["anthropic>=0.40", "openai>=1.60", "google-genai>=1.0", "jupyterlab>=4.0"]

[project.scripts]
bubo = "bubo_graphrag.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
