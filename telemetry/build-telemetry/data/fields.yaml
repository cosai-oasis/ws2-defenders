# Telemetry fields. Evidence is derived from attacks/ (tools/build.py).
- id: agent_name
  name: Agent Name
  tier: MUST
  role: identifier
  record: event
  origin: declared
  basis:
    evidence: [TA-05, TA-31]
  records: Logical name or type of the agent; exposes off-inventory agents.
  emitted_by: [componentReasoningCore]
  capture: Logical name/type of the agent (e.g. "Deep Research agent"). Detects off-inventory / "shadow" agents.
  rationale: Rests on `TA-05` (an agent nobody inventoried) and `TA-31` (one name bound to two peers, so requests reach the wrong one); both are found by comparing a name against what it should resolve to.
- id: agent_runtime_instance_id
  name: Agent (Runtime) Instance ID
  tier: MUST
  role: identifier
  record: event
  origin: observed
  basis:
    required_to_read:
    - identities_used_per_hop
    - source_host_ip_request_metadata
    - capability_set_change_event
    - instrumentation_coverage_hook_status
  records: The running instance an event belongs to, for per-instance quarantine.
  emitted_by: [componentReasoningCore]
  capture: UUID pinning an event to one running instance, not just the type. Enables per-instance kill/quarantine.
  rationale: One identity across a fleet is otherwise ambiguous between sibling instances and a stolen credential, and capability sets and hook state are per process.
- id: workflow_run_id
  name: Workflow / Run ID
  tier: MUST
  role: identifier
  record: event
  origin: observed
  basis:
    required_to_read: [loop_step_count_signal, resource_consumption_aggregate]
  records: Groups one multi-step run or sub-agent tree into one execution.
  emitted_by: [componentReasoningCore]
  capture: Groups all activity of one multi-step run or sub-agent tree into a single traceable execution.
  rationale: Both are defined per run.
- id: session_turn_step_ids
  name: Session / Turn / Step IDs
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: The session, turn and step beneath a run, locating where behavior changed.
  emitted_by: [componentApplication, componentReasoningCore]
  capture: 'The three-level execution hierarchy *beneath* the run: `session_id` (the conversation/engagement), `turn_id` (one request→response cycle), `step_id` (one action within a turn). Lets a detection point at *which* turn behavior changed, not just which run.'
- id: trace_context_propagated
  name: Trace Context (propagated)
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: W3C trace context carried across every agent and tool hop.
  emitted_by_text: every hop
  capture: W3C `traceparent` / `trace_id` + `span_id` **propagated across every agent→tool→agent hop**, including MCP [[39]](#standards--frameworks) and A2A [[40]](#standards--frameworks) calls. Without propagation, multi-agent activity cannot be reassembled into one trace. Records the baggage members received with the context, by key. A member that names a telemetry destination or credential is attacker-controllable input, not configuration.
- id: organization_tenant_id
  name: Organization / Tenant ID
  tags: [AOS]
  tier: SHOULD
  role: identifier
  record: event
  origin: declared
  records: Owning tenant of the agent, the session and the invoking user.
  modality: multi-tenancy
  emitted_by_text: agent, session and user records
  capture: The tenant/organization owning the agent, the session, and the invoking user, recorded on each. The primitive for detecting cross-tenant leakage and credential propagation.
  rationale: 'Held by the modality gate, not the evidence gate. Its instances (`TA-11`, `TA-17`, `TA-22`) clear the evidence bar; what holds it below MUST is that multi-tenant hosting is a deployment modality, and a single-tenant deployment has nothing for the field to describe. **MUST for any multi-tenant deployment.** The two cross-tenant entries differ in a way worth recording: `TA-11` involved **no attacker**, the boundary failed unaided, which under [RFC §4.7](CoSAI-AI-Telemetry-RFC.md#47-tiers) is a documented instance of the failure mode and not a lesser kind of evidence, since the field detects the boundary failure whatever caused it. `TA-17` supplies the adversarial instance, an authenticated caller reaching another tenant''s application deliberately. Evidence is therefore settled twice over, and only the modality gate remains.'
- id: trigger_type_source_event
  name: Trigger Type & Source Event
  tags: [AOS]
  tier: MUST
  role: label
  record: event
  origin: observed
  compound: label plus identifier of the originating event
  records: User-initiated or autonomous, and for autonomous runs the originating event.
  emitted_by: [componentReasoningCore]
  capture: Whether this run was **user-initiated or autonomous**, and for autonomous runs the originating event (inbound email, chat message, webhook, schedule). Distinct from Surface / App, which records the *channel*, not who or what started the run.
  rationale: Zero-click is a telemetry category. `TA-01` starts an entire run from one inbound email with no human in the loop. Surface / App would record "email" for both that and an ordinary request; the autonomous flag is what separates them.
- id: action_type
  name: Action Type
  tier: MUST
  role: label
  record: event
  origin: observed
  records: LLM call, tool call, memory operation or message send.
  emitted_by: [componentReasoningCore]
  capture: Distinguishes LLM-call vs tool-call vs memory-op vs message-send, the "think → act" boundary.
  rationale: Marks the think→act boundary where `AOC-01` and `AOC-02` did their damage. No pattern lists it as a condition, because each names the operation's own field, such as **Tool Call I/O**. Action Type is what lets a detection select the same kind of operation across components ([§2](#2-correlation-patterns)).
- id: execution_status
  name: Execution Status
  tier: MUST
  role: outcome
  record: event
  origin: observed
  compound: outcome plus duration (measure)
  records: Outcome and duration of an operation or turn.
  emitted_by: [componentReasoningCore]
  capture: Outcome of the operation or turn (complete / error / exit / aborted) + duration. Spikes/timeouts reveal probing, DoS, or mass failure. Distinct from **Stop Reason** below, which records why a *completion* ended.
- id: stop_reason
  name: Stop Reason
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: 'Why a completion ended: end of turn, token limit, tool use, cancellation, content filter.'
  emitted_by: [componentReasoningCore]
  capture: 'Normalized reason a model completion ended: end of turn, token limit, tool use pending, session stop (caller canceled or disconnected), content filter. Separates a truncation from a clean stop and a guardrail kill from a crash; a `content_filter` stop is the completion-side view of a guardrail block (§1.2).'
  rationale: Without it a **Response / Model Output** cut short by a provider content filter or a token limit reads the same as one that finished, so it also passes the dependency test of [RFC §4.7](CoSAI-AI-Telemetry-RFC.md#47-tiers). A deployment's own guardrail verdict does not record the provider's filter, and token counts cannot infer it. Every major provider API returns a completion's stop reason, so it is implementable wherever a model is called.
- id: surface_app
  name: Surface / App
  tier: MUST
  role: label
  record: event
  origin: observed
  records: 'Entry point: CLI, web, IDE, email, chat, scheduler; internal or external.'
  emitted_by: [componentApplication]
  capture: Entry point (CLI, web, IDE, email, chat channel, cron/heartbeat; internal vs external service). Detects access from unexpected surfaces.
- id: system_prompt_instruction_config
  name: System Prompt / Instruction Config
  tier: MUST
  role: content
  record: state
  origin: asserted
  records: Instruction configuration in force for the call. Self-asserted.
  emitted_by: [componentAgentSystemInstruction]
  capture: The system/instruction configuration in force for the call. Detects unauthorized weakening and, by comparison against the response, system-prompt leakage/extraction.
  rationale: 'Both a config-integrity baseline and the reference against which extraction is detected: `TA-07` succeeds when the response reproduces it.'
- id: autonomy_level
  name: Autonomy Level
  tier: SHOULD
  role: label
  record: state
  origin: asserted
  records: Declared independence level the run is authorized for. Self-asserted.
  modality: autonomous action
  emitted_by: [componentReasoningCore]
  capture: Declared independence level (e.g. L1 to L5) the run is authorized to operate at; sets oversight/delegation limits.
  rationale: The oversight dial for delegated action. The corpus repeatedly shows agents operating *above* their intended autonomy (`AOC-04`, `AOC-01`, `AOC-07`); logging the claimed level is what makes that detectable.
- id: model_input
  name: Model Input
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Every input to each model call, including tool output, retrieved context and messages.
  emitted_by: [componentApplicationInputHandling, componentAgentInputHandling]
  capture: Every input to each model call in the loop, user prompts, tool outputs, retrieved context, inter-agent messages. Not just the first user turn. Includes size/shape (large or repetitive inputs).
  rationale: 'Must cover *all* inputs, not the first user turn: injection arrives via tool outputs (`IR-01`), retrieved content (`IR-03`, `TA-01`, `TA-02`), memory (`IR-02`), or another agent (`AOC-12`).'
- id: input_source_channel
  name: Input Source / Channel
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: Which surface, tool, agent or document each input segment came from.
  emitted_by: [componentApplicationInputHandling, componentAgentInputHandling]
  capture: 'Provenance label for each input segment: which surface/tool/agent/document it came from. Telemetry placed in a model''s context for analysis (log records, alerts, malware samples) is a channel of its own: its fields carry text an attacker wrote. For the principal''s own turn, whether the principal typed the content or another party supplied it and the principal submitted it (a link''s pre-filled parameter, a paste, a share target), with the supplying origin where known.'
- id: input_trust_classification
  name: Input Trust Classification
  tier: MUST
  role: label
  record: event
  origin: observed
  records: 'Trusted or untrusted origin, crossed with the role assigned on entry: instruction or data.'
  emitted_by: [componentAgentInputHandling]
  capture: 'The origin authority of a segment crossed with the role the deployment assigned it on entry: **trusted-instruction**, **trusted-data**, **untrusted-instruction**, **untrusted-data**. Owner command against environmental or third-party content, and instruction against data. **`untrusted-instruction` is the attack state**, the cell `TA-01` occupies.'
  rationale: Operationalizes the risk map's core agentic control. `AOC-02` disclosed 124 email records because it did not distinguish an owner instruction from a non-owner's; `TA-01` is untrusted email content promoted to instruction.
- id: source_host_ip_request_metadata
  name: Source host / IP + request metadata
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: Origin of the request, for geo, rate and credential-theft detection.
  emitted_by: [componentApplicationInputHandling]
  capture: Origin of the request; supports geo/impossible-travel, rate-limit, and credential-theft detection.
- id: guardrail_input_verdict
  name: Guardrail (Input) Verdict
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Input classifier result (pass, flag, block, modify) with detector and score.
  emitted_by: [componentApplicationInputHandling, componentAgentInputHandling]
  capture: 'Result of any input-side injection/jailbreak/PII/secret classifier: **pass / flag / block / modify**, with detector + score.'
  rationale: '`TA-01` *defeated* a prompt-injection classifier. A classifier bypass is undetectable if verdicts are never logged.'
- id: content_modality_attachment_identity
  name: Content Modality & Attachment Identity
  tags: [AOS]
  tier: MUST
  role: label
  record: event
  origin: observed
  compound: label plus content hash
  records: Part type, MIME type, and for files name, size and hash, on every content-bearing field.
  emitted_by_text: every content-bearing field
  capture: '**Cross-cutting.** For every content-bearing field: the part type (text / file / structured data), MIME type, and for files the name, size, and content hash. Instructions that arrive as an image, PDF, or structured blob are invisible to text-only inspection and text-only logging.'
  rationale: 'The corpus''s obfuscation attacks are modality attacks: instructions in OCR''d images and base64 blobs (`AOC-12`), ~10 MB attachment floods (`AOC-05`). Text-only capture misses both.'
- id: guardrail_modification_record
  name: Guardrail Modification Record
  tags: [AOS]
  tier: MUST
  role: outcome
  record: event
  origin: observed
  basis:
    required_to_read: [model_input, response_model_output, guardrail_input_verdict, guardrail_output_verdict]
  records: That an enforcement point rewrote a payload, which one, with before and after digests.
  emitted_by_text: any rewriting enforcement point
  capture: '**Cross-cutting.** When an enforcement point **rewrites rather than blocks**: masking, redacting, stripping, or rewriting a payload; record that a modification occurred, which enforcement point made it, and a before/after digest (plus a redaction map where policy permits). Applies on both the input and the output side.'
  rationale: Applies whenever an enforcement point or redaction pipeline rewrites rather than blocks. Without it, **Model Input**, **Response** and a guardrail verdict of `modify` record content that was not what the model or the recipient saw, so the record is *actively wrong*. Its value is R first and D second. `TA-01`, whose chain bypassed link redaction, is an instance, but the tier rests on the dependency.
- id: threat_classification_atlas_technique_tag
  name: Threat Classification / ATLAS Technique Tag
  tier: MAY
  role: label
  record: event
  origin: derived
  basis:
    may: [thin]
  records: MITRE ATLAS technique IDs on any event where a detection fires.
  emitted_by_text: any detector
  capture: '**Cross-cutting enrichment.** On any flagged or security-relevant event, the classified technique(s) as **MITRE ATLAS `AML.Txxxx`** IDs (plus a free-text threat type). Emitted by input/output guardrails and by tool/memory/retrieval detectors alike, so every alert carries a portable, ATT&CK-aligned technique reference.'
  rationale: Its value is D-portability into ATT&CK-aligned tooling plus A-rollup, but no documented instance turns on its absence and no MUST field depends on it, so it fails both MUST tests. This document still recommends stamping every fired detection with it.
- id: encoded_obfuscated_payload_indicator
  name: Encoded / Obfuscated Payload Indicator
  tier: MUST
  role: label
  record: event
  origin: derived
  basis:
    evidence: [AOC-12, TA-21]
  records: Flag and decoded form of base64, image-embedded, invisible-Unicode or markup-authority input.
  emitted_by: [componentAgentInputHandling]
  capture: Flag + decoded form when input contains base64, image-embedded (OCR), or markup "authority" tags. Includes invisible or control Unicode characters (tag characters, zero-width joiners, bidirectional overrides) that hide instructions from a human reader.
  rationale: 'The corpus''s obfuscation attacks hide instructions where a reader of the recorded input would not see them: base64 and OCR''d images (`AOC-12`), invisible Unicode in a rules file (`TA-21`). Model Input is only required to carry a content hash ([RFC §5.3](CoSAI-AI-Telemetry-RFC.md#53-content-hashing)), so where raw content is not retained the flag and decoded form are the only record that the payload was there.'
- id: response_model_output
  name: Response / Model Output
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Generated output at each step.
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: The generated output at each step. Where leakage, disclosure, verbatim training data, and embedded exfil URLs appear.
- id: output_egress_destination
  name: Output Egress Destination
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: 'Where output goes: recipients, URLs, channels, files, broadcast scope.'
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: 'Where output goes: recipient addresses, outbound URLs/domains, channels, file targets, broadcast scope.'
  rationale: 'Converts a detection from *"something bad was generated"* into *"and here is where it went"*: the difference between blocking and reporting. It would have caught `TA-01` and `TA-03` *before data left*: both smuggle data into an outbound URL on a trusted-looking domain. It also renders `AOC-03`, `AOC-11`, and `AOC-05` visible.'
- id: citations_source_attribution
  name: Citations / Source Attribution
  tags: [AOS]
  tier: MUST
  role: outcome
  record: event
  origin: derived
  compound: asserted claim plus derived resolution outcome
  records: Sources the agent claims, and whether each resolves to a logged retrieval.
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: 'The sources the agent *claims* it drew on, per output: file ID/name/URL or site URL for each citation, **plus whether each resolves to an item actually returned by a logged Retrieval Event (§1.4)**. Unresolvable, fabricated, or attacker-supplied citations are the signal.'
  rationale: 'Applies to deployments that emit citations, which is now the common RAG configuration. A citation is a *trusted* output component (`AML.T0067.000`), so three detections depend on it and none is reachable from response text alone: fabricated citations matching no retrieval, attacker-planted links (`TA-02`, `TA-01`), and suppression visible by comparing retrieved against cited (`IR-03`).'
- id: observation_thought_reasoning_trace
  name: Observation / Thought (reasoning trace)
  tier: SHOULD
  role: content
  record: event
  origin: asserted
  records: Reasoning trace, where the provider exposes it. Self-asserted.
  provider_gated: true
  emitted_by: [componentReasoningCore]
  capture: Chain-of-thought/observations *when the provider exposes it*. Reveals whether a harmful act was injected, misauthorized, or self-initiated.
  rationale: High-value forensics for separating a compromised agent from a misconfigured one (`AOC-01`, `AOC-07`), but frequently unavailable from provider APIs and privacy-sensitive.
- id: guardrail_output_verdict
  name: Guardrail (Output) Verdict
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Output filter result (pass, flag, block, modify).
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: 'Output-side filter result (PII/DLP, harmful content, exfil pattern): **pass / flag / block / modify**. Modifications are recorded via the **Guardrail Modification Record**. Fired detections can carry the **ATLAS Technique Tag**.'
- id: llm_refusal
  name: LLM Refusal
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Refusal status and reason.
  emitted_by: [componentAgentOutputHandling]
  capture: Status + reason when the model refuses. A refusal-then-success streak signals a jailbreak in progress; an *absent* refusal on clearly policy-violating output flags a guardrail gap.
  rationale: An early-warning tripwire. `IR-01` is iterated reframing until a refusal flips; `AOC-12`, `AOC-13` and `AOC-14` are the mirror image, successful refusals whose telemetry documents attempted attacks even when blocked.
- id: model_name_version
  name: Model Name + Version
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: Model and version that processed the request.
  emitted_by: [componentModelServing]
  capture: Model and version processing the request. "Which agents used the compromised model?"; pins a model-specific vulnerability for patching.
  rationale: The supply-chain pivot, and R-critical for scoping.
- id: provider_endpoint_identity
  name: Provider / Endpoint Identity
  tier: MAY
  role: identifier
  record: event
  origin: observed
  basis:
    may: [qa, redundant]
  records: Which provider or endpoint served the call.
  emitted_by: [componentModelServing]
  capture: Which provider/endpoint served the call. The reason the completion ended is **Stop Reason**.
  rationale: '`TA-28` is the case that tests the tier. `AOC-06` is a governance and availability signal rather than a discrete adversary technique, which makes the field Q- and A-dominant, and the D concern it is usually asked to carry, model substitution, belongs to Model Name + Version. `TA-28` is different: a backdoor using a provider''s own API as its command-and-control channel, where the exfiltration destination is an endpoint the application legitimately calls. That is a detection argument rather than a governance one, and it is carried by **Output Egress Destination** (§1.2, MUST) recording the destination together with what left, not by provider identity alone, because a legitimate call and a C2 beacon share the provider. The field stays MAY because knowing *which* provider was called does not separate them; knowing what was sent does.'
- id: inference_parameters
  name: Inference Parameters
  tags: [AOS]
  tier: MUST
  role: descriptor
  record: state
  origin: declared
  records: Decoding parameters and declared context window in force for the call; the denominator for max-length-output and oversized-input detections.
  emitted_by: [componentModelServing]
  capture: 'The decoding/config parameters in force for the call: `temperature`, `top_p`/`top_k`, `max_tokens`, `stop` sequences, `seed`, and the **declared context-window size**. The runtime half of the configuration-integrity baseline that **System Prompt / Instruction Config** covers for instructions.'
  rationale: 'Rests on a *denominator* argument rather than a tampering attack: "max-length output" (`TA-04`) and "anomalously large input" (`TA-10`) are the documented detection signatures, and neither is computable without `max_tokens` and the declared context window. It also gives decoding configuration the integrity baseline the system prompt has. Capture it per call: per-request overrides are the attack.'
- id: input_output_token_counts
  name: Input / Output Token Counts
  tier: MUST
  role: measure
  record: event
  origin: observed
  records: Per-call token usage, which feeds the Resource-Consumption Aggregate budget check.
  emitted_by: [componentModelServing]
  capture: Per-call token usage, the primary resource-abuse and runaway-loop signal; max-length outputs flag extraction/DoS.
  rationale: The cheapest DoS and runaway-loop detector in the document (`AOC-04`'s ~60 k-token relay, `AOC-05`, `TA-10`), and it costs nothing to emit.
- id: llm_error_exception
  name: LLM Error / Exception
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Errors under adversarial conditions and provider-side silent failures.
  emitted_by: [componentModelServing]
  capture: Errors that occur under adversarial conditions (overflow, malformed encoding, context exhaustion); provider-side silent failures.
- id: model_provenance_signing_hash
  name: Model Provenance / Signing / Hash
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: Signed digest or provenance of the served model artifact.
  modality: supply-chain provenance
  emitted_by: [componentModelServing, componentModelRegistry]
  capture: Signed digest / provenance of the served model artifact (supply-chain provenance). Where the deployment trains or fine-tunes the model, the provenance includes the training run and the digest of the dataset version it used.
  rationale: A supply-chain primitive; ties to model-signing work and ODIS [[26]](#standards--frameworks) `software_hash`.
- id: pre_forward_pass_state_digest_vector
  name: Pre-Forward-Pass State Digest/Vector
  tier: MAY
  role: content
  record: event
  origin: derived
  basis:
    may: [research, thin]
  records: Digest of the exact inputs to a forward pass, for replay and drift detection.
  emitted_by: [componentTheModel]
  capture: Content-addressed digest (+ pooled vector) of the exact inputs to a forward pass, captured pre-inference for replay/drift detection.
- id: token_malformation_context_corruption_indicator
  name: Token Malformation / Context-Corruption Indicator
  tier: MAY
  role: label
  record: event
  origin: derived
  basis:
    may: [research, thin]
  records: Token-entropy anomalies correlated with confabulation.
  emitted_by: [componentTheModel]
  capture: Signal of context-induced token-entropy anomalies correlated with confabulation.
- id: tool_call_io
  name: Tool Call I/O
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Full arguments and output of every tool or MCP call.
  emitted_by: [componentToolServer, componentTools]
  capture: Full input params **and** output for every tool/MCP call; what the agent actually *did* vs what it was asked. Reveals credentials passed between chained calls.
  rationale: Without it and **Tool Name** a compromised agent's actions are invisible, and every destructive case in the corpus is reconstructed from them.
- id: tool_name
  name: Tool Name
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: The capability invoked, as the agent saw it.
  emitted_by: [componentToolServer]
  capture: Which capability was invoked. Detects off-manifest / sensitive-tool invocation, escalating tool sequences, and enumeration.
  rationale_see: tool_call_io
- id: tool_type_trust_boundary
  name: Tool Type / Trust Boundary
  tier: MUST
  role: label
  record: state
  origin: declared
  records: MCP, internal, direct-storage or code-execution.
  emitted_by: [componentTools]
  capture: MCP (cross-network) vs internal vs direct-storage vs code-execution, different trust models & policies.
  rationale: Earned via `AOC-14`, which tried to make the agent bypass the tool API and write to backend storage directly. "API-mediated only" is unenforceable unless telemetry distinguishes the two.
- id: tool_id
  name: Tool ID
  tier: MAY
  role: identifier
  record: event
  origin: declared
  basis:
    may: [redundant, thin]
  records: Unique tool-implementation ID across MCP servers.
  emitted_by: [componentTools]
  capture: Unique tool-implementation ID for unambiguous attribution across many MCP servers.
  rationale: Tool Name together with **MCP Server Identity & Primitive** (both MUST) already identifies the implementation across servers; a unique ID makes the join cheaper, not possible.
- id: tool_execution_id
  name: Tool Execution ID
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: Correlation ID pairing each tool request with its outcome.
  emitted_by: [componentToolServer]
  capture: Correlation ID minted at invocation and echoed on the result, pairing every request with its outcome.
  rationale: Makes *a result with no matching request* a queryable condition, and is the only way to correlate asynchronous tool calls. `AOC-01`'s false completion report is precisely a request/result mismatch.
- id: tool_definition_digest
  name: Tool Definition Digest
  tags: [AOS]
  tier: MUST
  role: provenance
  record: event
  origin: derived
  compound: derived digest plus comparison outcome against the baseline
  basis:
    evidence: [TA-15, TA-29]
  records: Hash of the tool contract as presented at invocation, compared with the approved baseline.
  emitted_by: [componentToolServer, componentToolRegistry]
  capture: 'Hash of the tool''s **declared contract as presented at invocation time**: name, description, argument schema, output schema, plus a comparison against the approved baseline. Detects a tool whose definition mutated after approval.'
  rationale: '`TA-15` and `TA-29` are the grounding instances. In `TA-15` the definition is malicious as published, the injection carried in the tool''s own description, which is why the digest is taken **at invocation** rather than at registration and must cover the description, not only the argument and output schemas. In `TA-29` the description changed after approval under an unchanged name, which the comparison against the approved baseline detects. The adjacent rug pulls fall outside the digest: `TA-14` mutates an approved configuration''s launch command and `TA-16` ships a malicious implementation under an adopted name; in both of those the *declared contract* is itself unchanged, so the detecting fields there are Capability-Set Change Event and MCP Server Identity & Primitive respectively. The modality gate does not hold it: the gate is third-party or dynamically-discovered tools, and an MCP `tools/list` exchange is dynamic discovery by construction.'
- id: execution_environment_sandbox
  name: Execution Environment / Sandbox
  tags: [AOS]
  tier: MUST
  role: descriptor
  record: state
  origin: observed
  records: 'Isolation settings: sandbox mode, runtime, OS, timeout, egress policy.'
  emitted_by: [componentIsolationRuntime, componentToolHosting]
  capture: 'The isolation posture of the execution: sandbox mode (none / container / VM / WASM), language runtime and version, OS/architecture, timeout, and network-egress policy.'
  rationale: '`TA-06` is characterized as model-emitted Python executed **unsandboxed**: the isolation posture *is* the finding. Two calls to the same code-execution tool, one containerized and one not, are otherwise the same event.'
- id: mcp_server_identity_primitive
  name: MCP Server Identity & Primitive
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: asserted
  compound: asserted server identity plus observed primitive (label)
  records: MCP server name, version, transport and endpoint, and the primitive exercised.
  emitted_by: [componentToolServer]
  capture: 'For MCP calls: server name, version, transport, and endpoint; **and which MCP primitive was exercised**: `tool`, `resource`, `prompt`, `sampling`, `elicitation`, or `roots`.'
  rationale: The corpus's MCP incidents (`TA-11` to `TA-16`, `TA-29`) clear the evidence gate several times over; `TA-16` is the sharpest, because the server's declared contract never changed and only its published **version** did, so name alone would not have distinguished the safe release from the malicious one. What held the field at SHOULD was the modality gate, and that gate turns on MCP being at the **edge of current agentic practice** ([RFC §4.7](CoSAI-AI-Telemetry-RFC.md#47-tiers)). It is not. The corpus's MCP-mediated entries all date from 2025 onward, and their share understates the point, because the remaining agentic entries are incidents of other kinds rather than counter-examples to MCP's prevalence; CoSAI's Workstream 4 devoted a paper to MCP security [[24]](#standards--frameworks); OWASP publishes an MCP Top 10 [[76]](#standards--frameworks); and MITRE ATLAS has added `AML.T0109` AI Supply Chain Rug Pull and `AML.T0110` AI Agent Tool Poisoning, the latter with three sub-techniques (`.000` Definition and Instructions, `.001` Implementation, `.002` Runtime Response). A protocol acquires a dedicated top-ten list and a dedicated technique family once it is typical. **Server name and version are as cheap as Tool Name and should be adopted first.**
- id: tool_error_exception
  name: Tool Error / Exception
  tier: MAY
  role: outcome
  record: event
  origin: observed
  basis:
    may: [thin]
  records: Failed or blocked tool calls, including the probing that precedes exploitation.
  emitted_by: [componentToolServer, componentToolInputHandling]
  capture: 'Failed/blocked tool calls: rejected injection args, SSRF blocks, authz boundary hits, and the probing errors that precede successful exploitation.'
  rationale: 'No documented instance records a failed or blocked tool call: `TA-06` reports exceptions only where exploitation failed, and the privileged calls in `TA-13` succeeded. The probing that precedes exploitation is the case the field serves, and the corpus has none. No MUST field depends on it, because **Execution Status** records each operation''s outcome.'
- id: tool_acl_required_scope
  name: Tool ACL / Required Scope
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: Authority a tool requires and who can invoke it.
  modality: delegated authority
  emitted_by:
  - componentAuthorizationPolicyEnforcementPoint
  capture: The authority a tool requires and who may invoke it (the tool's security policy); individually-authorized calls that violate separation-of-duties as a chain.
  rationale: Every attack that cites it presupposes meaningful delegation.
- id: tool_privacy_classification
  name: Tool Privacy Classification
  tier: MAY
  role: label
  record: state
  origin: declared
  basis:
    may: [qa, redundant]
  records: Sensitivity class of the data a tool touches.
  emitted_by: [componentTools]
  capture: Sensitivity class of data the tool touches, feeds DLP / data-flow governance.
  rationale: DLP and compliance governance metadata, A-dominant, and not modality-gated. Its D value is already carried by Tool ACL / Required Scope and Output Egress Destination.
- id: tool_selection_rationale
  name: Tool Selection Rationale
  tags: [AOS]
  tier: SHOULD
  role: content
  record: event
  origin: asserted
  records: The agent's stated reason for a tool call. Self-asserted.
  provider_gated: true
  emitted_by: [componentReasoningCore]
  capture: 'The agent''s stated reason for choosing *this* tool with *these* arguments, captured at the request step. Distinct from the §1.2 output-side reasoning trace: it is attached to the action, not the answer.'
- id: memory_write_event
  name: Memory Write Event
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Each create, update or delete of a persistent memory item, and by whom.
  emitted_by: [componentMemory]
  capture: 'Every create/update/delete to persistent or long-term memory: what changed, by which turn/actor. Deletions include evictions made by the store itself under a size or token budget, recorded with the policy that evicted the item, so an item lost to eviction is distinguishable from one that was retrieved poorly.'
  rationale: 'MINJA (`IR-02`) poisons memory using only benign queries: the agent autonomously persists malicious reasoning. AGENTPOISON (`IR-05`) uses optimized triggers. `TA-18` is the production instance: injected ChatGPT memories persisted and were recalled in later conversations. None is detectable without Memory Write Event, Memory Read / Injection Event and **Memory Provenance / Source**.'
- id: memory_read_injection_event
  name: Memory Read / Injection Event
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Which memory items were pulled into context for a call.
  emitted_by: [componentMemory]
  capture: Which memory items were pulled into context for a call.
  rationale_see: memory_write_event
- id: memory_provenance_source
  name: Memory Provenance / Source
  tier: MUST
  role: provenance
  record: state
  origin: observed
  records: Origin and mutability of a memory item, including externally editable sources.
  emitted_by: [componentMemory]
  capture: Origin & mutability of a memory item, self-authored, owner, non-owner, or **externally editable resource**.
  rationale: 'Exposes `AOC-10`: a "constitution" stored as an externally editable Gist, later edited to make the agent shut down peers and send unauthorized mail. The signal is *a context-shaping memory item resolving to a mutable, non-owner-controlled source.*'
- id: memory_integrity_poisoning_signal
  name: Memory Integrity / Poisoning Signal
  tier: SHOULD
  role: measure
  record: event
  origin: derived
  records: Integrity check or poisoning score; cross-session isolation flag.
  provider_gated: true
  emitted_by: [componentMemory]
  capture: Integrity check / poisoning-likelihood score, cross-session isolation flag.
- id: memory_footprint_growth
  name: Memory Footprint / Growth
  tier: MUST
  role: measure
  record: aggregate
  origin: observed
  basis:
    evidence: [AOC-05, TA-30]
  records: Size and growth of memory stores per user or session.
  emitted_by: [componentMemory]
  capture: Size/growth of memory stores (per user/session), resource-exhaustion signal.
  rationale: 'Catches `AOC-05` (ever-growing per-non-owner file → mail-server DoS) and `TA-30`, a production memory index that grew without bound because the disk budget measured other tables. `TA-30` involved no adversary, which [RFC §4.7](CoSAI-AI-Telemetry-RFC.md#47-tiers) admits: the field detects the growth whatever caused it.'
- id: declared_memory_configuration
  name: Declared Memory Configuration
  tags: [AOS]
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  basis:
    may: [thin]
  records: A memory store's declared identity, limits and retrieval settings.
  emitted_by: [componentMemory]
  capture: 'The memory store''s declared identity and limits: name, type, backend, size cap, retention, and retrieval spec (top-k, scoring). The baseline that **Memory Footprint** is measured against.'
  rationale: '`TA-30` is an instance (a store with no retention policy), but the silently-raised-limit scenario is absent from the corpus, and the field''s job (a baseline for Memory Footprint / Growth) can be met by hard-coding known limits.'
- id: memory_write_rationale
  name: Memory Write Rationale
  tags: [AOS]
  tier: SHOULD
  role: content
  record: event
  origin: asserted
  records: The agent's stated reason for persisting an item. Self-asserted.
  provider_gated: true
  emitted_by: [componentMemory]
  capture: The agent's stated reason for persisting *this* item, captured at the write step.
  rationale: 'The analogue of Tool Selection Rationale, and `IR-02` is the case demanding it: the content looks innocuous and the write unremarkable; the tell is the justification the agent gives itself.'
- id: retrieval_event
  name: Retrieval Event
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Query issued, items returned and their scores.
  emitted_by: [componentRAGContent]
  capture: Query issued + documents/chunks returned + retrieval scores.
  rationale: 'RAG is the document''s most-cited injection channel (`TA-01`, `TA-02`, `TA-09`, `IR-03`, `AOC-10` are all retrieval-mediated). This field and **Retrieved-Content Source / Provenance** answer the halves a detection needs: *what came back*, and *where it came from and when it changed*.'
- id: retrieved_content_source_provenance
  name: Retrieved-Content Source / Provenance
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: Origin, owner, trust level and freshness of each retrieved item.
  emitted_by: [componentRAGContent]
  capture: Origin, owner, trust level, and freshness (create/update time) of each retrieved item (internal doc, web, third-party, user upload).
  rationale_see: retrieval_event
- id: retrieved_content_metadata_integrity_signal
  name: Retrieved-Content / Metadata Integrity Signal
  tier: SHOULD
  role: measure
  record: event
  origin: derived
  records: Tamper or poisoning indicators on content or its metadata.
  provider_gated: true
  emitted_by: [componentRAGContent]
  capture: Tamper/poisoning indicators on content **or its metadata/tags**.
  rationale: Poison-RAG (`IR-03`) manipulates item *metadata tags* rather than content bodies, which is why the integrity signal must cover metadata. `TA-09` plants hidden instructions in wikis and tickets, and recently-modified retrievable documents deserve scrutiny, hence freshness folds into provenance.
- id: declared_knowledge_source_configuration
  name: Declared Knowledge-Source Configuration
  tags: [AOS]
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  basis:
    may: [thin]
  records: A knowledge source's declared identity, schema and search parameters.
  emitted_by: [componentRAGContent]
  capture: 'Each knowledge source''s declared identity and contract: name, description, index/collection identity, schema, and search parameters (top-k, filters, scoring, reranker).'
  rationale: 'On the same reasoning as Declared Memory Configuration: a silently altered retrieval config or repointed index is not in the corpus, and `IR-03` poisons metadata, not search configuration.'
- id: inter_agent_message
  name: Inter-Agent Message
  tier: MUST
  role: content
  record: event
  origin: observed
  records: 'Agent-to-agent messages: sender, receiver, content, channel.'
  emitted_by: [componentReasoningCore]
  capture: 'Agent→agent messages: sender, receiver, content, channel, including capability/skill transfer.'
  rationale: 'The substrate of cross-agent propagation: `AOC-04` (nine-day mutual-relay loop), `AOC-09` (capability transfer), and `AOC-16`: the positive case, agents sharing risk signals.'
- id: a2a_task_lifecycle_event
  name: A2A Task Lifecycle Event
  tags: [AOS]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: Delegated-task state changes across A2A, including callback registration.
  modality: A2A
  emitted_by: [componentReasoningCore, componentAgentToolTransport]
  capture: 'Delegated-task state transitions across the A2A surface: task submitted, streamed, polled, **canceled**, resubscribed, and **push-notification config set or changed**, which registers an outbound callback destination.'
  rationale: 'Held by the modality gate. Its evidence is generic multi-agent incidents, not A2A-protocol incidents: `AOC-04` and `AOC-09` did not use A2A. **MUST the moment A2A is in play**; push-notification configuration in particular registers an attacker-settable egress channel.'
- id: peer_agent_card_descriptor
  name: Peer Agent Card / Descriptor
  tags: [AOS]
  tier: SHOULD
  role: descriptor
  record: state
  origin: asserted
  compound: asserted descriptor plus verification outcome
  records: A counterparty agent's descriptor at contact, with change and verification outcome.
  modality: A2A
  emitted_by: [componentReasoningCore]
  capture: 'The counterparty agent''s declared descriptor as presented at contact: name, URL, version, provider, and advertised skills/capabilities, with change detection against prior contacts **and the outcome of any verification attempted against it** (signature checked, inspection request answered or refused, or unverified).'
  rationale: Held by the modality gate. Its one A2A instance is `TA-31`, where hosts keyed routing on a card's `name`; the rest of its grounding is generic multi-agent incidents. **MUST the moment agent cards are in play.**
- id: background_scheduled_task_event
  name: Background / Scheduled Task Event
  tier: MUST
  role: descriptor
  record: event
  origin: observed
  records: Creation or change of cron jobs, heartbeats and self-scheduled loops.
  emitted_by: [componentReasoningCore]
  capture: Creation/modification of cron jobs, heartbeats, daemons, or self-scheduled loops, incl. presence/absence of a termination condition.
  rationale: 'Captures the corpus''s most striking finding: agents spawning infinite shell loops and cron jobs with **no termination condition**, converting short-lived tasks into permanent infrastructure (`AOC-04`, `AOC-10`).'
- id: loop_step_count_signal
  name: Loop / Step-Count Signal
  tier: MUST
  role: measure
  record: aggregate
  origin: derived
  records: Steps per run against baseline; circular exchanges between agents.
  emitted_by: [componentReasoningCore]
  capture: Steps or iterations per run vs baseline; circular agent-to-agent exchange detection.
  rationale_see: background_scheduled_task_event
- id: resource_consumption_aggregate
  name: Resource-Consumption Aggregate
  tier: MUST
  role: measure
  record: aggregate
  origin: derived
  records: Token, compute, storage and outbound totals per run against a budget.
  emitted_by: [componentReasoningCore]
  capture: 'Per-run/agent token, compute, storage, and outbound-volume totals against a budget, and, where authority is delegated, **accounted across the delegation subtree rather than per run**: individually modest runs can exhaust a principal''s budget in aggregate. Where a budget is enforced, the **consumed and remaining figures ride the record of the action that consumed them** and not only the metric series, because a total cannot be recomputed after the fact from records that never carried it. That is what separates a budget denial from a budget overrun discovered later.'
- id: task_intent_declaration
  name: Task / Intent Declaration
  tier: SHOULD
  role: descriptor
  record: state
  origin: asserted
  records: Declared purpose the run is authorized to pursue. Self-asserted.
  modality: autonomous action
  emitted_by: [componentReasoningCore]
  capture: The declared purpose/task the run is authorized to pursue (for goal-drift detection).
  rationale: The goal-drift anchor; `AOC-04` shows agents inventing new goals beyond the requested task.
- id: protocol_envelope_capture
  name: Protocol Envelope Capture
  tags: [AOS]
  tier: MAY
  role: content
  record: event
  origin: observed
  basis:
    may: [qa, redundant]
  records: Raw MCP or A2A JSON-RPC envelope alongside the interpreted fields.
  emitted_by: [componentAgentToolTransport]
  capture: The raw MCP / A2A JSON-RPC envelope (method, id, params) alongside the interpreted fields, preserving protocol-level detail that framework-level abstraction discards.
  rationale: Q-dominant, duplicates interpreted fields, carries raw-content privacy weight, and is not modality-gated.
- id: identities_used_per_hop
  name: Identities Used (per hop)
  tier: MUST
  role: identifier
  record: event
  origin: declared
  records: The identity behind each agent, tool and infrastructure action, per hop.
  emitted_by: [componentIdentityProvider]
  capture: Attribute every agent→user, agent→agent, agent→tool, tool→infra action to an identity + metadata; detect identity changes across a tool chain.
  rationale: 'The accountability primitive: when an agent resets its own mail server (`AOC-01`), dumps 124 records (`AOC-02`), or mass-mails defamation (`AOC-11`), *which principal, which agent, which tool, which credential* is the first question of any response. It applies to every deployment, including the simplest single-agent one.'
- id: verified_vs_displayed_identity
  name: Verified vs Displayed Identity
  tier: MUST
  role: identifier
  record: event
  origin: observed
  compound: two identifiers plus which one authorized (outcome)
  records: Verified identifier against spoofable display name, and which one authorized.
  emitted_by: [componentIdentityProvider]
  capture: Distinguish an immutable/verified identifier from a spoofable display identity; record which was used to authorize.
  rationale: '`AOC-08` shows same-channel spoofing *detected* (the agent checked an immutable user ID) and cross-channel spoofing *succeeding* where only a display name was available. The difference between those outcomes is entirely a telemetry difference.'
- id: originating_principal_on_behalf_of
  name: Originating Principal (on-behalf-of)
  tier: SHOULD
  role: identifier
  record: event
  origin: declared
  records: The human or service at the root of the delegation chain.
  modality: delegated authority
  emitted_by: [componentIdentityProvider, componentFederationProxy]
  capture: The human/service sponsor at the root of the delegation chain.
- id: delegation_chain
  name: Delegation Chain
  tier: SHOULD
  role: provenance
  record: event
  origin: declared
  records: Ordered agent hops, each integrity-bound to its parent.
  modality: delegated authority
  emitted_by: [componentFederationProxy]
  capture: Ordered lineage of prior agent hops carried across the call. Each hop carries an **integrity-protected reference to its parent** (issuer, delegation identifier, and a digest of the parent record), so lineage is verifiable from the records rather than asserted; a digest that does not match the resolved parent fails chain validation closed.
- id: granted_authorizations_scope
  name: Granted Authorizations / Scope
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  compound: declared scope plus narrowing-check outcome
  records: Authority in effect at this hop, with the narrowing check and its rules.
  modality: delegated authority
  emitted_by: [componentFederationProxy]
  capture: 'Delegated authority in effect at this hop, with monotonic-narrowing check. Record the **rules the check ran against** (ODIS `attenuation_profile_ref`: a versioned identifier and content digest for the normalization and comparison rules), since "narrower" is a semantic comparison and two profiles can disagree on the same pair of scopes.'
- id: resource_indicators_constraints
  name: Resource Indicators + Constraints
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: Target audience and time, purpose, rate, locality and classification limits.
  modality: delegated authority
  emitted_by: [componentFederationProxy]
  capture: Target resource audience + time/purpose/rate/locality/`data_classification` narrowing.
- id: token_exchange_scope_narrowing_check
  name: Token Exchange & Scope-Narrowing Check
  tags: [CPEX]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: 'Each token exchange: grant type, whose identity, and whether scope narrowed.'
  modality: token exchange
  emitted_by: [componentFederationProxy, componentIdentityProvider]
  capture: 'The token-exchange event at each hop: grant type (token exchange / client assertion / client credentials), whose identity the issued token represents (**end user / client application / calling workload / the enforcement point itself**), target **audience**, issuer, lifetime, and the **requested-vs-granted scope delta** verified after issuance. Detects both over-broad tokens and forwarded inbound tokens that were never narrowed.'
  rationale: Adds the *event* the surrounding fields only describe the state of. Forwarding a caller's inbound token is usually wrong (it is scoped for the agent, not the backend) so the **requested-vs-granted delta** is what makes a silently over-broad grant visible (`TA-08`).
- id: trust_domain_crossing_delegation_depth
  name: Trust-Domain Crossing & Delegation Depth
  tier: SHOULD
  role: measure
  record: event
  origin: derived
  compound: derived depth (measure) plus limit-crossed flag (outcome)
  records: Counterparty trust domain and delegation depth, and whether a limit was crossed.
  modality: delegated authority
  emitted_by: [componentFederationProxy]
  capture: 'The counterparty''s **trust domain** and the **depth of the delegation chain** at this hop, plus whether either crossed a configured limit. Records that authority left the domain that issued it, and how many hops from the originating principal the acting agent now sits. Depth is **derived** from the chain (the OCSF [[37]](#standards--frameworks) `delegation.parent_uid` lineage or the RFC 8693 [[45]](#standards--frameworks) `act` chain), not transmitted as a counter; a transmitted copy can disagree with the chain it was derived from. The derivation holds only while every hop carries its parent link: a hop that does not is a **break in the chain**, to be recorded as such rather than read as a shorter chain ([XM §1.2](Telemetry-Cross-Mapping-Addendum.md#12-correspondence)).'
  rationale: 'Makes an **externally-operated** counterparty legible. ODIS treats `trust_domain` and `max_depth` as policy-engine inputs rather than telemetry, which is right only while a chain stays inside one domain. Once authority crosses out of the domain that issued it, or the acting agent sits several hops from the originating principal, both become detection-grade: `AOC-04`''s nine-day relay and `AOC-09`''s capability transfer are both depth phenomena, and `TA-11` is a domain-boundary failure. See [RFC §4.6](CoSAI-AI-Telemetry-RFC.md#46-record-your-boundary-not-their-internals).'
- id: runtime_credential_attestation
  name: Runtime Credential / Attestation
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: Runtime-instance credential and attestation evidence, each source verified separately.
  modality: cryptographic agent identity
  emitted_by: [componentIdentityProvider]
  capture: 'Runtime-instance credential: `software_hash`, `attestation_evidence`, issuer, expiry, holder-key binding. Evidence is recorded **per source, each with its own issuer, validity and verification outcome**: software-provenance and runtime/workload evidence come from independent issuers, and a single collapsed value loses the independence that makes the evidence worth verifying (see **Attribute Source / Trusted-Provenance Marking**, [§1.2](#12-content-trust-verdicts-and-their-availability)).'
- id: lifecycle_state
  name: Lifecycle State
  tier: SHOULD
  role: label
  record: state
  origin: declared
  records: Active, suspended or revoked, for kill-switch and revocation fan-out.
  modality: cryptographic agent identity
  emitted_by: [componentIdentityProvider]
  capture: active / suspended / revoked, supports kill-switch & revocation-fanout.
- id: capability_set_change_event
  name: Capability-Set Change Event
  tags: [AOS]
  tier: MUST
  role: descriptor
  record: event
  origin: observed
  records: A tool, server, model, knowledge source or memory store added, removed or modified at runtime.
  emitted_by: [componentReasoningCore]
  capture: 'An event emitted whenever the agent''s usable capability set changes at runtime, a tool, MCP server, model, knowledge source, or memory store **discovered, added, removed, or modified**: with before/after identity and what triggered the change.'
  rationale: 'Every other inventory field describes a **state**; this one describes a **transition**, and transitions are where attacks are visible. Grounded directly in `AOC-09`, where one agent teaches another to acquire a browser/download capability. The security event is the *acquisition*; the previous inference path ("tool-call spike + new Tool Name") fires only once the capability is exercised, and never at all for one acquired and held in reserve. Removal matters symmetrically: a guardrail tool or logging sink quietly dropped is a defense-evasion signal. It is also cheap where least expected to fire: a static capability set emits nothing.'
- id: tool_agent_version
  name: Tool/Agent Version
  tier: SHOULD
  role: identifier
  record: state
  origin: declared
  records: Version of each tool, agent and framework.
  modality: dynamic third-party capability composition
  emitted_by: [componentToolRegistry, componentModelRegistry]
  capture: Version of each tool/agent/framework; instant CVE blast-radius answer; downgrade detection.
  rationale: 'A supply-chain response primitive, with Repository / Code Path / Software Ref. The closest call among the inventory fields: documented instances and genuine R value (CVE blast radius), held below MUST because that value is realized through a fleet-inventory process rather than per-event detection, and because it is inseparable in practice from the AgBOM fields. The WG may reasonably promote it.'
- id: repository_code_path_software_ref
  name: Repository / Code Path / Software Ref
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: Source provenance of tool and agent code.
  modality: dynamic third-party capability composition
  emitted_by: [componentToolRegistry]
  capture: Source provenance of tool/agent code (ties to signing & ODIS `approved_software_refs`).
  rationale_see: tool_agent_version
- id: agbom_inventory_snapshot
  name: AgBOM / Inventory Snapshot
  tags: [AOS]
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: Machine-readable inventory of the agent's composition, on change and on demand.
  modality: supply-chain provenance
  emitted_by: [componentApplication, componentToolRegistry]
  capture: 'A structured, machine-readable inventory of the agent''s composition (packages, models, capabilities (agent cards, discovered peers, MCP servers), knowledge sources, memory stores, tools) emitted on change and **on demand**. Bound to an existing BOM format rather than a bespoke one. Three formats can carry it, to different extents: **CycloneDX** [[41]](#standards--frameworks) is the only one for which an agent-runtime binding has been written (sandbox, tool scopes and endpoints, memory backend, agent-card URL, carried in its generic property bag); **SPDX 3.0** [[42]](#standards--frameworks) carries dependency, integrity and, through its AI profile, model governance; **SWID** [[43]](#standards--frameworks) carries identity, version, dependency and signing. Emit in whichever format the deployment already uses, and record which one ([XM §4.2](Telemetry-Cross-Mapping-Addendum.md#42-correspondence)).'
  rationale: Requires an inventory-emission capability most deployments lack; so do Component Dependency Graph and Inventory Integrity Signature.
- id: component_dependency_graph
  name: Component Dependency Graph
  tags: [AOS]
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: Dependency edges between inventoried components, including transitive ones.
  modality: supply-chain provenance
  emitted_by: [componentApplication, componentToolRegistry]
  capture: Dependency edges between inventoried components, including transitive ones; which agent depends on which tool, which tool on which package or MCP server.
  rationale: 'The complete answer to CVE blast radius: `TA-06` is a vulnerability in a *framework* beneath the agent, and reaching it requires transitive edges.'
- id: inventory_integrity_signature
  name: Inventory Integrity Signature
  tags: [AOS]
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: Signature over the emitted inventory, binding it to a signer.
  modality: supply-chain provenance
  emitted_by: [componentApplication, componentToolRegistry]
  capture: Cryptographic signature over the emitted inventory (signature value + key identifier), binding the declared composition to a signer.
  rationale: 'An inventory a compromised agent can rewrite is worth little. The limit: a signature proves who asserted the inventory, not that the assertion is true, which is the subject of Attribute Source / Trusted-Provenance Marking (§1.2).'
- id: tool_description
  name: Tool Description
  tier: MAY
  role: content
  record: state
  origin: declared
  basis:
    may: [thin]
  records: Declared purpose of a tool, against which behavior is compared.
  emitted_by: [componentToolRegistry]
  capture: 'Declared purpose: detects misleadingly-described ("read-only" but writes) tools.'
  rationale: No documented instance turns on a tool whose declared purpose misdescribes its behavior; `AOC-14` motivates it analogically. A change to the description is already caught by **Tool Definition Digest**.
- id: tool_status
  name: Tool Status (active/disabled)
  tier: MAY
  role: label
  record: state
  origin: declared
  basis:
    may: [thin]
  records: Whether a tool is meant to be reachable.
  emitted_by: [componentToolRegistry]
  capture: Detects calls to tools that should be unreachable.
  rationale: No documented instance involves a call to a tool that should have been unreachable; `AOC-02` motivates it analogically.
- id: creator_id_oncall_creation_update_dates
  name: Creator ID / Oncall / Creation & Update dates
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  basis:
    may: [thin]
  records: Ownership and change dates.
  emitted_by: [componentToolRegistry, componentModelRegistry]
  capture: Ownership, age-based risk, change-correlation for IR speed; recently-changed assets/content correlate with attack timelines.
  rationale: Its value is response routing (who owns the asset) and change correlation. No documented instance turns on it, and the freshness signal it offers for retrieved content is carried by **Retrieved-Content Source / Provenance**.
- id: surfaces_supported
  name: Surfaces Supported
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  basis:
    may: [qa, redundant]
  records: Exposure map per tool.
  emitted_by: [componentToolRegistry]
  capture: Exposure map per tool.
  rationale: An exposure map is inventory and audit material; the surface an event actually arrived on is **Surface / App** (MUST).
- id: fleet_counts
  name: Fleet counts
  name_note: (agents by framework/type; sessions L1/L7/L28; users MAU/power-user; tool-call volume & agent↔tool map; surface & status breakdowns)
  tier: MAY
  role: measure
  record: aggregate
  origin: derived
  basis:
    may: [redundant]
  records: 'Fleet aggregates: agents, sessions, users, tool-call volume.'
  emitted_by_text: fleet level
  capture: Aggregate anomaly, shadow-AI, and CVE-exposure signals.
  rationale: Each count is an aggregate over per-event MUST fields (Agent (Runtime) Instance ID, Session / Turn / Step IDs, Identities Used, Tool Call I/O), so it can be computed where it is needed.
- id: enforcement_point_availability_failure_mode
  name: Enforcement-Point Availability & Failure Mode
  tier: MUST
  role: outcome
  record: event
  origin: observed
  basis:
    required_to_read: [guardrail_input_verdict, guardrail_output_verdict, authorization_decision_record]
  records: Whether each enforcement callout was reached, its latency, and fail-open or fail-closed.
  emitted_by_text: enforcement points
  capture: 'For each enforcement callout (guardrail, policy engine, external guardian): whether it was reached, its latency, and on failure whether the system **failed open or failed closed**, plus the action that was taken anyway.'
  rationale: A verdict that never arrived and a verdict of `allow` are indistinguishable in the log, so without it the guardrail verdicts and the **Authorization Decision Record** cannot be read, and the control plane is a single point of silent failure. Deployments choose fail-open or fail-closed for availability reasons; **the field records the choice and the outcome**, and neither posture is recommended.
- id: instrumentation_coverage_hook_status
  name: Instrumentation Coverage / Hook Status
  tier: MUST
  role: descriptor
  record: state
  origin: observed
  basis:
    required_to_read: [llm_refusal, tool_execution_id, guardrail_input_verdict]
  records: Which hooks are active, their version, where each reports, and the sampling configuration in force.
  emitted_by_text: instrumentation layer
  capture: Which lifecycle hooks are instrumented and active for this agent/run, the instrumentation version, and **where each hook reports**, the difference between "no events", "not observed", and "observed by someone else."
  rationale: 'Grounded by `TA-17`, where the telemetry plane was redirected ([§4.2](#42-the-telemetry-plane)). Under sampling, an absent refusal, tool result or verdict cannot be read without the coverage and sampling record ([RFC §5.2](CoSAI-AI-Telemetry-RFC.md#52-sampling)). More generally it resolves the ambiguity undermining every absence-based detection in the document: no refusal, no termination condition, no matching request are each only interpretable if the relevant hook was instrumented. It is D-dominant, it is not modality-gated (every deployment has an instrumentation configuration), and recording *where each hook reports* is what separates a hijacked plane from a healthy one.'
- id: event_sequence_continuity
  name: Event Sequence Continuity
  tier: SHOULD
  role: identifier
  record: event
  origin: observed
  records: Per-session sequence number, hash-chained, for gap and reordering detection.
  modality: hash-chained event streams
  emitted_by: [componentAuditRecordRepository]
  capture: Per-session monotonic sequence number enabling gap and reordering detection. The stream **SHOULD be hash-chained**, and where chained the **chain head SHOULD be periodically signed and published outside the emitter's trust domain**. That is the minimum that lets a verifier distinguish a gap from a suppression. Where the chain head is published, each record carries the chain identifier and a reference to the published head that covers it.
  rationale: 'The minimum defense against selective suppression by a compromised agent: sequence numbers make omission visible as a gap rather than invisible as silence. Grounded analogically ([§4.2](#42-the-telemetry-plane)).'
- id: policy_reason_code
  name: Policy Reason Code
  tier: MAY
  role: label
  record: event
  origin: observed
  basis:
    may: [qa, redundant]
  records: Machine-readable reason code for an enforcement decision.
  emitted_by_text: enforcement points
  capture: Machine-readable reason code(s) for an enforcement decision, alongside the existing free-text detector name and score.
  rationale: A-dominant reporting convenience, not modality-gated, and the underlying decision is already captured by the guardrail verdicts and the **Authorization Decision Record**.
- id: authorization_decision_record
  name: Authorization Decision Record
  tags: [CPEX]
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: 'Per mediated operation: decision, reason code, deciding authority and rule.'
  emitted_by:
  - componentAuthorizationPolicyDecisionPoint
  - componentAuthorizationPolicyEnforcementPoint
  capture: 'Per mediated operation: the terminal decision (**allow / deny**, with **allow-after-modification** flagged), the deny **reason and machine-readable code** (a fail-closed enforcement failure arrives as a deny with its own code), the per-step actions that produced it including any **suppressed deny** (a plugin denied and was overridden by pipeline role) and any **abort**, the **deciding authority** (inline policy rule vs external PDP, and which; Cedar / CEL / OPA [[49]](#standards--frameworks) / custom), the **rule or policy identifier** that produced it, and any obligations attached. Distinct from a content-guardrail verdict: this is the *authorization* outcome, not a classifier score.'
  rationale: It records what the authorization layer **decided**, on which rule, and why. The guardrail verdicts record what a *content classifier* concluded and Tool ACL / Required Scope what authority a tool *requires*; without this field a denied operation and a never-attempted one are indistinguishable. Among the attacks that turn on that record are `AOC-02` (non-owner compliance), `AOC-08` (privileged action after spoof), `AOC-10` (injected authority), and `TA-08` (individually-authorized calls escalating in aggregate; visible only if each link's decision and rule are recorded). Universal rather than modality-gated; D and R jointly.
- id: attribute_source_trusted_provenance_marking
  name: Attribute Source / Trusted-Provenance Marking
  tags: [CPEX]
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: The authority that supplied each security-relevant attribute, or that it is self-asserted, and each counterparty's knowability tier.
  emitted_by_text: every security-relevant attribute
  capture: '**Cross-cutting.** For every security-relevant attribute, the **authority that supplied it**: verified IdP token, policy decision point, enforcement-owned session store, platform/runtime, versus **self-asserted by the agent or model**. Security-relevant attributes are those a hostile agent could plausibly fabricate: identity, authorization outcome, taint state, approval status, autonomy level, task declaration, and instruction configuration. Under assume-breach, an unmarked value is an unverified value.'
  rationale: 'The zero-trust principle applied to telemetry itself: it determines whether the rest of the field set can be believed. The document already applies the idea once (Verified vs Displayed Identity, §1.6) and the generalization is that identity is not the only attribute an agent can assert. Autonomy Level, Task / Intent Declaration, System Prompt / Instruction Config, and every reasoning field are agent-supplied, and the corpus shows that agents *do* report falsely ([RFC §4.4](CoSAI-AI-Telemetry-RFC.md#44-the-agent-might-be-lying)). Cost is an enum per attribute group, not per event.'
- id: session_taint_labels_information_flow_decisions
  name: Session Taint Labels & Information-Flow Decisions
  tags: [CPEX]
  tier: SHOULD
  role: label
  record: state
  origin: observed
  compound: label state plus taint-caused denials (events, outcome)
  records: Information-flow labels in force, and denials caused by accumulated taint.
  modality: information-flow control
  emitted_by_text: enforcement points
  capture: 'Information-flow labels in force for the session or message: which labels are set, **scope** (session vs message), what operation applied each, and (critically) when an operation is **denied because of accumulated taint rather than anything in its own payload**. The write-down record.'
  rationale: 'A genuinely different mechanism from Input Trust Classification (§1.2): that classifies a segment of one payload, while taint is **state accumulating across a session** that survives into operations whose own content is clean. That distinction is the whole attack in `TA-01` and `TA-02`, where the exfiltrating request is innocuous in isolation. Of everything in SHOULD this has the highest D value per unit of effort.'
- id: human_approval_elicitation_event
  name: Human Approval / Elicitation Event
  tags: [CPEX]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: 'Approval lifecycle: status, identity-provider-verified approver, and whether it covers the executed arguments.'
  modality: out-of-band human approval
  emitted_by: [componentAgentConsentSurface, componentApplicationConsentSurface]
  capture: 'Out-of-band approval lifecycle for high-impact actions: correlation ID, status (pending / resolved / expired), outcome, **approver identity as verified by the identity provider** (not as reported by the agent), channel, and the **scope-binding validation result**: whether the approval still covers the arguments actually presented at execution time.'
  rationale: 'Covers the control the corpus most often shows *missing*: `AOC-01` and `AOC-07` are irreversible actions taken without human authorization. `TA-23` is the sharper case, because the gate was present and was **switched off as configuration** rather than argued past: the record that matters is not only the approval but the change to whether approval was required at all, which is why **Capability-Set Change Event** (§1.6, MUST) and this field are read together. **MUST wherever the deployment gates actions on human approval.** Two sub-signals matter: approver identity must come from the identity provider, not the agent''s claim; and approval scope must be re-validated against the arguments actually presented, or one sign-off can be replayed against a larger action.'
- id: backend_route_restriction_decision
  name: Backend / Route Restriction Decision
  tags: [CPEX]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: Candidate backends, the constraint applied, the choice made.
  modality: policy-driven backend selection
  emitted_by_text: enforcement points
  capture: 'Where an operation was allowed to execute: the candidate backend/model set, the constraint that narrowed it (region, model, site, cost tier, custom label), the selection made, and the behavior when **no candidate qualified**.'
  rationale: Paired with taint it is a D signal; standing alone it is closer to A (data-residency evidence) and Q.
- id: mediation_coverage_bypass_path
  name: Mediation Coverage & Bypass Path
  tags: [CPEX]
  tier: SHOULD
  role: label
  record: event
  origin: observed
  records: Whether an operation passed a reference monitor, where, and whether a bypass exists.
  modality: reference monitor in the request path
  emitted_by_text: enforcement points
  capture: Whether this operation traversed a reference monitor at all, at which **placement** (inbound gateway / egress sidecar / in-process framework), and whether **unmediated paths to the same capability exist**.
  rationale: The enforcement counterpart to Instrumentation Coverage (§1.2). That field asks *is the telemetry complete?*; this one asks *is the enforcement unbypassable?* `AOC-14` is precisely this attack. A control that can be routed around is not a control.
- id: training_data_item_digest
  name: Training-Data Item Digest
  tier: SHOULD
  role: provenance
  record: event
  origin: derived
  records: Digest of each training item at curation, checked against the content fetched.
  modality: training or fine-tuning on externally sourced data
  emitted_by: [componentDataFilteringAndProcessing, componentTrainingData]
  capture: 'For each training item: the content digest taken when it was curated, the digest of the content fetched for training, the source URL, the fetch time, and whether the two match. A mismatch is an event. A dataset distributed as a list of URLs is fetched anew by every downloader, so the check belongs at fetch, not only at curation.'
  rationale: 'Grounded by `TA-33`, where domains named in dataset indexes changed hands after indexing and downloads continued; the per-item hash the source proposes is this field, and several LAION datasets now publish one. Held at SHOULD by its modality: a deployment that trains on no externally sourced data has nothing for it to record.'
- id: training_data_source_provenance
  name: Training-Data Source / Provenance
  tier: SHOULD
  role: provenance
  record: state
  origin: observed
  records: Source, contributor and acquisition of each training document.
  modality: training or fine-tuning on externally sourced data
  emitted_by: [componentDataSources, componentTrainingData]
  capture: 'Per document, not per dataset: the source (URL, repository, crawl, vendor, user feedback), the owner or contributing account where known, how it was acquired, when it was ingested, and the dataset version it entered.'
  rationale: Grounded by `TA-33` (the owner of a source changed after indexing) and `TA-34` (a near-constant number of documents installs a backdoor whatever the corpus size, so dataset-level statistics cannot reveal it, and finding the documents after a backdoor is found needs their per-document origin); `TA-35` motivates it analogically. The two instances meet the evidence test; the modality gate holds the field at SHOULD (RFC §4.7).
- id: compute_job_submission_event
  name: Compute Job Submission
  tier: SHOULD
  role: descriptor
  record: event
  origin: observed
  records: Each job submitted to a training or serving compute framework, with its submitter.
  modality: self-operated training or serving compute
  emitted_by: [componentModelFrameworksAndCode, componentRuntimeHosting]
  capture: 'A job submitted to a training or serving framework or scheduler: the submitter identity and whether it authenticated, the source address, the entrypoint or command, the image or code reference, the resources requested, and the cluster.'
  rationale: 'Grounded by `TA-36`, where unauthenticated jobs on internet-exposed Ray clusters ran cryptominers and harvested credentials for at least seven months. An unauthenticated submission is the attack state; an entrypoint that is not a training or serving workload is the mining signature. It is the first field for `componentRuntimeHosting`. Held at SHOULD by its modality: a deployment on managed inference runs no jobs of its own.'
