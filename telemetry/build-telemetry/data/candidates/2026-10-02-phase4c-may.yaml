- id: T:encoded_obfuscated_payload_indicator
  type: tier
  subject:
    field: encoded_obfuscated_payload_indicator
  source: phase4c
  proposal:
    tier: MUST
    basis:
      evidence: [AOC-12, TA-21]
    rationale: 'The corpus''s obfuscation attacks hide instructions where a reader of the recorded input would not see them: base64 and OCR''d images (`AOC-12`), invisible Unicode in a rules file (`TA-21`). Model Input is only required to carry a content hash ([RFC §5](CoSAI-AI-Telemetry-RFC.md#5-conformance)), so where raw content is not retained the flag and decoded form are the only record that the payload was there.'
  reason: 'two independent instance edges (AOC-12, TA-21), no modality, no Q/A dominance, not research-grade. Its old basis, "a derived detector output", is gone from §4.7. Redundancy with Model Input fails because raw content is deployment policy and the hash cannot be decoded. If rejected, the alternative is B:… may: [redundant], which holds only for deployments that retain raw input'
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
- id: C:encoded_obfuscated_payload_indicator:invisible-unicode
  type: capture
  subject:
    field: encoded_obfuscated_payload_indicator
  source: phase4c
  proposal:
    capture_addition: Includes invisible or control Unicode characters (tag characters, zero-width joiners, bidirectional overrides) that hide instructions from a human reader.
  reason: the accepted TA-21 edge is invisible Unicode in a rules file, which the capture text (base64, OCR, markup tags) does not name. Accept this, or re-class E:TA-21:encoded_obfuscated_payload_indicator as analogical, which leaves one instance and makes the field MAY on thin evidence
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
