  type: pattern
  subject:
    pattern: prefilled_prompt_to_remember
  source: intake
  proposal:
    id: prefilled_prompt_to_remember
    name: Pre-filled prompt telling the assistant to remember a source
    indicates: Memory or recommendation poisoning through a link
    stage: entry
    join: [session_turn_step_ids]
    conditions:
    - '**Input Source / Channel** records that the turn arrived pre-filled from a link or URL parameter, not typed.'
    - The **Model Input** tells the assistant to remember, trust or prefer a named source.
    requires: [input_source_channel, model_input]
    enriches: [memory_write_event, memory_provenance_source]
    baseline: Turns per channel; a pre-filled turn is unusual for most users.
    catches: [TA-32]
