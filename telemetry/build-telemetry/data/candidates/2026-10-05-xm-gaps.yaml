- id: C:input_source_channel:turn-origin
  type: capture
  subject:
    field: input_source_channel
  source: xm-gaps
  proposal:
    capture_addition: For the principal's own turn, whether the principal typed the content or another party supplied it and the principal submitted it (a link's pre-filled parameter, a paste, a share target), with the supplying origin where known.
  reason: 'TA-32: a pre-filled prompt arrives as the user''s turn, so Input Trust Classification sees user trust. The supplying origin is a channel, so this refines Input Source / Channel rather than adding a field; TA-32 already has an instance edge to it.'
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-06'
  applied: '2026-10-06'
