- id: B:threat_classification_atlas_technique_tag
  type: basis
  subject:
    field: threat_classification_atlas_technique_tag
  source: tier
  proposal:
    basis:
      conditional: when a detection fires
  reason: a derived tag; RFC §6.2 makes it MUST when a detection fires, not on instances
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
- id: B:agent_name
  type: basis
  subject:
    field: agent_name
  source: tier
  proposal:
    basis:
      evidence: [TA-05, TA-31]
  reason: 'two independent instances once A:TA-31 is accepted: TA-05 (an off-inventory agent) and TA-31 (one name bound to two peers in multi-agent hosts)'
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  note: one instance (TA-05), no dependency; tier waits on the RFC §4.7 amendment for single-instance fields, and on a search for more off-inventory-agent instances
  amended:
  - proposal:
      basis:
        required_to_read: every §6.1 identifier chain
    reason: 'RFC §6.1: every later detection resolves through these identifiers; one instance edge (TA-05)'
    by: jo5iah
    'on': '2026-10-02'
  applied: '2026-10-02'
- id: B:agent_runtime_instance_id
  type: basis
  subject:
    field: agent_runtime_instance_id
  source: tier
  proposal:
    basis:
      required_to_read:
      - identities_used_per_hop
      - source_host_ip_request_metadata
      - capability_set_change_event
      - instrumentation_coverage_hook_attestation
  reason: one identity across a fleet is ambiguous between sibling instances and a stolen credential (CP-15); capability sets and hook state are per process, so acquisition and coverage drops cannot be joined to the acting workload without it; one instance (AOC-04)
  critical: true
  status: accepted
  amended:
  - proposal:
      basis:
        required_to_read: every §6.1 identifier chain
    reason: RFC §6.1 identifier; one instance edge (AOC-04)
    by: jo5iah
    'on': '2026-10-02'
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
- id: B:workflow_run_id
  type: basis
  subject:
    field: workflow_run_id
  source: tier
  proposal:
    basis:
      required_to_read: [loop_step_count_signal, resource_consumption_aggregate]
  reason: both are defined per run and cannot be computed without the run ID; one instance (AOC-04)
  critical: true
  status: accepted
  amended:
  - proposal:
