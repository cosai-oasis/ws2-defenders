- id: Q:ocsf_ai_guardrail:leva
  type: ask
  subject:
    ask: ocsf_ai_guardrail
  source: leva-review
  proposal:
    id: ocsf_ai_guardrail
    publication: ocsf
    summary: Add an ai_guardrail object (type, verdict, score, blocked flag, threat reference), with enforcement availability and failure-mode attributes.
    proposes: ['object:ai_guardrail']
    tracking: []
    status: proposed
    rationale: 'A Guardrail Modification Record needs no content. Three facts on one record carry it: a modifying step naming the enforcement point, an allow-after-modification verdict, and entry and emission digests that differ under one key. The AID-EMIT-1 record format [[87]](#other-sources) carries that composition, and codes a fail-closed failure as a deny distinct from a policy deny. Whether the enforcement point was reached at all has no carrier yet.'
  reason: items 9 and 10
  status: accepted
  decided_by: levaj2000
  decided_on: '2026-10-05'
  note: Jeff Leva's review of XM §§1 and 2; accepted on Josiah's instruction, 2026-10-05
  applied: '2026-10-05'
