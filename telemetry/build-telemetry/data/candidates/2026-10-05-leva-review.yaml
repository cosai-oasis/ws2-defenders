- id: M:event_sequence_continuity:ocsf:leva
  type: mapping
  subject:
    field: event_sequence_continuity
    publication: ocsf
  source: leva-review
  proposal:
    coverage: partial
    constructs: ['profile:record_integrity', 'object:attestation', 'attribute:prev_event', 'attribute:chain_uid', 'attribute:sequence']
    gap: No end-of-chain marker, so a truncated chain reads as an open one
    note: '`attestation.prev_event` and `chain_uid` link the records and `metadata.sequence` counts them. Scoping the count to a producer epoch and stream is a producer convention, not schema (AID-EMIT-1 section 7 [[87]](#other-sources)).'
    asks: [ocsf_chain_end]
  reason: items 1 and 13. metadata.sequence is optional on metadata at 1.9.0 (checked in the cached schema). The OTel audit draft has audit.sequence.end; OCSF has no counterpart, so tail truncation is not detectable. Signature bytes on digital_signature (ocsf-schema#1709, merged 2026-09-24) are after the 1.9.0 pin.
  status: accepted
  decided_by: levaj2000
  decided_on: '2026-10-05'
  note: Jeff Leva's review of XM §§1 and 2; accepted on Josiah's instruction, 2026-10-05
  applied: '2026-10-05'
- id: Q:ocsf_chain_end:leva
