- id: P:callback_to_undeclared_destination:cs11
  type: pattern
  subject:
    pattern: callback_to_undeclared_destination
  source: open-items
  proposal:
    id: callback_to_undeclared_destination
    former_id: CP-20
    name: Task callback registered to an undeclared destination
    indicates: Covert egress through delegated-task callbacks
    stage: egress
    join: [workflow_run_id]
    conditions:
    - An **A2A Task Lifecycle Event** registers a push-notification callback.
    - Its destination (**Output Egress Destination**) is not among the peer's declared endpoints or the agent's egress history.
    requires: [a2a_task_lifecycle_event, output_egress_destination]
    enriches: [peer_agent_card_descriptor]
    catches: []
    motivation: A2A push-notification configuration registers an egress channel the peer sets; no corpus entry uses one.
  reason: its only catch, AOC-11 (analogical), has no delegated task or callback in CS11
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-05'
  applied: '2026-10-05'
- id: Q:ocsf_ai_agent_activity:xm26
  type: ask
  subject:
    ask: ocsf_ai_agent_activity
  source: open-items
  proposal:
    id: ocsf_ai_agent_activity
    publication: ocsf
    summary: 'Ratify an AI Agent Activity class (9001) for agent-originated control-plane events: inter-agent messages, background tasks, loop and resource aggregates, capability changes.'
    proposes: ['class:9001']
    tracking: [ocsf-schema#1640]
    status: open
    rationale: 'Draft ocsf-schema#1754 adds an AI Agent Activity class as 6009 in Application Activity, not 9001. Its nine activities follow agent hook points, and it carries none of the five fields: Subagent Start and Stop have no attributes, so they record no sender, receiver, content, channel or step count, and no activity covers scheduled tasks, resource totals or capability changes.'
  reason: 'XM 26. #1754 checked 2026-10-05 at head 3a72052 (draft, open, updated 2026-09-22): class uid 9 under application (6009); activities Session Start/End, Subagent Start/Stop, User Prompt Submit, Permission Request, Tool Use, Stop, Compact; only ai_agent_stop_info and ai_agent_tool_use_info have attributes. Tracking stays #1640 per the XM 26 plan.'
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-05'
  applied: '2026-10-05'
