# Curation registry batch. Edit status only through tools/curate.py, or by hand
# keeping decided_by and decided_on filled in. See curate.py for the schema.
- id: P:claimed_failure_unrecorded
  type: pattern
  subject:
    pattern: claimed_failure_unrecorded
  source: open-items
  proposal:
    id: claimed_failure_unrecorded
    name: Claimed failure with no recorded failure
    indicates: Injected content that fakes an error or limit to make the model stop, truncate or refuse
    stage: decision
    join: [session_turn_step_ids]
    conditions:
    - '**LLM Refusal** or **Stop Reason** shows the turn ending early, and the response attributes it to a failure: an expired token, exhausted memory or disk, a failed operation.'
    - '**LLM Error / Exception** records no error for the turn.'
    requires: [llm_refusal, stop_reason, llm_error_exception]
    enriches: [input_output_token_counts, model_input, encoded_obfuscated_payload_indicator, response_model_output]
    catches: []
    catches_analogical: [TA-38]
    motivation: '`TA-38` plants fabricated system messages (token expiry, out-of-memory kills, disk exhaustion) so that an analysis model aborts; no test against a model is reported. It applies RFC §4.4 ("The agent might be lying") to a misreport an attacker planted.'
  reason: decided 2026-10-05 to propose. Every TA-38 edge is analogical, so the pattern is motivation-only; it reads LLM Refusal and Stop Reason, not Response / Model Output.
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-05'
  applied: '2026-10-05'
- id: E:AOC-11:inter_agent_message:cs11
  type: edge
  subject:
    attack: AOC-11
    field: inter_agent_message
  source: open-items
  proposal:
    grounding: reject
  reason: CS11 (arXiv:2602.20021, pp. 33-34) records a human impersonating the owner and Ash emailing its contacts; the Moltbook post failed and the recipients shown are lab members. No second agent receives or acts on a relay. Inter-Agent Message stays MUST on 6 instances.
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-05'
  applied: '2026-10-05'
