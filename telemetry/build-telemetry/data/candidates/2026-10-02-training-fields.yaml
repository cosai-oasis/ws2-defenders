- id: F:training_data_item_digest
  type: field
  subject:
    field: training_data_item_digest
  source: intake-fields
  proposal:
    record:
      id: training_data_item_digest
      name: Training-Data Item Digest
      tier: SHOULD
      role: provenance
      record: event
      origin: derived
      records: Digest of each training item at curation, checked against the content fetched.
      modality: training or fine-tuning on externally sourced data
      emitted_by: [componentDataFilteringAndProcessing, componentTrainingData]
      capture: 'For each training item: the content digest taken when it was curated, the digest of the content fetched for training, the source URL, the fetch time, and whether the two match. A mismatch is an event. A dataset distributed as a list of URLs is fetched anew by every downloader, so the check belongs at fetch, not only at curation.'
      rationale: 'Grounded by `TA-33`, where domains named in dataset indexes changed hands after indexing and downloads continued; the per-item hash the source proposes is this field, and several LAION datasets now publish one. Held at SHOULD by its modality: a deployment that trains on no externally sourced data has nothing for it to record.'
    step: '6.7'
  reason: Identified by the TA-33 to TA-40 intake; no existing field records this step of the attack.
  requires: S:6.7
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
