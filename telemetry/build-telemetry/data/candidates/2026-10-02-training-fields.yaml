- id: X:trace_context_propagated:training
  type: capture
  subject:
    field: trace_context_propagated
  source: intake-fields
  proposal:
    capture_addition: Records the baggage members received with the context, by key. A member that names a telemetry destination or credential is attacker-controllable input, not configuration.
  reason: 'TA-37: the attacker-supplied replica rode the W3C `baggage` header the field mandates propagating; recording baggage keys makes the injection visible, and the field already has the TA-37 instance edge.'
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
- id: X:input_source_channel:training
  type: capture
  subject:
    field: input_source_channel
  source: intake-fields
  proposal:
    capture_addition: 'Telemetry placed in a model''s context for analysis (log records, alerts, malware samples) is a channel of its own: its fields carry text an attacker wrote.'
  reason: 'TA-38, TA-39 and TA-40: logs and samples given to an AI analyst carry attacker text; the capture text names surfaces, tools, agents and documents, not telemetry.'
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
- id: X:model_provenance_signing_hash:training
  type: capture
  subject:
    field: model_provenance_signing_hash
  source: intake-fields
  proposal:
    capture_addition: Where the deployment trains or fine-tunes the model, the provenance includes the training run and the digest of the dataset version it used.
  reason: 'TA-34: a backdoor found at inference has to be traced to the run and data that installed it; the field''s capture covers the served artifact only.'
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
