- id: F:compute_job_submission_event
  type: field
  subject:
    field: compute_job_submission_event
  source: intake-fields
  proposal:
    record:
      id: compute_job_submission_event
      name: Compute Job Submission
      tier: SHOULD
      role: descriptor
      record: event
      origin: observed
      records: Each job submitted to a training or serving compute framework, with its submitter.
      modality: self-operated training or serving compute
      emitted_by: [componentModelFrameworksAndCode, componentRuntimeHosting]
      capture: 'A job submitted to a training or serving framework or scheduler: the submitter identity and whether it authenticated, the source address, the entrypoint or command, the image or code reference, the resources requested, and the cluster.'
      rationale: 'Grounded by `TA-36`, where unauthenticated jobs on internet-exposed Ray clusters ran cryptominers and harvested credentials for at least seven months. An unauthenticated submission is the attack state; an entrypoint that is not a training or serving workload is the mining signature. It is the first field for `componentRuntimeHosting`. Held at SHOULD by its modality: a deployment on managed inference runs no jobs of its own.'
    step: '6.7'
  reason: Identified by the TA-33 to TA-40 intake; no existing field records this step of the attack.
  requires: S:6.7
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
