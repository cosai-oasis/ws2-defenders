- id: S:6.7
  type: step
  subject:
    step: '6.7'
  source: intake-fields
  proposal:
    number: '6.7'
    ad_number: '1.7'
    title: Training data and training infrastructure
    rfc_header:
    - '| Field | Tier | What it records | Emitted by |'
    - '| :------------------ | :---- | :--------------------------------------------- | :-------------------- |'
  reason: Appended after §6.6, so no section renumbers. Training-time fields share no step with the runtime path; the step comes last in the implementation order because every field in it is modality-gated.
