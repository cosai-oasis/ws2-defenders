- id: F:training_data_source_provenance
  type: field
  subject:
    field: training_data_source_provenance
  source: intake-fields
  proposal:
    record:
      id: training_data_source_provenance
      name: Training-Data Source / Provenance
      tier: SHOULD
      role: provenance
      record: state
      origin: observed
      records: Source, contributor and acquisition of each training document.
      modality: training or fine-tuning on externally sourced data
      emitted_by: [componentDataSources, componentTrainingData]
      capture: 'Per document, not per dataset: the source (URL, repository, crawl, vendor, user feedback), the owner or contributing account where known, how it was acquired, when it was ingested, and the dataset version it entered.'
      rationale: Grounded by `TA-33` (the owner of a source changed after indexing) and `TA-34` (a near-constant number of documents installs a backdoor whatever the corpus size, so dataset-level statistics cannot reveal it, and finding the documents after a backdoor is found needs their per-document origin); `TA-35` motivates it analogically. The two instances meet the evidence test; the modality gate holds the field at SHOULD (RFC §4.7).
    step: '6.7'
  reason: Identified by the TA-33 to TA-40 intake; no existing field records this step of the attack.
  requires: S:6.7
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
