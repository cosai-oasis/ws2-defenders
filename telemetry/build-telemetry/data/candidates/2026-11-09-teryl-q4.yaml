# Curation registry batch. Edit status only through tools/curate.py, or by hand
# keeping decided_by and decided_on filled in. See curate.py for the schema.
- id: F:agent_registration_identity
  type: field
  subject:
    field: agent_registration_identity
  source: teryl-review-4
  proposal:
    record:
      id: agent_registration_identity
      name: Agent Registration Identity
      tier: MUST
      role: identifier
      record: event
      origin: declared
      basis:
        required_to_read: [agent_name, verified_vs_displayed_identity]
      records: The stable identifier the agent is registered under, to which Agent Name resolves.
      emitted_by: [componentIdentityProvider]
      capture: The agent's stable registered identifier within its trust domain, as issued by the identity provider or agent registry (ODIS `agent_id`). It persists across runs, restarts and versions. **Agent (Runtime) Instance ID** identifies one running instance, and **Agent Name** is a display label that resolves to this identifier.
      rationale: A name is checked only by resolving it to something that cannot be reused. **Agent Name** rests on `TA-05` and `TA-31`, both found by comparing a name against what it should resolve to, and in `TA-31` an admitted peer took a trusted peer's name without forging anything. For an agent, the verified identifier that **Verified vs Displayed Identity** sets against the display name is this one. Without it, both fields are ambiguous between the registered agent and any agent using its name.
    step: '6.1'
  reason: Teryl's review on issue 154, comment 4. Tiered through the RFC §4.7 dependency clause on two MUST fields, not on new instances.
  critical: true
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-11-09'
  applied: '2026-11-09'
- id: E:TA-31:agent_registration_identity
  type: edge
  subject:
    attack: TA-31
    field: agent_registration_identity
  source: teryl-review-4
  proposal:
    grounding: instance
  reason: the instance is a name that resolved to the wrong registered peer; dispatch keyed on the display name rather than the identity it should resolve to
  requires: F:agent_registration_identity
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-11-09'
  applied: '2026-11-09'
- id: R:agent_name:display-label
  type: facets
  subject:
    field: agent_name
  source: teryl-review-4
  proposal:
    records: Display name or type of the agent; resolves to Agent Registration Identity and exposes off-inventory agents.
    capture: Human-readable name or type of the agent (e.g. "Deep Research agent"), as displayed; not an identifier. Detects off-inventory / "shadow" agents, whose name resolves to no **Agent Registration Identity**.
  reason: Agent Name stays a display label that resolves to the registered identity.
  requires: F:agent_registration_identity
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-11-09'
  applied: '2026-11-09'
- id: P:agent_name_collision:registration
  type: pattern
  subject:
    pattern: agent_name_collision
  source: teryl-review-4
  proposal:
    id: agent_name_collision
    former_id: CP-33
    name: One agent name bound to two peers
    indicates: Agent name collision; wrong-peer dispatch
    stage: action
    join: [agent_name]
    conditions:
    - Within one host, an **Agent Name** resolves to more than one **Agent Registration Identity**, **Peer Agent Card / Descriptor** or endpoint.
    - '**Verified vs Displayed Identity** shows the requests addressed to the name reach a different peer.'
    requires: [agent_registration_identity, peer_agent_card_descriptor, verified_vs_displayed_identity]
    enriches: [identities_used_per_hop, inter_agent_message]
    catches: [TA-31]
  reason: The collision is the name resolving to more than one registered identity; the pattern reads the field it resolves to.
  requires: E:TA-31:agent_registration_identity
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-11-09'
  applied: '2026-11-09'
