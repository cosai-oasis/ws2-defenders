- id: A:otel_agent_instance_id
  type: ask
  subject:
    ask: otel_agent_instance_id
  source: teryl-review-4
  proposal:
    id: otel_agent_instance_id
    publication: otel_genai
    summary: Add an agent instance identifier distinct from gen_ai.agent.id, which identifies the agent across runs.
    proposes: []
    tracking: []
    status: proposed
    rationale: '`gen_ai.agent.id` is defined as the stable identifier of the agent, so it cannot also identify one running instance of it. `service.instance.id` identifies the service instance, which is the agent instance only where one service hosts one agent. Per-instance quarantine needs the instance itself (AD §1.1).'
  reason: found while mapping Agent Registration Identity; the instance ID was mapped to gen_ai.agent.id
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-11-09'
  applied: '2026-11-09'
