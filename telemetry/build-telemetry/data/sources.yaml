# External vocabularies the data refers to. Pinned, not copied: tools resolve
# IDs against these versions, fetched into a cache outside data/.
atlas:
  repository: https://github.com/mitre-atlas/atlas-data
  release: v2026.08
  file: dist/v6/ATLAS-2026.08.yaml
  commit: 41d4f5ca4112f0e492ffaa3ebff07dc80a75afa5
  released: '2026-09-01'
  note: v2026.09 (2026-09-15) is available; AD §3.6 is verified against v2026.08. Re-verify before moving the pin.
  # IDs ATLAS has retired. The documents may name them to record the retirement;
  # the data may not use them.
  retired:
    AML.T0104: absorbed into AML.T0110 and its sub-techniques

# Risk Map IDs resolve against the base, then each layer in order.
riskmap:
  repository: https://github.com/cosai-oasis/secure-ai-tooling
  files: [risk-map/yaml/risks.yaml, risk-map/yaml/controls.yaml, risk-map/yaml/components.yaml]
  base:
    branch: develop
    commit: 37e7beddd6611bdeb61ad707492aed069bcc51af
    committed: '2026-09-30'
    note: The near-future target, used in place of main.
  layers:
    - branch: feature/jo5iah-524-527
      repository: https://github.com/davidlabianca/secure-ai-tooling
      commit: 0e9601d7d7780df7726b94d46270edc8f0c86493
      committed: '2026-09-23'
      stacked_on: {pull_request: 507, branch: feature/controls-risks-layer45, commit: 1a0b5d4e11eac1ce733918c8779c83d1646fcad7}
      state: no pull request yet; opens against feature/controls-risks-layer45 after review
      issues: [524, 525, 526, 527]
      note: >-
        Carries PR #507 plus the reworked telemetry proposals. Retires two IDs the
        documents still use: riskUnsafeInterAgentPropagation (split into an extension of
        riskImplicitCrossBoundaryTrust and the new riskCrossAgentReputationPoisoning) and
        controlAgentMemoryIntegrity (narrowed to controlMemoryReferentRevalidation, with
        controlRetrievalAndVectorSystemIntegrity extended to componentMemory).

# Publications XM cross-references. Each pins a commit or a published version.
# `verified` records whether XM's mapping has been checked against that pin, and
# when; a pin set before the check is a target, not a claim. `reference` is the
# entry in the set's reference list. `schema` names a machine-readable
# definition the validator can resolve mapped constructs against.
publications:
  ocsf:
    name: Open Cybersecurity Schema Framework
    reference: 37
    repository: https://github.com/ocsf/ocsf-schema
    release: 1.9.0
    commit: 856d462bd20dc46cc1ffed2dfffe3b91ef0fbeba
    released: '2026-08-03'
    schema: [dictionary.json, objects/, events/, profiles/]
    verified: true
    verified_on: '2026-10-02'
    verified_how: every construct mapping.yaml cites resolves at this pin (tools/validate.py); coverage judged from the schema's own definitions
    note: XM's mapping also cites open proposals (ocsf-schema#1640, #1704, #1724, #1729, #1739); constructs from them are asks, not 1.9.0.
  otel_genai:
    name: OpenTelemetry GenAI semantic conventions
    reference: 35
    repository: https://github.com/open-telemetry/semantic-conventions-genai
    commit: e07f4ebacb08f56db8c4c882d117720333fbca04
    committed: '2026-10-02'
    schema: [model/]
    verified: true
    verified_on: '2026-10-02'
    verified_how: every construct mapping.yaml cites resolves at this pin (tools/validate.py); coverage judged from the schema's own definitions
    note: No release yet; every convention is at Development status, so pin by commit.
  otel_semconv:
    name: OpenTelemetry semantic conventions (core)
