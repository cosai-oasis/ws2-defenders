# TA-38. Data for AD §3; `fields:` lists its edges (grounding instance unless marked).
id: TA-38
name: macOS.Gaslight
label: '**macOS.Gaslight, prompt injection aimed at AI-assisted malware analysis** (SentinelOne, Aug 2026)'
ref: 82
instance: executed
same_incident_as: []
what_happened: 'A Rust backdoor for macOS, attributed with high confidence to DPRK-aligned activity, carries a 3.5 KB Markdown-fenced payload of 38 fabricated system messages: token-expiry warnings, out-of-memory kills, disk exhaustion, repeated operation failures and bogus analysis flags, with `{{DATA}}` tokens imitating prompt scaffolding. Its aim is that an LLM-assisted triage or reverse-engineering tool reading the sample aborts, truncates or refuses the analysis. The implant also has Telegram command and control, a stealer and LaunchAgent persistence. The sample was uploaded to VirusTotal on 22 May 2026. SentinelOne reports no test against a model, so no effect on an AI system is documented.'
reference: macOS.Gaslight | Rust Backdoor Turns Prompt Injection on the Analyst, Not the Sandbox. P. Stokes, SentinelLABS, August 2026. <https://www.sentinelone.com/labs/macos-gaslight-rust-backdoor-turns-prompt-injection-on-the-analyst-not-the-sandbox/>
atlas: [AML.T0051.001, AML.T0015]
atlas_text: '`AML.T0051.001` LLM Prompt Injection: Indirect; `AML.T0015` Evade AI Model'
atlas_notes: The payload targets the defender's AI analysis, not the victim host
risks: [riskPromptInjection, riskModelEvasion]
components_text: AgentInputHandling, AgentOutputHandling
chain:
- step: An AI-assisted analysis tool reads the sample, payload included
  fields:
  - field: model_input
    grounding: analogical
    reason: the payload is built to enter the tool's input; no ingestion is documented
  - field: encoded_obfuscated_payload_indicator
    grounding: analogical
    reason: fake system messages and `{{DATA}}` scaffolding are the markup authority tags the field flags; no model input is documented
- step: The fabricated errors and limits push the model to abort, truncate or refuse
  fields:
  - field: llm_refusal
    grounding: analogical
    reason: a refusal of analysis is one stated goal; no response is documented
  - field: stop_reason
    grounding: analogical
    reason: an abort or truncation would show as an early stop; no response is documented
  - field: llm_error_exception
    grounding: analogical
    reason: a claimed error with no recorded error is the discrepancy that separates the attack from a real failure; no response is documented
