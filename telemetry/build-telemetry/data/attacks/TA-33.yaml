# TA-33. Data for AD §3; `fields:` lists its edges (grounding instance unless marked).
id: TA-33
name: Split-view dataset poisoning
label: '**Split-view poisoning of web-scale training datasets** (Carlini et al., Feb 2023)'
ref: 77
instance: executed
same_incident_as: []
what_happened: 'Web-scale datasets such as LAION-400M and COYO-700M are distributed as lists of URLs, and every downloader fetches the content anew. The authors bought expired domains still named in these lists and logged requests for 12 months from August 2022; downloads continued even for the oldest datasets. For $60 an attacker could control 0.01% of LAION-400M or COYO-700M. The authors returned 404 to every request and poisoned nothing: the control step was executed and the poison withheld. A second attack, frontrunning, times malicious Wikipedia edits to land in a snapshot before moderators revert them. The defense the paper proposes is a cryptographic hash per item, checked at download; several LAION datasets now publish SHA-256 hashes.'
reference: Poisoning Web-Scale Training Datasets is Practical. N. Carlini, M. Jagielski, C. A. Choquette-Choo, D. Paleka, W. Pearce, H. Anderson, A. Terzis, K. Thomas, F. Tramèr, arXiv:2302.10149, February 2023. MITRE ATLAS case study **`AML.CS0025`**. <https://arxiv.org/abs/2302.10149>
atlas: [AML.T0020, AML.T0010.002]
atlas_text: '`AML.T0020` Training Data Poisoning; `AML.T0010.002` AI Supply Chain Compromise: Data'
atlas_notes: ATLAS case study `AML.CS0025` (Exercise); content at a URL changes after the dataset indexed it
risks: [riskDataPoisoning]
components_text: DataSources, TrainingData
chain:
- step: An expired domain named in a dataset index is bought
  fields: []
- step: A downloader fetches the URL and receives content other than what was indexed
  fields:
