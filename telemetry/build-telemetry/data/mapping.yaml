# How the publications XM cross-references carry each field, the asks CoSAI makes of
# them, and the Risk Map controls each field helps implement. Written by tools/apply.py
# from decided candidates; record documented in tools/xm_propose.py. Constructs resolve
# at the versions pinned in sources.yaml `publications:` (tools/validate.py checks).
asks:
- id: ocsf_ai_delegation_activity
  publication: ocsf
  summary: Ratify an AI Delegation Activity class (9002) for the delegation lifecycle.
  proposes: ['class:9002']
  tracking: [ocsf-schema#1640]
  status: open
- id: ocsf_ai_operation_identifiers
  publication: ocsf
  summary: Extend the ai_operation profile with run, turn and step identifiers, action type and trigger type.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_stop_reason
  publication: ocsf
  summary: Merge the ai_status object on the ai_operation profile; its stop_reason_id carries End of Turn, Token Limit, Tool Use, Session Stop and Content Filter.
  proposes: ['object:ai_status', 'attribute:stop_reason_id']
  tracking: [ocsf-schema#1704]
  status: open
- id: ocsf_trust_level
  publication: ocsf
  summary: Add a trust_level enum usable on content and message objects.
  proposes: ['attribute:trust_level']
  tracking: []
  status: proposed
- id: ocsf_autonomy_level
  publication: ocsf
  summary: Add an autonomy_level enum.
  proposes: ['attribute:autonomy_level']
  tracking: []
  status: proposed
- id: ocsf_egress_correlation
  publication: ocsf
  summary: Add an egress correlation attribute linking model output to its destination, recipient or URL.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_model_provenance
  publication: ocsf
  summary: Standardize model provider and provenance or signing attributes in ai_operation.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_ai_memory
  publication: ocsf
  summary: Add an ai_memory object (operation, provenance, footprint, poisoning score, isolation verified).
  proposes: ['object:ai_memory']
  tracking: []
  status: proposed
- id: ocsf_ai_retrieval
  publication: ocsf
  summary: Add an ai_retrieval object (query, items, source and provenance, integrity signal).
  proposes: ['object:ai_retrieval']
  tracking: []
  status: proposed
- id: ocsf_ai_approval
  publication: ocsf
  summary: Add an ai_approval object (correlation ID, status, identity-provider-verified approver, channel, scope-binding result).
  proposes: ['object:ai_approval']
  tracking: []
  status: proposed
- id: ocsf_attribute_source
  publication: ocsf
  summary: Add an attribute_source enum (idp, pdp, enforcement-state, platform, self-asserted) usable on identity, authorization and agent-state attributes.
  proposes: ['attribute:attribute_source']
  tracking: []
  status: proposed
- id: otel_trust_level
  publication: otel_genai
  summary: Add gen_ai.input.trust_level on message parts (trusted or untrusted, crossed with instruction or data).
  proposes: [gen_ai.input.trust_level]
  tracking: []
  status: proposed
  rationale: 'The four values are trusted-instruction, trusted-data, untrusted-instruction and untrusted-data. **`untrusted-instruction` is the attack state**: `TA-01` is untrusted email content promoted to instruction. The enum carries provenance only; detector verdicts belong on the **Guardrail (Input) Verdict** (AD §1.2). No current convention has an analogue, and the addition is one enum on an existing structure.'
- id: otel_security_guardrail
  publication: otel_genai
  summary: Extend the evaluation event for security use (blocked or allowed, guardrail type, threat technique), or add gen_ai.guardrail.*.
  proposes: []
  tracking: []
  status: proposed
  rationale: The evaluation event already carries name, score, label and explanation, the right shape for a classifier verdict; reusing it avoids a parallel namespace. This is what makes classifier *bypass* detectable (`TA-01`).
- id: otel_memory_provenance_footprint
  publication: otel_genai
  summary: Add provenance and footprint attributes to gen_ai.memory.*.
  proposes: []
  tracking: []
  status: proposed
  rationale: '`gen_ai.memory.*` carries store and record identity, query text, record count, seven memory operations and a `gen_ai.memory.client` span ([§2.1](#21-what-it-is-and-the-version-mapped)). Operation and item identity are therefore covered; **provenance** and **footprint** are not, and neither appears anywhere in the `gen_ai` registry. Memory remains MUST here (AD §1.4), with `IR-02` and `IR-05` as direct grounding and `AOC-05` for footprint.'
- id: otel_retrieval_provenance
  publication: otel_genai
  summary: Add per-document source, owner, trust level and last-modified attributes to retrieval documents.
  proposes: []
  tracking: []
  status: proposed
  rationale: '`gen_ai.retrieval.documents` exists; per-document **source, owner, trust level, and last-modified** do not, and `TA-09` turns specifically on recently-modified retrievable content.'
- id: otel_turn_step_ids
  publication: otel_genai
  summary: Add gen_ai.turn.id and gen_ai.step.id.
  proposes: [gen_ai.turn.id, gen_ai.step.id]
  tracking: []
  status: proposed
  rationale: '`gen_ai.conversation.id` and `gen_ai.workflow.name` exist; the intermediate levels do not. `TA-08` and `IR-01` are across-turn patterns (AD §1.1).'
- id: otel_trigger
  publication: otel_genai
  summary: Add gen_ai.trigger.type (user_initiated or autonomous) and gen_ai.trigger.event; scheduled and self-triggered runs use it.
  proposes: [gen_ai.trigger.type, gen_ai.trigger.event]
  tracking: []
  status: proposed
  rationale: '`TA-01` is zero-click; this is the first filter of any injection hunt.'
- id: otel_tool_digest_mcp_primitive
  publication: otel_genai
  summary: Add gen_ai.tool.definitions.hash and an mcp.primitive value set (tool, resource, prompt, sampling, elicitation, roots).
  proposes: [gen_ai.tool.definitions.hash, mcp.primitive]
  tracking: []
  status: proposed
  rationale: '`gen_ai.tool.definitions` and `mcp.method.name` already carry the raw material; a stable hash attribute and an explicit primitive value set make definition drift and non-tool MCP surfaces queryable (AD §1.3).'
- id: otel_attachment_identity
  publication: otel_genai
  summary: Add attachment identity (name, size, hash) on message parts.
  proposes: []
  tracking: []
  status: proposed
  rationale: '`AOC-12` is an image/OCR injection; `AOC-05` is attachment flooding.'
- id: otel_model_provenance
  publication: otel_genai
  summary: Add gen_ai.model.hash, gen_ai.model.signature and gen_ai.model.source.
  proposes: [gen_ai.model.hash, gen_ai.model.signature, gen_ai.model.source]
  tracking: []
  status: proposed
  rationale: Together they complete the supply-chain record that `gen_ai.request.model` starts.
- id: otel_citations
  publication: otel_genai
  summary: Add citation attributes on output messages with a resolution flag against retrieval.
  proposes: []
  tracking: []
  status: proposed
- id: otel_execution_environment
  publication: otel_genai
  summary: Add execution-environment attributes (sandbox, runtime, egress policy) for tool execution.
  proposes: []
  tracking: []
  status: proposed
- id: otel_inter_agent_messaging
  publication: otel_genai
  summary: Add inter-agent messaging attributes.
  proposes: []
  tracking: []
  status: proposed
- id: otel_run_budget
  publication: otel_genai
  summary: Add per-run budget and threshold semantics; document security use of the loop metrics.
  proposes: []
  tracking: []
  status: proposed
- id: otel_capability_change
  publication: otel_genai
  summary: Add a capability-change event; reference an external BOM by URI or digest.
  proposes: []
  tracking: []
  status: proposed
- id: otel_hook_coverage
  publication: otel_genai
  summary: Record instrumentation hook coverage as a resource attribute.
  proposes: []
  tracking: []
  status: proposed
- id: otel_egress_pattern
  publication: otel_genai
  summary: Document correlating model output to its destination through the HTTP and network conventions on the child span.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_entry_point
  publication: ocsf
  summary: 'Add an entry point to ai_operation: the surface an operation arrived through (CLI, web, IDE, email, chat, scheduler) and whether it is internal or external.'
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_input_segment_source
  publication: ocsf
  summary: 'Add a per-segment source to message_context: the surface, tool, agent or document each input segment came from, beside the proposed trust_level.'
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_obfuscation
  publication: ocsf
  summary: Add an obfuscation finding (detected, encodings, decoded form or its hash) to ai_guardrail or Detection Finding, aligned with AITF security.obfuscation.*.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_citations
  publication: ocsf
  summary: Add citations to message_context, each with its source and whether it resolves to an item an ai_retrieval record returned, aligned with AITF rag.citation.*.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_inference_parameters
  publication: ocsf
  summary: Add the decoding parameters in force for a call (temperature, top_p, max_tokens, stop sequences, seed) and the declared context window to ai_model or message_context.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_ai_error
  publication: ocsf
  summary: 'Add an AI error type to ai_operation beside status_id: provider error, context overflow, rate limit, content filter, silent truncation.'
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_tool_execution_environment
  publication: ocsf
  summary: Add the execution environment of a tool call (isolation mode, runtime, timeout and egress policy) beside ai_capability, aligned with AITF supply_chain.runtime.*.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_identity_verification
  publication: ocsf
  summary: Record which identity authorized an operation (a verified identifier or a display name) and the verification outcome, on actor or ai_authorization.
  proposes: []
  tracking: []
  status: proposed
- id: otel_run_id
  publication: otel_genai
  summary: Add gen_ai.run.id, as AITF defines it; gen_ai.workflow.name names the workflow, not the run.
  proposes: [gen_ai.run.id]
  tracking: []
  status: proposed
- id: otel_entry_point
  publication: otel_genai
  summary: 'Add an entry-point attribute: the surface a request arrived through and whether it is internal or external.'
  proposes: []
  tracking: []
  status: proposed
- id: otel_input_part_source
  publication: otel_genai
  summary: Add a per-part source on input messages (the surface, tool, agent or document it came from), beside the proposed gen_ai.input.trust_level.
  proposes: []
  tracking: []
  status: proposed
- id: otel_obfuscation
  publication: otel_genai
  summary: Add obfuscation indicators on input (detected, encodings, decoded hash), aligned with AITF security.obfuscation.*.
  proposes: []
  tracking: []
  status: proposed
- id: otel_refusal
  publication: otel_genai
  summary: Add a refusal status and reason distinct from finish reasons, so a refusal that ends normally is still visible.
  proposes: []
  tracking: []
  status: proposed
- id: otel_tool_trust_boundary
  publication: otel_genai
  summary: Extend gen_ai.tool.type, or add a trust-boundary attribute, to distinguish MCP, internal, direct-storage and code-execution tools.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_chain_end
  publication: ocsf
  summary: Add an end-of-chain marker to attestation, so a verifier can tell a closed chain from a truncated one. The signature bytes on digital_signature, merged as ocsf-schema#1709 after 1.9.0, complete the signed chain head.
  proposes: []
  tracking: []
  status: proposed
  rationale: The OpenTelemetry Audit Logging data model already carries the marker as `audit.sequence.end` [[88]](#other-sources).
- id: otel_audit_sequence
  publication: otel_semconv
  summary: 'Adopt the Audit Logging data model for security records: `audit.record.id`, the `audit.sequence.*` chain (number, previous hash, previous record id, end) and `audit.integrity.*` with its canonicalization declaration. Referenced here at commit `3c5a0ff` (2026-09-18) of the `auditing` branch.'
  proposes: []
  tracking: [community#2409]
  status: open
  rationale: The draft is in the Audit Logging SIG proposal, not yet the specification [[88]](#other-sources). A crosswalk maps each attribute to and from OCSF `attestation` [[89]](#other-sources).
- id: ocsf_ai_authorization
  publication: ocsf
  summary: Add an ai_authorization object (decision, reason, code, deciding authority, rule, obligations, budget accounting and the principal or subtree join key).
  proposes: ['object:ai_authorization']
  tracking: [ocsf-schema#1756]
  status: open
  rationale: The budget accounting is the consumption side of the `constraint` object ocsf-schema#1756 proposes on delegation.
- id: ocsf_delegation_lineage
  publication: ocsf
  summary: Extend delegation with scope, constraints and lifecycle state; require parent_uid where a parent exists; add a root or subtree identifier.
  proposes: []
  tracking: [ocsf-schema#1739, ocsf-schema#1756]
  status: open
  rationale: ocsf-schema#1756 proposes the constraints as a `constraint` object. Enforcement points already hold per-hop subject, audience, granted scopes and TTL; the schema has no place for them.
- id: ocsf_ai_taint
  publication: ocsf
  summary: 'Add an ai_taint object: the label set at entry and the final label set, so the labels an operation added are their difference; scope; origin; and taint-caused denial.'
  proposes: ['object:ai_taint']
  tracking: []
  status: proposed
  rationale: Records in the AID-EMIT-1 format [[87]](#other-sources) carry both sets today, outside the schema.
- id: ocsf_ai_tool
  publication: ocsf
  summary: 'Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request''s head (`b6e44ac`, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.'
  proposes: ['object:ai_capability', 'attribute:desc_fingerprint', 'attribute:baseline_fingerprint', 'attribute:tool_trust_boundary']
  tracking: [ocsf-schema#1729]
  status: open
  rationale: Its fingerprints reuse the `fingerprint` object, which declares `serialization_id`, so this ask already meets the canonicalization rule stated after the asks.
- id: ocsf_ai_bom
  publication: ocsf
  summary: Add an ai_bom object (BOM reference, format, signature, dependency edges) and a capability-change activity on Agent Activity.
  proposes: ['object:ai_bom']
  tracking: [ocsf-schema#1724]
  status: open
  rationale: 'A [draft class](https://github.com/Levaj2000/AI-Identity/tree/main/docs/ocsf-1724-class-draft) for #1724, AI Agent Trust Inventory, has `agent_artifact` with a `fingerprint`, `agent_config_declaration`, `agent_execution_params` and `agent_credential`. It carries Inventory Integrity Signature as `record_integrity` on the inventory event, with one `chain_uid` per instance, so a gap in the chain is an unrecorded change.'
- id: ocsf_ai_asset
  publication: ocsf
  summary: Add an ai_asset object (version, software reference, ownership, status, instrumentation coverage).
  proposes: ['object:ai_asset']
  tracking: [ocsf-schema#1724]
  status: open
  rationale: 'Shape it against the #1724 draft class under [`ocsf_ai_bom`](#ask-ocsf-ai-bom).'
- id: ocsf_runtime_attestation
  publication: ocsf
  summary: Add a runtime_attestation object carrying independently issued evidence objects and an explicit not-available status with a reason.
  proposes: ['object:runtime_attestation']
  tracking: []
  status: proposed
  rationale: 'The field needs both halves, each its own evidence object: the runtime workload credential with its attestor and freshness, and the software evidence of what ran. The #1724 draft class under [`ocsf_ai_bom`](#ask-ocsf-ai-bom) carries the second as `agent_artifact.fingerprint`.'
- id: ocsf_message_context_content
  publication: ocsf
  summary: Extend message_context with prompt and response hashes, a redaction flag, the system prompt and its hash, and attachment identity. Each hash declares its canonicalization and may be a keyed digest with a key identifier; an absent hash means not digested, never unchanged.
  proposes: ['attribute:prompt_hash', 'attribute:response_hash', 'attribute:is_redacted', 'attribute:system_prompt']
  tracking: []
  status: proposed
  rationale: The AID-EMIT-1 record format [[87]](#other-sources) carries digests in that form today, `hmac-sha256:<key_id>:<hex>` or `sha256:<hex>`, taken at pipeline entry and at emission. Equal digests under one key identifier mean the content passed unchanged.
- id: otel_hash_only_capture
  publication: otel_genai
  summary: Ensure a hash-only content-capture mode exists for message content. The digest declares its canonicalization and may be keyed with a key identifier; an absent digest means not captured.
  proposes: []
  tracking: []
  status: proposed
  rationale: The digest form under [`ocsf_message_context_content`](#ask-ocsf-message-context-content) is a worked example.
- id: ocsf_ai_guardrail
  publication: ocsf
  summary: Add an ai_guardrail object (type, verdict, score, blocked flag, threat reference), with enforcement availability and failure-mode attributes.
  proposes: ['object:ai_guardrail']
  tracking: []
  status: proposed
  rationale: 'A Guardrail Modification Record needs no content. Three facts on one record carry it: a modifying step naming the enforcement point, an allow-after-modification verdict, and entry and emission digests that differ under one key. The AID-EMIT-1 record format [[87]](#other-sources) carries that composition, and codes a fail-closed failure as a deny distinct from a policy deny. Whether the enforcement point was reached at all has no carrier yet.'
- id: otel_authorization_reference
  publication: otel_genai
  summary: Let a span reference an authorization decision by the decision record's stable identifier (OCSF `metadata.uid`), so OpenTelemetry and OCSF records join at query time.
  proposes: []
  tracking: []
  status: proposed
- id: ocsf_ai_agent_activity
  publication: ocsf
  summary: 'Ratify an AI Agent Activity class (9001) for agent-originated control-plane events: inter-agent messages, background tasks, loop and resource aggregates, capability changes.'
  proposes: ['class:9001']
  tracking: [ocsf-schema#1640]
  status: open
  rationale: 'Draft ocsf-schema#1754 adds an AI Agent Activity class as 6009 in Application Activity, not 9001. Its nine activities follow agent hook points, and it carries none of the five fields: Subagent Start and Stop have no attributes, so they record no sender, receiver, content, channel or step count, and no activity covers scheduled tasks, resource totals or capability changes.'
fields:
  agent_name:
    ocsf:
      coverage: covered
      constructs: ['profile:ai_operation', 'object:ai_agent']
    otel:
      coverage: covered
      constructs: [gen_ai.agent.name]
    aitf:
      coverage: covered
      constructs: [gen_ai.agent.name, asset.*]
    odis:
      coverage: covered
      constructs: [agent_id, owner_ref]
      note: ODIS §6.1.
      sections: ['6.1']
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  agent_runtime_instance_id:
    ocsf:
      coverage: covered
      constructs: ['object:ai_agent', 'attribute:instance_uid']
    otel:
      coverage: covered
      constructs: [gen_ai.agent.id]
    aitf:
      coverage: covered
      constructs: [gen_ai.agent.id]
    odis:
      coverage: covered
      constructs: [runtime_instance_id]
      note: ODIS §6.2.
      sections: ['6.2']
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  workflow_run_id:
    ocsf:
      coverage: none
      gap: No workflow or run identifier
      asks: [ocsf_ai_operation_identifiers]
    otel:
      coverage: partial
      constructs: [gen_ai.workflow.name]
      gap: A workflow name, not a run identifier; the run maps to the trace ID
      asks: [otel_run_id]
    aitf:
      coverage: covered
      constructs: [gen_ai.run.id]
    odis:
      coverage: covered
      constructs: [request_trace_id]
      note: ODIS §6.4.
      sections: ['6.4']
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  session_turn_step_ids:
    ocsf:
      coverage: partial
      constructs: ['object:message_context']
      gap: A session identifier only; no turn or step
      asks: [ocsf_ai_operation_identifiers]
    otel:
      coverage: partial
      constructs: [gen_ai.conversation.id]
      gap: No turn or step identifier
      asks: [otel_turn_step_ids]
    aitf:
      coverage: covered
      constructs: [gen_ai.conversation.id, gen_ai.turn.id, gen_ai.step.id, gen_ai.agent.step.index]
    odis:
      coverage: out_of_scope
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  trigger_type_source_event:
    ocsf:
      coverage: none
      gap: No trigger type
      asks: [ocsf_ai_operation_identifiers]
    otel:
      coverage: none
      gap: No trigger type or source event
      asks: [otel_trigger]
    aitf:
      coverage: covered
      constructs: [gen_ai.trigger.*, gen_ai.agent.*]
    odis:
      coverage: out_of_scope
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  action_type:
    ocsf:
      coverage: none
      gap: No action type
      asks: [ocsf_ai_operation_identifiers]
    otel:
      coverage: partial
      constructs: [gen_ai.operation.name]
      gap: Operations include chat, execute_tool, invoke_agent and the memory operations; no inter-agent message send
      asks: [otel_inter_agent_messaging]
    aitf:
      coverage: covered
      constructs: [gen_ai.agent.step.type]
    odis:
      coverage: covered
      constructs: [action]
      note: '`action.{tool,method}` (6.4)'
      sections: ['6.4']
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  execution_status:
    ocsf:
      coverage: covered
      constructs: ['attribute:status_id', 'attribute:duration']
      note: Outcome and duration on the base event.
    otel:
      coverage: covered
      constructs: [error.type]
      note: With the span status.
    aitf:
      coverage: covered
      constructs: [error.type]
      note: span status + `error.type`
    odis:
      coverage: out_of_scope
    controls: [controlAgentInventoryManagement, controlAgentObservability]
  surface_app:
    ocsf:
      coverage: partial
      constructs: ['object:actor', 'attribute:app_name']
      gap: An application name; no entry-point type and no internal or external flag
      asks: [ocsf_entry_point]
    otel:
      coverage: none
      gap: No surface attribute
      asks: [otel_entry_point]
    aitf:
      coverage: partial
      constructs: [gen_ai.*]
      gap: AITF names a namespace but defines no attribute for this field at the pin
    odis:
      coverage: out_of_scope
      note: n/a (policy input)
    controls: []
  system_prompt_instruction_config:
    ocsf:
      coverage: none
      gap: No system prompt in message_context
      asks: [ocsf_message_context_content]
    otel:
      coverage: covered
      constructs: [gen_ai.system_instructions]
      asks: [otel_hash_only_capture]
      note: Gated behind content-capture opt-in.
    aitf:
      coverage: covered
      constructs: [gen_ai.*]
      note: '`gen_ai.*` (system message / request)'
    odis:
      coverage: out_of_scope
      note: n/a (see note)
    controls: []
  model_name_version:
    ocsf:
      coverage: covered
      constructs: ['profile:ai_operation', 'object:ai_model']
    otel:
      coverage: covered
      constructs: [gen_ai.request.model, gen_ai.response.model]
    aitf:
      coverage: covered
      constructs: [gen_ai.request.model, gen_ai.provider.name]
    odis:
      coverage: covered
      constructs: [approved_software_refs]
      note: ODIS §6.1.
      sections: ['6.1']
    controls: [controlModelAndDataIntegrityManagement, controlMessageAndPayloadResourceLimits]
  inference_parameters:
    ocsf:
      coverage: none
      gap: No decoding parameters or context window on ai_model or message_context
      asks: [ocsf_inference_parameters]
    otel:
      coverage: covered
      constructs: [gen_ai.request.temperature, gen_ai.request.top_p, gen_ai.request.max_tokens, gen_ai.request.stop_sequences, gen_ai.request.seed]
    aitf:
      coverage: covered
      constructs: [gen_ai.request.temperature, gen_ai.request.top_p, gen_ai.request.max_tokens, gen_ai.request.stop_sequences, gen_ai.request.seed]
    odis:
      coverage: out_of_scope
    controls: [controlModelAndDataIntegrityManagement, controlMessageAndPayloadResourceLimits]
  input_output_token_counts:
    ocsf:
      coverage: covered
      constructs: ['object:message_context']
    otel:
      coverage: covered
      constructs: [gen_ai.usage.input_tokens, gen_ai.usage.output_tokens, gen_ai.client.token.usage]
    aitf:
      coverage: covered
      constructs: [gen_ai.usage.input_tokens, gen_ai.usage.output_tokens, cost.*]
    odis:
      coverage: out_of_scope
    controls: [controlModelAndDataIntegrityManagement, controlMessageAndPayloadResourceLimits]
  llm_error_exception:
    ocsf:
