nts and cannot propagate across tenant boundaries at any point in an orchestration or delegation chain. This control addresses the credential issuance and propagation properties of agents — answering \"are this agent's credentials ","desc":"<p>Ensure that credentials issued to agents are scoped to individual tenants and cannot propagate across tenant boundaries at any point in an orchestration or delegation chain. This control addresses the credential issuance and propagation properties of agents — answering \"are this agent's credentials structurally isolated to its tenant?\" — as distinct from agent integrity (which attests that an agent matches its registered identity) and agent permissions (which governs the action scope of tool calls).<\/p><p>Implementation requires: per-tenant credential issuance with no shared credential pools across tenant boundaries; short-lived, tenant-scoped tokens for agent-to-tool authentication, with lifetimes bounded to the duration of a single task or session; tenant boundary validation at every MCP protocol hop and delegation step, so that a credential issued in tenant A cannot be forwarded to or reused in tenant B's context; and credential rotation and revocation scoped to tenant context, ensuring that decommissioning an agent in one tenant does not leave credentials valid in another.<\/p>","comp":["Agent Reasoning Core","Orchestration Input Handling","Orchestration Output Handling","External Tool Capabilities","Model Memory","Authorization Federation Proxy"],"u":false,"dropped":false},"C:controlAgentExecutionBounds":{"t":"C","g":"gCcontrolsApplication","n":"Agent Execution Bounds","code":"controlAgentExecutionBounds","tip":"Enforce per-agent, per-session, and per-tool-call execution limits at the orchestration layer to prevent runaway tool-calling cycles. This control addresses the enforcement of loop bounds, context-window budgets, and circuit breakers within agent reasoning and tool invocation sequences — as distinct","desc":"<p>Enforce per-agent, per-session, and per-tool-call execution limits at the orchestration layer to prevent runaway tool-calling cycles. This control addresses the enforcement of loop bounds, context-window budgets, and circuit breakers within agent reasoning and tool invocation sequences — as distinct from API-layer rate limiting (which operates at the external request boundary) and agent observability (which detects loops but does not halt them).<\/p><p>Implementation requires: mandatory max_turns defaults for all agent-to-tool execution sequences, with no framework permitting unbounded execution by default; per-agent and per-session tool-call budgets that are enforced by the orchestration layer before each tool invocation; context-window budget tracking that halts agent execution before context saturation degrades reasoning quality; and circuit breakers that terminate agent execution when cumulative resource thresholds (compute, tokens, wall-clock time) are exceeded. Loop detection at the orchestration layer should identify repeated tool-call patterns and trigger early termination.<\/p>","comp":["Agent Reasoning Core","Orchestration Input Handling","Orchestration Output Handling"],"u":false,"dropped":false},"C:controlAgentCapabilityNegotiation":{"t":"C","g":"gCcontrolsApplication","n":"Agent Capability Negotiation Control","code":"controlAgentCapabilityNegotiation","tip":"Validate the set of tools and capabilities an agent acquires through runtime capability negotiation against an approved policy before those capabilities become reachable, so that dynamically advertised capabilities cannot silently expand the agent's effective reach. The objective is that capability ","desc":"<p>Validate the set of tools and capabilities an agent acquires through runtime capability negotiation against an approved policy before those capabilities become reachable, so that dynamically advertised capabilities cannot silently expand the agent's effective reach. The objective is that capability acquisition is an explicitly governed admission decision, not an implicit side effect of connecting to a tool or service endpoint.<\/p><p>Apply this control at the capability-discovery and handshake boundary, where an agent enumerates and binds the tools exposed by a remote tooling or shared-service endpoint (for example an MCP or A2A tool server). Admission should be evaluated against an allowlist of approved capability identities; a capability outside the pre-approved set fails closed and is routed to Third-Party Capability Admission Control's admission process rather than approved inline. Re-evaluate on renegotiation so that a capability set changing between sessions is re-admitted rather than inherited.<\/p><p>This control is the RUNTIME enforcement point for capability admission. It is distinct from Third-Party Capability Admission Control, which is the onboarding/change-control authority that vets and approves (and re-approves) the capability set — this control enforces that approved allowlist at each negotiation handshake, re-admitting per session so an approved provider cannot silently expand its reach mid-session. Detecting a slow rug-pull — an approved capability whose behavior or description changes while its identity stays the same — is Third-Party Capability Admission Control's job via its re-approval trigger; a runtime identity-allowlist check alone would not catch it. It is distinct from Agent Permissions, the static least-privilege upper bound this control enforces at the negotiation boundary; from Agent User Control, which gates user approval of data-altering actions; and from Agent Inventory Management, the lifecycle authority over which endpoints may exist.<\/p>","comp":["Agent Reasoning Core","External Tool Capabilities","Agent Consent Elicitation Surface"],"u":false,"dropped":false},"C:controlFederatedUserAuthentication":{"t":"C","g":"gCcontrolsApplication","n":"Federated User Authentication","code":"controlFederatedUserAuthentication","tip":"Establish the identity of human users by delegating authentication to a trusted external identity provider using federated standards (for example OIDC, OAuth 2.0, or SAML), rather than collecting, storing, and verifying user credentials within the AI application itself. The objective is to ground ev","desc":"<p>Establish the identity of human users by delegating authentication to a trusted external identity provider using federated standards (for example OIDC, OAuth 2.0, or SAML), rather than collecting, storing, and verifying user credentials within the AI application itself. The objective is to ground every user-initiated session in a verifiable identity issued by an authoritative provider, so that downstream authorization, delegation, and audit decisions have a trustworthy principal to act on. Delegating authentication to an established provider reduces the application's exposure to credential-handling weaknesses (credential storage, password reset flows, multi-factor enrollment) and lets the application inherit the provider's identity assurance and session-management posture.<\/p><p>This control governs authentication of human users at the application boundary. It is distinct from Application Access and Resource Management, which governs authorization and resource governance once a principal is established — this control answers \"who is the human user\" while access management answers \"what is this principal allowed to do.\" It is also distinct from the machine-to-machine identity controls Component Identity Provenance and Agent Credential Isolation, which authenticate non-human component and agent principals; those controls assume a separate user-identity origin where a human initiates the request, which this control supplies. Where an agent acts on a user's behalf, the user identity established here is the authority that delegation controls such as Agent Permissions narrow against.<\/p><p>The protocol used (OIDC, OAuth 2.0, SAML) and the deployment form (browser redirect, device-code flow, remote tooling such as MCP servers) are implementation attributes. Implementers should prefer an existing organizational or commercial identity provider over a bespoke authentication implementation, and should validate provider-issued tokens (signature, audience, expiry, issuer) on each session establishment so that a token issued for one application cannot be replayed against another.<\/p>","comp":["Application","Application Input Handling","Identity Provider"],"u":false,"dropped":false},"C:controlComponentIdentityRegistration":{"t":"C","g":"gCcontrolsApplication","n":"Component Identity Registration","code":"controlComponentIdentityRegistration","tip":"Ensure that each component participating in authenticated inter-component flows — agents, remote tool servers, and shared-service endpoints — is established as a recognized client identity with the authorization server before credentials are issued to it. The objective is that every machine principa","desc":"<p>Ensure that each component participating in authenticated inter-component flows — agents, remote tool servers, and shared-service endpoints — is established as a recognized client identity with the authorization server before credentials are issued to it. The objective is that every machine principal calling or being called holds an identity the authorization server can name, authenticate, and revoke, rather than acting under ambient trust or a shared, unattributable credential.<\/p><p>Registration binds a component to a distinct client identity at the identity provider, scoped to the component's role. Where a component cannot be enrolled ahead of time — for example a tool server discovered at runtime — a programmatic enrollment mechanism such as OAuth 2.0 Dynamic Client Registration (rfc7591-dcr) lets the component obtain its own credentials through a governed, attributable path instead of falling back to a static or shared secret.<\/p><p>This control should follow least-privilege and zero-trust posture: a component's registered identity scopes the credentials it can be issued, and registration should be gated on the component first being authorized to exist (its inventory entry), so that an unregistered or decommissioned component cannot obtain a usable client identity.<\/p><p>Boundary: this control governs how a component is enrolled as an authenticable client identity — the issuance side of authentication. It is distinct from Agent Inventory Management, which is the governance registry of what is authorized to exist (registration consumes that authority, it does not replace it); from Component Identity Provenance, which verifies at invocation time that a caller is the currently registered, non-revoked principal (registration is what makes a principal registrable in the first place); from Agent Credential Isolation, which scopes issued credentials to tenant boundaries; and from Inter-Component Transport Security, which protects the channel those credentials travel over. Registration establishes the identity; those controls bound, attest, and transport it. It is closest to Component Identity Authentication: registration is the enrollment that makes a component a known, revocable client the authorization server can issue an authenticator to, while that control verifies the bound authenticator at connection time and defines the identity primitive it verifies. The two hold independently — a component can be authenticated against a trust anchor it was never registered into (for example a per-principal certificate chained to a trusted CA), and a registered component's issued credential stays unverified at use until that control checks it.<\/p>","comp":["Agent Reasoning Core","Tool Server","External Tool Capabilities","Identity Provider","Tool Registry and Discovery"],"u":false,"dropped":false},"C:controlDelegatedAuthorityConfinement":{"t":"C","g":"gCcontrolsApplication","n":"Delegated Authority Confinement","code":"controlDelegatedAuthorityConfinement","tip":"Ensure that authority propagating across a delegation chain is re-established at each hop for the specific party acting and the action requested, never by forwarding or reusing a token issued for an earlier hop. The objective is attributable, narrowable authority at every hop — authority minted for ","desc":"<p>Ensure that authority propagating across a delegation chain is re-established at each hop for the specific party acting and the action requested, never by forwarding or reusing a token issued for an earlier hop. The objective is attributable, narrowable authority at every hop — authority minted for its own recipient and scoped to the intersection of the caller's authority and the requested action — so that a credential captured or over-scoped at one hop cannot be replayed to reach broader authority downstream, and each action can be attributed to the actor that took it rather than only to the original subject.<\/p><p>Establish authority afresh at each hop — for example through OAuth 2.0 Token Exchange (rfc-8693-token-exchange) or an on-behalf-of flow — bound to the current actor and audience-restricted to the intended recipient (RFC 8707 resource indicators), rather than presenting an inbound token unchanged to a downstream resource. The default posture is to reject token passthrough: a resource accepts only tokens issued specifically for it and neither honors nor forwards tokens minted for another audience. Carry original-caller and intermediate-actor identities forward as an actor chain so downstream policy and audit can attribute an action to the full delegation path rather than a single subject; because a compromised intermediary can truncate or misstate the chain it presents, have the terminal resource validate the chain against the expected delegation topology rather than trust a self-consistent chain at face value. Narrow scope and lifetime at each issuance to what the hop needs. Where no central authorization server is available, equivalent signed delegation assertions that bind actor, audience, scope, and chain position satisfy the intent.<\/p><p>This control governs how authority propagates across hops. It is distinct from Delegated Authorization Integrity, which requires the delegated grant to be verifiable and independently re-evaluable at each intermediary: that control defines what a trustworthy grant looks like, while this one requires re-minting authority per hop rather than forwarding it. The two are independent — a system can re-mint at every hop yet issue tokens that name only the immediate caller and cannot be independently re-evaluated (satisfying this control but not that one), or forward a fully verifiable grant unchanged across hops (satisfying that control but not this one). It is distinct from Sender-Constrained Credentials, which makes an individual credential hard to replay through proof-of-possession binding — a property of one token, whereas this control concerns the propagation discipline across the chain. It is further distinct from Agent Permissions, which bounds the action scope an actor may exercise once acting, and Component Identity Provenance, which verifies a callee is the registered principal.<\/p>","comp":["Agent Reasoning Core","Orchestration Input Handling","Orchestration Output Handling","External Tool Capabilities","Application","Identity Provider","Authorization Federation Proxy"],"u":false,"dropped":false},"C:controlSenderConstrainedCredentials":{"t":"C","g":"gCcontrolsApplication","n":"Sender-Constrained Credentials","code":"controlSenderConstrainedCredentials","tip":"Bind credentials used for inter-component and tool authentication to their legitimate holder so that possession of a credential value alone is insufficient to authenticate. The objective is that the presenter must additionally prove control of a holder-bound key or context at use time.\n Implement th","desc":"<p>Bind credentials used for inter-component and tool authentication to their legitimate holder so that possession of a credential value alone is insufficient to authenticate. The objective is that the presenter must additionally prove control of a holder-bound key or context at use time.<\/p><p>Implement this through proof-of-possession mechanisms such as DPoP-style application-layer binding (rfc9449) and mutual-TLS-bound access tokens, and pair the binding with short credential lifetimes.<\/p><p>This control is distinct from Inter-Component Transport Security, which binds tokens to the TLS channel at the transport layer; sender-constrained credentials bind to a holder key independently of the channel, so the binding survives across hops and intermediaries. It is also distinct from Agent Credential Isolation, which scopes issuance and propagation to a tenant and governs which principals a credential is valid for; this control governs whether a presenter is the rightful holder.<\/p>","comp":["External Tool Capabilities","Model Serving Infrastructure & Policy Enforcement Point","Agent Reasoning Core","Orchestration Input Handling","Identity Provider"],"u":false,"dropped":false},"C:controlExternalizedAuthorizationDecisioning":{"t":"C","g":"gCcontrolsApplication","n":"Externalized Authorization Decisioning","code":"controlExternalizedAuthorizationDecisioning","tip":"Ensure that authorization decisions are made by a policy decision point that is separated from the points that enforce them, so that what an agent, tool, or service is allowed to do is governed by an explicit, administrable policy rather than by logic embedded ad hoc in each enforcement site. Decisi","desc":"<p>Ensure that authorization decisions are made by a policy decision point that is separated from the points that enforce them, so that what an agent, tool, or service is allowed to do is governed by an explicit, administrable policy rather than by logic embedded ad hoc in each enforcement site. Decisions are evaluated per request at the granularity of the specific resource and parameters requested — not at coarse session scope. Decoupling decision from enforcement keeps authorization consistent and auditable across delegation hops, tool invocations, and service-to-service calls as the set of agents and tools changes at runtime.<\/p><p>Implementation centers on three roles from the nist-sp-800-162-abac / nist-sp-800-207-zero-trust reference model: a policy administration point where rules are authored and versioned as data; a policy decision point that evaluates each request against those rules and the relevant request context (caller identity, delegated authority, resource, action, and requested parameters — for example expressed as Rich Authorization Requests, RFC 9396); and policy enforcement points co-located with each resource that consult the decision point before allowing an action. Expressing policy in a dedicated authorization policy language keeps rules reviewable and testable independently of application code.<\/p><p>This control is mechanism-agnostic. Implementers may use a general-purpose policy engine, a relationship- or attribute-based authorization service, or capability-token issuance gated on policy state, provided the decision is externalized from the enforcement site and driven by administrable policy. Where the decision point is operated centrally, that centralization is an availability and blast-radius trade-off to manage, not the control objective itself.<\/p><p>This control governs how the authorization decision is made and administered. It is distinct from Resource Authorization Enforcement, which enforces that decision per object at the resource boundary — this control supplies the externalized decision those enforcement points consult (decision vs enforcement); and from Trusted Policy Enforcement Point, which requires the decider be a deterministic component the model cannot influence. It is distinct from Agent Permissions (the least-privilege policy content this control externalizes), Application Access and Resource Management (identity and coarse enforcement at the application boundary), and Component Identity Provenance (which establishes which principal is calling while this control decides what it may do).<\/p>","comp":["Orchestration Input Handling","External Tool Capabilities","Application","Authorization Policy Decision Point","Authorization Policy Enforcement Point"],"u":false,"dropped":false},"C:controlTrustedPolicyEnforcementPoint":{"t":"C","g":"gCcontrolsApplication","n":"Trusted Policy Enforcement Point","code":"controlTrustedPolicyEnforcementPoint","tip":"Make the security-critical authorization and constraint-enforcement decision at a trusted, deterministic enforcement point rather than at the model. The model is influenceable by untrusted content reaching its context (for example via {{riskPromptInjection}}), so a system that relies on the model to","desc":"<p>Make the security-critical authorization and constraint-enforcement decision at a trusted, deterministic enforcement point rather than at the model. The model is influenceable by untrusted content reaching its context (for example via Prompt Injection), so a system that relies on the model to authorize an action or hold a guardrail can be steered into actions the requester was never entitled to take. Treat the model's output as a request to be checked, not an authority to be trusted: a separate enforcement component decides whether a requested operation is permitted and rejects or constrains anything outside policy before any side effect occurs.<\/p><p>This realizes the classical policy enforcement point / policy decision point separation (NIST SP 800-162) in an agentic setting — the enforcement decision lives in a component the attacker cannot reach through the model's context window. The role is locus-defined and protocol-independent: it applies wherever a model's output gates a privileged operation, whether the call rides over MCP, A2A, an in-process tool interface, or any other remote-tooling channel.<\/p><p>This control governs WHERE the enforcement decision is placed. It is distinct from Externalized Authorization Decisioning and Resource Authorization Enforcement, which assume a trustworthy enforcement point and specify how the decision is externalized and enforced; this control establishes that the model is not that point. It is distinct from Agent Permissions (which bounds the action scope an agent is granted) and Input Validation and Sanitization (which filters adversarial input to the model rather than relocating authorization out of it). See cosai-mcp-security.<\/p>","comp":["External Tool Capabilities","Agent Reasoning Core","Orchestration Input Handling","Authorization Policy Enforcement Point","Tool Input Handling"],"u":false,"dropped":false},"C:controlInformedAgentConsentSurface":{"t":"C","g":"gCcontrolsApplication","n":"Informed Agent Consent Surface","code":"controlInformedAgentConsentSurface","tip":"Ensure that a human-in-the-loop approval of a security-relevant agent or tool action is an INFORMED decision — the approver both sees the decision-relevant facts and can act on them — rather than a reflexive click-through. Where a person is the authorising party, the consent surface must render what","desc":"<p>Ensure that a human-in-the-loop approval of a security-relevant agent or tool action is an INFORMED decision — the approver both sees the decision-relevant facts and can act on them — rather than a reflexive click-through. Where a person is the authorising party, the consent surface must render what is being requested and its consequences unambiguously, so approval is meaningful.<\/p><p>Render the machine-resolved tool identity, registered origin or publisher, and the marshalled inputs at the approval point — not the tool's self-described label, which is the channel an attacker controls — so that a lookalike or shadowed tool is distinguishable before the action runs. This is the agentic analogue of anti-phishing origin display.<\/p><p>Keep the prompt intelligible and calibrate its salience and frequency to the risk of the action, so high-consequence requests stay distinguishable and do not lose effect through habituation (consent fatigue). Safe execution should not depend on the human absorbing every prompt; routine, low-risk authorisations may be batched, defaulted, or policy-pre-approved so scarce attention is reserved for consequential decisions.<\/p><p>This control governs the quality of the agent consent surface — both the provenance content it renders and its intelligibility. It is distinct from Agent User Control, which governs whether human approval is required at all, and from User Transparency and Controls, which governs general disclosure of AI risks and user control over data use; those establish that a gate exists, while this ensures the gate presents an intelligible, non-fatiguing, provenance-accurate decision.<\/p>","comp":["Agent Consent Elicitation Surface","Application Consent Surface","Tool Server","External Tool Capabilities"],"u":false,"dropped":false},"C:controlAgentHostSecureConfiguration":{"t":"C","g":"gCcontrolsApplication","n":"Agent Host Secure Configuration","code":"controlAgentHostSecureConfiguration","tip":"Configure the host and client environments that run agents and remote tooling so that security-relevant settings resist tampering by unprivileged users. The objective is to ensure that protective configuration — including the human approval surface, tool-invocation gating, and least-privilege defaul","desc":"<p>Configure the host and client environments that run agents and remote tooling so that security-relevant settings resist tampering by unprivileged users. The objective is to ensure that protective configuration — including the human approval surface, tool-invocation gating, and least-privilege defaults — remains in effect for its intended risk-appetite and is not silently weakened by a local actor who lacks the authority to change it.<\/p><p>Implementation favors a hardened baseline whose security-relevant settings are owned by a privileged role and applied to running agent and tool-host instances, with changes to those settings restricted to that role and recorded for later review. Secure defaults should require explicit, authorized opt-out rather than being disablable from an unprivileged context, and configuration drift from the baseline should be detectable.<\/p><p>This control governs the integrity of the configuration itself — whether protective settings can be turned off by someone who should not be able to. It is distinct from Runtime Host Isolation, which sandboxes the running process to bound its blast radius; this control keeps the protective settings (including that isolation) from being silently disabled. It is distinct from Agent User Control, which establishes that user approval is sought for consequential agent actions — this control keeps that approval surface from being disabled — and from Secure-by-Default ML Tooling (selecting/shipping tooling with secure defaults) and Agent Permissions (which scopes the agent's action authority rather than the tamper-resistance of the settings that bound it).<\/p>","comp":["Agent Reasoning Core","External Tool Capabilities","Runtime Hosting","Agent Consent Elicitation Surface"],"u":false,"dropped":false},"C:controlResourceAuthorizationEnforcement":{"t":"C","g":"gCcontrolsApplication","n":"Resource Authorization Enforcement","code":"controlResourceAuthorizationEnforcement","tip":"Ensure that every request to read or act on a protected resource is authorized against the requesting principal's verified identity and role at an explicit policy enforcement point, rather than left to the calling service's discretion. Authorization for each object, tool, and data resource is enforc","desc":"<p>Ensure that every request to read or act on a protected resource is authorized against the requesting principal's verified identity and role at an explicit policy enforcement point, rather than left to the calling service's discretion. Authorization for each object, tool, and data resource is enforced consistently — regardless of whether the caller is a user, a service, or an agent — so that a principal can reach only the resources its role and context entitle it to.<\/p><p>Authorization is evaluated per resource instance, not merely per endpoint or resource type, so that holding a valid identity for one object does not confer access to sibling objects of the same type (the classical broken-object-level-authorization, or BOLA, failure). Decisions are made against claims asserted by the identity provider — role membership, group, or attributes — using role- or attribute-based access control, and follow least-privilege and privilege-separation so the permission scope granted to a service or tool integration is the minimum its function requires.<\/p><p>Enforcement points at the resource boundary admit or deny each call by consulting an externalized policy decision (NIST SP 800-162 PEP/PDP/PIP/PAP). Remote tooling and shared-service integrations — MCP tool servers, plugin backends, orchestration endpoints — are in scope: each should be granted narrow, resource-scoped permissions enforced on every call rather than inheriting broad ambient authority. Agent-initiated calls are the agent case of this same per-object enforcement, not a separate control.<\/p><p>This control governs per-object authorization ENFORCEMENT at the resource. It is distinct from Externalized Authorization Decisioning, which supplies the externalized policy decision this control's enforcement points consult (decision vs enforcement), and from Trusted Policy Enforcement Point, which requires that enforcement live in a component the model cannot influence. It is distinct from Application Access and Resource Management (coarse identity gating + quotas), Agent Permissions (which tools/actions an agent may invoke), Agent Credential Isolation (tenant scoping), and Component Identity Provenance (who the principal is) — those establish identity and coarse gating, while this control decides whether the established principal may reach the specific resource instance.<\/p>","comp":["Application","External Tool Capabilities","Orchestration Input Handling","Model Memory","Data Storage Infrastructure","Authorization Policy Enforcement Point","Authorization Policy Decision Point"],"u":false,"dropped":false},"C:controlUntrustedContextContainment":{"t":"C","g":"gCcontrolsApplication","n":"Untrusted Context Containment","code":"controlUntrustedContextContainment","tip":"Treat model-external content that enters an AI system's context — tool and function-call responses, retrieved documents, tool and resource schema descriptions, and other third-party data — as untrusted, and contain the actions the model may take in response so that such content cannot drive privileg","desc":"<p>Treat model-external content that enters an AI system's context — tool and function-call responses, retrieved documents, tool and resource schema descriptions, and other third-party data — as untrusted, and contain the actions the model may take in response so that such content cannot drive privileged or side-effecting behavior on its own. This is the residual-risk posture for the absence of a true instruction/data boundary inside the model: because current language models share a single token channel for instructions and data, untrusted context cannot be made structurally inert as instructions at the model layer, so containment shifts to the surrounding system.<\/p><p>This control governs the trust treatment and action-gating of untrusted context. It is distinct from Input Validation and Sanitization, which filters adversarial user queries to the model; from Agent Permissions, which sets the least-privilege upper bound and confused-deputy checks on agent authority; and from Agent Observability, which records what an agent did. Containment composes with those controls rather than replacing them: it provides the trust-labelling and action-gating layer on which permission and observability decisions act. Where feasible, label context by provenance and require a higher assurance step — independent authorization, user confirmation via Agent User Control, or a policy check — before content that originated outside a trust boundary can trigger a side-effecting action.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Agent Reasoning Core","Orchestration Input Handling","Model Memory","External Tool Capabilities","Tool Output Handling","Tool Server"],"u":false,"dropped":false},"C:controlToolArgumentValidationAndSanitization":{"t":"C","g":"gCcontrolsApplication","n":"Tool Argument Validation and Sanitization","code":"controlToolArgumentValidationAndSanitization","tip":"Validate and sanitize the arguments an agent passes to a tool, function, or backend service before they are executed, so that structured parameters cannot be interpreted as unintended commands by the receiving system.\n The receiving tool or service is responsible for validating parameters independen","desc":"<p>Validate and sanitize the arguments an agent passes to a tool, function, or backend service before they are executed, so that structured parameters cannot be interpreted as unintended commands by the receiving system.<\/p><p>The receiving tool or service is responsible for validating parameters independently of the calling agent's apparent intent. Tool selection by an agent is not evidence that the argument values are safe: an agent may be steered by injected content into emitting parameters that, once executed, reach a backend as a shell command, a file path, a database query, or a serialized object. The tool boundary is the point at which classical injection defenses apply.<\/p><p>Apply conventional injection-prevention techniques scoped to the argument type, for example:<\/p><ul><li>Constrain arguments to an expected schema, type, and allowlist of values or formats rather than accepting freeform strings where structured input is expected.<\/li><li>Use parameterized or prepared interfaces (for example parameterized queries) so that argument values cannot alter the structure of the operation they feed (cwe-89).<\/li><li>Canonicalize and bound file-path arguments to a permitted root to prevent traversal outside the intended scope (cwe-22).<\/li><li>Avoid passing argument values through a shell interpreter; where a system command is unavoidable, pass arguments as a non-interpreted argument vector rather than a concatenated string (cwe-77).<\/li><li>Reject or safely handle serialized payloads using restricted, type-bounded deserialization (cwe-502).<\/li><\/ul><p>This control governs the values flowing through a tool call. It is distinct from Input Validation and Sanitization, which screens adversarial queries reaching the model itself, and from Output Validation and Sanitization, which screens model output before it is consumed. It is also distinct from Agent Permissions, which governs which tools an agent may invoke and with what authority — permissions decide whether a call is allowed, while this control decides whether the call's arguments are safe to execute. Permission scoping and parameter validation are complementary: a permitted tool can still be driven to harm with malicious arguments.<\/p>","comp":["External Tool Capabilities","Orchestration Input Handling","Tool Input Handling"],"u":false,"dropped":false},"C:controlMemoryReferentRevalidation":{"t":"C","g":"gCcontrolsApplication","n":"Memory Referent Revalidation","code":"controlMemoryReferentRevalidation","tip":"Re-validate, when an agent's memory item is read for use, any content it references but does not itself hold — a link, file path, or other pointer to a resource outside the memory store. A write-time validation certifies only what the reference resolved to then, not what it resolves to now. This clo","desc":"<p>Re-validate, when an agent's memory item is read for use, any content it references but does not itself hold — a link, file path, or other pointer to a resource outside the memory store. A write-time validation certifies only what the reference resolved to then, not what it resolves to now. This closes a time-of-check-to-time-of-use gap: content legitimate when authored can be altered afterward by whoever controls the referenced resource, and a store that verifies only at write time cannot detect the substitution.<\/p><p>At write time, record a digest or provenance record of any referent a memory item points to. At read time, re-resolve the referent and re-run that same check — the check applied at write time, not a fresh and independent judgment — against what is retrieved now, failing closed if the referent no longer passes or can no longer be resolved. Where no write-time record exists, treat the referent as untrusted content and apply Untrusted Context Containment's containment to it. This holds regardless of the referent's form — a document, note, or file a memory item can point at without embedding its content — because the exposure is the mutable pointer, not any one resource type.<\/p><p>On a fail-closed rejection or quarantine, log the memory item and the referent that failed to resolve or re-verify as an auditable event, consistent with Agent Observability's logging of agent activity.<\/p><p>This control is distinct from Retrieval and Vector System Integrity Management, which verifies content at ingestion via signing and digests that certify an item as written — those checks say nothing about a referent that changes after that write. It is distinct from Untrusted Context Containment, which gates actions driven by untrusted context by provenance, but does not itself re-evaluate a referenced item's content at the moment of use. It is distinct from Agent Permissions, which bounds what an agent may do with a memory item once read, not whether its content is still what it claimed when written.<\/p>","comp":["Model Memory"],"u":false,"dropped":false},"C:controlRedTeaming":{"t":"C","g":"gCcontrolsAssurance","n":"Red Teaming","code":"controlRedTeaming","tip":"Drive security and privacy improvements through self-driven adversarial attacks on AI infrastructure and products","desc":"<p>Drive security and privacy improvements through self-driven adversarial attacks on AI infrastructure and products<\/p>","comp":["a","l","l"],"u":true,"dropped":false},"C:controlVulnerabilityManagement":{"t":"C","g":"gCcontrolsAssurance","n":"Vulnerability Management","code":"controlVulnerabilityManagement","tip":"Proactively and continually test and monitor production infrastructure and products for security and privacy regressions","desc":"<p>Proactively and continually test and monitor production infrastructure and products for security and privacy regressions<\/p>","comp":["a","l","l"],"u":true,"dropped":false},"C:controlThreatDetection":{"t":"C","g":"gCcontrolsAssurance","n":"Threat Detection","code":"controlThreatDetection","tip":"Detect and alert on internal or external attacks on AI assets, infrastructure, and products","desc":"<p>Detect and alert on internal or external attacks on AI assets, infrastructure, and products<\/p>","comp":["a","l","l"],"u":true,"dropped":false},"C:controlIncidentResponseManagement":{"t":"C","g":"gCcontrolsAssurance","n":"Incident Response Management","code":"controlIncidentResponseManagement","tip":"Manage response to AI security and privacy incidents","desc":"<p>Manage response to AI security and privacy incidents<\/p>","comp":["a","l","l"],"u":true,"dropped":false},"C:controlUserPoliciesAndEducation":{"t":"C","g":"gCcontrolsGovernance","n":"User Policies and Education","code":"controlUserPoliciesAndEducation","tip":"Publish easy to understand AI security and privacy policies and education for users.","desc":"<p>Publish easy to understand AI security and privacy policies and education for users.<\/p>","comp":["n","o","n","e"],"u":false,"dropped":false},"C:controlInternalPoliciesAndEducation":{"t":"C","g":"gCcontrolsGovernance","n":"Internal Policies and Education","code":"controlInternalPoliciesAndEducation","tip":"Publish comprehensive AI security and privacy policies and education for your employees.","desc":"<p>Publish comprehensive AI security and privacy policies and education for your employees.<\/p>","comp":["n","o","n","e"],"u":true,"dropped":false},"C:controlProductGovernance":{"t":"C","g":"gCcontrolsGovernance","n":"Product Governance","code":"controlProductGovernance","tip":"Validate that all AI models and products meet the established security and privacy requirements.","desc":"<p>Validate that all AI models and products meet the established security and privacy requirements.<\/p>","comp":["n","o","n","e"],"u":true,"dropped":false},"C:controlRiskGovernance":{"t":"C","g":"gCcontrolsGovernance","n":"Risk Governance","code":"controlRiskGovernance","tip":"Inventory, measure, and monitor residual risk to AI in your organization.","desc":"<p>Inventory, measure, and monitor residual risk to AI in your organization.<\/p>","comp":["n","o","n","e"],"u":true,"dropped":false},"C:controlToolServerVetting":{"t":"C","g":"gCcontrolsGovernance","n":"Tool Server Vetting and Approval","code":"controlToolServerVetting","tip":"Ensure that remote and third-party tool servers are admitted to an agentic system only after passing a documented security review, so that the set of reachable tool providers reflects an explicit vetting decision rather than ad-hoc discovery. This is the pre-admission gate: a candidate tool server (","desc":"<p>Ensure that remote and third-party tool servers are admitted to an agentic system only after passing a documented security review, so that the set of reachable tool providers reflects an explicit vetting decision rather than ad-hoc discovery. This is the pre-admission gate: a candidate tool server (an MCP, A2A, or other remote-tooling endpoint) is assessed against the organization's security criteria and the review outcome is recorded before the server becomes invocable, consistent with mcp-security-best-practices.<\/p><p>Vetting criteria typically cover the provider's ownership, provenance, and supplier-trust chain — including a preference for first-party, provider-hosted endpoints over unaffiliated third parties — the declared tool surface and its side effects, authentication posture, and known-vulnerability history; the depth of review scales with the server's privilege and blast radius. Enterprise deployments may operationalize the approved set through managed configuration so clients reach only servers that cleared review; centralizing the approved set is an implementation convenience, not the objective — the load-bearing element is the documented review gate.<\/p><p>This is the supplier-vetting equivalent of classical third-party vendor security assessment applied to the tool-provider supply chain. It is distinct from Third-Party Capability Admission Control, which admits and re-approves the capability SET (including prompt capabilities) a vetted provider exposes — this control vets whether the provider/server is trustworthy at all. It is distinct from Tool-Server Supply Chain Integrity (provenance of the server SOFTWARE package), Agent Inventory Management (the runtime registry that records the admission decision), Model and Data Integrity Management (artifact tamper-verification), Component Identity Provenance (invocation-time attestation that a caller is the registered principal), and Tool Registry and Discovery Integrity (integrity-protection of registered tool manifests and metadata — vetting decides whether a provider earns registration; that control protects the registry entry's integrity thereafter).<\/p>","comp":["Tool Server","Tool Registry and Discovery"],"u":false,"dropped":false},"C:controlAgenticZeroTrustPosture":{"t":"C","g":"gCcontrolsGovernance","n":"Agentic Zero-Trust Posture","code":"controlAgenticZeroTrustPosture","tip":"Design agentic systems so that every component boundary — between orchestrator and agent, agent and tool server, tool server and downstream API — is treated as an explicit, verified trust boundary. No component may assume trust from co-location, adjacency, or prior authentication in a different segm","desc":"<p>Design agentic systems so that every component boundary — between orchestrator and agent, agent and tool server, tool server and downstream API — is treated as an explicit, verified trust boundary. No component may assume trust from co-location, adjacency, or prior authentication in a different segment. This posture, grounded in zero-trust architecture principles (nist-sp-800-207), applies at design time to the system's trust topology; the individual mechanisms that enforce it at runtime (transport authentication, credential scoping, registry-bound identity) belong to the operational controls that implement it.<\/p><p>The posture has three structural properties that must be present by design. First, explicit boundary verification: trust at each component boundary is asserted by a credential or attestation checked at call time against an authoritative registry or policy engine — not inferred from network position, localhost binding, or a certificate that proves only key possession. Second, assume-breach segmentation: the system is designed so that compromise of any one segment (an agent process, a tool server, the orchestration plane) cannot propagate laterally beyond that segment; segment boundaries are enforced by distinct identity domains, scoped credentials, and policy enforcement points that do not transit compromised segments. Third, defense-in-depth layering: multiple independent control layers (transport security, identity verification, permission narrowing, observability) are stacked so failure of any one layer is not a system-wide breach.<\/p><p>This control addresses the architectural posture — the design decision about what the system's trust topology must be. It is distinct from the controls that implement individual layers of that posture: Agent Permissions enforces least-privilege narrowing and caller-authorization checks at individual delegation hops; Inter-Component Transport Security establishes authenticated, encrypted channels; Component Identity Provenance binds runtime identity to the authoritative registry at invocation time; Agent Credential Isolation scopes credentials to tenant boundaries. Adopting this posture commits the organization to structuring those operational controls around an explicit trust topology rather than deploying them individually while leaving implicit trust gaps at co-located or adjacent components.<\/p>","comp":["Agent Reasoning Core","External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling","Model Serving Infrastructure & Policy Enforcement Point"],"u":false,"dropped":false},"F:agent_name":{"t":"F","g":"gF6.1","n":"Agent Name","code":"agent_name","tier":"MUST","tip":"Logical name or type of the agent; exposes off-inventory agents.","records":"Logical name or type of the agent; exposes off-inventory agents.","capture":"Logical name/type of the agent (e.g. \"Deep Research agent\"). Detects off-inventory / \"shadow\" agents.","why":"Rests on <code>TA-05<\/code> (an agent nobody inventoried) and <code>TA-31<\/code> (one name bound to two peers, so requests reach the wrong one); both are found by comparing a name against what it should resolve to.","role":"identifier","origin":"declared","record":"event","modality":"","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"covered","con":["profile:ai_operation","object:ai_agent"],"gap":"","note":"","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.agent.name"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.agent.name","asset.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["agent_id","owner_ref"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-agent-name"},"F:agent_runtime_instance_id":{"t":"F","g":"gF6.1","n":"Agent (Runtime) Instance ID","code":"agent_runtime_instance_id","tier":"MUST","tip":"The running instance an event belongs to, for per-instance quarantine.","records":"The running instance an event belongs to, for per-instance quarantine.","capture":"UUID pinning an event to one running instance, not just the type. Enables per-instance kill/quarantine.","why":"One identity across a fleet is otherwise ambiguous between sibling instances and a stolen credential, and capability sets and hook state are per process.","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"covered","con":["object:ai_agent","attribute:instance_uid"],"gap":"","note":"","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.agent.id"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.agent.id"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["runtime_instance_id"],"gap":"","note":"ODIS §6.2.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-agent-runtime-instance-id"},"F:workflow_run_id":{"t":"F","g":"gF6.1","n":"Workflow / Run ID","code":"workflow_run_id","tier":"MUST","tip":"Groups one multi-step run or sub-agent tree into one execution.","records":"Groups one multi-step run or sub-agent tree into one execution.","capture":"Groups all activity of one multi-step run or sub-agent tree into a single traceable execution.","why":"Both are defined per run.","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No workflow or run identifier","note":"","asks":[{"id":"ocsf_ai_operation_identifiers","s":"Extend the ai_operation profile with run, turn and step identifiers, action type and trigger type.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.workflow.name"],"gap":"A workflow name, not a run identifier; the run maps to the trace ID","note":"","asks":[{"id":"otel_run_id","s":"Add gen_ai.run.id, as AITF defines it; gen_ai.workflow.name names the workflow, not the run.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.run.id"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["request_trace_id"],"gap":"","note":"ODIS §6.4.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-workflow-run-id"},"F:session_turn_step_ids":{"t":"F","g":"gF6.1","n":"Session / Turn / Step IDs","code":"session_turn_step_ids","tier":"MUST","tip":"The session, turn and step beneath a run, locating where behavior changed.","records":"The session, turn and step beneath a run, locating where behavior changed.","capture":"The three-level execution hierarchy <i>beneath<\/i> the run: <code>session_id<\/code> (the conversation/engagement), <code>turn_id<\/code> (one request→response cycle), <code>step_id<\/code> (one action within a turn). Lets a detection point at <i>which<\/i> turn behavior changed, not just which run.","why":"","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Application","Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"partial","con":["object:message_context"],"gap":"A session identifier only; no turn or step","note":"","asks":[{"id":"ocsf_ai_operation_identifiers","s":"Extend the ai_operation profile with run, turn and step identifiers, action type and trigger type.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.conversation.id"],"gap":"No turn or step identifier","note":" .*","gen_ai.agent.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-trigger-type-source-event"},"F:action_type":{"t":"F","g":"gF6.1","n":"Action Type","code":"action_type","tier":"MUST","tip":"LLM call, tool call, memory operation or message send.","records":"LLM call, tool call, memory operation or message send.","capture":"Distinguishes LLM-call vs tool-call vs memory-op vs message-send, the \"think → act\" boundary.","why":"Marks the think→act boundary where <code>AOC-01<\/code> and <code>AOC-02<\/code> did their damage. No pattern lists it as a condition, because each names the operation's own field, such as <b>Tool Call I/O<\/b>. Action Type is what lets a detection select the same kind of operation across components (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#2-correlation-patterns\" target=\"_blank\" rel=\"noopener\">§2<\/a>).","role":"label","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No action type","note":"","asks":[{"id":"ocsf_ai_operation_identifiers","s":"Extend the ai_operation profile with run, turn and step identifiers, action type and trigger type.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.operation.name"],"gap":"Operations include chat, execute_tool, invoke_agent and the memory operations; no inter-agent message send","note":"","asks":[{"id":"otel_inter_agent_messaging","s":"Add inter-agent messaging attributes.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.agent.step.type"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["action"],"gap":"","note":"<code>action.{tool,method}<\/code> (6.4)","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-action-type"},"F:execution_status":{"t":"F","g":"gF6.1","n":"Execution Status","code":"execution_status","tier":"MUST","tip":"Outcome and duration of an operation or turn.","records":"Outcome and duration of an operation or turn.","capture":"Outcome of the operation or turn (complete / error / exit / aborted) + duration. Spikes/timeouts reveal probing, DoS, or mass failure. Distinct from <b>Stop Reason<\/b> below, which records why a <i>completion<\/i> ended.","why":"","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"covered","con":["attribute:status_id","attribute:duration"],"gap":"","note":"Outcome and duration on the base event.","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":["error.type"],"gap":"","note":"With the span status.","asks":[]},{"pub":"AITF","cov":"covered","con":["error.type"],"gap":"","note":"span status + <code>error.type<\/code>","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-execution-status"},"F:surface_app":{"t":"F","g":"gF6.1","n":"Surface / App","code":"surface_app","tier":"MUST","tip":"Entry point: CLI, web, IDE, email, chat, scheduler; internal or external.","records":"Entry point: CLI, web, IDE, email, chat, scheduler; internal or external.","capture":"Entry point (CLI, web, IDE, email, chat channel, cron/heartbeat; internal vs external service). Detects access from unexpected surfaces.","why":"","role":"label","origin":"observed","record":"event","modality":"","gated":false,"emit":["Application"],"carriers":[{"pub":"OCSF","cov":"partial","con":["object:actor","attribute:app_name"],"gap":"An application name; no entry-point type and no internal or external flag","note":"","asks":[{"id":"ocsf_entry_point","s":"Add an entry point to ai_operation: the surface an operation arrived through (CLI, web, IDE, email, chat, scheduler) and whether it is internal or external.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No surface attribute","note":"","asks":[{"id":"otel_entry_point","s":"Add an entry-point attribute: the surface a request arrived through and whether it is internal or external.","st":"proposed"}]},{"pub":"AITF","cov":"partial","con":["gen_ai.*"],"gap":"AITF names a namespace but defines no attribute for this field at the pin","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"n/a (policy input)","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-surface-app"},"F:system_prompt_instruction_config":{"t":"F","g":"gF6.1","n":"System Prompt / Instruction Config","code":"system_prompt_instruction_config","tier":"MUST","tip":"Instruction configuration in force for the call. Self-asserted.","records":"Instruction configuration in force for the call. Self-asserted.","capture":"The system/instruction configuration in force for the call. Detects unauthorized weakening and, by comparison against the response, system-prompt leakage/extraction.","why":"Both a config-integrity baseline and the reference against which extraction is detected: <code>TA-07<\/code> succeeds when the response reproduces it.","role":"content","origin":"asserted","record":"state","modality":"","gated":false,"emit":["Agent System Instructions"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No system prompt in message_context","note":"","asks":[{"id":"ocsf_message_context_content","s":"Extend message_context with prompt and response hashes, a redaction flag, the system prompt and its hash, and attachment identity. Each hash declares its canonicalization and may be a keyed digest with a key identifier; an absent hash means not digested, never unchanged.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.system_instructions"],"gap":"","note":"Gated behind content-capture opt-in.","asks":[{"id":"otel_hash_only_capture","s":"Ensure a hash-only content-capture mode exists for message content. The digest declares its canonicalization and may be keyed with a key identifier; an absent digest means not captured.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.*"],"gap":"","note":"<code>gen_ai.*<\/code> (system message / request)","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"n/a (see note)","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-system-prompt-instruction-config"},"F:model_name_version":{"t":"F","g":"gF6.1","n":"Model Name + Version","code":"model_name_version","tier":"MUST","tip":"Model and version that processed the request.","records":"Model and version that processed the request.","capture":"Model and version processing the request. \"Which agents used the compromised model?\"; pins a model-specific vulnerability for patching.","why":"The supply-chain pivot, and R-critical for scoping.","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Model Serving Infrastructure & Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"covered","con":["profile:ai_operation","object:ai_model"],"gap":"","note":"","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.request.model","gen_ai.response.model"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.request.model","gen_ai.provider.name"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["approved_software_refs"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-model-name-version"},"F:inference_parameters":{"t":"F","g":"gF6.1","n":"Inference Parameters","code":"inference_parameters","tier":"MUST","tip":"Decoding parameters and declared context window in force for the call; the denominator for max-length-output and oversized-input detections.","records":"Decoding parameters and declared context window in force for the call; the denominator for max-length-output and oversized-input detections.","capture":"The decoding/config parameters in force for the call: <code>temperature<\/code>, <code>top_p<\/code>/<code>top_k<\/code>, <code>max_tokens<\/code>, <code>stop<\/code> sequences, <code>seed<\/code>, and the <b>declared context-window size<\/b>. The runtime half of the configuration-integrity baseline that <b>System Prompt / Instruction Config<\/b> covers for instructions.","why":"Rests on a <i>denominator<\/i> argument rather than a tampering attack: \"max-length output\" (<code>TA-04<\/code>) and \"anomalously large input\" (<code>TA-10<\/code>) are the documented detection signatures, and neither is computable without <code>max_tokens<\/code> and the declared context window. It also gives decoding configuration the integrity baseline the system prompt has. Capture it per call: per-request overrides are the attack.","role":"descriptor","origin":"declared","record":"state","modality":"","gated":false,"emit":["Model Serving Infrastructure & Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No decoding parameters or context window on ai_model or message_context","note":"","asks":[{"id":"ocsf_inference_parameters","s":"Add the decoding parameters in force for a call (temperature, top_p, max_tokens, stop sequences, seed) and the declared context window to ai_model or message_context.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.request.temperature","gen_ai.request.top_p","gen_ai.request.max_tokens","gen_ai.request.stop_sequences","gen_ai.request.seed"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.request.temperature","gen_ai.request.top_p","gen_ai.request.max_tokens","gen_ai.request.stop_sequences","gen_ai.request.seed"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-inference-parameters"},"F:input_output_token_counts":{"t":"F","g":"gF6.1","n":"Input / Output Token Counts","code":"input_output_token_counts","tier":"MUST","tip":"Per-call token usage, which feeds the Resource-Consumption Aggregate budget check.","records":"Per-call token usage, which feeds the Resource-Consumption Aggregate budget check.","capture":"Per-call token usage, the primary resource-abuse and runaway-loop signal; max-length outputs flag extraction/DoS.","why":"The cheapest DoS and runaway-loop detector in the document (<code>AOC-04<\/code>'s ~60 k-token relay, <code>AOC-05<\/code>, <code>TA-10<\/code>), and it costs nothing to emit.","role":"measure","origin":"observed","record":"event","modality":"","gated":false,"emit":["Model Serving Infrastructure & Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"covered","con":["object:message_context"],"gap":"","note":"","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.usage.input_tokens","gen_ai.usage.output_tokens","gen_ai.client.token.usage"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.usage.input_tokens","gen_ai.usage.output_tokens","cost.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-input-output-token-counts"},"F:llm_error_exception":{"t":"F","g":"gF6.1","n":"LLM Error / Exception","code":"llm_error_exception","tier":"MUST","tip":"Errors under adversarial conditions and provider-side silent failures.","records":"Errors under adversarial conditions and provider-side silent failures.","capture":"Errors that occur under adversarial conditions (overflow, malformed encoding, context exhaustion); provider-side silent failures.","why":"","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Model Serving Infrastructure & Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"partial","con":["attribute:status_id","attribute:status_detail"],"gap":"A generic outcome; no AI-specific error type","note":"","asks":[{"id":"ocsf_ai_error","s":"Add an AI error type to ai_operation beside status_id: provider error, context overflow, rate limit, content filter, silent truncation.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"covered","con":["error.type"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"partial","con":["gen_ai.*","security.*"],"gap":"AITF names a namespace but defines no attribute for this field at the pin","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-llm-error-exception"},"F:trace_context_propagated":{"t":"F","g":"gF6.1","n":"Trace Context (propagated)","code":"trace_context_propagated","tier":"MUST","tip":"W3C trace context carried across every agent and tool hop.","records":"W3C trace context carried across every agent and tool hop.","capture":"W3C <code>traceparent<\/code> / <code>trace_id<\/code> + <code>span_id<\/code> <b>propagated across every agent→tool→agent hop<\/b>, including MCP <span class=\"ref\" title=\"Model Context Protocol (MCP). https://modelcontextprotocol.io/. Tools, resources, prompts, sampling, elicitation, roots. Cited at specification version 2026-07-28.\">[39]<\/span> and A2A <span class=\"ref\" title=\"A2A, Agent-to-Agent Protocol. https://a2a-protocol.org/. Agent cards, task lifecycle, push-notification configuration. Cited at release v1.0.1 (28 May 2026).\">[40]<\/span> calls. Without propagation, multi-agent activity cannot be reassembled into one trace. Records the baggage members received with the context, by key. A member that names a telemetry destination or credential is attacker-controllable input, not configuration.","why":"","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["every hop"],"carriers":[{"pub":"OCSF","cov":"covered","con":["profile:trace","object:trace"],"gap":"","note":"The trace profile carries the trace and span identifiers.","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":[],"gap":"","note":"OpenTelemetry trace context (W3C traceparent) is core to the specification.","asks":[]},{"pub":"AITF","cov":"covered","con":[],"gap":"","note":"OTel <code>trace_id<\/code> and <code>span_id<\/code>, propagated as W3C <code>traceparent<\/code>.","asks":[]},{"pub":"ODIS","cov":"covered","con":["request_trace_id"],"gap":"","note":"ODIS §6.4.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-trace-context-propagated"},"F:stop_reason":{"t":"F","g":"gF6.1","n":"Stop Reason","code":"stop_reason","tier":"MUST","tip":"Why a completion ended: end of turn, token limit, tool use, cancellation, content filter.","records":"Why a completion ended: end of turn, token limit, tool use, cancellation, content filter.","capture":"Normalized reason a model completion ended: end of turn, token limit, tool use pending, session stop (caller canceled or disconnected), content filter. Separates a truncation from a clean stop and a guardrail kill from a crash; a <code>content_filter<\/code> stop is the completion-side view of a guardrail block (§1.2).","why":"Without it a <b>Response / Model Output<\/b> cut short by a provider content filter or a token limit reads the same as one that finished, so it also passes the dependency test of <a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#47-tiers\" target=\"_blank\" rel=\"noopener\">RFC §4.7<\/a>. A deployment's own guardrail verdict does not record the provider's filter, and token counts cannot infer it. Every major provider API returns a completion's stop reason, so it is implementable wherever a model is called.","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"ai_status.stop_reason_id is proposed in","note":"","asks":[{"id":"ocsf_stop_reason","s":"Merge the ai_status object on the ai_operation profile; its stop_reason_id carries End of Turn, Token Limit, Tool Use, Session Stop and Content Filter.","st":"open"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.response.finish_reasons"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.response.finish_reasons"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-stop-reason"},"F:autonomy_level":{"t":"F","g":"gF6.1","n":"Autonomy Level","code":"autonomy_level","tier":"SHOULD","tip":"Declared independence level the run is authorized for. Self-asserted.","records":"Declared independence level the run is authorized for. Self-asserted.","capture":"Declared independence level (e.g. L1 to L5) the run is authorized to operate at; sets oversight/delegation limits.","why":"The oversight dial for delegated action. The corpus repeatedly shows agents operating <i>above<\/i> their intended autonomy (<code>AOC-04<\/code>, <code>AOC-01<\/code>, <code>AOC-07<\/code>); logging the claimed level is what makes that detectable.","role":"label","origin":"asserted","record":"state","modality":"autonomous action","gated":false,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No autonomy level","note":"","asks":[{"id":"ocsf_autonomy_level","s":"Add an autonomy_level enum.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No autonomy level","note":"","asks":[{"id":"otel_autonomy_level","s":"Add gen_ai.agent.autonomy_level, the level of action an agent may take without human approval.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.agent.state"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-autonomy-level"},"F:model_provenance_signing_hash":{"t":"F","g":"gF6.1","n":"Model Provenance / Signing / Hash","code":"model_provenance_signing_hash","tier":"SHOULD","tip":"Signed digest or provenance of the served model artifact.","records":"Signed digest or provenance of the served model artifact.","capture":"Signed digest / provenance of the served model artifact (supply-chain provenance). Where the deployment trains or fine-tunes the model, the provenance includes the training run and the digest of the dataset version it used.","why":"A supply-chain primitive; ties to model-signing work and ODIS <span class=\"ref\" title=\"ODIS: Coalition for Secure AI, Workstream 4: Open Delegation &amp; Identity Standard. Apache-2.0. Records defined in ODIS §6: Agent Registration Record (6.1), Agent Runtime Credential Descriptor (6.2), Delegation Record (6.3), Identity Context (Policy Engine Feed) (6.4). Cited at commit 148dc41 (8 September 2026); ODIS is a working draft, so this reference is pinned to a commit rather than to main to keep the section numbers and field names cited against it checkable. https://github.com/cosai-oasis/ws4-odis/blob/148dc4187139a41325e3c6d6e7533d956bd33144/RFCs/ODIS.md\">[26]<\/span> <code>software_hash<\/code>.","role":"provenance","origin":"declared","record":"state","modality":"supply-chain provenance","gated":false,"emit":["Model Serving Infrastructure & Policy Enforcement Point","Model Registry and Marketplace"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"Provenance and signing not standardized in the profile","note":"","asks":[{"id":"ocsf_model_provenance","s":"Standardize model provider and provenance or signing attributes in ai_operation.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No model provenance or signing","note":"","asks":[{"id":"otel_model_provenance","s":"Add gen_ai.model.hash, gen_ai.model.signature and gen_ai.model.source.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.model.hash","supply_chain.model.signed","supply_chain.model.source","supply_chain.ai_bom.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["software_hash","approved_software_refs"],"gap":"","note":"ODIS §6.2, §6.1.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-model-provenance-signing-hash"},"F:organization_tenant_id":{"t":"F","g":"gF6.1","n":"Organization / Tenant ID","code":"organization_tenant_id","tier":"SHOULD","tip":"Owning tenant of the agent, the session and the invoking user.","records":"Owning tenant of the agent, the session and the invoking user.","capture":"The tenant/organization owning the agent, the session, and the invoking user, recorded on each. The primitive for detecting cross-tenant leakage and credential propagation.","why":"Held by the modality gate, not the evidence gate. Its instances (<code>TA-11<\/code>, <code>TA-17<\/code>, <code>TA-22<\/code>) clear the evidence bar; what holds it below MUST is that multi-tenant hosting is a deployment modality, and a single-tenant deployment has nothing for the field to describe. <b>MUST for any multi-tenant deployment.<\/b> The two cross-tenant entries differ in a way worth recording: <code>TA-11<\/code> involved <b>no attacker<\/b>, the boundary failed unaided, which under <a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#47-tiers\" target=\"_blank\" rel=\"noopener\">RFC §4.7<\/a> is a documented instance of the failure mode and not a lesser kind of evidence, since the field detects the boundary failure whatever caused it. <code>TA-17<\/code> supplies the adversarial instance, an authenticated caller reaching another tenant's application deliberately. Evidence is therefore settled twice over, and only the modality gate remains.","role":"identifier","origin":"declared","record":"event","modality":"multi-tenancy","gated":false,"emit":["agent, session and user records"],"carriers":[{"pub":"OCSF","cov":"partial","con":["object:metadata","attribute:tenant_uid"],"gap":"One tenant per event (metadata.tenant_uid), not the tenant of the agent, the session and the invoking user separately","note":"","asks":[{"id":"ocsf_tenant_scopes","s":"Carry the tenant of the agent, of the session and of the invoking user as separate attributes, beside metadata.tenant_uid.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No tenant attribute in the GenAI conventions","note":"XM recommends adopting existing tenant and resource attributes rather than an ask.","asks":[]},{"pub":"AITF","cov":"covered","con":["asset.tenant.*","security.tenant.*","asset.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["trust_domain"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-organization-tenant-id"},"F:provider_endpoint_identity":{"t":"F","g":"gF6.1","n":"Provider / Endpoint Identity","code":"provider_endpoint_identity","tier":"MAY","tip":"Which provider or endpoint served the call.","records":"Which provider or endpoint served the call.","capture":"Which provider/endpoint served the call. The reason the completion ended is <b>Stop Reason<\/b>.","why":"<code>TA-28<\/code> is the case that tests the tier. <code>AOC-06<\/code> is a governance and availability signal rather than a discrete adversary technique, which makes the field Q- and A-dominant, and the D concern it is usually asked to carry, model substitution, belongs to Model Name + Version. <code>TA-28<\/code> is different: a backdoor using a provider's own API as its command-and-control channel, where the exfiltration destination is an endpoint the application legitimately calls. That is a detection argument rather than a governance one, and it is carried by <b>Output Egress Destination<\/b> (§1.2, MUST) recording the destination together with what left, not by provider identity alone, because a legitimate call and a C2 beacon share the provider. The field stays MAY because knowing <i>which<\/i> provider was called does not separate them; knowing what was sent does.","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Model Serving Infrastructure & Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"covered","con":["object:ai_model","attribute:ai_provider"],"gap":"","note":"","asks":[]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.provider.name"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.provider.name"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-provider-endpoint-identity"},"F:pre_forward_pass_state_digest_vector":{"t":"F","g":"gF6.1","n":"Pre-Forward-Pass State Digest/Vector","code":"pre_forward_pass_state_digest_vector","tier":"MAY","tip":"Digest of the exact inputs to a forward pass, for replay and drift detection.","records":"Digest of the exact inputs to a forward pass, for replay and drift detection.","capture":"Content-addressed digest (+ pooled vector) of the exact inputs to a forward pass, captured pre-inference for replay/drift detection.","why":"","role":"content","origin":"derived","record":"event","modality":"","gated":false,"emit":["The Model"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No forward-pass digest","note":"A MAY research-grade signal; no ask.","asks":[]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No forward-pass digest","note":"A MAY research-grade signal; no ask.","asks":[]},{"pub":"AITF","cov":"covered","con":["drift.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-pre-forward-pass-state-digest-vector"},"F:token_malformation_context_corruption_indicator":{"t":"F","g":"gF6.1","n":"Token Malformation / Context-Corruption Indicator","code":"token_malformation_context_corruption_indicator","tier":"MAY","tip":"Token-entropy anomalies correlated with confabulation.","records":"Token-entropy anomalies correlated with confabulation.","capture":"Signal of context-induced token-entropy anomalies correlated with confabulation.","why":"","role":"label","origin":"derived","record":"event","modality":"","gated":false,"emit":["The Model"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No token-entropy signal","note":"A MAY research-grade signal; no ask.","asks":[]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No token-entropy signal","note":"A MAY research-grade signal; no ask.","asks":[]},{"pub":"AITF","cov":"covered","con":["drift.*","quality.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.1","url":"https://github.com/cosai-oasis/ws2-defenders/blob
