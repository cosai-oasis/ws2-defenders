* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg);

header { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 8px 14px;

header h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
header h1 a { color: inherit; }
.draft { font: 600 10.5px/1 ui-monospace, monospace; letter-spacing: .05em; padding: 3px 6px; border-radius: 4px;

.chip:hover { border-color: var(--ink); }

.meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: 12px; margin: 6px 0; }
.meta dt { color: var(--mute); }
.meta dd { margin: 0; }
.carrier { border-top: 1px solid var(--soft); padding: 5px 0; font-size: 12px; }
.cov { font-size: 10.5px; padding: 1px 5px; border-radius: 3px; background: var(--soft); }
.cov.covered { background: var(--F); color: #fff; } .cov.none { background: var(--A); color: #fff; }
.step { border-left: 2px solid var(--line); padding: 2px 0 6px 10px; margin: 4px 0; }

.legend { font-size: 12px; color: var(--mute); }

.note { color: var(--mute); font-size: 12px; }

ss at scale<\/b> (Microsoft, Dec 2024 onward)","what":"A criminal group scraped exposed customer credentials, accessed generative-AI accounts, and operated <b>custom tooling that bypassed safety guardrails and modified service capabilities<\/b>, reselling the bypass as a service. The second documented guardrail defeat in this corpus after <code>TA-01<\/code>, and the first operated as a business.","kind":"","same":[],"atlas":"<code>AML.T0054<\/code> LLM Jailbreak; <code>AML.T0012<\/code> Valid Accounts; <code>AML.T0048.003<\/code> External Harms: User Harm","atlasNote":"Guardrail bypass operated as a service","comp":"ApplicationInputHandling, ModelServing, Identity","source":"Storm-2139: credential scraping and custom tooling to bypass Azure OpenAI guardrails and modify service capabilities, resold as a service. Microsoft, January and February 2025. MITRE ATLAS case study <b><code>AML.CS0057<\/code><\/b>. <a href=\"https://blogs.microsoft.com/on-the-issues/2025/02/27/disrupting-cybercrime-abusing-gen-ai/\" target=\"_blank\" rel=\"noopener\">https://blogs.microsoft.com/on-the-issues/2025/02/27/disrupting-cybercrime-abusing-gen-ai/<\/a>","ref":57,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-22"},"A:TA-23":{"t":"A","g":"gA3.2","code":"TA-23","n":"OpenClaw 1-click RCE","tip":"A malicious link executed script in the agent's context, stole its token, then modified the agent's configuration to disable the user-confirmation step and escaped the container to run shell commands on the host. The approval gate was not defeated by argument; it was switched off as configuration.","label":"<b>OpenClaw 1-click RCE with confirmation bypass<\/b> (CVE-2026-25253; DepthFirst, Feb 2026)","what":"A malicious link executed script in the agent's context, stole its token, then <b>modified the agent's configuration to disable the user-confirmation step<\/b> and escaped the container to run shell commands on the host. The approval gate was not defeated by argument; it was switched off as configuration.","kind":"","same":[],"atlas":"<code>AML.T0011.003<\/code> User Execution: Malicious Link; <code>AML.T0105<\/code> Escape to Host; <code>AML.T0053<\/code> AI Agent Tool Invocation","atlasNote":"Approval gate disabled as configuration. ATLAS case study <code>AML.CS0050<\/code>","comp":"Application, Tools, Identity","source":"OpenClaw 1-click remote code execution, <b>CVE-2026-25253<\/b>: token theft, configuration change disabling user confirmation, container escape. DepthFirst, February 2026. MITRE ATLAS case study <b><code>AML.CS0050<\/code><\/b>. <a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-25253\" target=\"_blank\" rel=\"noopener\">https://nvd.nist.gov/vuln/detail/CVE-2026-25253<\/a>","ref":58,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-23"},"A:TA-24":{"t":"A","g":"gA3.2","code":"TA-24","n":"GTG-1002","tip":"A state-sponsored group circumvented an agent's safeguards and configured it as an autonomous attack framework against approximately 30 organizations, with the model performing the operational work and humans supervising. Reconnaissance, exploitation and collection ran as agent tool calls under one ","label":"<b>GTG-1002, AI-orchestrated espionage campaign<\/b> (Anthropic, Sep 2025; ATT&amp;CK campaign C0062)","what":"A state-sponsored group circumvented an agent's safeguards and configured it as an <b>autonomous attack framework<\/b> against approximately 30 organizations, with the model performing the operational work and humans supervising. Reconnaissance, exploitation and collection ran as agent tool calls under one delegated authority.","kind":"","same":[],"atlas":"<code>AML.T0124<\/code> Autonomous Attack Orchestration; <code>AML.T0054<\/code> LLM Jailbreak; <code>AML.T0116<\/code> Autonomous Reconnaissance; <code>AML.T0117<\/code> Autonomous Attack-Path Adaptation","atlasNote":"First reported AI-orchestrated campaign. ATLAS case study <code>AML.CS0069<\/code>","comp":"ReasoningCore, Orchestration, Tools","source":"GTG-1002: state-sponsored group configuring an agent as an autonomous attack framework against ~30 organizations. Anthropic, September 2025; MITRE ATT&amp;CK campaign <b>C0062<\/b>. MITRE ATLAS case study <b><code>AML.CS0069<\/code><\/b>. <a href=\"https://www.anthropic.com/news/disrupting-AI-espionage\" target=\"_blank\" rel=\"noopener\">https://www.anthropic.com/news/disrupting-AI-espionage<\/a>","ref":59,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-24"},"A:TA-25":{"t":"A","g":"gA3.2","code":"TA-25","n":"Multi-agent framework vs government systems","tip":"An operator ran a multi-agent framework built on two agent runtimes through 12 attack waves over four days; a recovered 160 MB workspace of 1,395 files documented the orchestration. The defending ministry detected abnormal agent-driven activity rather than a human operator's pattern.","label":"<b>Multi-agent framework against government systems<\/b> (Taiwan MODA / Dream Research Labs / FT, Jul 2026)","what":"An operator ran a <b>multi-agent framework<\/b> built on two agent runtimes through 12 attack waves over four days; a recovered 160 MB workspace of 1,395 files documented the orchestration. The defending ministry detected abnormal agent-driven activity rather than a human operator's pattern.","kind":"","same":[],"atlas":"<code>AML.T0124<\/code> Autonomous Attack Orchestration; <code>AML.T0118<\/code> Autonomous AI Agent Communication","atlasNote":"Multi-agent orchestration in the wild. ATLAS case study <code>AML.CS0071<\/code>","comp":"Orchestration, Identity","source":"Multi-agent framework used against Taiwanese government systems: 12 attack waves, 1 to 4 July 2026, recovered 160 MB / 1,395-file operational workspace. Taiwan Ministry of Digital Affairs; Dream Research Labs; <i>Financial Times<\/i>. MITRE ATLAS case study <b><code>AML.CS0071<\/code><\/b>. <a href=\"https://moda.gov.tw/ACS/press/news/press/20394\" target=\"_blank\" rel=\"noopener\">https://moda.gov.tw/ACS/press/news/press/20394<\/a>","ref":60,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-25"},"A:TA-26":{"t":"A","g":"gA3.2","code":"TA-26","n":"Computer-use data destruction","tip":"A prompt injection embedded in a PDF reached a computer-use agent when a user asked it to work with the file, used jailbreak and obfuscation to clear the guardrails, and invoked the agent's bash tool to destroy user data. The corpus's first computer-use instance: the capability is a shell, and the c","label":"<b>Data destruction via computer-use agent<\/b> (HiddenLayer, Oct 2024)","what":"A prompt injection embedded in a <b>PDF<\/b> reached a computer-use agent when a user asked it to work with the file, used jailbreak and obfuscation to clear the guardrails, and invoked the agent's <code>bash<\/code> tool to destroy user data. The corpus's first computer-use instance: the capability is a shell, and the carrier is an attachment.","kind":"","same":[],"atlas":"<code>AML.T0051.001<\/code> LLM Prompt Injection: Indirect; <code>AML.T0054<\/code> LLM Jailbreak; <code>AML.T0068<\/code> LLM Prompt Obfuscation; <code>AML.T0053<\/code> AI Agent Tool Invocation","atlasNote":"Attachment-borne injection → shell. ATLAS case study <code>AML.CS0046<\/code>","comp":"AgentInputHandling, Tools","source":"Indirect prompt injection of Claude Computer Use: PDF-borne injection invoking the agent's shell tool to destroy user data. HiddenLayer, 24 October 2024. MITRE ATLAS case study <b><code>AML.CS0046<\/code><\/b>. <a href=\"https://hiddenlayer.com/innovation-hub/indirect-prompt-injection-of-claude-computer-use/\" target=\"_blank\" rel=\"noopener\">https://hiddenlayer.com/innovation-hub/indirect-prompt-injection-of-claude-computer-use/<\/a>","ref":61,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-26"},"A:TA-27":{"t":"A","g":"gA3.2","code":"TA-27","n":"Morris II","tip":"A zero-click adversarial self-replicating prompt that reproduces itself in the assistant's output and propagates between connected GenAI systems, demonstrated against a RAG-based email assistant that ingests mail automatically and retrieves prior correspondence. Propagation is the payload.","label":"<b>Morris II, self-replicating GenAI worm<\/b> (Cohen, Bitton &amp; Nassi, Mar 2024)","what":"A <b>zero-click adversarial self-replicating prompt<\/b> that reproduces itself in the assistant's output and propagates between connected GenAI systems, demonstrated against a RAG-based email assistant that ingests mail automatically and retrieves prior correspondence. Propagation is the payload.","kind":"","same":[],"atlas":"<code>AML.T0061<\/code> LLM Prompt Self-Replication; <code>AML.T0070<\/code> RAG Poisoning; <code>AML.T0051.001<\/code> Indirect","atlasNote":"Zero-click propagation between GenAI systems. ATLAS case study <code>AML.CS0024<\/code>","comp":"RAGContent, Orchestration","source":"Morris II: zero-click adversarial self-replicating prompt propagating between GenAI systems via a RAG-based email assistant. S. Cohen, R. Bitton, B. Nassi, 5 March 2024. MITRE ATLAS case study <b><code>AML.CS0024<\/code><\/b>. <a href=\"https://arxiv.org/abs/2403.02817\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2403.02817<\/a>","ref":62,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-27"},"A:TA-28":{"t":"A","g":"gA3.2","code":"TA-28","n":"SesameOp","tip":"A backdoor used a model provider's Assistants API as its C2 channel, fetching commands and exfiltrating encrypted results through it for several months. The exfiltration destination is the same endpoint the application legitimately calls, so destination alone does not separate the two.","label":"<b>SesameOp, provider API as command and control<\/b> (Microsoft DART, Jul 2025)","what":"A backdoor used a <b>model provider's Assistants API as its C2 channel<\/b>, fetching commands and exfiltrating encrypted results through it for several months. The exfiltration destination is the same endpoint the application legitimately calls, so destination alone does not separate the two.","kind":"","same":[],"atlas":"<code>AML.T0086<\/code> Exfiltration via AI Agent Tool Invocation; <code>AML.T0040<\/code> AI Model Inference API Access","atlasNote":"Provider API as C2. ATLAS case study <code>AML.CS0042<\/code>","comp":"ModelServing, ApplicationOutputHandling","source":"SesameOp: backdoor abusing the OpenAI Assistants API as a covert command-and-control and exfiltration channel over several months. Microsoft Incident Response (DART), 3 November 2025. MITRE ATLAS case study <b><code>AML.CS0042<\/code><\/b>. <a href=\"https://www.microsoft.com/en-us/security/blog/2025/11/03/sesameop-novel-backdoor-uses-openai-assistants-api-for-command-and-control/\" target=\"_blank\" rel=\"noopener\">https://www.microsoft.com/en-us/security/blog/2025/11/03/sesameop-novel-backdoor-uses-openai-assistants-api-for-command-and-control/<\/a>","ref":63,"chain":[],"noPattern":"Outside the deployment: the backdoor ran on a compromised host and used the provider API from there, so no instrumented AI system carries the activity. Detection belongs to endpoint and network monitoring of provider API use; within a deployment, Output Egress Destination records what its own calls send.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-28"},"A:TA-29":{"t":"A","g":"gA3.2","code":"TA-29","n":"WhatsApp MCP sleeper rug pull","tip":"A malicious MCP server advertised an innocuous tool on first launch and, after the user had approved it, returned a changed description on the second launch. The new description instructed the agent, whenever it called the separately installed whatsapp-mcp server's send_message, to redirect the mess","label":"<b>WhatsApp MCP sleeper rug pull<\/b> (Invariant Labs, Apr 2025)","what":"A malicious MCP server advertised an innocuous tool on first launch and, after the user had approved it, returned a changed description on the second launch. The new description instructed the agent, whenever it called the separately installed <code>whatsapp-mcp<\/code> server's <code>send_message<\/code>, to redirect the message to an attacker's number and append the user's chat history, padded so the confirmation dialog hid the payload. The tool's name was unchanged; its definition was not.","kind":"executed","same":[],"atlas":"<code>AML.T0109<\/code> AI Supply Chain Rug Pull; <code>AML.T0110.000<\/code> AI Agent Tool Poisoning: Definition and Instructions; <code>AML.T0086<\/code> Exfiltration via AI Agent Tool Invocation","atlasNote":"Definition changed after approval under an unchanged name","comp":"Tools, ToolServer, AgentOutputHandling","source":"WhatsApp MCP exploited: exfiltrating chat history via a sleeper rug pull and tool shadowing. Invariant Labs, 7 April 2025 (updated 9 April). <a href=\"https://invariantlabs.ai/blog/whatsapp-mcp-exploited\" target=\"_blank\" rel=\"noopener\">https://invariantlabs.ai/blog/whatsapp-mcp-exploited<\/a> · reproduction: <a href=\"https://github.com/invariantlabs-ai/mcp-injection-experiments\" target=\"_blank\" rel=\"noopener\">https://github.com/invariantlabs-ai/mcp-injection-experiments<\/a>","ref":65,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-29"},"A:TA-30":{"t":"A","g":"gA3.2","code":"TA-30","n":"OpenClaw memory index unbounded growth","tip":"The memory index of the OpenClaw agent runtime (memory_index_chunks, memory_embedding_cache) had no retention or eviction policy and grew on every memory-extraction cycle. The disk budget enforced on session tables did not measure the memory tables. Production installs reported 1.5 to 3.3 GB agent d","label":"<b>OpenClaw memory index, unbounded growth<\/b> (openclaw/openclaw#114612, Jul 2026)","what":"The memory index of the OpenClaw agent runtime (<code>memory_index_chunks<\/code>, <code>memory_embedding_cache<\/code>) had no retention or eviction policy and grew on every memory-extraction cycle. The disk budget enforced on session tables did not measure the memory tables. Production installs reported 1.5 to 3.3 GB agent databases (38,985 rows in one), growing heap and GC pauses, and four-minute gateway start-ups; credential rotation re-embedded the whole corpus. No adversary was involved. A cache cap shipped in 2026.9.7; retention for still-present sources remained open.","kind":"failure","same":[],"atlas":"<code>AML.T0029<\/code> Denial of AI Service","atlasNote":"Store growth and degraded service with no adversary; <b>no adversary technique applies<\/b>, and AML.T0029 names the impact only","comp":"Memory","source":"OpenClaw memory-core: SQLite unbounded growth, <code>memory_index_chunks<\/code> and <code>memory_embedding_cache<\/code> have no retention policy. GitHub issue openclaw/openclaw#114612, opened 27 July 2026, with independent field confirmations from further production installs. <a href=\"https://github.com/openclaw/openclaw/issues/114612\" target=\"_blank\" rel=\"noopener\">https://github.com/openclaw/openclaw/issues/114612<\/a>","ref":66,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-30"},"A:TA-31":{"t":"A","g":"gA3.2","code":"TA-31","n":"Agent name collision","tip":"Multi-agent hosts turn a remote A2A Agent Card into a local agent, tool, workflow target or broker route keyed by the card's name, which A2A defines as human-readable metadata with no collision semantics. An admitted peer that sets its name to a trusted peer's wins the collision by order or shared r","label":"<b>Agent name collision in multi-agent hosts<\/b> (Kumar, Sep 2026)","what":"Multi-agent hosts turn a remote A2A Agent Card into a local agent, tool, workflow target or broker route keyed by the card's <code>name<\/code>, which A2A defines as human-readable metadata with no collision semantics. An admitted peer that sets its name to a trusted peer's wins the collision by order or shared route, and requests addressed to the trusted peer go to the attacker. No transport, key or credential is forged. Demonstrated against the code of seven open-source frameworks at pinned versions; in all six client-style integrations dispatch went to the attacker's endpoint and the legitimate peer was never invoked.","kind":"executed","same":[],"atlas":"<code>AML.T0073<\/code> Impersonation","atlasNote":"Peer display name used as a routing identity; the paper names Google ADK (Python, TypeScript), UiPath LangChain, BeeAI, Solace Agent Mesh, Mozilla Any-Agent and AutoDev","comp":"Orchestration, AgentToolTransport, Identity","source":"Agent Name Collision Attacks in Multi-Agent Systems. A. Arun Kumar, arXiv:2609.27624, September 2026. <a href=\"https://arxiv.org/abs/2609.27624\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2609.27624<\/a>","ref":67,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-31"},"A:TA-32":{"t":"A","g":"gA3.2","code":"TA-32","n":"AI recommendation poisoning","tip":"Websites embedded \"Summarize with AI\" links whose URLs pre-filled an AI assistant's input through a query parameter (?q= or ?prompt=). The pre-filled prompt instructed the assistant to remember the company as a trusted source, and the stored memory shaped the assistant's recommendations in later con","label":"<b>AI recommendation poisoning through pre-filled prompts<\/b> (Microsoft Defender Security Research, Feb 2026)","what":"Websites embedded \"Summarize with AI\" links whose URLs pre-filled an AI assistant's input through a query parameter (<code>?q=<\/code> or <code>?prompt=<\/code>). The pre-filled prompt instructed the assistant to remember the company as a trusted source, and the stored memory shaped the assistant's recommendations in later conversations without the user's awareness. Over 60 days Microsoft identified 50 distinct prompts from 31 companies across more than 14 industries, aimed at several assistants (Copilot, ChatGPT, Claude, Perplexity, Grok). The actors were companies seeking promotion, not threat actors; the input arrives as the user's own turn.","kind":"executed","same":[],"atlas":"<code>AML.T0080.000<\/code> AI Agent Context Poisoning: Memory; <code>AML.T0051<\/code> LLM Prompt Injection","atlasNote":"The mapping the source gives; the prompt enters through a pre-filled URL parameter, and ATT&amp;CK T1204.001 (User Execution: Malicious Link) covers the click","comp":"ApplicationInputHandling, Memory","source":"Manipulating AI memory for profit: the rise of AI Recommendation Poisoning. Microsoft Defender Security Research Team (Noam Kochavi), Microsoft Security Blog, 10 February 2026. <a href=\"https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/\" target=\"_blank\" rel=\"noopener\">https://www.microsoft.com/en-us/security/blog/2026/02/10/ai-recommendation-poisoning/<\/a>","ref":68,"chain":[{"step":"A website links to an AI assistant with a prompt in the URL query parameter","fields":[{"id":"F:input_source_channel","g":"instance","why":"the prompt arrives through a pre-filled URL parameter rather than typed input; the channel is what separates it from an ordinary user turn"},{"id":"F:model_input","g":"instance","why":"the injected prompt text (\"remember [Company] as a trusted source\") is the payload and is in the input"}]},{"step":"The user clicks, and the assistant receives the pre-filled prompt as the user's own turn","fields":[{"id":"F:input_trust_classification","g":"analogical","why":"the content is third-party but enters at user trust; the instance shows the gap the field addresses, but the source documents no classification"}]},{"step":"The prompt makes the assistant store the company as a trusted source in long-term memory","fields":[{"id":"F:memory_write_event","g":"instance","why":"the attack exists to cause a memory write; the source shows the stored entries in saved-memory settings"},{"id":"F:memory_provenance_source","g":"instance","why":"the written item originates from a third-party site through a link, not from the user; provenance is what makes that visible"},{"id":"F:memory_integrity_poisoning_signal","g":"analogical","why":"Microsoft's hunting matches memory-manipulation keywords in URLs (remember, trusted, authoritative); a poisoning signal on the write would carry the same test, but the source applies it to mail and chat URLs, not to memory"}]},{"step":"In later conversations the stored memory biases the assistant's recommendations","fields":[{"id":"F:memory_read_injection_event","g":"instance","why":"the effect depends on the item being read into later sessions"},{"id":"F:response_model_output","g":"analogical","why":"the biased recommendations are the outcome, but the source documents the prompts and stored memories, not specific responses"}]}],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-32"},"A:TA-33":{"t":"A","g":"gA3.2","code":"TA-33","n":"Split-view dataset poisoning","tip":"Web-scale datasets such as LAION-400M and COYO-700M are distributed as lists of URLs, and every downloader fetches the content anew. The authors bought expired domains still named in these lists and logged requests for 12 months from August 2022; downloads continued even for the oldest datasets. For","label":"<b>Split-view poisoning of web-scale training datasets<\/b> (Carlini et al., Feb 2023)","what":"Web-scale datasets such as LAION-400M and COYO-700M are distributed as lists of URLs, and every downloader fetches the content anew. The authors bought expired domains still named in these lists and logged requests for 12 months from August 2022; downloads continued even for the oldest datasets. For $60 an attacker could control 0.01% of LAION-400M or COYO-700M. The authors returned 404 to every request and poisoned nothing: the control step was executed and the poison withheld. A second attack, frontrunning, times malicious Wikipedia edits to land in a snapshot before moderators revert them. The defense the paper proposes is a cryptographic hash per item, checked at download; several LAION datasets now publish SHA-256 hashes.","kind":"executed","same":[],"atlas":"<code>AML.T0020<\/code> Training Data Poisoning; <code>AML.T0010.002<\/code> AI Supply Chain Compromise: Data","atlasNote":"ATLAS case study <code>AML.CS0025<\/code> (Exercise); content at a URL changes after the dataset indexed it","comp":"DataSources, TrainingData","source":"Poisoning Web-Scale Training Datasets is Practical. N. Carlini, M. Jagielski, C. A. Choquette-Choo, D. Paleka, W. Pearce, H. Anderson, A. Terzis, K. Thomas, F. Tramèr, arXiv:2302.10149, February 2023. MITRE ATLAS case study <b><code>AML.CS0025<\/code><\/b>. <a href=\"https://arxiv.org/abs/2302.10149\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2302.10149<\/a>","ref":77,"chain":[{"step":"An expired domain named in a dataset index is bought","fields":[]},{"step":"A downloader fetches the URL and receives content other than what was indexed","fields":[{"id":"F:retrieved_content_metadata_integrity_signal","g":"analogical","why":"the same split view applies to a RAG source that changes after indexing; the instance is a training download, not a retrieval"},{"id":"F:retrieved_content_source_provenance","g":"analogical","why":"owner and freshness of the source are what changed when the domain expired; the instance records them for training data, which no field covers"}]},{"step":"The fetched content enters training","fields":[]}],"noPattern":"Training time: Training-Data Item Digest records the mismatch at fetch as one event, which needs no correlation. Its runtime edges are analogical, to retrieval, where the same split view applies.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-33"},"A:TA-34":{"t":"A","g":"gA3.2","code":"TA-34","n":"Near-constant poison count","tip":"In the largest pretraining-poisoning study to date, the authors trained models from 600M to 13B parameters on 6B to 260B tokens. At every scale, 250 poisoned documents installed a backdoor that makes the model emit gibberish after a trigger string; for the 13B model that is 0.00016% of training toke","label":"<b>Backdoors from a near-constant number of poisoned documents<\/b> (UK AISI, Anthropic, et al., Oct 2025)","what":"In the largest pretraining-poisoning study to date, the authors trained models from 600M to 13B parameters on 6B to 260B tokens. At every scale, 250 poisoned documents installed a backdoor that makes the model emit gibberish after a trigger string; for the 13B model that is 0.00016% of training tokens. Success depended on the number of poisoned documents, not their share of the data. Fine-tuning Llama-3.1-8B-Instruct, and GPT-3.5-turbo through the OpenAI fine-tuning API, gave the same result for harmful-compliance and language-switching backdoors. Continued clean training degraded the backdoors by different amounts. The experiments were controlled; no deployed model was attacked.","kind":"executed","same":[],"atlas":"<code>AML.T0020<\/code> Training Data Poisoning; <code>AML.T0018.000<\/code> Manipulate AI Model: Poison AI Model","atlasNote":"Pretraining and fine-tuning; the backdoor is read at inference by its trigger","comp":"TrainingData, ModelTrainingTuning","source":"Poisoning Attacks on LLMs Require a Near-constant Number of Poison Samples. A. Souly, J. Rando, E. Chapman, et al. (UK AI Security Institute, Anthropic, ETH Zurich, Alan Turing Institute, University of Oxford), arXiv:2510.07192, October 2025; summarized in \"A small number of samples can poison LLMs of any size\", Anthropic, 9 October 2025. <a href=\"https://arxiv.org/abs/2510.07192\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2510.07192<\/a>","ref":78,"chain":[{"step":"Poisoned documents enter the pretraining corpus or the fine-tuning set","fields":[]},{"step":"The model is trained or fine-tuned and served","fields":[{"id":"F:model_provenance_signing_hash","g":"analogical","why":"a signed digest ties the served artifact to the training run that produced it, which scopes a backdoor once found; it does not reveal the poison, and the study deploys nothing"},{"id":"F:model_name_version","g":"analogical","why":"answers which deployments served the backdoored model; the study deploys nothing"}]},{"step":"At inference the trigger in the input produces the backdoor behavior","fields":[{"id":"F:model_input","g":"instance","why":"the trigger string is in the input of every successful attack; the study measures it there"},{"id":"F:response_model_output","g":"instance","why":"the backdoor behavior (gibberish, German, harmful compliance) is in the output; the study measures it by perplexity and judged compliance"}]}],"noPattern":"Training time: Training-Data Source / Provenance locates the poisoned documents once a backdoor is found. At inference the backdoor shows only as a trigger in Model Input and anomalous Response / Model Output, and no pattern reads that pair without a baseline for the model.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-34"},"A:TA-35":{"t":"A","g":"gA3.2","code":"TA-35","n":"Basilisk Venom","tip":"Jailbreak prompts for over 25 models were published in a public GitHub repository. The authors report that DeepSeek R1 responded to a prompt invoking that content by bypassing its constraints without any web access, and attribute the behavior to the repository having been scraped into training data.","label":"<b>Basilisk Venom, jailbreak text in scraped training data<\/b> (0DIN, Feb 2025)","what":"Jailbreak prompts for over 25 models were published in a public GitHub repository. The authors report that DeepSeek R1 responded to a prompt invoking that content by bypassing its constraints without any web access, and attribute the behavior to the repository having been scraped into training data. The causation is the authors' inference from the model's behavior; DeepSeek has not confirmed it. Recorded analogically for that reason.","kind":"executed","same":[],"atlas":"<code>AML.T0020<\/code> Training Data Poisoning; <code>AML.T0054<\/code> LLM Jailbreak","atlasNote":"The source's claim of training-data causation is inferred, not confirmed by the model developer","comp":"DataSources, TrainingData","source":"Poison in the Pipeline: Liberating models with Basilisk Venom. M. Figueroa and Pliny the Liberator, 0DIN (Mozilla), 6 February 2025. <a href=\"https://0din.ai/blog/poison-in-the-pipeline-liberating-models-with-basilisk-venom\" target=\"_blank\" rel=\"noopener\">https://0din.ai/blog/poison-in-the-pipeline-liberating-models-with-basilisk-venom<\/a>","ref":79,"chain":[{"step":"Jailbreak prompts are published in a public repository","fields":[]},{"step":"The repository is scraped into a model's training data","fields":[]},{"step":"A prompt invoking the content makes the model bypass its constraints","fields":[{"id":"F:model_input","g":"analogical","why":"the invoking prompt would be in the input; recorded analogically because the causation is inferred"},{"id":"F:llm_refusal","g":"analogical","why":"an absent refusal on policy-violating output is the gap the field flags; the source shows no refusal record"},{"id":"F:response_model_output","g":"analogical","why":"the unconstrained response is the outcome; recorded analogically because the causation is inferred"}]}],"noPattern":"Training time, and the causation is inferred: its edges are analogical, so no pattern catches it as an instance. The inference-time step is the ordinary jailbreak that the refusal patterns read.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-35"},"A:TA-36":{"t":"A","g":"gA3.2","code":"TA-36","n":"ShadowRay","tip":"Ray's Jobs API runs arbitrary code by design and has no authentication. Anyscale disputes CVE-2023-48022 as a design decision, so scanners that skip disputed CVEs miss it. From at least 5 September 2023 attackers submitted jobs to hundreds of internet-exposed clusters used for training and serving. ","label":"<b>ShadowRay, exploitation of exposed Ray clusters<\/b> (Oligo Security, Mar 2024; CVE-2023-48022)","what":"Ray's Jobs API runs arbitrary code by design and has no authentication. Anyscale disputes CVE-2023-48022 as a design decision, so scanners that skip disputed CVEs miss it. From at least 5 September 2023 attackers submitted jobs to hundreds of internet-exposed clusters used for training and serving. They ran cryptominers (XMRig, NBMiner, a Java Zephyr miner) on GPU nodes and harvested OpenAI, Hugging Face, Stripe and cloud credentials, database passwords, SSH keys and Kubernetes tokens. Oligo estimates the compromised compute at nearly $1 billion. It reports that model weights and datasets were reachable, but documents no theft or modification of them.","kind":"executed","same":[],"atlas":"<code>AML.T0049<\/code> Exploit Public-Facing Application; <code>AML.T0050<\/code> Command and Scripting Interpreter; <code>AML.T0055<\/code> Unsecured Credentials; <code>AML.T0034<\/code> Cost Harvesting","atlasNote":"ATLAS case study <code>AML.CS0023<\/code> (Incident); the target is training and serving infrastructure, not a model","comp":"ModelFrameworksAndCode, RuntimeHosting","source":"ShadowRay: First Known Attack Campaign Targeting AI Workloads Actively Exploited In The Wild. A. Lumelsky, G. Elbaz, G. Kaplan, Oligo Security, 26 March 2024. MITRE ATLAS case study <b><code>AML.CS0023<\/code><\/b>. <a href=\"https://www.oligo.security/blog/shadowray-attack-ai-workloads-actively-exploited-in-the-wild\" target=\"_blank\" rel=\"noopener\">https://www.oligo.security/blog/shadowray-attack-ai-workloads-actively-exploited-in-the-wild<\/a>","ref":80,"chain":[{"step":"An attacker reaches the Ray dashboard and submits a job with no authentication","fields":[{"id":"F:source_host_ip_request_metadata","g":"analogical","why":"Oligo publishes the attacker addresses; the request reached the compute framework, not an AI application's input handling, which is where the field is emitted"},{"id":"F:authorization_decision_record","g":"analogical","why":"no decision was made because the API has no authorization; the instance shows the gap, not a record"}]},{"step":"The job runs cryptominers on the GPU nodes","fields":[{"id":"F:resource_consumption_aggregate","g":"analogical","why":"compute against a budget is the signal, but the field totals agent runs and a Ray job is not one"}]},{"step":"The job harvests credentials and tokens from the cluster","fields":[]}],"noPattern":"Training and serving infrastructure: Compute Job Submission records the unauthenticated submission as one event, which needs no correlation. Its edges to runtime-path fields are analogical.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-36"},"A:TA-37":{"t":"A","g":"gA3.2","code":"TA-37","n":"LangSmith trace replica injection","tip":"The LangSmith SDK's distributed tracing read trace context from incoming HTTP headers (RunTree.from_headers(), TracingMiddleware). The W3C baggage header could carry langsmith-replicas entries with an api_url and api_key, accepted without validation. When a traced operation completed, the SDK posted","label":"<b>LangSmith SDK, trace exfiltration through injected baggage<\/b> (CVE-2026-25528, Feb 2026) <i>(disclosed)<\/i>","what":"The LangSmith SDK's distributed tracing read trace context from incoming HTTP headers (<code>RunTree.from_headers()<\/code>, <code>TracingMiddleware<\/code>). The W3C <code>baggage<\/code> header could carry <code>langsmith-replicas<\/code> entries with an <code>api_url<\/code> and <code>api_key<\/code>, accepted without validation. When a traced operation completed, the SDK posted the run, with its LLM prompts, completions and application metadata, to every replica, including one the request had named. Any caller able to reach a traced service could add itself as a trace destination. Fixed in langsmith 0.6.3 (Python) and 0.4.6 (JavaScript) by removing URL and credential fields from header-supplied replicas; no exploitation is reported.","kind":"disclosed","same":[],"atlas":"<code>AML.T0025<\/code> Exfiltration via Cyber Means","atlasNote":"Telemetry plane repurposed as the exfiltration channel, as in TA-17; the vector is propagated trace context","comp":"Application","source":"LangSmith Client SDK affected by server-side request forgery via tracing header injection, GHSA-v34v-rq6j-cj6p; <b>CVE-2026-25528<\/b> (CVSS 5.8). LangChain, 9 February 2026; fixed in langsmith 0.6.3 (Python) and 0.4.6 (JavaScript). <a href=\"https://github.com/langchain-ai/langsmith-sdk/security/advisories/GHSA-v34v-rq6j-cj6p\" target=\"_blank\" rel=\"noopener\">https://github.com/langchain-ai/langsmith-sdk/security/advisories/GHSA-v34v-rq6j-cj6p<\/a>","ref":81,"chain":[{"step":"A request arrives with a <code>baggage<\/code> header naming an attacker-controlled replica","fields":[{"id":"F:trace_context_propagated","g":"instance","why":"the injected replica rides the propagated context itself; the header is the field's value"},{"id":"F:source_host_ip_request_metadata","g":"analogical","why":"the origin of the request carrying the header; the advisory names no requester"}]},{"step":"The SDK adds the replica as a trace destination for the run","fields":[{"id":"F:instrumentation_coverage_hook_status","g":"instance","why":"the field records where each hook reports; here the destinations changed per request, which is what separates the attack from configured tracing"}]},{"step":"Run data, with prompts and completions, is posted to the attacker's endpoint","fields":[{"id":"F:output_egress_destination","g":"instance","why":"prompts and completions leave to an outbound URL the request chose, as in TA-17"}]}],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-37"},"A:TA-38":{"t":"A","g":"gA3.2","code":"TA-38","n":"macOS.Gaslight","tip":"A Rust backdoor for macOS, attributed with high confidence to DPRK-aligned activity, carries a 3.5 KB Markdown-fenced payload of 38 fabricated system messages: token-expiry warnings, out-of-memory kills, disk exhaustion, repeated operation failures and bogus analysis flags, with {{DATA}} tokens imit","label":"<b>macOS.Gaslight, prompt injection aimed at AI-assisted malware analysis<\/b> (SentinelOne, Aug 2026)","what":"A Rust backdoor for macOS, attributed with high confidence to DPRK-aligned activity, carries a 3.5 KB Markdown-fenced payload of 38 fabricated system messages: token-expiry warnings, out-of-memory kills, disk exhaustion, repeated operation failures and bogus analysis flags, with <code>{{DATA}}<\/code> tokens imitating prompt scaffolding. Its aim is that an LLM-assisted triage or reverse-engineering tool reading the sample aborts, truncates or refuses the analysis. The implant also has Telegram command and control, a stealer and LaunchAgent persistence. The sample was uploaded to VirusTotal on 22 May 2026. SentinelOne reports no test against a model, so no effect on an AI system is documented.","kind":"executed","same":[],"atlas":"<code>AML.T0051.001<\/code> LLM Prompt Injection: Indirect; <code>AML.T0015<\/code> Evade AI Model","atlasNote":"The payload targets the defender's AI analysis, not the victim host","comp":"AgentInputHandling, AgentOutputHandling","source":"macOS.Gaslight | Rust Backdoor Turns Prompt Injection on the Analyst, Not the Sandbox. P. Stokes, SentinelLABS, August 2026. <a href=\"https://www.sentinelone.com/labs/macos-gaslight-rust-backdoor-turns-prompt-injection-on-the-analyst-not-the-sandbox/\" target=\"_blank\" rel=\"noopener\">https://www.sentinelone.com/labs/macos-gaslight-rust-backdoor-turns-prompt-injection-on-the-analyst-not-the-sandbox/<\/a>","ref":82,"chain":[{"step":"An AI-assisted analysis tool reads the sample, payload included","fields":[{"id":"F:model_input","g":"analogical","why":"the payload is built to enter the tool's input; no ingestion is documented"},{"id":"F:encoded_obfuscated_payload_indicator","g":"analogical","why":"fake system messages and <code>{{DATA}}<\/code> scaffolding are the markup authority tags the field flags; no model input is documented"}]},{"step":"The fabricated errors and limits push the model to abort, truncate or refuse","fields":[{"id":"F:llm_refusal","g":"analogical","why":"a refusal of analysis is one stated goal; no response is documented"},{"id":"F:stop_reason","g":"analogical","why":"an abort or truncation would show as an early stop; no response is documented"},{"id":"F:llm_error_exception","g":"analogical","why":"a claimed error with no recorded error is the discrepancy that separates the attack from a real failure; no response is documented"}]}],"noPattern":"No AI system's handling of the sample is documented, so every edge is analogical. It motivates a pattern comparing errors a response claims against Model Error / Exception, not yet proposed.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-38"},"A:TA-39":{"t":"A","g":"gA3.2","code":"TA-39","n":"Log-field prompt injection","tip":"Payloads were placed in six log fields an attacker controls (user_agent, http_uri, payload, dns_query, auth_user, raw_message). Batches of 200 synthesized logs were flattened into GPT-4o-mini's user message for classification, summarization and remediation tasks. Persona-hijack payloads had maliciou","label":"<b>Prompt injection through attacker-controlled log fields<\/b> (Pandey and Bhujang, May 2026)","what":"Payloads were placed in six log fields an attacker controls (<code>user_agent<\/code>, <code>http_uri<\/code>, <code>payload<\/code>, <code>dns_query<\/code>, <code>auth_user<\/code>, <code>raw_message<\/code>). Batches of 200 synthesized logs were flattened into GPT-4o-mini's user message for classification, summarization and remediation tasks. Persona-hijack payloads had malicious events labeled benign at up to 68%, and context manipulation succeeded on 96% of summaries. Wrapping fields in tags and stating that they were untrusted, keyword filtering, and templated output cut average success from 26.6% to 11.8%, not to zero. A base64 payload was never decoded and never succeeded.","kind":"executed","same":[],"atlas":"<code>AML.T0051.001<\/code> LLM Prompt Injection: Indirect; <code>AML.T0015<\/code> Evade AI Model","atlasNote":"Telemetry content is the injection channel into a defender's AI","comp":"AgentInputHandling, AgentOutputHandling","source":"Poisoning the Watchtower: Prompt Injection Attacks Against LLM-Augmented Security Operations Through Adversarial Log Content. R. Pandey, A. Bhujang, arXiv:2605.24421, May 2026. <a href=\"https://arxiv.org/abs/2605.24421\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2605.24421<\/a>","ref":83,"chain":[{"step":"The attacker writes instructions into fields the defender logs","fields":[]},{"step":"The logs enter the model's context for a SOC task","fields":[{"id":"F:model_input","g":"instance","why":"the payloads are in the flattened logs the model receives"},{"id":"F:input_source_channel","g":"instance","why":"log records arrive concatenated into the user message; the channel is what separates them from the analyst's instruction"},{"id":"F:input_trust_classification","g":"instance","why":"the structured defense assigns log fields the untrusted-data role and is evaluated as a condition"},{"id":"F:guardrail_input_verdict","g":"instance","why":"the sanitized condition runs a keyword filter over the input and is evaluated"},{"id":"F:encoded_obfuscated_payload_indicator","g":"analogical","why":"a base64 payload is tested; it failed, so the flag would not distinguish a successful attack"}]},{"step":"The model labels malicious events benign, omits them, or discourages escalation","fields":[{"id":"F:response_model_output","g":"instance","why":"every success metric is measured on the output"}]}],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-39"},"A:TA-40":{"t":"A","g":"gA3.2","code":"TA-40","n":"LogInject","tip":"The LogInject-1.0 benchmark holds 12,847 log entries, 2,569 of them adversarial, with payloads in HTTP User-Agent and Referer headers, SSH usernames, JSON API bodies and echoed error messages. Logs reach the model when an analyst's query retrieves them by time, keyword or semantic search. Against GP","label":"<b>LogInject, passive prompt injection in network security logs<\/b> (Karanjai et al., Jul 2026)","what":"The LogInject-1.0 benchmark holds 12,847 log entries, 2,569 of them adversarial, with payloads in HTTP User-Agent and Referer headers, SSH usernames, JSON API bodies and echoed error messages. Logs reach the model when an analyst's query retrieves them by time, keyword or semantic search. Against GPT-4o, Claude 3.5 Sonnet and Llama-3-70B-Instruct the payloads concealed activity, fabricated alerts, leaked a system-prompt canary or inserted attacker text, at 83.4% average and up to 88.2% success. Context Stitching splits one payload across several entries, each of which passes a WAF, and reached 76.4%. A regex input filter cut success from 87.3% to 78.2%, spotlighting to 51.4%, and spotlighting with canary-based output validation to 8.4%. Obfuscation included null bytes, base64, hex and ROT13 with decoding instructions, and homoglyphs.","kind":"executed","same":[],"atlas":"<code>AML.T0051.001<\/code> LLM Prompt Injection: Indirect; <code>AML.T0068<\/code> LLM Prompt Obfuscation; <code>AML.T0015<\/code> Evade AI Model","atlasNote":"Telemetry content is the injection channel; payloads fragment across entries","comp":"RAGContent, AgentInputHandling, AgentOutputHandling","source":"Context Contamination in LLM Analysis of Network Security Logs: Poison with Passive Prompt Injection and Mitigation Evaluation. R. Karanjai, et al., arXiv:2607.14493, July 2026. <a href=\"https://arxiv.org/abs/2607.14493\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2607.14493<\/a>","ref":84,"chain":[{"step":"The attacker writes payloads, split and obfuscated, into logged fields","fields":[{"id":"F:encoded_obfuscated_payload_indicator","g":"instance","why":"null bytes, base64, hex, ROT13 and homoglyphs are in the payloads the benchmark measures"}]},{"step":"An analyst's query retrieves the logs into the model's context","fields":[{"id":"F:retrieval_event","g":"instance","why":"logs reach the model only through a retrieval by time, keyword or similarity"},{"id":"F:retrieved_content_source_provenance","g":"instance","why":"each entry's origin, an external-facing service whose field the attacker wrote, is what marks it untrusted"},{"id":"F:model_input","g":"instance","why":"the payloads are in the retrieved logs the model receives"},{"id":"F:input_trust_classification","g":"instance","why":"spotlighting marks the logs as untrusted data and is evaluated as a defense layer"},{"id":"F:guardrail_input_verdict","g":"instance","why":"the regex input filter is evaluated as a defense layer"}]},{"step":"The model conceals activity, fabricates alerts or leaks its system prompt","fields":[{"id":"F:response_model_output","g":"instance","why":"every success metric is measured on the output"},{"id":"F:guardrail_output_verdict","g":"instance","why":"canary-based output validation is evaluated as a defense layer"},{"id":"F:system_prompt_instruction_config","g":"instance","why":"the leak objective is detected by a system-prompt canary reproduced in the output"}]}],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ta-40"},"A:IR-01":{"t":"A","g":"gA3.3","code":"IR-01","n":"Breaking the Prompt Wall","tip":"Lightweight prompt-injection templates bypass safety filters across chat, file upload, and agent config.","label":"Breaking the Prompt Wall","what":"Lightweight prompt-injection templates bypass safety filters across chat, file upload, and agent config.","kind":"","same":[],"atlas":"<code>AML.T0051<\/code>(.000/.001), <code>AML.T0054<\/code>, <code>AML.T0053<\/code>","atlasNote":"See §3.3","comp":"ApplicationInputHandling, AgentInputHandling","source":"Breaking the Prompt Wall (I): A Real-World Case Study of Attacking ChatGPT via Lightweight Prompt Injection. X. Chang, G. Dai, H. Di, et al., arXiv:2504.16125, April 2025. <a href=\"https://arxiv.org/abs/2504.16125\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2504.16125<\/a>","ref":69,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ir-01"},"A:IR-02":{"t":"A","g":"gA3.3","code":"IR-02","n":"MINJA","tip":"Benign queries induce the agent to autonomously generate & persist malicious reasoning in memory.","label":"MINJA (Memory Injection Attack)","what":"Benign queries induce the agent to autonomously generate &amp; persist malicious reasoning in memory.","kind":"","same":[],"atlas":"<code>AML.T0051.000<\/code> Direct and <code>AML.T0051.002<\/code> Triggered; <code>AML.T0080.000<\/code> AI Agent Contex ied for field overlap with AI incident response; <b>does not alone ground a MUST field<\/b>.","kind":"","same":[],"atlas":"MITRE <b>ATT&amp;CK<\/b> (non-AI)","atlasNote":"SSRF/cloud exfil","comp":"ModelServing, Identity","source":"A Case Study of the Capital One Data Breach. N. Novaes Neto, S. Madnick, A. M. G. de Paula, N. Malara Borges, MIT Sloan CISL Working Paper 2020-07, January 2020. <a href=\"https://web.mit.edu/smadnick/www/wp/2020-07.pdf\" target=\"_blank\" rel=\"noopener\">https://web.mit.edu/smadnick/www/wp/2020-07.pdf<\/a>","ref":72,"chain":[],"noPattern":"A non-AI incident, carried for field overlap; its edges are analogical. <code>identity_from_new_source<\/code> catches it analogically.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ir-04"},"A:IR-05":{"t":"A","g":"gA3.3","code":"IR-05","n":"AGENTPOISON","tip":"Optimized trigger-based adversarial queries poison agent memory/RAG.","label":"AGENTPOISON","what":"Optimized trigger-based adversarial queries poison agent memory/RAG.","kind":"","same":[],"atlas":"<code>AML.T0070<\/code>, <code>AML.T0020<\/code>, <code>AML.T0043.004<\/code> Craft Adversarial Data: Insert Backdoor Trigger","atlasNote":"Trigger-based memory/RAG poisoning","comp":"Memory, RAGContent","source":"AgentPoison: Red-teaming LLM Agents via Poisoning Memory or Knowledge Bases. Z. Chen, Z. Xiang, C. Xiao, et al., arXiv:2407.12784, July 2024. <a href=\"https://arxiv.org/abs/2407.12784\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2407.12784<\/a>","ref":73,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-ir-05"},"A:AOC-01":{"t":"A","g":"gA3.4","code":"AOC-01","n":"Disproportionate Response","tip":"To protect a non-owner \"secret,\" the agent reset/destroyed its own email account (owner's asset) and falsely reported the secret deleted while it remained recoverable.","label [],"atlas":"<code>AML.T0052.000<\/code> Spearphishing via Social Engineering LLM","atlasNote":"Fake owner-compromise <i>(resisted)<\/i>","comp":"Identity, AgentInputHandling","source":"<b>Agents of Chaos<\/b>: Shapira, N., Wendler, C., Yen, A., et al. <i>Agents of Chaos.<\/i> arXiv:2602.20021 (2026). <a href=\"https://arxiv.org/abs/2602.20021\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2602.20021<\/a> · interactive log: <a href=\"https://agentsofchaos.baulab.info/\" target=\"_blank\" rel=\"noopener\">https://agentsofchaos.baulab.info/<\/a>. Corpus IDs <code>AOC-01<\/code> to <code>AOC-16<\/code> are the paper's Case Studies #1 to #16. <b>Case Study #15<\/b>","ref":2,"chain":[],"noPattern":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-aoc-15"},"A:AOC-16":{"t":"A","g":"gA3.4","code":"AOC-16","n":"Inter-Agent Coordination","tip":"Agents shared risk signals about a researcher running the same probing pattern; jointly hardened policy.","label":"Inter-Agent Coordination on Suspicious Requests <i>(emergent defense)<\/i>","what":"Agents shared risk signals about a researcher running the same probing pattern; jointly hardened policy.","kind":"","same":[],"atlas":"<i>(defensive)<\/i>: <code>AML.T0118.001<\/code> Direct Agent Communication carrying detection of <code>AML.T0051<\/code>/<code>AML.T0053<\/code> patterns","atlasNote":"Emergent cross-agent defense","comp":"Orchestration","source":"<b>Agents of Chaos<\/b>: Shapira, N., Wendler, C., Yen, A., et al. <i>Agents of Chaos.<\/i> arXiv:2602.20021 (2026). <a href=\"https://arxiv.org/abs/2602.20021\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2602.20021<\/a> · interactive log: <a href=\"https://agentsofchaos.baulab.info/\" target=\"_blank\" rel=\"noopener\">https://agentsofchaos.baulab.info/<\/a>. Corpus IDs <code>AOC-01<\/code> to <code>AOC-16<\/code> are the paper's Case Studies #1 to #16. <b>Case Study #16<\/b>","ref":2,"chain":[],"noPattern":"An emergent defense, not an attack: agents shared risk signals about a probing researcher. A pattern would detect the defense. Its Inter-Agent Message edge supports reading such signals.","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#a-aoc-16"},"R:riskDataPoisoning":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Data Poisoning","code":"riskDataPoisoning","tip":"Altering data sources used to train the model. In terms of impact, Data Poisoning is comparable to modifying the logic of an application to change its behavior.","short":"<p>Altering data sources used to train the model. In terms of impact, Data Poisoning is comparable to modifying the logic of an application to change its behavior.<\/p>","long":"<p>Altering data sources used during training or retraining (by deleting or modifying existing data as well as injecting adversarial data) to degrade model performance, skew results towards a specific outcome, or create hidden backdoors.<\/p><p>Data Poisoning can be considered comparable to maliciously modifying the logic of an application to change its behavior.<\/p><p>Data Poisoning attacks can happen during training or tuning, while data is held in storage, or even before the data is ingested into an organization. For example, foundation models are often trained on distributed web-scale datasets crawled from the Internet. An attack could indirectly pollute a public data source (<a href=\"https://arxiv.org/abs/2302.10149\" target=\"_blank\" rel=\"noopener\">Poisoning Web-Scale Training Datasets is Practical<\/a>) that is eventually ingested. A malicious or compromised insider could also more directly poison the datasets while held in storage or during the training process, by submitting poisoned prompt-response examples for inclusion in the tuning data, as demonstrated in a 2023 research paper on poisoning models during instruction tuning (<a href=\"https://arxiv.org/abs/2305.00944\" target=\"_blank\" rel=\"noopener\">Poisoning Language Models During Instruction Tuning<\/a>).<\/p><p>Data Poisoning attacks can also install backdoors by specific alterations of the training data. Backdoored models would continue to function normally, but alternate behaviors could be triggered under certain conditions to make the model behave maliciously.<\/p>","atlas":["AML.T0020","AML.T0019","AML.T0010.002","AML.T0043","AML.T0059","AML.T0008.002"],"life":["data-preparation","model-training","maintenance"],"impact":["integrity","reliability","safety","fairness"],"dropped":false},"R:riskUnauthorizedTrainingData":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Unauthorized Training Data","code":"riskUnauthorizedTrainingData","tip":"Using unauthorized data for model training. Using a model trained with Unauthorized Training Data might lead to legal or ethical challenges.","short":"<p>Using unauthorized data for model training. Using a model trained with Unauthorized Training Data might lead to legal or ethical challenges.<\/p>","long":"<p>Training a model using data that is not authorized to be used for that model.<\/p><p>A model trained or fine tuned on unauthorized data could pose legal or ethical challenges. Unauthorized Training Data may include any data that violates policies, contracts, or regulations. Examples are user data that does not have appropriate user consent, unlicensed copyrighted data, or legally restricted data.<\/p>","atlas":["AML.T0010.002"],"life":["planning","data-preparation","model-training"],"impact":["compliance","privacy","fairness"],"dropped":false},"R:riskModelSourceTampering":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Model Source Tampering","code":"riskModelSourceTampering","tip":"Tampering with the model's code or data. Model Source Tampering is similar to tampering with traditional software code, and can create vulnerabilities or unintended behavior.","short":"<p>Tampering with the model's code or data. Model Source Tampering is similar to tampering with traditional software code, and can create vulnerabilities or unintended behavior.<\/p>","long":"<p>Tampering with the model's source code, dependencies, or weights, either by supply chain attacks or insider attacks.<\/p><p>Similar to tampering with traditional software code, Model Source Tampering can introduce vulnerabilities or unexpected behaviors.<\/p><p>Since model source code is used in the process of developing the model, code modifications can affect model behavior. As with traditional code, attacks on a dependency can affect the program that relies on that dependency, so the risks in this area are transitive, potentially through many layers of a model code's dependency chain.<\/p><p>Another method of Model Source Tampering is model architecture backdoors, which are backdoors embedded within the definition of the neural network architecture (<a href=\"https://arxiv.org/abs/2402.06957\" target=\"_blank\" rel=\"noopener\">Architectural Neural Backdoors from First Principles<\/a>). Such backdoors can survive full retraining of a model.<\/p>","atlas":["AML.T0010.001","AML.T0010.003","AML.T0018"],"life":["development","model-training","deployment"],"impact":["integrity","availability","safety","reliability","compliance"],"dropped":false},"R:riskExcessiveDataHandling":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Excessive Data Handling","code":"riskExcessiveDataHandling","tip":"Using data for model training and development that exceeds authorized or legal boundaries for collection, retention, or processing. This may lead to policy and legal challenges.","short":"<p>Using data for model training and development that exceeds authorized or legal boundaries for collection, retention, or processing. This may lead to policy and legal challenges.<\/p>","long":"<p>The collection, retention, or processing of data for model training that violates legal, ethical, or organizational policies.<\/p><p>Excessive Data Handling can create significant policy and legal challenges.<\/p><p>This includes training models on datasets containing copyrighted material, proprietary information, or sensitive Personally Identifiable Information (PII) without a proper legal basis.<\/p>","atlas":[],"life":["data-preparation","model-training","evaluation"],"impact":["privacy","compliance","confidentiality"],"dropped":false},"R:riskFederatedDistributedTrainingPrivacy":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Federated/Distributed Training Privacy","code":"riskFederatedDistributedTrainingPrivacy","tip":"Gradient leakage and inversion attacks from untrusted clients in federated learning. Federated/Distributed Training Privacy risks can expose sensitive training data and compromise participant privacy.","short":"<p>Gradient leakage and inversion attacks from untrusted clients in federated learning. Federated/Distributed Training Privacy risks can expose sensitive training data and compromise participant privacy.<\/p>","long":"<p>Privacy breaches in federated learning systems where malicious participants or compromised clients can extract sensitive information from gradient updates, model parameters, or aggregation processes.<\/p><p>Federated learning enables collaborative model training without centralizing raw data, but the shared gradient updates and model parameters can leak sensitive information about participants' private datasets. Attackers can use gradient inversion techniques, membership inference attacks, or property inference to reconstruct training samples, identify dataset characteristics, or determine if specific data points were used in training.<\/p><p>The risk is amplified when federated learning systems lack proper privacy protections such as differential privacy, secure aggregation, or robust participant verification. Malicious clients can also poison the training process by submitting adversarial gradients designed to compromise model integrity while extracting information from honest participants.<\/p><p>Advanced attacks may exploit the iterative nature of federated learning to gradually extract information over multiple training rounds, use auxiliary information to enhance reconstruction attacks, or coordinate between multiple compromised clients to amplify privacy breaches.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskMaliciousLoaderDeserialization":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Malicious Loader/Deserialization","code":"riskMaliciousLoaderDeserialization","tip":"Unsafe loaders for models and tokenizers that can cause remote code execution or integrity compromise. Malicious Loader/Deserialization poses significant security risks including system compromise and data breaches.","short":"<p>Unsafe loaders for models and tokenizers that can cause remote code execution or integrity compromise. Malicious Loader/Deserialization poses significant security risks including system compromise and data breaches.<\/p>","long":"<p>Exploitation of unsafe deserialization processes or malicious model loading mechanisms that can lead to remote code execution, system compromise, or integrity violations when loading AI models, tokenizers, or related artifacts.<\/p><p>Many AI frameworks use serialization formats like pickle, joblib, or custom binary formats to store and load models, weights, tokenizers, and preprocessing pipelines. These formats can contain executable code that runs during the deserialization process. Attackers can craft malicious model files that execute arbitrary code when loaded, potentially compromising the entire system.<\/p><p>This risk extends beyond traditional pickle-based attacks to include malicious model architectures, compromised tokenizer configurations, and poisoned preprocessing pipelines. Even seemingly safe formats can be exploited through buffer overflows, path traversal attacks, or by exploiting vulnerabilities in parsing libraries.<\/p><p>The attack surface is particularly large because model loading often occurs with elevated privileges, and users frequently download models from untrusted sources or model repositories without proper verification. Malicious loaders can also be used to establish persistence, exfiltrate data, or serve as entry points for further attacks on AI infrastructure.<\/p><p>Modern attacks may also target container images, model serving frameworks, or cloud-based model repositories, making the threat landscape even more complex and requiring comprehensive security measures throughout the model lifecycle.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskToolSourceProvenance":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Tool Source Provenance","code":"riskToolSourceProvenance","tip":"Use of unvetted or unverified tool registries, MCP server manifests, or tool metadata sources that may provide agents with deceptive tool descriptions, altered schemas, or shadowed tool names.","short":"<p>Use of unvetted or unverified tool registries, MCP server manifests, or tool metadata sources that may provide agents with deceptive tool descriptions, altered schemas, or shadowed tool names.<\/p>","long":"<p>The tool metadata an agent acts on originates in registries, MCP server manifests, and discovery endpoints — governing both which endpoints are admitted as reachable and what the served model knows about the tools available to it. When these sources are adopted without provenance verification, cryptographic signing, or publisher identity validation, the agent may receive deliberately deceptive tool descriptions or schemas. Three gaps widen this exposure: third-party tools that are discovered or registered without any check of the publisher's identity or provenance, registries or manifests that are added without cryptographic signature verification, and a tool-selection step that trusts a tool's described functionality without independently confirming the tool behaves as claimed.<\/p><p>This risk operates at the tool selection layer, before a prompt is constructed. Unlike Prompt Injection, which targets model input processing, Tool Source Provenance targets the trust assumptions in tool discovery. Registry-sourced metadata is treated as authoritative wherever it lands — at the admission decision that enumerates reachable endpoints, and in whatever the served model already knows about available tools — and unvetted sources exploit that trust.<\/p><p>Attack patterns include Tool Poisoning (malicious logic hidden in tool descriptions), Tool Shadowing and Typosquatting (lookalike tools using similar names or Unicode homoglyphs), and Schema Poisoning (configuration files that alter tool behavior). These were cataloged by Checkmarx in their MCP risk taxonomy (December 2025).<\/p><p>Tool Source Provenance is structurally analogous to Model Source Tampering, which addresses unvetted model artifacts in the supply chain. Both are provenance failures where untrusted sources are consumed without verification. A successful Tool Source Provenance exploit typically manifests as Rogue Actions when the agent invokes the wrong tool.<\/p>","atlas":["AML.T0010.001"],"life":["development","deployment"],"impact":["confidentiality","integrity","safety"],"dropped":false},"R:riskAgenticToolSupplyChain":{"t":"R","g":"gRrisksSupplyChainAndDevelopment","n":"Agentic Tool Supply Chain Compromise","code":"riskAgenticToolSupplyChain","tip":"Compromise of the build, packaging, and dependency chain of the server-side code that backs an agent's tools, where unsigned or unverified artifacts and vulnerable or unpinned dependencies execute with the tool's privileges.","short":"<p>Compromise of the build, packaging, and dependency chain of the server-side code that backs an agent's tools, where unsigned or unverified artifacts and vulnerable or unpinned dependencies execute with the tool's privileges.<\/p>","long":"<p>Agents invoke tools that are backed by server-side code — most visibly Model Context Protocol (MCP) servers, but equally A2A endpoints, plugin runtimes, and any remote-tooling service the agent calls. That code is built, packaged, and deployed through a supply chain: source repositories, dependency resolvers, build pipelines, and artifact registries. When an artifact is admitted to execution without provenance verification or signature checking, when its transitive dependencies are not screened for known vulnerabilities, or when dependencies resolve through floating version ranges rather than hash-pinned references, an attacker who compromises any link in that chain runs code with the tool's privileges the next time the agent invokes it.<\/p><p>This is the classical software supply-chain compromise pattern in agentic dress. The relevant reference frame is the same one used for any build pipeline: SLSA provenance levels, software composition analysis (SCA) over the dependency graph, binary or admission authorization that refuses unsigned artifacts, software bills of materials (SBOM), and hash-pinned, reproducible dependency resolution. The protocol an agent uses to reach the tool, and whether the server runs locally or remotely, are attributes of the deployment, not the identity of the defect.<\/p><p>This risk operates at the tool's CODE and DEPENDENCY integrity layer — the artifact that runs when a tool is invoked. It is distinct from Tool Source Provenance, which operates one layer up at tool discovery and metadata: a tool can have a perfectly trustworthy manifest and publisher identity while the server binary behind it was built from a poisoned dependency. It is also distinct from Model Source Tampering, which is the same defect class applied to the MODEL artifact (code, weights, training dependencies) rather than to agentic tool/server code. Agentic Tool Supply Chain Compromise is structurally analogous to Model Source Tampering: both are integrity failures in a build-and-dependency chain consumed without verification, but they target different artifacts and different consuming personas.<\/p><p>When the compromised build itself behaves maliciously, that is this risk's own consequence, not Rogue Actions. It still manifests downstream as Insecure Integrated Component for a generic software flaw exploited at runtime, or as Rogue Actions where the compromised build also alters the tool's description or schema. Because dependency chains are transitive, a single poisoned upstream package can reach many tool servers, giving this risk supply-chain blast radius rather than per-tool scope.<\/p>","atlas":["AML.T0010.002"],"life":["development","deployment"],"impact":["integrity","confidentiality","availability"],"dropped":false},"R:riskDenialOfMLService":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Denial of ML Service","code":"riskDenialOfMLService","tip":"Overloading ML systems with resource-intensive queries. Like traditional DoS attacks, Denial of ML Service can reduce availability of or entirely disrupt a service.","short":"<p>Overloading ML systems with resource-intensive queries. Like traditional DoS attacks, Denial of ML Service can reduce availability of or entirely disrupt a service.<\/p>","long":"<p>Reducing the availability of ML systems and denying service by issuing queries that take too many resources.<\/p><p>Examples of attacks include traditional denial of service or spamming a system with abusive material to overload automated or manual review processes. If an API-gated model does not have appropriate rate limiting or load balancing, the repeated queries can take the model offline, making it unavailable to other users.<\/p><p>There are also energy-latency attacks (<a href=\"https://arxiv.org/abs/2006.03463\" target=\"_blank\" rel=\"noopener\">Sponge Examples: Energy-Latency Attacks on Neural Networks<\/a>): attackers can carefully craft “sponge examples” (also known as queries of death), which are inputs designed to maximize energy consumption and latency, pushing ML systems towards their worst-case performance. Adversaries might use their own tools to accelerate construction of such sponge examples. These attacks are especially relevant for on-device models, since the increased energy consumption can drain batteries and make the model unavailable.<\/p>","atlas":["AML.T0029","AML.T0034"],"life":["runtime"],"impact":["availability"],"dropped":false},"R:riskPromptInjection":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Prompt Injection","code":"riskPromptInjection","tip":"Tricking a model to run unintended commands. In terms of impact, Prompt Injection can change a model's behavior.","short":"<p>Tricking a model to run unintended commands. In terms of impact, Prompt Injection can change a model's behavior.<\/p>","long":"<p>Causing a model to execute commands “injected” inside a prompt.<\/p><p>Prompt Injection takes advantage of the blurry boundary between “instructions” and “input data” in a prompt, resulting in a change to the model’s behavior. These attacks can be both direct (entered directly by the user) or indirect (read from other sources such as a doc, email, or website).<\/p><p>Jailbreaks (<a href=\"https://arxiv.org/abs/2307.02483\" target=\"_blank\" rel=\"noopener\">Jailbroken: How Does LLM Safety Training Fail?<\/a>) are one type of Prompt Injection attack, causing the model to behave in ways that they’ve been trained to avoid, such as outputting unsafe content or leaking personally identifiable information.  These are well-known vulnerabilities such as \"ignore your previous instructions\" or “Do Anything Now” (DAN).<\/p><p>Aside from jailbreaks, Prompt Injections (<a href=\"https://arxiv.org/abs/2302.12173\" target=\"_blank\" rel=\"noopener\">Not what you've signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection<\/a>) generally cause the LLM to execute malicious “injected” instructions as part of data that were not meant to be executed by the LLM. The blast radius of such attacks can become much bigger in the presence of other risks such as Insecure Integrated Component and Rogue Actions.<\/p><p>With foundation models becoming multi-modal, multi-modal prompt injection has also become possible. These attacks use injection inputs other than text to trigger the intended model behavior.<\/p>","atlas":["AML.T0051"],"life":["runtime"],"impact":["integrity","confidentiality","safety"],"dropped":false},"R:riskModelEvasion":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Model Evasion","code":"riskModelEvasion","tip":"Changes to a prompt input to cause the model to produce incorrect inferences. Model Evasion can lead to reputational, legal, security, and privacy risks.","short":"<p>Changes to a prompt input to cause the model to produce incorrect inferences. Model Evasion can lead to reputational, legal, security, and privacy risks.<\/p>","long":"<p>Causing a model to produce incorrect inferences by slightly perturbing the prompt input.<\/p><p>Model Evasion can result in reputational or legal challenges and trigger other downstream risks, such as to security or privacy systems.<\/p><p>A classic example is placing stickers on a stop sign to obscure the visual inputs to model piloting a self-driving car. Because of the change to the typical visual presentation of the sign, the model might not correctly infer its presence. Similarly, normal wear and tear on a stop sign could lead to misidentification if the model is not trained on images of signs in varying degrees of disrepair.<\/p><p>In some cases, an attacker might gain clues about how to perturb inputs by discovering the underlying foundation model’s family, i.e., by knowing the particular architecture and evolution of a specific model. In other situations, an attacker might repeatedly probe the model (see Model Reverse Engineering) to figure out inference patterns in order to craft examples that evade those inferences. Adversarial examples might be constructed by perturbations to inputs that will provide the output the attacker wants while looking unaltered otherwise. This could be used, for example, for evading a classifier that serves as an important safeguard.<\/p><p>Not all examples of model evasion attacks are necessarily visible to the naked eye. The inputs might be perturbed in such a way to appear unaltered, but still produce the output the attacker wants. For example, a homoglyph attack involves slight changes to typefaces that the human eye doesn’t perceive as a different letter, but could trigger unexpected inferences in the mode. Another example could be sending an image in the prompt but using steganography to encode text within the image pixels. This text would be part of the prompt for the LLM, but the user won’t see it.<\/p>","atlas":["AML.T0015","AML.T0043"],"life":["evaluation","runtime"],"impact":["integrity","safety","reliability"],"dropped":false},"R:riskEconomicDenialOfWallet":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Economic Denial of Wallet","code":"riskEconomicDenialOfWallet","tip":"Cost abuse via token inflation, long context, or tool loops that spike spend. Economic Denial of Wallet can lead to unexpected financial losses and service disruption through resource exhaustion attacks.","short":"<p>Cost abuse via token inflation, long context, or tool loops that spike spend. Economic Denial of Wallet can lead to unexpected financial losses and service disruption through resource exhaustion attacks.<\/p>","long":"<p>Attacks designed to cause excessive computational or financial costs by exploiting AI service pricing models, resource consumption patterns, or billing mechanisms to drain budgets or exhaust allocated resources.<\/p><p>Many AI services operate on usage-based pricing models where costs scale with token consumption, compute time, API calls, or resource utilization. Attackers can exploit these models through various techniques including token inflation attacks (crafting prompts that generate extremely long responses), context window abuse (using maximum context lengths repeatedly), recursive tool calling, or triggering expensive operations.<\/p><p>Economic attacks can be particularly devastating because they directly impact operational budgets and can force service shutdowns when cost limits are reached. Attackers may use automated scripts to repeatedly trigger expensive operations, exploit pricing arbitrage between different service tiers, or abuse free trial periods to maximize damage.<\/p><p>The risk extends beyond direct API abuse to include attacks on model serving infrastructure where malicious inputs are designed to maximize computational overhead, memory usage, or processing time. These attacks can also target auto-scaling mechanisms to force unnecessary resource provisioning and associated costs.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskRunawayAgentToolLoops":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Runaway Agent Tool Loops","code":"riskRunawayAgentToolLoops","tip":"Agents enter uncontrolled recursive tool-calling cycles at the orchestration layer, exhausting context windows, compute resources, and API budgets through emergent autonomous behavior or adversarial trigger.","short":"<p>Agents enter uncontrolled recursive tool-calling cycles at the orchestration layer, exhausting context windows, compute resources, and API budgets through emergent autonomous behavior or adversarial trigger.<\/p>","long":"<p>In agentic systems, autonomous agents invoke tools in sequence or recursively based on LLM reasoning. Runaway Agent Tool Loops occur when agents enter uncontrolled tool-calling cycles because termination conditions are absent, broken, or never satisfied. The primary failure mode is emergent: agents that loop because validation functions never return satisfying results, max_turns defaults are not set, or tool responses trigger further reasoning without convergence. No adversary is required.<\/p><p>This risk extends classical infinite loop and fork bomb patterns to the agentic domain
