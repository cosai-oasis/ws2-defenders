","con":["delegation_chain"],"gap":"","note":"<code>delegation_chain<\/code> origin (6.3)","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-input-source-channel"},"F:input_trust_classification":{"t":"F","g":"gF6.2","n":"Input Trust Classification","code":"input_trust_classification","tier":"MUST","tip":"Trusted or untrusted origin, crossed with the role assigned on entry: instruction or data.","records":"Trusted or untrusted origin, crossed with the role assigned on entry: instruction or data.","capture":"The origin authority of a segment crossed with the role the deployment assigned it on entry: <b>trusted-instruction<\/b>, <b>trusted-data<\/b>, <b>untrusted-instruction<\/b>, <b>untrusted-data<\/b>. Owner command against environmental or third-party content, and instruction against data. <b><code>untrusted-instruction<\/code> is the attack state<\/b>, the cell <code>TA-01<\/code> occupies.","why":"Operationalizes the risk map's core agentic control. <code>AOC-02<\/code> disclosed 124 email records because it did not distinguish an owner instruction from a non-owner's; <code>TA-01<\/code> is untrusted email content promoted to instruction.","role":"label","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Input Handling"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:2004"],"gap":"No trust-provenance enum","note":"","asks":[{"id":"ocsf_trust_level","s":"Add a trust_level enum usable on content and message objects.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No trust-provenance concept","note":"","asks":[{"id":"otel_trust_level","s":"Add gen_ai.input.trust_level on message parts (trusted or untrusted, crossed with instruction or data).","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["security.*"],"gap":"","note":"<code>security.*<\/code> (trust/threat)","asks":[]},{"pub":"ODIS","cov":"covered","con" t identity. Each hash declares its canonicalization and may be a keyed digest with a key identifier; an absent hash means not digested, never unchanged.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.output.messages"],"gap":"","note":"Gated behind content-capture opt-in.","asks":[{"id":"otel_hash_only_capture","s":"Ensure a hash-only content-capture mode exists for message content. The digest declares its canonicalization and may be keyed with a key identifier; an absent digest means not captured.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.completion"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-response-model-output"},"F:output_egress_destination":{"t":"F","g":"gF6.2","n":"Output Egress Destination","code":"output_egress_destination","tier":"MUST","tip":"Where output goes: recipients, URLs, channels, files, broadcast scope.","records":"Where output goes: recipients, URLs, channels, files, broadcast scope.","capture":"Where output goes: recipient addresses, outbound URLs/domains, channels, file targets, broadcast scope.","why":"Converts a detection from <i>\"something bad was generated\"<\/i> into <i>\"and here is where it went\"<\/i>: the difference between blocking and reporting. It would have caught <code>TA-01<\/code> and <code>TA-03<\/code> <i>before data left<\/i>: both smuggle data into an outbound URL on a trusted-looking domain. It also renders <code>AOC-03<\/code>, <code>AOC-11<\/code>, and <code>AOC-05<\/code> visible.","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Application Output Handling","Agent Output Handling"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:http_activity","class:network_activity"],"gap":"No link from model output to the egress channel or recipient","note":"","asks":[{"id":"ocsf_egress_correlation","s":"Add an egress correlation attribute linking model output to its destination, recipient or URL.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No link from model output to its destination","note":"","asks":[{"id":"otel_egress_pattern","s":"Document correlating model output to its destination through the HTTP and network conventions on the child span.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.tool.call.arguments","security.pii.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["resource_indicators"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-output-egress-destination"},"F:citations_source_attribution":{"t":"F","g":"gF6.2","n":"Citations / Source Attribution","code":"citations_source_attribution","tier":"MUST","tip":"Sources the agent claims, and whether each resolves to a logged retrieval.","records":"Sources the agent claims, and whether each resolves to a logged retrieval.","capture":"The sources the agent <i>claims<\/i> it drew on, per output: file ID/name/URL or site URL for each citation, <b>plus whether each resolves to an item actually returned by a logged Retrieval Event (§1.4)<\/b>. Unresolvable, fabricated, or attacker-supplied citations are the signal.","why":"Applies to deployments that emit citations, which is now the common RAG configuration. A citation is a <i>trusted<\/i> output component (<code>AML.T0067.000<\/code>), so three detections depend on it and none is reachable from response text alone: fabricated citations matching no retrieval, attacker-planted links (<code>TA-02<\/code>, <code>TA-01<\/code>), and suppression visible by comparing retrieved against cited (<code>IR-03<\/code>).","role":"outcome","origin":"derived","record":"event","modality":"","gated":false,"emit":["Application Output Handling","Agent Output Handling"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No citation, and no resolution of a citation against retrieval","note":"","asks":[{"id":"ocsf_citations","s":"Add citations to message_context, each with its source and whether it resolves to an item an ai_retrieval record returned, aligned with AITF rag.citation.*.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.retrieval.documents"],"gap":"Output-side citations are not linked to retrieved items","note":"","asks":[{"id":"otel_citations","s":"Add citation attributes on output messages with a resolution flag against retrieval.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["rag.citation.*","rag.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-citations-source-attribution"},"F:guardrail_output_verdict":{"t":"F","g":"gF6.2","n":"Guardrail (Output) Verdict","code":"guardrail_output_verdict","tier":"MUST","tip":"Output filter result (pass, flag, block, modify).","records":"Output filter result (pass, flag, block, modify).","capture":"Output-side filter result (PII/DLP, harmful content, exfil pattern): <b>pass / flag / block / modify<\/b>. Modifications are recorded via the <b>Guardrail Modification Record<\/b>. Fired detections can carry the <b>ATLAS Technique Tag<\/b>.","why":"","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Application Output Handling","Agent Output Handling"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:2004"],"gap":"No guardrail-verdict object","note":"","asks":[{"id":"ocsf_ai_guardrail","s":"Add an ai_guardrail object (type, verdict, score, blocked flag, threat reference), with enforcement availability and failure-mode attributes.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.evaluation.score.value"],"gap":"The evaluation event is quality-oriented","note":"","asks":[{"id":"otel_security_guardrail","s":"Extend the evaluation event for security use (blocked or allowed, guardrail type, threat technique), or add gen_ai.guardrail.*.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["security.guardrail.*","security.pii.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["constraints"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-guardrail-output-verdict"},"F:llm_refusal":{"t":"F","g":"gF6.2","n":"LLM Refusal","code":"llm_refusal","tier":"MUST","tip":"Refusal status and reason.","records":"Refusal status and reason.","capture":"Status + reason when the model refuses. A refusal-then-success streak signals a jailbreak in progress; an <i>absent<\/i> refusal on clearly policy-violating output flags a guardrail gap.","why":"An early-warning tripwire. <code>IR-01<\/code> is iterated reframing until a refusal flips; <code>AOC-12<\/code>, <code>AOC-13<\/code> and <code>AOC-14<\/code> are the mirror image, successful refusals whose telemetry documents attempted attacks even when blocked.","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Agent Output Handling"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No refusal status or reason; the Content Filter stop reason proposed in","note":"","asks":[{"id":"ocsf_stop_reason","s":"Merge the ai_status object on the ai_operation profile; its stop_reason_id carries End of Turn, Token Limit, Tool Use, Session Stop and Content Filter.","st":"open"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.response.finish_reasons"],"gap":"A content-filter finish reason where the provider returns one; no refusal status or reason","note":"","asks":[{"id":"otel_refusal","s":"Add a refusal status and reason distinct from finish reasons, so a refusal that ends normally is still visible.","st":"proposed"}]},{"pub":"AITF","cov":"partial","con":["gen_ai.response.finish_reasons","security.*"],"gap":"AITF names a namespace but defines no attribute for this field at the pin","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-llm-refusal"},"F:content_modality_attachment_identity":{"t":"F","g":"gF6.2","n":"Content Modality & Attachment Identity","code":"content_modality_attachment_identity","tier":"MUST","tip":"Part type, MIME type, and for files name, size and hash, on every content-bearing field.","records":"Part type, MIME type, and for files name, size and hash, on every content-bearing field.","capture":"<b>Cross-cutting.<\/b> For every content-bearing field: the part type (text / file / structured data), MIME type, and for files the name, size, and content hash. Instructions that arrive as an image, PDF, or structured blob are invisible to text-only inspection and text-only logging.","why":"The corpus's obfuscation attacks are modality attacks: instructions in OCR'd images and base64 blobs (<code>AOC-12<\/code>), ~10 MB attachment floods (<code>AOC-05<\/code>). Text-only capture misses both.","role":"label","origin":"observed","record":"event","modality":"","gated":false,"emit":["every content-bearing field"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No attachment identity","note":"","asks":[{"id":"ocsf_message_context_content","s":"Extend message_context with prompt and response hashes, a redaction flag, the system prompt and its hash, and attachment identity. Each hash declares its canonicalization and may be a keyed digest with a key identifier; an absent hash means not digested, never unchanged.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"partial","con":[],"gap":"Message parts carry types; no attachment name, size or hash","note":"","asks":[{"id":"otel_attachment_identity","s":"Add attachment identity (name, size, hash) on message parts.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["gen_ai.content.*","gen_ai.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-content-modality-attachment-identity"},"F:attribute_source_trusted_provenance_marking":{"t":"F","g":"gF6.2","n":"Attribute Source / Trusted-Provenance Marking","code":"attribute_source_trusted_provenance_marking","tier":"MUST","tip":"The authority that supplied each security-relevant attribute, or that it is self-asserted, and each counterparty's knowability tier.","records":"The authority that supplied each security-relevant attribute, or that it is self-asserted, and each counterparty's knowability tier.","capture":"<b>Cross-cutting.<\/b> For every security-relevant attribute, the <b>authority that supplied it<\/b>: verified IdP token, policy decision point, enforcement-owned session store, platform/runtime, versus <b>self-asserted by the agent or model<\/b>. Security-relevant attributes are those a hostile agent could plausibly fabricate: identity, authorization outcome, taint state, approval status, autonomy level, task declaration, and instruction configuration. Under assume-breach, an unmarked value is an unverified value.","why":"The zero-trust principle applied to telemetry itself: it determines whether the rest of the field set can be believed. The document already applies the idea once (Verified vs Displayed Identity, §1.6) and the generalization is that identity is not the only attribute an agent can assert. Autonomy Level, Task / Intent Declaration, System Prompt / Instruction Config, and every reasoning field are agent-supplied, and the corpus shows that agents <i>do<\/i> report falsely (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#44-the-agent-might-be-lying\" target=\"_blank\" rel=\"noopener\">RFC §4.4<\/a>). Cost is an enum per attribute group, not per event.","role":"provenance","origin":"observed","record":"event","modality":"","gated":false,"emit":["every security-relevant attribute"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No attribute-provenance marking","note":"","asks":[{"id":"ocsf_attribute_source","s":"Add an attribute_source enum (idp, pdp, enforcement-state, platform, self-asserted) usable on identity, authorization and agent-state attributes.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["security.attribute_source.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"partial","con":["attestation_evidence"],"gap":"","note":"<code>attestation_evidence<\/code> (6.2, partial)","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-attribute-source-trusted-provenance-marking"},"F:instrumentation_coverage_hook_status":{"t":"F","g":"gF6.2","n":"Instrumentation Coverage / Hook Status","code":"instrumentation_coverage_hook_status","tier":"MUST","tip":"Which hooks are active, their version, where each reports, and the sampling configuration in force.","records":"Which hooks are active, their version, where each reports, and the sampling configuration in force.","capture":"Which lifecycle hooks are instrumented and active for this agent/run, the instrumentation version, and <b>where each hook reports<\/b>, the difference between \"no events\", \"not observed\", and \"observed by someone else.\"","why":"Grounded by <code>TA-17<\/code>, where the telemetry plane was redirected (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#42-the-telemetry-plane\" target=\"_blank\" rel=\"noopener\">§4.2<\/a>). Under sampling, an absent refusal, tool result or verdict cannot be read without the coverage and sampling record (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#52-sampling\" target=\"_blank\" rel=\"noopener\">RFC §5.2<\/a>). More generally it resolves the ambiguity undermining every absence-based detection in the document: no refusal, no termination condition, no matching request are each only interpretable if the relevant hook was instrumented. It is D-dominant, it is not modality-gated (every deployment has an instrumentation configuration), and recording <i>where each hook reports<\/i> is what separates a hijacked plane from a healthy one.","role":"descriptor","origin":"observed","record":"state","modality":"","gated":false,"emit":["instrumentation layer"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No hook-coverage representation","note":"","asks":[{"id":"ocsf_ai_asset","s":"Add an ai_asset object (version, software reference, ownership, status, instrumentation coverage).","st":"open"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No instrumentation-coverage representation","note":"","asks":[{"id":"otel_hook_coverage","s":"Record instrumentation hook coverage as a resource attribute.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["asset.instrumentation.*","asset.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-instrumentation-coverage-hook-status"},"F:enforcement_point_availability_failure_mode":{"t":"F","g":"gF6.2","n":"Enforcement-Point Availability & Failure Mode","code":"enforcement_point_availability_failure_mode","tier":"MUST","tip":"Whether each enforcement callout was reached, its latency, and fail-open or fail-closed.","records":"Whether each enforcement callout was reached, its latency, and fail-open or fail-closed.","capture":"For each enforcement callout (guardrail, policy engine, external guardian): whether it was reached, its latency, and on failure whether the system <b>failed open or failed closed<\/b>, plus the action that was taken anyway.","why":"A verdict that never arrived and a verdict of <code>allow<\/code> are indistinguishable in the log, so without it the guardrail verdicts and the <b>Authorization Decision Record<\/b> cannot be read, and the control plane is a single point of silent failure. Deployments choose fail-open or fail-closed for availability reasons; <b>the field records the choice and the outcome<\/b>, and neither posture is recommended.","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["enforcement points"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No enforcement availability or fail-open representation","note":"","asks":[{"id":"ocsf_ai_guardrail","s":"Add an ai_guardrail object (type, verdict, score, blocked flag, threat reference), with enforcement availability and failure-mode attributes.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["security.enforcement.*","security.guardrail.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-enforcement-point-availability-failure-mode"},"F:guardrail_modification_record":{"t":"F","g":"gF6.2","n":"Guardrail Modification Record","code":"guardrail_modification_record","tier":"MUST","tip":"That an enforcement point rewrote a payload, which one, with before and after digests.","records":"That an enforcement point rewrote a payload, which one, with before and after digests.","capture":"<b>Cross-cutting.<\/b> When an enforcement point <b>rewrites rather than blocks<\/b>: masking, redacting, stripping, or rewriting a payload; record that a modification occurred, which enforcement point made it, and a before/after digest (plus a redaction map where policy permits). Applies on both the input and the output side.","why":"Applies whenever an enforcement point or redaction pipeline rewrites rather than blocks. Without it, <b>Model Input<\/b>, <b>Response<\/b> and a guardrail verdict of <code>modify<\/code> record content that was not what the model or the recipient saw, so the record is <i>actively wrong<\/i>. Its value is R first and D second. <code>TA-01<\/code>, whose chain bypassed link redaction, is an instance, but the tier rests on the dependency.","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["any rewriting enforcement point"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No record that an enforcement point rewrote a payload","note":"","asks":[{"id":"ocsf_ai_guardrail","s":"Add an ai_guardrail object (type, verdict, score, blocked flag, threat reference), with enforcement availability and failure-mode attributes.","st":"proposed"},{"id":"ocsf_message_context_content","s":"Extend message_context with prompt and response hashes, a redaction flag, the system prompt and its hash, and attachment identity. Each hash declares its canonicalization and may be a keyed digest with a key identifier; an absent hash means not digested, never unchanged.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No record that an enforcement point rewrote a payload","note":"","asks":[{"id":"otel_security_guardrail","s":"Extend the evaluation event for security use (blocked or allowed, guardrail type, threat technique), or add gen_ai.guardrail.*.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["security.guardrail.modification.*","security.guardrail.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-guardrail-modification-record"},"F:encoded_obfuscated_payload_indicator":{"t":"F","g":"gF6.2","n":"Encoded / Obfuscated Payload Indicator","code":"encoded_obfuscated_payload_indicator","tier":"MUST","tip":"Flag and decoded form of base64, image-embedded, invisible-Unicode or markup-authority input.","records":"Flag and decoded form of base64, image-embedded, invisible-Unicode or markup-authority input.","capture":"Flag + decoded form when input contains base64, image-embedded (OCR), or markup \"authority\" tags. Includes invisible or control Unicode characters (tag characters, zero-width joiners, bidirectional overrides) that hide instructions from a human reader.","why":"The corpus's obfuscation attacks hide instructions where a reader of the recorded input would not see them: base64 and OCR'd images (<code>AOC-12<\/code>), invisible Unicode in a rules file (<code>TA-21<\/code>). Model Input is only required to carry a content hash (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#53-content-hashing\" target=\"_blank\" rel=\"noopener\">RFC §5.3<\/a>), so where raw content is not retained the flag and decoded form are the only record that the payload was there.","role":"label","origin":"derived","record":"event","modality":"","gated":false,"emit":["Agent Input Handling"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No obfuscation flag or decoded form","note":"","asks":[{"id":"ocsf_obfuscation","s":"Add an obfuscation finding (detected, encodings, decoded form or its hash) to ai_guardrail or Detection Finding, aligned with AITF security.obfuscation.*.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No obfuscation flag or decoded form","note":"","asks":[{"id":"otel_obfuscation","s":"Add obfuscation indicators on input (detected, encodings, decoded hash), aligned with AITF security.obfuscation.*.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["security.obfuscation.*","security.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-encoded-obfuscated-payload-indicator"},"F:observation_thought_reasoning_trace":{"t":"F","g":"gF6.2","n":"Observation / Thought (reasoning trace)","code":"observation_thought_reasoning_trace","tier":"SHOULD","tip":"Reasoning trace, where the provider exposes it. Self-asserted.","records":"Reasoning trace, where the provider exposes it. Self-asserted.","capture":"Chain-of-thought/observations <i>when the provider exposes it<\/i>. Reveals whether a harmful act was injected, misauthorized, or self-initiated.","why":"High-value forensics for separating a compromised agent from a misconfigured one (<code>AOC-01<\/code>, <code>AOC-07<\/code>), but frequently unavailable from provider APIs and privacy-sensitive.","role":"content","origin":"asserted","record":"event","modality":"","gated":true,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No reasoning trace","note":"No ask proposed.","asks":[]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.usage.reasoning.output_tokens"],"gap":"A count of reasoning tokens, not the trace","note":"No ask proposed.","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.agent.step.thought"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-observation-thought-reasoning-trace"},"F:threat_classification_atlas_technique_tag":{"t":"F","g":"gF6.2","n":"Threat Classification / ATLAS Technique Tag","code":"threat_classification_atlas_technique_tag","tier":"MAY","tip":"MITRE ATLAS technique IDs on any event where a detection fires.","records":"MITRE ATLAS technique IDs on any event where a detection fires.","capture":"<b>Cross-cutting enrichment.<\/b> On any flagged or security-relevant event, the classified technique(s) as <b>MITRE ATLAS <code>AML.Txxxx<\/code><\/b> IDs (plus a free-text threat type). Emitted by input/output guardrails and by tool/memory/retrieval detectors alike, so every alert carries a portable, ATT&amp;CK-aligned technique reference.","why":"Its value is D-portability into ATT&amp;CK-aligned tooling plus A-rollup, but no documented instance turns on its absence and no MUST field depends on it, so it fails both MUST tests. This document still recommends stamping every fired detection with it.","role":"label","origin":"derived","record":"event","modality":"","gated":false,"emit":["any detector"],"carriers":[{"pub":"OCSF","cov":"covered","con":["class:2004","attribute:attacks"],"gap":"","note":"No schema change: populate attacks[].technique.uid with AML.Txxxx, the tactic, and attacks[].version with the ATLAS matrix version.","asks":[]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No threat-technique reference","note":"","asks":[{"id":"otel_security_guardrail","s":"Extend the evaluation event for security use (blocked or allowed, guardrail type, threat technique), or add gen_ai.guardrail.*.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["security.threat_type","compliance.framework","compliance.control_id"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.2","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-threat-classification-atlas-technique-tag"},"F:execution_environment_sandbox":{"t":"F","g":"gF6.3","n":"Execution Environment / Sandbox","code":"execution_environment_sandbox","tier":"MUST","tip":"Isolation settings: sandbox mode, runtime, OS, timeout, egress policy.","records":"Isolation settings: sandbox mode, runtime, OS, timeout, egress policy.","capture":"The isolation posture of the execution: sandbox mode (none / container / VM / WASM), language runtime and version, OS/architecture, timeout, and network-egress policy.","why":"<code>TA-06<\/code> is characterized as model-emitted Python executed <b>unsandboxed<\/b>: the isolation posture <i>is<\/i> the finding. Two calls to the same code-execution tool, one containerized and one not, are otherwise the same event.","role":"descriptor","origin":"observed","record":"state","modality":"","gated":false,"emit":["Isolation Runtime Boundary","Tool Hosting"],"carriers":[{"pub":"OCSF","cov":"partial","con":["object:process","attribute:sandbox","object:container"],"gap":"A sandbox name on a process, and container identity; no isolation mode, timeout or egress policy for a tool execution","note":"","asks":[{"id":"ocsf_tool_execution_environment","s":"Add the execution environment of a tool call (isolation mode, runtime, timeout and egress policy) beside ai_capability, aligned with AITF supply_chain.runtime.*.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No sandbox or isolation attributes","note":"","asks":[{"id":"otel_execution_environment","s":"Add execution-environment attributes (sandbox, runtime, egress policy) for tool execution.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.runtime.*","supply_chain.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"partial","con":["attestation_evidence"],"gap":"","note":"Runtime/workload evidence in <code>attestation_evidence<\/code> (6.2); ODIS has no normalized sandbox field.","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-execution-environment-sandbox"},"F:tool_call_io":{"t":"F","g":"gF6.3","n":"Tool Call I/O","code":"tool_call_io","tier":"MUST","tip":"Full arguments and output of every tool or MCP call.","records":"Full arguments and output of every tool or MCP call.","capture":"Full input params <b>and<\/b> output for every tool/MCP call; what the agent actually <i>did<\/i> vs what it was asked. Reveals credentials passed between chained calls.","why":"Without it and <b>Tool Name<\/b> a compromised agent's actions are invisible, and every destructive case in the corpus is reconstructed from them.","role":"content","origin":"observed","record":"event","modality":"","gated":false,"emit":["Tool Server","External Tool Capabilities"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:6003"],"gap":"No tool object","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.tool.call.arguments","gen_ai.tool.call.result"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.tool.call.arguments","gen_ai.tool.call.result","mcp.tool.name"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["action"],"gap":"","note":"ODIS §6.4.","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-call-io"},"F:tool_name":{"t":"F","g":"gF6.3","n":"Tool Name","code":"tool_name","tier":"MUST","tip":"The capability invoked, as the agent saw it.","records":"The capability invoked, as the agent saw it.","capture":"Which capability was invoked. Detects off-manifest / sensitive-tool invocation, escalating tool sequences, and enumeration.","why":"","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Tool Server"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No tool object","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.tool.name"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["mcp.tool.name"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-name"},"F:tool_type_trust_boundary":{"t":"F","g":"gF6.3","n":"Tool Type / Trust Boundary","code":"tool_type_trust_boundary","tier":"MUST","tip":"MCP, internal, direct-storage or code-execution.","records":"MCP, internal, direct-storage or code-execution.","capture":"MCP (cross-network) vs internal vs direct-storage vs code-execution, different trust models &amp; policies.","why":"Earned via <code>AOC-14<\/code>, which tried to make the agent bypass the tool API and write to backend storage directly. \"API-mediated only\" is unenforceable unless telemetry distinguishes the two.","role":"label","origin":"declared","record":"state","modality":"","gated":false,"emit":["External Tool Capabilities"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No tool trust-boundary enum","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.tool.type"],"gap":"function, extension or datastore; no MCP, direct-storage or code-execution boundary","note":"","asks":[{"id":"otel_tool_trust_boundary","s":"Extend gen_ai.tool.type, or add a trust-boundary attribute, to distinguish MCP, internal, direct-storage and code-execution tools.","st":"proposed"}]},{"pub":"AITF","cov":"partial","con":["mcp.*"],"gap":"AITF names a namespace but defines no attribute for this field at the pin","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-type-trust-boundary"},"F:tool_execution_id":{"t":"F","g":"gF6.3","n":"Tool Execution ID","code":"tool_execution_id","tier":"MUST","tip":"Correlation ID pairing each tool request with its outcome.","records":"Correlation ID pairing each tool request with its outcome.","capture":"Correlation ID minted at invocation and echoed on the result, pairing every request with its outcome.","why":"Makes <i>a result with no matching request<\/i> a queryable condition, and is the only way to correlate asynchronous tool calls. <code>AOC-01<\/code>'s false completion report is precisely a request/result mismatch.","role":"identifier","origin":"observed","record":"event","modality":"","gated":false,"emit":["Tool Server"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No tool-call join key","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"covered","con":["gen_ai.tool.call.id"],"gap":"","note":"","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.tool.call.id"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-execution-id"},"F:tool_definition_digest":{"t":"F","g":"gF6.3","n":"Tool Definition Digest","code":"tool_definition_digest","tier":"MUST","tip":"Hash of the tool contract as presented at invocation, compared with the approved baseline.","records":"Hash of the tool contract as presented at invocation, compared with the approved baseline.","capture":"Hash of the tool's <b>declared contract as presented at invocation time<\/b>: name, description, argument schema, output schema, plus a comparison against the approved baseline. Detects a tool whose definition mutated after approval.","why":"<code>TA-15<\/code> and <code>TA-29<\/code> are the grounding instances. In <code>TA-15<\/code> the definition is malicious as published, the injection carried in the tool's own description, which is why the digest is taken <b>at invocation<\/b> rather than at registration and must cover the description, not only the argument and output schemas. In <code>TA-29<\/code> the description changed after approval under an unchanged name, which the comparison against the approved baseline detects. The adjacent rug pulls fall outside the digest: <code>TA-14<\/code> mutates an approved configuration's launch command and <code>TA-16<\/code> ships a malicious implementation under an adopted name; in both of those the <i>declared contract<\/i> is itself unchanged, so the detecting fields there are Capability-Set Change Event and MCP Server Identity &amp; Primitive respectively. The modality gate does not hold it: the gate is third-party or dynamically-discovered tools, and an MCP <code>tools/list<\/code> exchange is dynamic discovery by construction.","role":"provenance","origin":"derived","record":"event","modality":"","gated":false,"emit":["Tool Server","Tool Registry and Discovery"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No tool-definition digest","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.tool.definitions"],"gap":"The definitions, not a stable digest of them","note":"","asks":[{"id":"otel_tool_digest_mcp_primitive","s":"Add gen_ai.tool.definitions.hash and an mcp.primitive value set (tool, resource, prompt, sampling, elicitation, roots).","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["mcp.tool.definition.*","mcp.tool.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["approved_software_refs"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-definition-digest"},"F:mcp_server_identity_primitive":{"t":"F","g":"gF6.3","n":"MCP Server Identity & Primitive","code":"mcp_server_identity_primitive","tier":"MUST","tip":"MCP server name, version, transport and endpoint, and the primitive exercised.","records":"MCP server name, version, transport and endpoint, and the primitive exercised.","capture":"For MCP calls: server name, version, transport, and endpoint; <b>and which MCP primitive was exercised<\/b>: <code>tool<\/code>, <code>resource<\/code>, <code>prompt<\/code>, <code>sampling<\/code>, <code>elicitation<\/code>, or <code>roots<\/code>.","why":"The corpus's MCP incidents (<code>TA-11<\/code> to <code>TA-16<\/code>, <code>TA-29<\/code>) clear the evidence gate several times over; <code>TA-16<\/code> is the sharpest, because the server's declared contract never changed and only its published <b>version<\/b> did, so name alone would not have distinguished the safe release from the malicious one. What held the field at SHOULD was the modality gate, and that gate turns on MCP being at the <b>edge of current agentic practice<\/b> (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#47-tiers\" target=\"_blank\" rel=\"noopener\">RFC §4.7<\/a>). It is not. The corpus's MCP-mediated entries all date from 2025 onward, and their share understates the point, because the remaining agentic entries are incidents of other kinds rather than counter-examples to MCP's prevalence; CoSAI's Workstream 4 devoted a paper to MCP security <span class=\"ref\" title=\"CoSAI MCP Security: Coalition for Secure AI, Workstream 4 (Secure Design Patterns for Agentic Systems): Model Context Protocol (MCP) Security, approved 8 January 2026. Twelve threat categories (MCP-T1…T12), ~40 threats. https://www.coalitionforsecureai.org/wp-content/uploads/2026/03/model-context-protocol-security-1.pdf\">[24]<\/span>; OWASP publishes an MCP Top 10 <span class=\"ref\" title=\"OWASP MCP Top 10: OWASP, beta release (MCP01:2025 to MCP10:2025). https://owasp.org/www-project-mcp-top-10/\">[76]<\/span>; and MITRE ATLAS has added <code>AML.T0109<\/code> AI Supply Chain Rug Pull and <code>AML.T0110<\/code> AI Agent Tool Poisoning, the latter with three sub-techniques (<code>.000<\/code> Definition and Instructions, <code>.001<\/code> Implementation, <code>.002<\/code> Runtime Response). A protocol acquires a dedicated top-ten list and a dedicated technique family once it is typical. <b>Server name and version are as cheap as Tool Name and should be adopted first.<\/b>","role":"identifier","origin":"asserted","record":"event","modality":"","gated":false,"emit":["Tool Server"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No MCP object or primitive axis","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"partial","con":["mcp.method.name","mcp.protocol.version","mcp.session.id"],"gap":"No primitive discriminator; mcp.method.name partly serves","note":"","asks":[{"id":"otel_tool_digest_mcp_primitive","s":"Add gen_ai.tool.definitions.hash and an mcp.primitive value set (tool, resource, prompt, sampling, elicitation, roots).","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["mcp.primitive","mcp.server.name","mcp.server.version"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-mcp-server-identity-primitive"},"F:authorization_decision_record":{"t":"F","g":"gF6.3","n":"Authorization Decision Record","code":"authorization_decision_record","tier":"MUST","tip":"Per mediated operation: decision, reason code, deciding authority and rule.","records":"Per mediated operation: decision, reason code, deciding authority and rule.","capture":"Per mediated operation: the terminal decision (<b>allow / deny<\/b>, with <b>allow-after-modification<\/b> flagged), the deny <b>reason and machine-readable code<\/b> (a fail-closed enforcement failure arrives as a deny with its own code), the per-step actions that produced it including any <b>suppressed deny<\/b> (a plugin denied and was overridden by pipeline role) and any <b>abort<\/b>, the <b>deciding authority<\/b> (inline policy rule vs external PDP, and which; Cedar / CEL / OPA <span class=\"ref\" title=\"Cedar: authorization policy language. https://www.cedarpolicy.com/ · Open Policy Agent (Rego). https://www.openpolicyagent.org/\">[49]<\/span> / custom), the <b>rule or policy identifier<\/b> that produced it, and any obligations attached. Distinct from a content-guardrail verdict: this is the <i>authorization<\/i> outcome, not a classifier score.","why":"It records what the authorization layer <b>decided<\/b>, on which rule, and why. The guardrail verdicts record what a <i>content classifier<\/i> concluded and Tool ACL / Required Scope what authority a tool <i>requires<\/i>; without this field a denied operation and a never-attempted one are indistinguishable. Among the attacks that turn on that record are <code>AOC-02<\/code> (non-owner compliance), <code>AOC-08<\/code> (privileged action after spoof), <code>AOC-10<\/code> (injected authority), and <code>TA-08<\/code> (individually-authorized calls escalating in aggregate; visible only if each link's decision and rule are recorded). Universal rather than modality-gated; D and R jointly.","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Authorization Policy Decision Point","Authorization Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:3003"],"gap":"No authorization-decision object for AI operations","note":"","asks":[{"id":"ocsf_ai_authorization","s":"Add an ai_authorization object (decision, reason, code, deciding authority, rule, obligations, budget accounting and the principal or subtree join key).","st":"open"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[{"id":"otel_authorization_reference","s":"Let a span reference an authorization decision by the decision record's stable identifier (OCSF <code>metadata.uid<\/code>), so OpenTelemetry and OCSF records join at query time.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["security.authorization.*","security.*","compliance.control_id"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"n/a (see note)","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-authorization-decision-record"},"F:tool_selection_rationale":{"t":"F","g":"gF6.3","n":"Tool Selection Rationale","code":"tool_selection_rationale","tier":"SHOULD","tip":"The agent's stated reason for a tool call. Self-asserted.","records":"The agent's stated reason for a tool call. Self-asserted.","capture":"The agent's stated reason for choosing <i>this<\/i> tool with <i>these<\/i> arguments, captured at the request step. Distinct from the §1.2 output-side reasoning trace: it is attached to the action, not the answer.","why":"","role":"content","origin":"asserted","record":"event","modality":"","gated":true,"emit":["Agent Reasoning Core"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No self-asserted rationale","note":"No ask proposed.","asks":[]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No self-asserted rationale","note":"No ask proposed.","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.agent.step.thought"],"gap":"","note":"<code>gen_ai.agent.step.thought<\/code> (per-step)","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-selection-rationale"},"F:human_approval_elicitation_event":{"t":"F","g":"gF6.3","n":"Human Approval / Elicitation Event","code":"human_approval_elicitation_event","tier":"SHOULD","tip":"Approval lifecycle: status, identity-provider-verified approver, and whether it covers the executed arguments.","records":"Approval lifecycle: status, identity-provider-verified approver, and whether it covers the executed arguments.","capture":"Out-of-band approval lifecycle for high-impact actions: correlation ID, status (pending / resolved / expired), outcome, <b>approver identity as verified by the identity provider<\/b> (not as reported by the agent), channel, and the <b>scope-binding validation result<\/b>: whether the approval still covers the arguments actually presented at execution time.","why":"Covers the control the corpus most often shows <i>missing<\/i>: <code>AOC-01<\/code> and <code>AOC-07<\/code> are irreversible actions taken without human authorization. <code>TA-23<\/code> is the sharper case, because the gate was present and was <b>switched off as configuration<\/b> rather than argued past: the record that matters is not only the approval but the change to whether approval was required at all, which is why <b>Capability-Set Change Event<\/b> (§1.6, MUST) and this field are read together. <b>MUST wherever the deployment gates actions on human approval.<\/b> Two sub-signals matter: approver identity must come from the identity provider, not the agent's claim; and approval scope must be re-validated against the arguments actually presented, or one sign-off can be replayed against a larger action.","role":"outcome","origin":"observed","record":"event","modality":"out-of-band human approval","gated":false,"emit":["Agent Consent Elicitation Surface","Application Consent Surface"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No human-approval lifecycle","note":"","asks":[{"id":"ocsf_ai_approval","s":"Add an ai_approval object (correlation ID, status, identity-provider-verified approver, channel, scope-binding result).","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["identity.approval.*","identity.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"partial","con":["originating_principal"],"gap":"","note":"<code>originating_principal<\/code> (6.3, partial)","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-human-approval-elicitation-event"},"F:tool_acl_required_scope":{"t":"F","g":"gF6.3","n":"Tool ACL / Required Scope","code":"tool_acl_required_scope","tier":"SHOULD","tip":"Authority a tool requires and who can invoke it.","records":"Authority a tool requires and who can invoke it.","capture":"The authority a tool requires and who may invoke it (the tool's security policy); individually-authorized calls that violate separation-of-duties as a chain.","why":"Every attack that cites it presupposes meaningful delegation.","role":"descriptor","origin":"declared","record":"state","modality":"delegated authority","gated":false,"emit":["Authorization Policy Enforcement Point"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No tool scope attribute","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Prompt Template: extend it to the client-side MCP primitives (sampling, elicitation, roots), and add a trust-boundary value set and a required-scope attribute.","st":"open"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["identity.auth.scope_granted"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["granted_authorizations"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-acl-required-scope"},"F:session_taint_labels_information_flow_decisions":{"t":"F","g":"gF6.3","n":"Session Taint Labels & Information-Flow Decisions","code":"session_taint_labels_information_flow_decisions","tier":"SHOULD","tip":"Information-flow labels in force, and denials caused by accumulated taint.","records":"Information-flow labels in force, and denials caused by accumulated taint.","capture":"Information-flow labels in force for the session or message: which labels are set, <b>scope<\/b> (session vs message), what operation applied each, and (critically) when an operation is <b>denied because of accumulated taint rather than anything in its own payload<\/b>. The write-down record.","why":"A genuinely different mechanism from Input Trust Classification (§1.2): that classifies a segment of one payload, while taint is <b>state accumulating across a session<\/b> that survives into operations whose own content is clean. That distinction is the whole attack in <code>TA-01<\/code> and <code>TA-02<\/code>, where the exfiltrating request is innocuous in isolation. Of everything in SHOULD this has the highest D value per unit of effort.","role":"label","origin":"observed","record":"state","modality":"information-flow control","gated":false,"emit":["enforcement points"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No information-flow or taint labels","note":"","asks":[{"id":"ocsf_ai_taint","s":"Add an ai_taint object: the label set at entry and the final label set, so the labels an operation added are their difference; scope; origin; and taint-caused denial.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["security.taint.*","security.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["constraints"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-session-taint-labels-information-flow-decisions"},"F:backend_route_restriction_decision":{"t":"F","g":"gF6.3","n":"Backend / Route Restriction Decision","code":"backend_route_restriction_decision","tier":"SHOULD","tip":"Candidate backends, the constraint applied, the choice made.","records":"Candidate backends, the constraint applied, the choice made.","capture":"Where an operation was allowed to execute: the candidate backend/model set, the constraint that narrowed it (region, model, site, cost tier, custom label), the selection made, and the behavior when <b>no candidate qualified<\/b>.","why":"Paired with taint it is a D signal; standing alone it is closer to A (data-residency evidence) and Q.","role":"outcome","origin":"observed","record":"event","modality":"policy-driven backend selection","gated":false,"emit":["enforcement points"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No routing constraint or candidate backends","note":"","asks":[{"id":"ocsf_backend_route","s":"Add the routing constraint in force, the candidate backends and the backend chosen to ai_operation.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["gen_ai.route.*","gen_ai.provider.name"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["resource_indicators","constraints"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-backend-route-restriction-decision"},"F:mediation_coverage_bypass_path":{"t":"F","g":"gF6.3","n":"Mediation Coverage & Bypass Path","code":"mediation_coverage_bypass_path","tier":"SHOULD","tip":"Whether an operation passed a reference monitor, where, and whether a bypass exists.","records":"Whether an operation passed a reference monitor, where, and whether a bypass exists.","capture":"Whether this operation traversed a reference monitor at all, at which <b>placement<\/b> (inbound gateway / egress sidecar / in-process framework), and whether <b>unmediated paths to the same capability exist<\/b>.","why":"The enforcement counterpart to Instrumentation Coverage (§1.2). That field asks <i>is the telemetry complete?<\/i>; this one asks <i>is the enforcement unbypassable?<\/i> <code>AOC-14<\/code> is precisely this attack. A control that can be routed around is not a control.","role":"label","origin":"observed","record":"event","modality":"reference monitor in the request path","gated":false,"emit":["enforcement points"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No mediation-coverage representation","note":"","asks":[{"id":"ocsf_mediation_coverage","s":"Record whether a reference monitor mediated an operation and, where none did, the path that bypassed it.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An authorization-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["security.mediation.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.3","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-mediation-coverage-bypass-path"},"F:tool_error_exception":{"t":"F","g":"gF6.3","n":"Tool Error / Exception","code":"tool_error_exception","tier":"MAY","tip":"Failed or blocked tool calls, including the probing that precedes exploitation.","records":"Failed or blocked tool calls, including the probing that precedes exploitation.","capture":"Failed/blocked tool calls: rejected injection args, SSRF blocks, authz boundary hits, and the probing errors that precede successful exploitation.","why":"No documented instance records a failed or blocked tool call: <code>TA-06<\/code> reports exceptions only where exploitation failed, and the privileged calls in <code>TA-13<\/code> succeeded. The probing that precedes exploitation is the case the field serves, and the corpus has none. No MUST field depends on it, because <b>Execution Status<\/b> records each operation's outcome.","role":"outcome","origin":"observed","record":"event","modality":"","gated":false,"emit":["Tool Server","Tool Input Handling"],"carriers":[{"pub":"OCSF","cov":"partial","con":["attribute:status_id","attribute:status_detail"],"gap":"An outcome on API Activity, not tied to a tool call","note":"","asks":[{"id":"ocsf_ai_tool","s":"Land the ai_capability object: name, kind (type_id), serving system and transport, the transaction_uid join key, and fingerprints of the description and schemas with an approved baseline. At the pull request's head (<code>b6e44ac<\/code>, 2026-09-29) type_id has Tool, Resource and Pr rdered agent hops, each integrity-bound to its parent.","capture":"Ordered lineage of prior agent hops carried across the call. Each hop carries an <b>integrity-protected reference to its parent<\/b> (issuer, delegation identifier, and a digest of the parent record), so lineage is verifiable from the records rather than asserted; a digest that does not match the resolved parent fails chain validation closed.","why":"","role":"provenance","origin":"declared","record":"event","modality":"delegated authority","gated":false,"emit":["Authorization Federation Proxy"],"carriers":[{"pub":"OCSF","cov":"partial","con":["object:delegation","attribute:parent_uid"],"gap":"parent_uid is optional, so one record without it breaks the walk; no root or subtree identifier","note":"","asks":[{"id":"ocsf_delegation_lineage","s":"Extend delegation with scope, constraints and lifecycle state; require parent_uid where a parent exists; add a root or subtree identifier.","st":"open"},{"id":"ocsf_ai_delegation_activity","s":"Ratify an AI Delegation Activity class (9002) for the delegation lifecycle.","st":"open"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An identity-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":[],"gap":"","note":"delegation activity (OCSF 9002)","asks":[]},{"pub":"ODIS","cov":"covered","con":["delegation_chain","delegation_id","parent_delegation_ref"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-delegation-chain"},"F:granted_authorizations_scope":{"t":"F","g":"gF6.6","n":"Granted Authorizations / Scope","code":"granted_authorizations_scope","tier":"SHOULD","tip":"Authority in effect at this hop, with the narrowing check and its rules.","records":"Authority in effect at this hop, with the narrowing check and its rules.","capture":"Delegated a [],"gap":"No constraints on delegation","note":"","asks":[{"id":"ocsf_delegation_lineage","s":"Extend delegation with scope, constraints and lifecycle state; require parent_uid where a parent exists; add a root or subtree identifier.","st":"open"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An identity-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["identity.*","compliance.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["resource_indicators","constraints"],"gap":"","note":"ODIS §6.3.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-resource-indicators-constraints"},"F:token_exchange_scope_narrowing_check":{"t":"F","g":"gF6.6","n":"Token Exchange & Scope-Narrowing Check","code":"token_exchange_scope_narrowing_check","tier":"SHOULD","tip":"Each token exchange: grant type, whose identity, and whether scope narrowed.","records":"Each token exchange: grant type, whose identity, and whether scope narrowed.","capture":"The token-exchange event at each hop: grant type (token exchange / client assertion / client credentials), whose identity the issued token represents (<b>end user / client application / calling workload / the enforcement point itself<\/b>), target <b>audience<\/b>, issuer, lifetime, and the <b>requested-vs-granted scope delta<\/b> verified after issuance. Detects both over-broad tokens and forwarded inbound tokens that were never narrowed.","why":"Adds the <i>event<\/i> the surrounding fields only describe the state of. Forwarding a caller's inbound token is usually wrong (it is scoped for the agent, not the backend) so the <b>requested-vs-granted delta<\/b> is what makes a silently over-broad grant visible (<code>TA-08<\/code>).","role":"outcome","origin":"observed","record":"event","modality":"token exchange","gated":false,"emit":["A
