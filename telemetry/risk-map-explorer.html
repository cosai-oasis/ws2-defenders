d model-external content; Agent Observability contributes an after-the-fact audit trail that can surface the slander. In the self-promotion direction, a hostile or Sybil-amplified agent inflates its own standing so that peers extend it delegated tasks or credential-bearing capability it has not earned. No control in this corpus addresses that direction; the nearest candidate, Third-Party Capability Admission Control, gates the admission of tools a provider exposes, not the admission of a peer agent by its claimed reputation. That asymmetry is recorded here rather than papered over.<\/p>","atlas":[],"life":["development","deployment","runtime"],"impact":["integrity","accountability","availability"],"dropped":false},"C:controlModelPrivacyEnhancingTechnologies":{"t":"C","g":"gCcontrolsData","n":"Privacy Enhancing Technologies for Model Training","code":"controlModelPrivacyEnhancingTechnologies","tip":"Use technologies that minimize, de-identify, or restrict use of PII data in training or evaluating models, including differential privacy, secure aggregation protocols, federated learning, data anonymization, and synthetic data generation.","desc":"<p>Use technologies that minimize, de-identify, or restrict use of PII data in training or evaluating models, including differential privacy, secure aggregation protocols, federated learning, data anonymization, and synthetic data generation.<\/p>","comp":["Training and Tuning","Model Evaluation"],"u":false,"dropped":false},"C:controlRuntimePrivacyEnhancingTechnologies":{"t":"C","g":"gCcontrolsData","n":"Privacy Enhancing Technologies for Inference","code":"controlRuntimePrivacyEnhancingTechnologies","tip":"Use technologies that minimize, de-identify, or restrict use of PII data during model deployment and inference, including secure multi-party computation, homomorphic encryption, inference log de-identification, on-device processing, and privacy-preserving query mechanisms.","desc":"<p>Use technologies that minimize, de-identify, or restrict use of PII data during model deployment and inference, including secure multi-party computation, homomorphic encryption, inference log de-identification, on-device processing, and privacy-preserving query mechanisms.<\/p>","comp":["Application Output Handling","Model Serving Infrastructure & Policy Enforcement Point"],"u":false,"dropped":false},"C:controlTrainingDataManagement":{"t":"C","g":"gCcontrolsData","n":"Training Data Management","code":"controlTrainingDataManagement","tip":"Ensure that all data used to train and evaluate models is authorized for the intended purposes.","desc":"<p>Ensure that all data used to train and evaluate models is authorized for the intended purposes.<\/p>","comp":["Data Sources","Training Data","Training and Tuning","Model Evaluation"],"u":false,"dropped":false},"C:controlTrainingDataSanitization":{"t":"C","g":"gCcontrolsData","n":"Training Data Sanitization","code":"controlTrainingDataSanitization","tip":"Detect and remove or remediate poisoned or sensitive data in training and evaluation.","desc":"<p>Detect and remove or remediate poisoned or sensitive data in training and evaluation.<\/p>","comp":["Data Filtering and Processing"],"u":false,"dropped":false},"C:controlUserDataManagement":{"t":"C","g":"gCcontrolsData","n":"User Data Management","code":"controlUserDataManagement","tip":"Store, process, and use all user data (e.g. prompts and logs) from AI applications in compliance with user consent.","desc":"<p>Store, process, and use all user data (e.g. prompts and logs) from AI applications in compliance with user consent.<\/p>","comp":["Data Storage Infrastructure"],"u":false,"dropped":false},"C:controlRetrievalAndVectorSystemIntegrity":{"t":"C","g":"gCcontrolsData","n":"Retrieval and Vector System Integrity Management","code":"controlRetrievalAndVectorSystemIntegrity","tip":"Implement provenance tracking, cryptographic signing, deduplication, embedding anomaly detection, and index integrity checks to protect retrieval systems and vector databases from poisoning attacks.","desc":"<p>Implement provenance tracking, cryptographic signing, deduplication, embedding anomaly detection, and index integrity checks to protect retrieval systems and vector databases from poisoning attacks.<\/p>","comp":["Data Sources","Data Storage Infrastructure","Data Filtering and Processing","Model Memory","Retrieval Augmented Generation & Content"],"u":false,"dropped":false},"C:controlModelAndDataInventoryManagement":{"t":"C","g":"gCcontrolsInfrastructure","n":"Model and Data Inventory Management","code":"controlModelAndDataInventoryManagement","tip":"Ensure that all data, code, models, and transformation tools used in AI applications are inventoried and tracked.","desc":"<p>Ensure that all data, code, models, and transformation tools used in AI applications are inventoried and tracked.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Model Evaluation","Training and Tuning","Model Storage","Model Registry and Marketplace"],"u":false,"dropped":false},"C:controlModelAndDataAccessControls":{"t":"C","g":"gCcontrolsInfrastructure","n":"Model and Data Access Controls","code":"controlModelAndDataAccessControls","tip":"Minimize internal access to models, weights, datasets, etc. in storage and in production use.","desc":"<p>Minimize internal access to models, weights, datasets, etc. in storage and in production use.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Model Evaluation","Training and Tuning","Model Storage"],"u":false,"dropped":false},"C:controlModelAndDataIntegrityManagement":{"t":"C","g":"gCcontrolsInfrastructure","n":"Model and Data Integrity Management","code":"controlModelAndDataIntegrityManagement","tip":"Ensure that all data, models, and code used to produce AI models are verifiably integrity-protected during development and deployment.\n Implement repository trust policies, cryptographic signatures, attestation frameworks, and offline verification capabilities to ensure integrity and authenticity of","desc":"<p>Ensure that all data, models, and code used to produce AI models are verifiably integrity-protected during development and deployment.<\/p><p>Implement repository trust policies, cryptographic signatures, attestation frameworks, and offline verification capabilities to ensure integrity and authenticity of models and artifacts.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Model Evaluation","Training and Tuning","Model Storage","Model Registry and Marketplace"],"u":false,"dropped":false},"C:controlModelAndDataExecutionIntegrity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Model and Data Execution Integrity","code":"controlModelAndDataExecutionIntegrity","tip":"Ensure that the code and model results from training and development are of known provenance and lineage and not modified from known-good sources in unexpected ways at inference time.\n Examples include:","desc":"<p>Ensure that the code and model results from training and development are of known provenance and lineage and not modified from known-good sources in unexpected ways at inference time.<\/p><p>Examples include:<\/p><ul><li>Validating expected code and model signatures / hashes at inference-time.<\/li><li>Limiting and immutably recording all modifications to runtime AI system components via oversight processes.<\/li><li>Other integrity controls appropriate to the deployment context.<\/li><\/ul>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Model Storage","The Model"],"u":false,"dropped":false},"C:controlSecureByDefaultMLTooling":{"t":"C","g":"gCcontrolsInfrastructure","n":"Secure-by-Default ML Tooling","code":"controlSecureByDefaultMLTooling","tip":"Use secure-by-default frameworks, libraries, software systems, and hardware components for AI development or deployment to protect confidentiality and integrity of AI assets and outputs.","desc":"<p>Use secure-by-default frameworks, libraries, software systems, and hardware components for AI development or deployment to protect confidentiality and integrity of AI assets and outputs.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Training and Tuning","Model Evaluation","Model Storage"],"u":false,"dropped":false},"C:controlIsolatedConfidentialComputing":{"t":"C","g":"gCcontrolsInfrastructure","n":"Isolated and Confidential Computing","code":"controlIsolatedConfidentialComputing","tip":"Use technologies that minimize the risk of 3rd-party access to critical resources via hardware isolation invariants and/or physically isolated computing systems.\n Examples include including CPU and TPU-based confidential computing technologies (TEEs, secure enclaves), system isolation, secure schedu","desc":"<p>Use technologies that minimize the risk of 3rd-party access to critical resources via hardware isolation invariants and/or physically isolated computing systems.<\/p><p>Examples include including CPU and TPU-based confidential computing technologies (TEEs, secure enclaves), system isolation, secure scheduling, and side-channel monitoring to prevent cross-tenant information leakage.<\/p><p>Pair enclave/TEE isolation with remote attestation so that the isolated environment can be cryptographically verified before it is trusted. Attestation extends the protection beyond passive isolation to defend against compromised host hardware, malicious infrastructure administrators, and co-tenancy threats by proving that the workload is running in a genuine, unmodified isolated environment.<\/p><p>Account for the resulting trust boundary: when a workload runs in an enclave, the host system, host OS, firmware, and hypervisor lie outside that boundary, so privileged host-based software attacks do not reach the protected workload. Certain physical hardware attacks remain outside the enclave's mitigation and should be addressed by complementary controls.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Training and Tuning","Model Memory","Agent Reasoning Core","Isolation Runtime Boundary"],"u":false,"dropped":false},"C:controlOrchestratorAndRouteIntegrity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Orchestrator and Route Integrity","code":"controlOrchestratorAndRouteIntegrity","tip":"Implement signed route manifests, configuration integrity verification, and response provenance tracking to prevent routing manipulation and ensure request routing to authorized models.","desc":"<p>Implement signed route manifests, configuration integrity verification, and response provenance tracking to prevent routing manipulation and ensure request routing to authorized models.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Application"],"u":false,"dropped":false},"C:controlInterComponentTransportSecurity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Inter-Component Transport Security","code":"controlInterComponentTransportSecurity","tip":"Enforce authenticated, encrypted, and integrity-protected communication channels for all inter-component connections in AI systems, including agent-to-tool, model serving, orchestration, and application API channels.\n Implement the following transport-layer controls across all component communicatio","desc":"<p>Enforce authenticated, encrypted, and integrity-protected communication channels for all inter-component connections in AI systems, including agent-to-tool, model serving, orchestration, and application API channels.<\/p><p>Implement the following transport-layer controls across all component communication paths:<\/p><ul><li>TLS/mTLS enforcement: Require TLS 1.2 minimum (TLS 1.3 preferred) for all inter-component connections. Require mutual TLS (mTLS) for machine-to-machine paths — agent-to-tool server, orchestrator-to-model serving endpoint, and application-to-serving API — so that both parties authenticate before any payload is exchanged. Locally-exposed tool server endpoints (e.g., MCP servers on localhost) are in scope and must not be treated as implicitly trusted.<\/li><li>Mutual authentication: Each component must present a valid certificate or credential verified against an expected identity before the connection is accepted. This applies to machine-to-machine paths, not user-facing authentication (covered by application access controls).<\/li><li>Session token binding: Bind session tokens and API credentials to transport-layer identifiers (e.g., TLS channel binding per RFC 5929) so that a token captured from one TLS session cannot be replayed on a different channel.<\/li><li>Replay protection: Apply nonce, timestamp, or sequence number mechanisms to tool invocation requests and inter-component messages carrying side-effecting instructions, preventing captured messages from being reinjected.<\/li><li>Origin validation: Validate the origin of requests to locally-exposed endpoints against an allowlist of expected callers, preventing DNS rebinding attacks.<\/li><li>Certificate lifecycle management: Issue individual certificates per component identity rather than shared wildcards. Automate certificate rotation before expiry. Revoke certificates immediately on component decommission or credential compromise.<\/li><\/ul><p>This control addresses the transport layer — how component messages are protected in transit. It is distinct from Orchestrator and Route Integrity (which governs where traffic is routed), Secure-by-Default ML Tooling (which governs tooling selection and configuration), and Isolated and Confidential Computing (which governs hardware-level compute isolation). Those controls assume secure channels; this control establishes them.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling","Application","Agent Network Policy Enforcement Point"],"u":false,"dropped":false},"C:controlComponentIdentityProvenance":{"t":"C","g":"gCcontrolsInfrastructure","n":"Component Identity Provenance","code":"controlComponentIdentityProvenance","tip":"Ensure that when one component invokes another, the calling component can verify the callee is the currently registered, non-revoked principal for that role — not merely the holder of a key for a domain or network address. This control closes the gap that transport security leaves open: TLS and mTLS","desc":"<p>Ensure that when one component invokes another, the calling component can verify the callee is the currently registered, non-revoked principal for that role — not merely the holder of a key for a domain or network address. This control closes the gap that transport security leaves open: TLS and mTLS prove key possession for an endpoint, but do not attest that the endpoint is the legitimate principal a registry system of record says it should be.<\/p><p>Implementation requires: a binding between a component's runtime identity and an authoritative registry entry, such that revocation in the registry is observable to callers within a bounded time window; verification of that binding at invocation time, not solely at channel establishment; and audit telemetry that records the provenance assertion used so post-hoc detection of calls against revoked or expired principals is possible.<\/p><p>This control is mechanism-agnostic. Implementers may use SPIFFE/SVIDs, capability tokens, signed registration receipts, mTLS with a private CA whose issuance is gated on registry state, short-lived JWTs from a registration authority, hardware-attested identities, or other approaches that satisfy the intent. The control specifies the question that must be answered at invocation time — \"is this the registered principal?\" — not the cryptographic protocol used to answer it.<\/p><p>This control is distinct from Inter-Component Transport Security, which secures the channel, and from Agent Inventory Management, which maintains the registry of authorized principals. Inventory is the lifecycle authority; provenance is the runtime attestation that surfaces inventory state to callers; transport is the channel over which both ride.<\/p>","comp":["Orchestration Input Handling","Orchestration Output Handling","External Tool Capabilities","Model Serving Infrastructure & Policy Enforcement Point","Application"],"u":false,"dropped":false},"C:controlModelRegistryIntegrity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Model Registry and Discovery Integrity","code":"controlModelRegistryIntegrity","tip":"Ensure that model registries, marketplace listings, and registry-published metadata (model cards, provenance records, evaluation claims, licensing assertions, version histories) are integrity-protected throughout their lifecycle — from initial onboarding through runtime consumer-pull. Implement cryp","desc":"<p>Ensure that model registries, marketplace listings, and registry-published metadata (model cards, provenance records, evaluation claims, licensing assertions, version histories) are integrity-protected throughout their lifecycle — from initial onboarding through runtime consumer-pull. Implement cryptographic signing of model manifests and metadata, publisher identity verification, namespace governance to prevent typosquatting and takeover of well-known model namespaces, and consumer-side verification at pull time. Apply registry-side integrity gates regardless of whether the registry is public, private, sector-specific, or vendor-managed.<\/p>","comp":["Model Registry and Marketplace"],"u":false,"dropped":false},"C:controlToolRegistryAndDiscoveryIntegrity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Tool Registry and Discovery Integrity","code":"controlToolRegistryAndDiscoveryIntegrity","tip":"Ensure that tool registries, MCP server manifests, discovery endpoints, and tool metadata are integrity-protected throughout their lifecycle — from initial onboarding through runtime operation. Implement cryptographic signing of tool manifests and metadata, publisher identity verification, namespace","desc":"<p>Ensure that tool registries, MCP server manifests, discovery endpoints, and tool metadata are integrity-protected throughout their lifecycle — from initial onboarding through runtime operation. Implement cryptographic signing of tool manifests and metadata, publisher identity verification, namespace governance to prevent typosquatting and tool shadowing, integrity baselines for registered tool definitions, runtime monitoring for unauthorized changes to tool descriptions or schemas, and re-approval workflows when tool metadata is modified after initial vetting.<\/p><p>This control addresses a gap in the existing control set: integrity controls already cover model and data integrity (Model and Data Integrity Management), routing infrastructure integrity (Orchestrator and Route Integrity), and agent action observability (Agent Observability), but none explicitly address the integrity of tool discovery and registration infrastructure as its own surface. Tool Registry Tampering and Tool Source Provenance describe threat models that depend on tool-metadata integrity; the mitigations they call for (provenance verification, known-good baselines, tamper detection) are not the primary focus of any current control.<\/p>","comp":["Tool Registry and Discovery"],"u":false,"dropped":false},"C:controlComponentIdentityAuthentication":{"t":"C","g":"gCcontrolsInfrastructure","n":"Component Identity Authentication","code":"controlComponentIdentityAuthentication","tip":"Establish a distinct, authenticatable identity for each agent and each remote tool-serving endpoint, so that a principal acting in or on behalf of an AI system is authenticated before it is trusted and cannot be impersonated. The objective is a first-class identity primitive for non-human principals","desc":"<p>Establish a distinct, authenticatable identity for each agent and each remote tool-serving endpoint, so that a principal acting in or on behalf of an AI system is authenticated before it is trusted and cannot be impersonated. The objective is a first-class identity primitive for non-human principals — not a shared, ambient, or network-address-derived identity — that downstream registry, integrity, and authorization controls can rely on.<\/p><p>Issue a unique principal identifier per agent or tool endpoint rather than reusing a shared service account, and bind it to a verifiable authenticator — a workload credential, a signed identity document, or a client certificate — so a counterparty can confirm the principal before exchanging instructions or data. Authenticate at connection and invocation time rather than inferring identity from a hostname, port, or co-location. This applies equally to agent-to-tool, agent-to-agent, and orchestrator-to-agent paths, independent of wire protocol (for example MCP, A2A, or vendor SDKs) or deployment form (remote or locally exposed). A locally exposed tool server is not implicitly trusted for binding to localhost; it is authenticated like any other endpoint.<\/p><p>This is the identity-establishment layer that several adjacent controls presuppose. It is distinct from Agent Inventory Management (the lifecycle registry of which agents are authorized to exist), Component Identity Provenance (which verifies at invocation time that a caller is the currently registered, non-revoked principal for its role), Agent Integrity Management (which attests that a running agent matches its registered configuration), and Agent Credential Isolation (which scopes issued credentials to a tenant): those answer whether a principal is registered, unmodified, and tenant-scoped, while this control establishes the authenticatable principal that makes those questions answerable. It is closest to Component Identity Registration, which enrolls a component as a recognized, revocable client of the authorization server so that an authenticator can be issued to it — the issuance-side precondition. This control shares that establishment step but is distinguished by verification: it confirms the bound authenticator at connection time. The two hold independently — a principal can be authenticated against a trust anchor that never enrolled it as a client of any authorization server (for example an mTLS peer presenting a per-principal certificate chained to a trusted CA), and a registered component still presents an unverified credential until this control checks it at connect time. It is also distinct from Inter-Component Transport Security, which protects the channel — transport security can authenticate an endpoint key but does not establish that the endpoint is a distinct, named principal.<\/p><p>Authentication strength and credential lifetime should be proportionate to the principal's authority and blast radius: higher-privilege agents and side-effecting tool endpoints warrant stronger authenticators and shorter-lived credentials, while low-impact, read-only endpoints may accept lighter-weight authentication. Implementers may satisfy the intent with SPIFFE/SVID workload identities, OAuth client-credential or token-exchange flows, mutual TLS with per-principal certificates, hardware-attested identities, or equivalent mechanisms; the control requires that a distinct principal be authenticated, not any particular cryptographic scheme.<\/p>","comp":["Orchestration Input Handling","Orchestration Output Handling","External Tool Capabilities","Model Serving Infrastructure & Policy Enforcement Point","Application","Identity Provider","Tool Server"],"u":false,"dropped":false},"C:controlDelegatedAuthorizationIntegrity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Delegated Authorization Integrity","code":"controlDelegatedAuthorizationIntegrity","tip":"Ensure that when one component acts on behalf of another, the authority being exercised is carried by a verifiable delegated-authorization grant that names the original principal, is scoped to the requested action, and can be re-evaluated independently at each intermediary in the chain. The objectiv","desc":"<p>Ensure that when one component acts on behalf of another, the authority being exercised is carried by a verifiable delegated-authorization grant that names the original principal, is scoped to the requested action, and can be re-evaluated independently at each intermediary in the chain. The objective is an end-to-end authorization handoff whose provenance and scope are auditable across every hop, so an intermediary cannot silently broaden or impersonate the authority it was given.<\/p><p>Favor a standards-based delegated-authorization framework (for example OAuth 2.0 with token exchange, audience-restricted and short-lived access tokens, and fine-grained scopes) rather than forwarding a caller's raw credential or a static long-lived secret across intermediaries. Delegated grants should bind the acting party, the original principal, and the permitted scope so that each intermediary, including remote tooling and shared-service endpoints such as MCP or A2A tool servers, can validate the grant against its own policy point before honoring it. Where this control coordinates with a policy decision point, the delegated grant is the assertion that the policy enforcement point evaluates.<\/p><p>This control addresses how authorization is delegated and carried end-to-end. It is distinct from Agent Permissions, which bounds the effective authority of a delegated action to the intersection of the agent's and caller's permissions; from Agent Credential Isolation, which keeps credentials within a tenant boundary; from Inter-Component Transport Security, which protects the channel the grant rides over; and from Component Identity Provenance, which attests that the callee is the registered principal. Those controls assume an authorization grant exists and is trustworthy; this control establishes the grant and its per-hop verifiability. See rfc-8693-token-exchange, rfc-6749-oauth2, and nist-sp-800-162-abac.<\/p>","comp":["Agent Reasoning Core","Application","Tool Server","Identity Provider","Authorization Policy Decision Point","Authorization Policy Enforcement Point","Authorization Federation Proxy"],"u":false,"dropped":false},"C:controlMessageAndPayloadResourceLimits":{"t":"C","g":"gCcontrolsInfrastructure","n":"Message and Payload Resource Limits","code":"controlMessageAndPayloadResourceLimits","tip":"Bound the size and structural complexity of individual protocol messages so that no single message or stream can exhaust compute, memory, or bandwidth on a receiving component. This control governs per-message resource ceilings on the wire — maximum payload size ({{ref:cwe-400}}), maximum nesting an","desc":"<p>Bound the size and structural complexity of individual protocol messages so that no single message or stream can exhaust compute, memory, or bandwidth on a receiving component. This control governs per-message resource ceilings on the wire — maximum payload size (cwe-400), maximum nesting and recursion depth (cwe-674) for structured payloads, and decompression-ratio limits (cwe-409) — across all inter-component and remote-tooling channels (for example agent-to-tool, orchestration, and model-serving protocols).<\/p><p>This control addresses what a single message is allowed to consume, as distinct from Application Access and Resource Management, which governs how often a caller may issue requests (rate limiting and quotas at the request boundary), and Agent Execution Bounds, which caps agent reasoning and tool-call loops at the orchestration layer. It is also distinct from Inter-Component Transport Security, which authenticates and encrypts the channel but does not bound the work a well-formed message can impose on its receiver. Rate limits restrain request frequency; these limits restrain the cost of any one message, including the first.<\/p><p>Implementers can reject or truncate messages exceeding a configured size before full buffering, cap deserialization nesting and recursion depth to defeat deeply-nested and recursive payloads, and bound decompression ratios to defeat compression-bomb inputs. Where a protocol or framework ships without such ceilings, AI systems should set them explicitly rather than relying on transport or framework defaults, since agent and remote-tooling protocols frequently expose endpoints (including locally-exposed tool servers) that lack the hardened defaults of mature web stacks.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling","Agent Tool Transport Channel","Tool Input Handling"],"u":false,"dropped":false},"C:controlRuntimeHostIsolation":{"t":"C","g":"gCcontrolsInfrastructure","n":"Runtime Host Isolation","code":"controlRuntimeHostIsolation","tip":"Run remote-tooling and serving processes — including locally or co-resident tool servers (such as MCP servers), model-serving processes, and orchestration runtimes — under OS- and process-level isolation, so that a compromised or vulnerable process cannot reach host privileges, sibling processes, or","desc":"<p>Run remote-tooling and serving processes — including locally or co-resident tool servers (such as MCP servers), model-serving processes, and orchestration runtimes — under OS- and process-level isolation, so that a compromised or vulnerable process cannot reach host privileges, sibling processes, or resources beyond what its task requires.<\/p><p>The objective is to bound the blast radius of a compromised runtime process to a least-privilege execution context, containing privilege-escalation and lateral-movement paths from the process to the underlying host. This is a host-configuration and hardening posture, applied independently of whether the process is trusted at deploy time.<\/p><p>Implementations may draw on OS isolation primitives appropriate to the deployment context: containerization or microVM boundaries; OS namespaces and control groups; syscall filtering (seccomp); mandatory access control profiles (AppArmor, SELinux); dropped Linux capabilities; non-root, per-process service accounts; and read-only or scoped filesystem and network views. The specific primitives are deployment attributes; the control is the property that a runtime process executes with only the host privileges its task warrants.<\/p><p>This control governs the OS/process isolation tier. It is distinct from Isolated and Confidential Computing, which provides hardware-level isolation (TEEs, secure enclaves) against privileged-host and cross-tenant access; from Agent Host Secure Configuration, which keeps protective host settings from being tampered with — this control isolates the running process, that control keeps the isolation and other protections from being disabled; from Secure-by-Default ML Tooling, which governs selection and secure-default configuration of tooling rather than the runtime host boundary; and from Agent Permissions, which constrains an agent's logical tool/action scope rather than the host privileges of the process that serves a tool. Those controls assume processes may still be compromised; this control bounds what a compromised process can do to its host.<\/p>","comp":["External Tool Capabilities","Model Serving Infrastructure & Policy Enforcement Point","Application","Isolation Runtime Boundary","Tool Hosting","Runtime Hosting"],"u":false,"dropped":false},"C:controlSecretsAndKeyManagement":{"t":"C","g":"gCcontrolsInfrastructure","n":"Secrets and Key Management","code":"controlSecretsAndKeyManagement","tip":"Ensure that secrets and cryptographic key material held by AI system components — API keys, downstream service credentials, signing and encryption keys, and access tokens — are stored, brokered, and rotated through a dedicated secrets-management capability rather than embedded in component configura","desc":"<p>Ensure that secrets and cryptographic key material held by AI system components — API keys, downstream service credentials, signing and encryption keys, and access tokens — are stored, brokered, and rotated through a dedicated secrets-management capability rather than embedded in component configuration, source, or environment.<\/p><p>This control addresses the custody and lifecycle of secret material, which is acutely exposed in agentic and remote-tooling deployments: orchestrators and tool servers (for example MCP or A2A tool endpoints) accumulate credentials for many downstream services and broker them across delegation hops, so a single mishandled secret has a large blast radius.<\/p><p>Centralized custody: Hold secrets in a dedicated secret store or key-management service rather than in plaintext configuration, container images, source repositories, environment variables, or memory dumps. Where a shared secret store serves multiple principals or agents, scope retrieval so that one principal cannot read another's secrets.  Scoped, short-lived credentials: Prefer narrowly-scoped, short-lived credentials that are issued per task or session, so that captured secrets expire quickly and cannot be reused beyond their intended scope. This governs how secrets are issued and held to bound their at-rest scope and lifetime; the complementary presentation-time reuse-resistance — proof-of-possession or sender-constraint, and session-level anti-replay — is addressed by Sender-Constrained Credentials and Session and Credential Binding.  Encryption of key material: Protect stored keys with envelope encryption or hardware-backed key protection, and separate key-encrypting keys from the data they protect.  Rotation and revocation: Support automated rotation on a defined cadence and immediate revocation on suspected compromise or component decommission, without requiring redeployment of the holding component.  Classification-driven handling: Classify the secret and data material a component holds so that storage, encryption, and access decisions can be driven by sensitivity rather than applied uniformly.<\/p><p>This control governs the secret and key material a component holds at rest. It is distinct from Inter-Component Transport Security, which protects credentials in transit on the channel; from Agent Credential Isolation, which governs whether issued agent credentials stay within tenant boundaries during delegation; and from Model and Data Access Controls, which governs who may access models and datasets. Those controls assume secrets are well-custodied; this control establishes that custody.<\/p>","comp":["External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling","Model Serving Infrastructure & Policy Enforcement Point","Data Storage Infrastructure"],"u":false,"dropped":false},"C:controlInboundNetworkExposureAndSegmentation":{"t":"C","g":"gCcontrolsInfrastructure","n":"Inbound Network Exposure and Segmentation","code":"controlInboundNetworkExposureAndSegmentation","tip":"Constrain the INBOUND network reachability of AI-system services so that each service is exposed only to the callers that require it. Bind services to the narrowest interface that satisfies their role — a loopback or explicit internal interface rather than all interfaces — and place them behind netw","desc":"<p>Constrain the INBOUND network reachability of AI-system services so that each service is exposed only to the callers that require it. Bind services to the narrowest interface that satisfies their role — a loopback or explicit internal interface rather than all interfaces — and place them behind network segmentation boundaries that scope reachability to authorized peers.<\/p><p>Apply this at the host and network layer: secure-by-default listening interfaces for locally-run tool servers and sidecars so they are not reachable from the broader network by default; segmentation between tenant, trust, and environment boundaries so a compromised service cannot reach unrelated services; and default-deny inbound with allowlisted ingress and denied lateral paths, consistent with a zero-trust posture. Treat exposure as a deliberate, reviewable configuration decision rather than a default.<\/p><p>This control governs inbound exposure and the segmentation around it. It is distinct from Network Egress Control, which governs OUTBOUND reachability (egress filtering against data exfiltration and command-and-control) — this control governs who may reach a service, that control governs where a component may send. It is distinct from Inter-Component Transport Security, which secures and authenticates the channel once a connection is permitted (TLS/mTLS, origin validation, DNS-rebinding defense); that control assumes a connection has reached the service, while this control governs whether it should have been reachable at all. It is distinct from Isolated and Confidential Computing (hardware-layer compute/memory isolation), Secure-by-Default ML Tooling (secure defaults of tooling generally — this is the network-exposure slice), and Model and Data Access Controls (identity-scoped asset access, not network reachability).<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling","Tool Network Policy Enforcement Point","Agent Network Policy Enforcement Point"],"u":false,"dropped":false},"C:controlToolServerSupplyChainIntegrity":{"t":"C","g":"gCcontrolsInfrastructure","n":"Tool-Server Supply Chain Integrity","code":"controlToolServerSupplyChainIntegrity","tip":"Ensure that third-party and remote tool-server software is provenance-verified and integrity-gated before it is acquired, installed, or updated, so that the inventory and runtime controls that depend on it can trust what they are tracking. The objective is a verifiable chain of custody from publishe","desc":"<p>Ensure that third-party and remote tool-server software is provenance-verified and integrity-gated before it is acquired, installed, or updated, so that the inventory and runtime controls that depend on it can trust what they are tracking. The objective is a verifiable chain of custody from publisher to deployed tool server, not an open question of which package an agent ended up running.<\/p><p>Scope this control to the acquisition, installation, and update lifecycle of tool-server software (including MCP and other remote-tooling deployments). Apply, in proportion to the trust placed in the tool server and the sensitivity of the actions it can take:<\/p><ul><li>Provenance verification of the publisher and source before adoption, using signed artifacts and build provenance (for example SLSA-style attestations, in-toto, or registry-native signing) rather than name or description alone.<\/li><li>Package-integrity gating at install and update time, verifying checksums and signatures against the asserted publisher identity so that a substituted, tampered, or typosquatted package fails closed before it is deployed.<\/li><li>Dependency transparency through a software bill of materials (SBOM) for the tool server and its transitive dependencies, reviewed against known-vulnerable and disallowed components.<\/li><li>Update-channel integrity, so that updates are obtained over authenticated channels and re-verified with the same provenance and integrity checks applied at first install, preventing a trusted server from being silently replaced.<\/li><\/ul><p>This control governs the upstream supply-chain gate. It is distinct from Agent Inventory Management, which is the lifecycle authority over which tool servers are authorized to exist and detects shadow and zombie servers; this control is the provenance and package-integrity step that should gate entry into that inventory. It is distinct from Model and Data Integrity Management, which protects model, data, and training-code artifacts; this control protects a different artifact class -- the tool-server software an agent reaches out to. It is distinct from Model and Data Execution Integrity, which verifies known-good artifacts at inference time, and from Secure-by-Default ML Tooling, which governs the security posture of selected tooling rather than the verifiability of its origin. It is also distinct from Component Identity Provenance, which attests at invocation time that a running endpoint is the registered principal; this control establishes that the software behind that principal entered the environment through a verified supply chain.<\/p><p>Consistent with a risk-appetite posture, organizations calibrate the strength of provenance evidence required and the strictness of install-time gating to the privilege and blast radius of each tool server, rather than applying a single uniform bar to all tooling.<\/p>","comp":["External Tool Capabilities","Tool Server","Tool Registry and Discovery"],"u":false,"dropped":false},"C:controlSessionCredentialBindingAndLifecycle":{"t":"C","g":"gCcontrolsInfrastructure","n":"Session and Credential Binding","code":"controlSessionCredentialBindingAndLifecycle","tip":"Reduce the value of a stolen authentication token or session identifier by constraining who can use it, where, and for how long, so that interception of a credential does not by itself yield a usable impersonation. This is the identity- and credential-layer concern from {{ref:cosai-agentic-identity}","desc":"<p>Reduce the value of a stolen authentication token or session identifier by constraining who can use it, where, and for how long, so that interception of a credential does not by itself yield a usable impersonation. This is the identity- and credential-layer concern from cosai-agentic-identity: it governs how the credential itself is shaped, distinct from how the channel carrying it is secured.<\/p><p>The objective is that a credential observed by an attacker is not independently replayable indefinitely. Approaches that satisfy this intent include: audience-bound tokens scoped to their intended recipient, so a credential issued for one endpoint cannot be replayed against another; short credential and session lifetimes scoped to a single task, request, or session; rotation of session identifiers on privilege or context change; and prompt revocation and session invalidation when reuse from an unexpected origin, device, or concurrent session is detected. Where a credential must additionally resist replay by a party other than its rightful holder — not merely its intended audience — Sender-Constrained Credentials supplies the proof-of-possession / holder-of-key binding primitive; this control is the surrounding lifecycle discipline within which that holder-binding is one input, alongside audience scoping, lifetime, rotation, and revocation. The control is mechanism-agnostic — implementers may use OAuth audience restriction, rotating session identifiers, sender-constrained tokens, or other approaches that achieve the same property.<\/p><p>This control applies wherever agents, remote tools, and shared services authenticate to one another, including locally-exposed tool-server endpoints that are sometimes treated as implicitly trusted. The remote-tooling protocol in use (for example MCP or other agent-to-tool protocols) is an attribute of the deployment, not the locus of the control.<\/p><p>This control is distinct from adjacent controls along clear boundaries. Inter-Component Transport Security secures the channel a credential travels over — including channel binding and message-level replay protection for inter-component messages — whereas this control shapes the credential so it remains unusable to a third party even off that channel. Agent Credential Isolation governs tenant scoping of agent credentials (are they structurally confined to one tenant?), whereas this control governs reuse resistance regardless of tenancy. Application Access and Resource Management governs whether an authenticated principal is authorized for an action, whereas this control governs whether a presented credential genuinely belongs to its claimed holder. Delegated Authority Confinement governs authority re-minting across delegation hops — that authority is issued afresh for each hop's recipient rather than forwarded unchanged — whereas this control governs the binding and lifetime of a credential or session regardless of whether delegation is involved; a chain can re-mint authority at every hop yet still issue long-lived, unbound tokens at each hop, or a single non-delegated credential can be bound, short-lived, and rotated with no hop-to-hop propagation in play. Sender-Constrained Credentials supplies the specific proof-of-possession / holder-of-key mechanism that makes one credential resistant to replay by a non-holder, whereas this control is the broader session and credential lifecycle discipline — audience-binding, short lifetimes, rotation, and anomaly-triggered revocation — within which holder-binding is one input rather than a restatement; a deployment can adopt sender-constrained tokens without ever rotating or revoking them, or rotate and time-box its credentials without proof-of-possession binding.<\/p>","comp":["Application","Tool Server","Agent Tool Transport Channel","Identity Provider"],"u":false,"dropped":false},"C:controlAuthenticationSchemeHardening":{"t":"C","g":"gCcontrolsInfrastructure","n":"Authentication Scheme Hardening","code":"controlAuthenticationSchemeHardening","tip":"Select authentication and authorization schemes that bind each request to a verifiable, appropriately scoped principal, and phase out weak or pass-through schemes that undermine accountability. The objective is that every machine-to-machine and user-to-service authentication establishes who the call","desc":"<p>Select authentication and authorization schemes that bind each request to a verifiable, appropriately scoped principal, and phase out weak or pass-through schemes that undermine accountability. The objective is that every machine-to-machine and user-to-service authentication establishes who the caller is in a way the relying party can independently verify and attribute. Schemes that frustrate this objective — HTTP basic auth, long-lived static API keys, and pass-through (token-passthrough) patterns where an upstream credential is forwarded unverified to a downstream service — should be deprecated in favor of federated identity, short-lived tokens, proof-of-possession or channel-bound credentials, and per-principal rotation. Pass-through is the dominant case this control targets in agentic deployments: where a remote-tooling or shared-service intermediary (e.g., an MCP or plugin tool server) sits between a caller and a backend, the scheme must re-establish and independently verify the principal at each hop rather than forwarding the caller's bearer credential unverified. This control governs the quality and trust properties of the authentication scheme itself — what counts as an acceptable credential. It is distinct from Inter-Component Transport Security, which secures the channel the credential travels over and assumes a credential exists; from Component Identity Provenance, which verifies a presented identity is the registered principal for a role; and from Agent Credential Isolation, which scopes credentials to tenant boundaries once a strong scheme is in place. Those controls assume a sound authentication scheme; this control establishes one.<\/p>","comp":["Application","Tool Server","Agent Tool Transport Channel","Identity Provider","Authorization Policy Enforcement Point"],"u":false,"dropped":false},"C:controlNetworkEgressControl":{"t":"C","g":"gCcontrolsInfrastructure","n":"Network Egress Control","code":"controlNetworkEgressControl","tip":"Constrain the OUTBOUND network reachability of AI-system components — model-serving endpoints, orchestration services, agents, and the tool servers they run — so that a compromised or misbehaving component cannot originate arbitrary external connections. The objective is to bound where a component m","desc":"<p>Constrain the OUTBOUND network reachability of AI-system components — model-serving endpoints, orchestration services, agents, and the tool servers they run — so that a compromised or misbehaving component cannot originate arbitrary external connections. The objective is to bound where a component may send traffic: preventing data exfiltration and command-and-control (C2) callbacks by governing egress against an allowlist of legitimate destinations rather than permitting open outbound access by default.<\/p><p>Govern component-originated connections through an egress policy or forward proxy rather than allowing unrestricted external access: default-deny outbound with allowlisted destinations and ports scoped to what each component legitimately needs; egress filtering or proxying that constrains C2 reachability and bulk data egress (network-boundary data-loss prevention); and destination scoping for agents and tool servers so an agent cannot reach external endpoints beyond its task. Calibrate strictness to the sensitivity of the data a component handles and its blast radius.<\/p><p>This control governs outbound reachability and exfiltration. It is distinct from Inbound Network Exposure and Segmentation, which governs inbound exposure and segmentation (who may reach a service) — this control governs where a component may send. It is distinct from Inter-Component Transport Security (protects the channel once a connection is permitted), Model and Data Access Controls (principal access to assets, not network egress paths), and Isolated and Confidential Computing (compute/memory isolation rather than the network).<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","External Tool Capabilities","Agent Reasoning Core","Tool Network Policy Enforcement Point","Agent Network Policy Enforcement Point"],"u":false,"dropped":false},"C:controlThirdPartyCapabilityAdmission":{"t":"C","g":"gCcontrolsInfrastructure","n":"Third-Party Capability Admission Control","code":"controlThirdPartyCapabilityAdmission","tip":"Ensure that the third-party CAPABILITIES an agent acquires — the set of tools and, in particular, prompt or instruction-template capabilities a provider exposes — are admitted against an approval policy before use, and that a material change to an already-approved capability requires re-approval bef","desc":"<p>Ensure that the third-party CAPABILITIES an agent acquires — the set of tools and, in particular, prompt or instruction-template capabilities a provider exposes — are admitted against an approval policy before use, and that a material change to an already-approved capability requires re-approval before it takes effect. The objective is an admission decision at the capability-set level: only capabilities that have passed a current approval gate are eligible to execute. This addresses dependency-and-update (\"rug-pull\") compromise, where a capability benign at adoption is later swapped, re-versioned, or allowed to redefine its own description — and covers prompt capabilities that individual tool- and server-integrity controls do not.<\/p><p>Favor a documented approval gate proportionate to the capability's privilege and blast radius: confirmation that the providing server has cleared Tool Server Vetting and Approval before a capability from it is admitted; pinning an approved capability to a specific reviewed version; a re-approval trigger on description, schema, permission, or version change; and constrained update channels so capability updates arrive through reviewable paths rather than being self-asserted at runtime.<\/p><p>This control governs onboarding admission and re-approval of the capability set. It is distinct from Tool Server Vetting and Approval, which vets the provider/server; from Tool-Server Supply Chain Integrity, which provenance-verifies the server software; from Tool Registry and Discovery Integrity, which protects registered tool manifests/metadata and their re-approval; and from Agent Capability Negotiation Control, which enforces the approved set at each RUNTIME negotiation handshake — this control is the onboarding/change-control authority that populates what that runtime enforcement point checks.<\/p>","comp":["External Tool Capabilities","Agent Reasoning Core","Orchestration Input Handling","Tool Server"],"u":false,"dropped":false},"C:controlAIInfrastructureObservability":{"t":"C","g":"gCcontrolsInfrastructure","n":"AI Infrastructure Observability","code":"controlAIInfrastructureObservability","tip":"Maintain centralized, tamper-evident telemetry across the AI system infrastructure — hosts, model-serving endpoints, API gateways, client connections, and orchestration transport paths — so that compliance obligations can be demonstrated and security incidents can be reconstructed after the fact.\n T","desc":"<p>Maintain centralized, tamper-evident telemetry across the AI system infrastructure — hosts, model-serving endpoints, API gateways, client connections, and orchestration transport paths — so that compliance obligations can be demonstrated and security incidents can be reconstructed after the fact.<\/p><p>This control addresses the infrastructure and platform layer of observability: the log streams, distributed traces, and audit records produced by the components the AI system runs on and through. It is distinct from Agent Observability, which addresses behavioral telemetry of individual agents — their actions, tool invocations, and reasoning. A system can have complete agent-level logs and still lack the infrastructure-layer evidence needed to answer whether a serving endpoint was substituted, which clients connected to a model gateway, or what network activity accompanied an incident.<\/p><p>Effective implementation provides: structured, queryable log streams from serving infrastructure and host-level event sources; distributed trace correlation across request paths that cross component boundaries (gateways, load balancers, serving endpoints, application tiers); log retention policies calibrated to applicable compliance and forensic requirements; and integrity protections (write-once storage, cryptographic log chaining, or equivalent) that prevent after-the-fact alteration of audit records. The instrumentation should be sufficient to reconstruct the infrastructure-side sequence of events for any request that traversed the system.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","Application","Orchestration Input Handling","Orchestration Output Handling"],"u":false,"dropped":false},"C:controlAIComponentPatchManagement":{"t":"C","g":"gCcontrolsInfrastructure","n":"AI Component Patch Management","code":"controlAIComponentPatchManagement","tip":"Maintain a tested, staged, and version-enforced update lifecycle for deployed AI-system components, including model serving infrastructure, orchestration frameworks, and remote tool servers such as MCP servers. Where {{controlVulnerabilityManagement}} identifies vulnerabilities in production, this c","desc":"<p>Maintain a tested, staged, and version-enforced update lifecycle for deployed AI-system components, including model serving infrastructure, orchestration frameworks, and remote tool servers such as MCP servers. Where Vulnerability Management identifies vulnerabilities in production, this control closes the detect-to-remediate loop by ensuring identified vulnerabilities result in applied patches rather than advisory notices.<\/p><p>The discipline has two interdependent parts. Update management: validate fixes and version upgrades in a pre-production environment before promoting to production, and apply them through staged or canary rollouts so a regression introduced by a patch is contained before it propagates to the full deployment. Version enforcement: maintain a registry of deployed component versions — drawing on the inventory established by Model and Data Inventory Management and Agent Inventory Management — and apply policies that block or quarantine instances running versions with documented vulnerabilities, so detection drives mandatory remediation within a defined response window rather than remaining advisory.<\/p><p>This control applies to the AI-specific components classical patch-management processes often miss: MCP tool server instances managed outside conventional software asset management, model serving infrastructure deployed in cloud or container environments, and orchestration framework dependencies. Each can carry exploitable vulnerabilities that accumulate silently when no update-management process governs them.<\/p><p>This control is the remediation counterpart to Vulnerability Management (detection and monitoring) and is distinct from Incident Response Management (response to active incidents) and Secure-by-Default ML Tooling (selecting secure-by-default tooling at initial deployment). Rollback of a faulty update during an active incident belongs to Incident Response Management; the standing update cadence and version enforcement described here operate in normal operations.<\/p>","comp":["Model Serving Infrastructure & Policy Enforcement Point","External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling"],"u":false,"dropped":false},"C:controlAuditRecordRepositoryIndependence":{"t":"C","g":"gCcontrolsInfrastructure","n":"Audit Record Repository Independence","code":"controlAuditRecordRepositoryIndependence","tip":"Ensure the durable record of what an AI system did is held under an authority the recorded workload does not control. The obligation attaches to the storage substrate ({{componentAuditRecordRepository}}), not the components that write to it: an emitter can produce complete and accurate records and s","desc":"<p>Ensure the durable record of what an AI system did is held under an authority the recorded workload does not control. The obligation attaches to the storage substrate (Audit Record Repository), not the components that write to it: an emitter can produce complete and accurate records and still not guarantee they survive an adversary holding administrative authority over the workload being recorded. That adversary is frequently the recorded workload itself, which is why a component cannot be its own audit authority.<\/p><p>Effective implementation provides three structural properties. <b>Separated append, read, and delete authority:<\/b> the authority to append records does not carry authority to read the trail back, amend it, or remove entries; audit read access is granted separately; and no principal holds append together with deletion or retention-shortening authority. <b>An administrative plane outside the recorded trust domain:<\/b> the authority to configure retention, grant and revoke access, and authorize deletion sits outside the trust domain of the workloads the store records, so compromise of a recorded workload confers none over the record of that compromise. <b>Self-recording of the administrative plane:<\/b> actions taken against the store — retention changes, access grants and revocations, deletions, expiry, and roster changes — are themselves written to the trail. These are properties of authority, not of any mechanism expressing it: credentials are the usual expression, but a one-way write path into write-once media satisfies the first without one.<\/p><p>Omitting the third leaves the first two asserted rather than evidenced — though not falsifiable on its own, since self-recorded administrative actions land in the same trail an administrator can rewrite; only the externally held reference point of Audit Trail Integrity Verification closes that. NIST SP 800-53 states these as enhancements to the protection of audit information — AU-9(4), AU-9(5) and AU-9(6) for the authority separation, and AU-9(2) and AU-9(7) for the administrative plane, which it frames topologically (nist-sp-800-53r5). This control states that in control-plane terms; the topological form remains stronger wherever an adversary reaches host or hypervisor privilege, since a co-located store falls to that adversary regardless of logical partitioning. The EU AI Act divides them similarly, separating recording under Article 12 from the duty to keep records under Articles 19 and 26(6) (eu-ai-act-2024).<\/p><p>Where a recorded workload's operator also operates its store, that operator arranges the separation: holding both roles is the ordinary case for separation of duties, not an exemption. This control, with Audit Trail Completeness and Audit Trail Integrity Verification, divides by the question the trail must answer — who could have changed it, whether everything reached it, and whether what reached it still stands — not by the properties within an answer: here the separated administrative plane subsumes separated authority against the adversary this risk names, and self-recording makes either checkable. Resource Authorization Enforcement carries least-privilege and privilege-separation for service and tool-integration permission scope, but is an application-layer control that does not reach this component and names neither the append/read/delete triad over the audit record nor where its administrative plane sits.<\/p>","comp":["Audit Record Repository"],"u":false,"dropped":false},"C:controlAuditTrailCompleteness":{"t":"C","g":"gCcontrolsInfrastructure","n":"Audit Trail Completeness","code":"controlAuditTrailCompleteness","tip":"Ensure that every record which should have entered the trail held in {{componentAuditRecordRepository}} did enter it and remains for as long as it should. A gap nothing reports is indistinguishable from an absence of activity and will be read as one. The objective is that absence becomes reportable;","desc":"<p>Ensure that every record which should have entered the trail held in Audit Record Repository did enter it and remains for as long as it should. A gap nothing reports is indistinguishable from an absence of activity and will be read as one. The objective is that absence becomes reportable; sequence numbers, heartbeats, and writer manifests are realizations of that signal, not the requirement.<\/p><p><b>Verified commitment on the write path.<\/b> A record has entered the trail only when the repository has said so. The store authenticates itself as the write destination and returns an acknowledgement of durable commitment attributable to that identity, so a success response from an endpoint that cannot present the repository's identity is not a commitment. This raises the privilege required for write-path redirection, where an emitter's destination is reconfigured or impersonated so records are accepted and discarded: rewriting the destination address no longer suffices, though rewriting the emitter's trust anchors too still succeeds — a residual the continuity expectation below catches.<\/p><p><b>A stated contract for failure and expiry.<\/b> For each class of event the store states what a failure to commit means — whether the recorded operation blocks until its record is durable, or proceeds with the failure recorded and alerted — and a minimum retention period, with capacity provisioned so ordinary volume does not consume it. NIST SP 800-53 assigns the first to the organization under AU-5 and treats storage capacity as an obligation of the medium under AU-4 (nist-sp-800-53r5). Where regulation sets that period it is a floor, not a target: the EU AI Act requires providers and deployers to keep logs under their control for at least six months (eu-ai-act-2024). Within that floor, expiring or overwriting the oldest records is not an available response to pressure — AU-5 offers it as one, and it is exactly the mechanism an adversary uses to flood the store until records of interest age out. Exhaustion falls back to the stated commit posture; early expiry is an administrative action under Audit Record Repository Independence.<\/p><p><b>A continuity expectation held across writers.<\/b> The store requires of each writer a signal from which continuity can be judged and holds that expectation itself, so a sequence break, an out-of-order arrival, or a writer gone quiet is reportable rather than a silent hole. This is the half of the trail no emitter can attest to: a writer terminated, silenced, or redirected cannot report its own absence, because from its own vantage point a suppressed emitter is indistinguishable from an idle one. The roster of expected writers is administrative state of the store, so roster changes fall under the self-recording property of Audit Record Repository Independence; otherwise deregistering a writer silently retires its expectation. Where the writers are agents, the roster is reconciled against Agent Inventory Management.<\/p><p>Neither Inter-Component Transport Security nor Component Identity Authentication supplies commitment: a channel can be perfectly protected, its peer properly identified as a caller, to an endpoint that discards what it receives. The emitter-side work of carrying a continuity signal sits with AI Infrastructure Observability, whose scope is per-request ordering rather than per-writer continuity, and Agent Observability, which does not reach ordering at all; this control depends on neither widening.<\/p>","comp":["Audit Record Repository"],"u":false,"dropped":false},"C:controlAuditTrailIntegrityVerification":{"t":"C","g":"gCcontrolsInfrastructure","n":"Audit Trail Integrity Verification","code":"controlAuditTrailIntegrityVerification","tip":"Ensure that records already committed to the trail in {{componentAuditRecordRepository}} can be shown not to have changed since they were written, for as long as they are retained. This has two parts, and the second is the one usually missing: the trail carries a structure that makes alteration dete","desc":"<p>Ensure that records already committed to the trail in Audit Record Repository can be shown not to have changed since they were written, for as long as they are retained. This has two parts, and the second is the one usually missing: the trail carries a structure that makes alteration detectable, and something actually checks it. Detectability is not detection — an integrity structure nothing verifies produces no evidence, and a flat log file offers nothing to verify at all.<\/p><p><b>The structure this control verifies.<\/b> Records are held so that altering or removing one after the fact leaves a discrepancy a reader can find: write-once media, cryptographic chaining of each record to its predecessors, or an equivalent binding a later edit cannot silently satisfy — the cryptographic form is AU-9(3) (nist-sp-800-53r5). This restates for the repository the requirement AI Infrastructure Observability places on the telemetry it covers, and the restatement is deliberate rather than an oversight: a verification obligation with no stated object is empty. What earns this control its place is the property below.<\/p><p><b>Verification on a cadence, against an externally held reference.<\/b> The structure is checked on a defined schedule rather than only during an investigation, by a verifier that does not run under the authority of the workloads being recorded, and a verification failure raises an alert on the same path as a security incident. Because a principal holding full authority over the store can rewrite the trail and its structure together into a self-consistent whole, the objective is a reference point held outside that authority and committed to periodically, bounding how far back such a rewrite can reach undetected. Publishing a hash-chain head or Merkle tree root to an independent witness is the common realization; an independently retained copy or an outside countersignature serves the same objective for a trail structured otherwise.<\/p><p>This control and Audit Trail Completeness divide the trail's failure modes: records altered while they were durable, and records that never became durable or did not survive. It differs from Audit Record Repository Independence: independence determines who could have rewritten the trail, this control whether anyone did — which is why the verifier and the reference point sit outside the authority independence establishes, and why that reference is what makes independence's self-recording property checkable. Threat Detection and Incident Response Management consume the trail as evidence and depend on this control for the evidentiary value of what they read.<\/p>","comp":["Audit Record Repository"],"u":false,"dropped":false},"C:controlInputValidationAndSanitization":{"t":"C","g":"gCcontrolsModel","n":"Input Validation and Sanitization","code":"controlInputValidationAndSanitization","tip":"Block or restrict adversarial queries to AI models.","desc":"<p>Block or restrict adversarial queries to AI models.<\/p>","comp":["Application Input Handling","Agent Input Handling","Orchestration Input Handling"],"u":false,"dropped":false},"C:controlOutputValidationAndSanitization":{"t":"C","g":"gCcontrolsModel","n":"Output Validation and Sanitization","code":"controlOutputValidationAndSanitization","tip":"Block, nullify, or sanitize insecure output from AI models before passing it to applications, extensions or users.","desc":"<p>Block, nullify, or sanitize insecure output from AI models before passing it to applications, extensions or users.<\/p>","comp":["Application Output Handling","Agent Output Handling","Orchestration Output Handling"],"u":false,"dropped":false},"C:controlAdversarialTrainingAndTesting":{"t":"C","g":"gCcontrolsModel","n":"Adversarial Training and Testing","code":"controlAdversarialTrainingAndTesting","tip":"Use techniques to make AI models robust to adversarial inputs (i.e. prompts) in the context of their use in applications.","desc":"<p>Use techniques to make AI models robust to adversarial inputs (i.e. prompts) in the context of their use in applications.<\/p>","comp":["The Model"],"u":false,"dropped":false},"C:controlGenerativeModelAlignment":{"t":"C","g":"gCcontrolsModel","n":"Generative Model Alignment","code":"controlGenerativeModelAlignment","tip":"Ensure a generative model's own decision-making — the choices and outputs it produces, including the actions it proposes for execution where it drives an agent — is aligned with the operator's intended objectives and policies through how the model is trained, tuned and evaluated, and that its traine","desc":"<p>Ensure a generative model's own decision-making — the choices and outputs it produces, including the actions it proposes for execution where it drives an agent — is aligned with the operator's intended objectives and policies through how the model is trained, tuned and evaluated, and that its trained disposition when operating beyond the conditions under which it was validated is to refuse or defer rather than to produce an erroneous or harmful result.<\/p><p>This is a property established in the model itself, before it is served, and verified on an ongoing basis — distinct from controls that intercept or filter what the model has already produced.<\/p><p>Examples include:<\/p><ul><li>Alignment techniques applied during training or fine-tuning, such as supervised fine-tuning, reinforcement learning from human or AI feedback (RLHF/RLAIF), and targeted safety-context distillation.<\/li><li>Structured evaluation of the deployed model's validity, reliability, and safety margins against documented use conditions, with the limits of its generalizability recorded rather than assumed.<\/li><li>Trained refusal and deferral behavior — the model's disposition, established in training and verified in evaluation, to decline or defer rather than produce an output when a request falls outside its validated conditions — so that safe failure is a property of the model itself and not only of downstream enforcement.<\/li><\/ul><p>It is distinct from Adversarial Training and Testing, which makes a model robust to adversarial inputs — prompts crafted to attack it — in the context of its use in applications; this control governs the model's general behavioral alignment and its trained disposition to refuse or defer under valid-but-out-of-scope conditions, whether or not the triggering input is adversarial.<\/p>","comp":["The Model","Training and Tuning","Model Evaluation","Agent Reasoning Core"],"u":false,"dropped":false},"C:controlApplicationAccessManagement":{"t":"C","g":"gCcontrolsApplication","n":"Application Access and Resource Management","code":"controlApplicationAccessManagement","tip":"Ensure comprehensive access governance through:\n Identity and authorization controls that restrict resources to authorized users and endpoints for authorized actions.\n Resource governance controls including usage quotas, rate limiting, cost monitoring, and anomaly detection to prevent resource exhau","desc":"<p>Ensure comprehensive access governance through:<\/p><p>Identity and authorization controls that restrict resources to authorized users and endpoints for authorized actions.<\/p><p>Resource governance controls including usage quotas, rate limiting, cost monitoring, and anomaly detection to prevent resource exhaustion and economic denial of wallet attacks.<\/p>","comp":["Application"],"u":false,"dropped":false},"C:controlUserTransparencyAndControls":{"t":"C","g":"gCcontrolsApplication","n":"User Transparency and Controls","code":"controlUserTransparencyAndControls","tip":"Inform users of relevant AI risks with disclosures, and provide transparency and control experiences for use of their data in AI applications.","desc":"<p>Inform users of relevant AI risks with disclosures, and provide transparency and control experiences for use of their data in AI applications.<\/p>","comp":["Application"],"u":false,"dropped":false},"C:controlAgentPluginUserControl":{"t":"C","g":"gCcontrolsApplication","n":"Agent User Control","code":"controlAgentPluginUserControl","tip":"Ensure user approval for any actions performed by agents/plugins that alter user data or act on the user's behalf.","desc":"<p>Ensure user approval for any actions performed by agents/plugins that alter user data or act on the user's behalf.<\/p>","comp":["Agent Reasoning Core"],"u":false,"dropped":false},"C:controlAgentPluginPermissions":{"t":"C","g":"gCcontrolsApplication","n":"Agent Permissions","code":"controlAgentPluginPermissions","tip":"Use least-privilege principle as the upper bound on agentic system permissions to minimize the number of tools that an agent is permitted to interact with and the actions it is allowed to take. An agentic system's use of privileges should be contextual and dynamic, adapting to the specific user quer","desc":"<p>Use least-privilege principle as the upper bound on agentic system permissions to minimize the number of tools that an agent is permitted to interact with and the actions it is allowed to take. An agentic system's use of privileges should be contextual and dynamic, adapting to the specific user query and trusted contextual information. This design also applies to agents that have access to user information. For example, an agent asked to fill out a form or answer questions should share only contextually appropriate information and can be designed to dynamically minimize exposed data using reference monitors.<\/p><p>At delegation boundaries, an agent acting on behalf of a caller must verify the caller's authority for the requested action — not rely on the agent's own (often broader) permissions. Each delegation hop should narrow the agent's effective authority to the intersection of its own permissions and the caller's authorization, preventing the agent from being used as a confused deputy to execute actions the caller could not perform directly.<\/p>","comp":["Agent Reasoning Core","External Tool Capabilities","Retrieval Augmented Generation & Content","Model Memory","Authorization Federation Proxy","Tool Server"],"u":false,"dropped":false},"C:controlAgentObservability":{"t":"C","g":"gCcontrolsApplication","n":"Agent Observability","code":"controlAgentObservability","tip":"Ensure an agent's actions, tool use, and reasoning are transparent and auditable through logging, allowing for debugging, security oversight, and user insights into agent activity.","desc":"<p>Ensure an agent's actions, tool use, and reasoning are transparent and auditable through logging, allowing for debugging, security oversight, and user insights into agent activity.<\/p>","comp":["Orchestration Input Handling","Orchestration Output Handling","Agent Input Handling","Agent Output Handling","Agent Reasoning Core"],"u":false,"dropped":false},"C:controlAgentInventoryManagement":{"t":"C","g":"gCcontrolsApplication","n":"Agent Inventory Management","code":"controlAgentInventoryManagement","tip":"Ensure that all agents operating in the system are registered in a central inventory before credential issuance, with lifecycle state tracking (active, suspended, decommissioned) and automated detection of unregistered agents. This control addresses agent identity governance — knowing what agents ar","desc":"<p>Ensure that all agents operating in the system are registered in a central inventory before credential issuance, with lifecycle state tracking (active, suspended, decommissioned) and automated detection of unregistered agents. This control addresses agent identity governance — knowing what agents are authorized to exist — as distinct from agent observability, which addresses what agents do.<\/p><p>This control extends the inventory management concept from Model and Data Inventory Management to dynamic, running agent entities. Where model/data inventory tracks static artifacts through build and deployment pipelines, agent inventory tracks entities with operational lifecycle states in a live system. Enforcement includes credential revocation on lifecycle state change and blocking of unregistered agent actions. The same inventory discipline extends to MCP tool server endpoints, providing the lifecycle authority on which runtime provenance and observability controls depend.<\/p>","comp":["Agent Reasoning Core","External Tool Capabilities","Orchestration Input Handling","Orchestration Output Handling"],"u":false,"dropped":false},"C:controlAgentIntegrityManagement":{"t":"C","g":"gCcontrolsApplication","n":"Agent Integrity Management","code":"controlAgentIntegrityManagement","tip":"Ensure that each running agent's identity and configuration are cryptographically bound to its registered inventory entry and verifiable at runtime. This includes credential binding to individual agent identities (not shared pools), attestation of agent configuration against a registered baseline, a","desc":"<p>Ensure that each running agent's identity and configuration are cryptographically bound to its registered inventory entry and verifiable at runtime. This includes credential binding to individual agent identities (not shared pools), attestation of agent configuration against a registered baseline, and automated revocation propagation on decommission or underlying model swap.<\/p><p>This control extends the integrity management concept from Model and Data Integrity Management to agent identity. Where model/data integrity verifies that artifact content (weights, code) has not been tampered with, agent integrity verifies that a running agent's identity credentials match its registered entry. A model can pass artifact integrity checks while the agent wrapping it has drifted from its registered configuration or had its credential bindings compromised.<\/p>","comp":["Agent Reasoning Core","External Tool Capabilities","Orchestration Input Handling","Model Serving Infrastructure & Policy Enforcement Point"],"u":false,"dropped":false},"C:controlAgentCredentialIsolation":{"t":"C","g":"gCcontrolsApplication","n":"Agent Credential Isolation","code":"controlAgentCredentialIsolation","tip":"Ensure that credentials issued to agents are scoped to individual tena
