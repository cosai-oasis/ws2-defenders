. In traditional systems, runaway processes are constrained by watchdog timers, process resource limits (ulimit, cgroups), and OS-level scheduling. The AI-specific amplifier is that LLM-driven agents make non-deterministic decisions about when to stop, and each tool call generates reasoning traces and tool response pairs that accumulate in the context window. The loop degrades the agent's ability to reason about stopping even as it continues — context-window saturation creates a feedback loop where the agent can no longer process enough history to recognize it should terminate.<\/p><p>This risk is distinct from Economic Denial of Wallet, which addresses adversarial resource exhaustion at the API billing layer through attacks on pricing models and billing mechanisms. Runaway Agent Tool Loops addresses autonomous agent behavior at the MCP orchestration layer, where impacts include context-window exhaustion (task fails silently or incompletely), availability degradation for co-tenants, and safety failures in time-sensitive systems — impacts with no financial dimension. Prompt injection can trigger runaway loops (see Prompt Injection), but the underlying vulnerability is the absence of loop bounds at the orchestration layer: deployments that do not enforce per-agent, per-session, or per-tool-call resource budgets and rate limits, that allow recursive or deeply nested tool chains without an automatic bound or a human-approval checkpoint, that rely on MCP servers unable to reject or throttle requests based on cumulative context or cost, and that do not monitor for context-window saturation during tool-calling sequences.<\/p><p>Potential impacts include context-window exhaustion leading to silent task failure, massive unexpected costs, service degradation for other users on shared infrastructure, and safety risks when time-sensitive agent tasks are delayed or never complete. Consequences range from financial damage to availability failures and loss of trust in autonomous agent systems.<\/p>","atlas":["AML.T0034.002"],"life":["runtime"],"impact":["availability","safety"],"dropped":false},"R:riskOverScopedToolAuthority":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Over-Scoped Tool Authority","code":"riskOverScopedToolAuthority","tip":"A tool exposed to an agent with broader authority than any single task requires, whose constraints are enforced by the model's own judgment rather than deterministically at the tool boundary, lets a manipulated or merely over-reaching model exercise that full excess authority — collapsing the system","short":"<p>A tool exposed to an agent with broader authority than any single task requires, whose constraints are enforced by the model's own judgment rather than deterministically at the tool boundary, lets a manipulated or merely over-reaching model exercise that full excess authority — collapsing the system's effective security to the model's weakest behavior.<\/p>","long":"<p>Tools and capabilities exposed to an agent are designed with authority broader than any individual task requires, and the decision to constrain that authority — input validation, parameter bounds, object-level authorization, and policy enforcement — is delegated to the model's reasoning rather than enforced deterministically at the tool boundary. The model is made the security enforcement point. Because the model is non-deterministic and manipulable, the effective security of the system collapses to the weakest model behavior, and even robust upstream authentication and authorization controls can be undermined by the breadth of what the tool is permitted to do once invoked.<\/p><p>This is a classical least-privilege and secure-by-design failure in agentic dress (<a href=\"https://modelcontextprotocol.io/specification/draft/basic/security_best_practices\" target=\"_blank\" rel=\"noopener\">Model Context Protocol Security: Secure Tool and UX Design<\/a>). The same pattern recurs as over-privileged service accounts holding ambient authority, clients trusted to enforce access control that belongs on the server, and broken object-level authorization (BOLA) where the caller is trusted to scope its own request. Reference access-control architecture separates the policy enforcement point (PEP), decision point (PDP), and information point (PIP) (<a href=\"https://csrc.nist.gov/pubs/sp/800/162/upd2/final\" target=\"_blank\" rel=\"noopener\">NIST SP 800-162: Guide to Attribute Based Access Control (ABAC) Definition and Considerations<\/a>) precisely so that enforcement does not depend on the requesting actor's good behavior. Delegating enforcement to the LLM collapses these into a single untrusted actor. The AI-specific amplifiers are that the agent autonomously discovers, plans, and chains tool invocations, so a single over-scoped tool can be composed into actions its designer never anticipated, and that the model's susceptibility to manipulated input (see Prompt Injection) turns a held over-grant into an externally triggerable one.<\/p><p>The exposure persists wherever a tool holds standing capability beyond least privilege, wherever a tool's constraints are expressed as model instructions rather than as deterministic checks enforced before the action executes, and wherever the granted authority is coarse-grained or long-lived rather than ephemeral and context-scoped per action. The trigger is mechanism-independent: the over-grant is realized by adversarial manipulation of the model, by ambiguity in benign tasks, or simply by the agent operating within its intended-but-too-broad parameters.<\/p><p>This risk is distinct from Rogue Actions, which is the output/action-layer manifestation — the adversarially driven action actually executed via an extension. Over-Scoped Tool Authority is the upstream design condition that sets the blast radius of any such action; it is present and exploitable even when no rogue action has yet occurred, and it is mitigated by design-time controls (scope narrowing, relocation of enforcement out of the model) rather than action-time controls. It is also broader than Agentic Delegation Confused Deputy, which requires asymmetric privilege across a caller/deputy delegation boundary; the over-grant here is a property of a single tool's design and needs no second principal.<\/p><p>Potential impacts include unauthorized data access and exfiltration, destructive or financial actions executed at the tool's full authority, and privilege escalation as over-scoped tools are chained. Because enforcement was delegated to a non-deterministic model, these consequences are hard to bound in advance and degrade accountability for which constraint was supposed to stop the action.<\/p>","atlas":[],"life":["development","deployment","runtime"],"impact":["integrity","confidentiality","accountability"],"dropped":false},"R:riskConsentFatigue":{"t":"R","g":"gRrisksRuntimeInputSecurity","n":"Consent Fatigue in Human Approval Gates","code":"riskConsentFatigue","tip":"Human approval gates degrade as a safety control when agents prompt for consent so frequently that users habituate and approve actions without evaluating them, allowing dangerous operations to proceed.","short":"<p>Human approval gates degrade as a safety control when agents prompt for consent so frequently that users habituate and approve actions without evaluating them, allowing dangerous operations to proceed.<\/p>","long":"<p>Agentic and remote-tooling systems often place a human-in-the-loop approval gate in front of consequential actions, treating user consent as the last line of defense before an action executes. Consent Fatigue is the failure mode of that gate: when the volume, frequency, or uniformity of approval prompts exceeds what a person can meaningfully evaluate, users habituate to the prompt and approve reflexively. The protective value of the gate collapses because the human is no longer exercising judgment — the consent surface still functions mechanically, but the decision behind each approval has become a rubber stamp.<\/p><p>This is the agentic-dress form of a classical usable-security problem: warning fatigue, alert habituation, and the click-through phenomenon long documented for browser security warnings, OS permission dialogs, and SOC alert queues. The established lesson is that a human cannot serve as a reliable fail-safe for a control that fires constantly; effectiveness decays with exposure. The AI-specific amplifier is autonomy and tool breadth: an agent can decompose a single user intent into many tool calls, each potentially gated, producing prompt volumes no traditional application generated, and the prompts are often semantically opaque (a tool name and arguments) so the user cannot cheaply distinguish a routine action from a dangerous one.<\/p><p>The locus is the consent/elicitation surface, not the agent's reasoning or the transport. It is distinct from Rogue Actions, which is the agent taking an adversarially driven action; here the agent may be behaving as designed and the failure is that the human gate meant to catch a bad action waves it through. It is distinct from Runaway Agent Tool Loops, which uses human approval as one possible bound; Consent Fatigue is the risk that the approval lever itself is unreliable as a bound. The underlying condition is a consent surface that issues high-volume, low-context, undifferentiated approval requests and relies on sustained human vigilance to remain effective.<\/p><p>Potential impacts include execution of dangerous or irreversible operations (data deletion, fund transfers, privileged configuration changes) that a vigilant user would have rejected, erosion of the accountability story for agent actions (an approval was recorded but was not a considered decision), and false assurance that a human-in-the-loop control is providing protection it no longer provides.<\/p>","atlas":[],"life":["development","runtime"],"impact":["integrity","safety","accountability"],"dropped":false},"R:riskExcessiveDataHandlingDuringInference":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Excessive Data Handling During Inference","code":"riskExcessiveDataHandlingDuringInference","tip":"Unauthorized collection, retention, processing, or sharing of user data during model inference. This can lead to privacy violations and legal challenges.","short":"<p>Unauthorized collection, retention, processing, or sharing of user data during model inference. This can lead to privacy violations and legal challenges.<\/p>","long":"<p>The collection, retention, or processing of user inputs and session data during runtime that exceeds what is necessary for the immediate task or violates legal or organizational policies.<\/p><p>Excessive Data Handling during inference can create significant privacy risks.<\/p><p>This includes logging entire user conversations, improperly retaining data retrieved by tools, or sharing interaction data with third parties without proper consent or a legal basis.<\/p>","atlas":[],"life":["runtime","maintenance"],"impact":["privacy","compliance","confidentiality"],"dropped":false},"R:riskSensitiveDataDisclosure":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Sensitive Data Disclosure","code":"riskSensitiveDataDisclosure","tip":"Disclosure of sensitive data by the model. Sensitive Data Disclosure poses a threat to user privacy, organizational reputation, and intellectual property.","short":"<p>Disclosure of sensitive data by the model. Sensitive Data Disclosure poses a threat to user privacy, organizational reputation, and intellectual property.<\/p>","long":"<p>Disclosure of private or confidential data through querying of the model.<\/p><p>For non-agentic systems, this data might include memorized training/tuning data,  user chat history, and confidential data in the prompt preamble. Agentic systems  magnify this risk, as they may be granted privileged access to a user's email,  files, or even an entire computer, creating the potential to exfiltrate vast  amounts of personal or corporate data like source code and internal documents.  Sensitive data disclosure is a risk to user privacy, an organization's reputation,  and intellectual property.<\/p><p>Sensitive information is generally disclosed in two ways: leakage of data provided  to the model or agent during use (such as user input and data that passes through  integrated systems, like emails, texts, or system prompts) and leakage of data  used for training and tuning of the model.<\/p><ul><li><b>AI Systems:<\/b> AI systems can leak sensitive data sourced from three primary sources:<\/li><li>Data provided by the user.<\/li><li>Data used in model training and deployment, including system prompts.<\/li><li>Data accessed or produced via tool call responses and external system usage.<\/li><\/ul><ul><li>Data leakage occurs due to gaps in the system, application and deployment security controls and is analogous to the leakage vectors that exist in classical applications.<\/li><\/ul><ul><li>Data leakage can occur through several vectors:<\/li><li><b>Application Logs:<\/b> Logs may store entire interactions, including sensitive data retrieved by tools.<\/li><li><b>Retraining Data:<\/b> User conversations retained for model retraining can create a vulnerable database of sensitive information.<\/li><li><b>Prompt Stealing:<\/b> Attackers can use carefully crafted queries to trick the model into revealing its confidential system prompts or instructions.<\/li><li><b>Memorization:<\/b> A model may inadvertently reveal parts of its training data verbatim. This phenomenon, also called recitation, can expose sensitive details like names, addresses, or other Personally Identifiable Information (PII). Note: The risk of memorization is significantly higher when a model is retrained on private user data and then used by others, as it could expose one user's information to another.<\/li><\/ul><ul><li><b>Agents:<\/b> For agentic systems, the risk of sensitive data disclosure is exponentially multiplied, since agents may access user data that passes through integrated systems, like emails, texts, or proprietary organizational information. In extreme cases, agents can even reveal credentials and API keys they have been trusted with. Additionally, agents may use tools to not only access sensitive data on behalf of the user, but also use those tools to leak sensitive data. For example, an agent can leak information by:<\/li><li>Creating and sharing a document with an attacker.<\/li><li>Writing an email.<\/li><li>Opening a website and leaking information in the URL or a markdown image.<\/li><li>Using any tool that allows it to pass information to the outside world.<\/li><\/ul><ul><li>Context-hijacking attacks show that an adversary can potentially confuse the agent to reveal data that is not appropriate for a specific context, such as sharing health history when the agent should be booking a restaurant reservation.<\/li><\/ul>","atlas":["AML.T0024"],"life":["model-training","evaluation","runtime"],"impact":["confidentiality","privacy"],"dropped":false},"R:riskInferredSensitiveData":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Inferred Sensitive Data","code":"riskInferredSensitiveData","tip":"Model inferring personal information not contained in training data or inputs. Inferred Sensitive Data may be considered a data privacy incident.","short":"<p>Model inferring personal information not contained in training data or inputs. Inferred Sensitive Data may be considered a data privacy incident.<\/p>","long":"<p>Models inferring sensitive information about people that is not contained in the model’s training data.<\/p><p>Inferred information that turns out to be true, even if produced as part of a hallucination, can be considered a data privacy incident, whereas the same information when false would be treated as a factuality issue.<\/p><p>For example, a model may be able to infer information about people (gender, political affiliation, or sexual orientation) based on their inputs and responses from integrated plugins, such as a social media plugin that accesses a public account’s liked pages or followed accounts. Though the data used for inference may be public, this type of inference poses two related risks: that a user may be alarmed if a model infers sensitive data about them, and that one user may use a model to infer sensitive data about someone else.<\/p><p>This risk differs from Sensitive Data Disclosure which involves sensitive data specifically from training, tuning or prompt data.<\/p>","atlas":[],"life":["runtime"],"impact":["privacy","fairness"],"dropped":false},"R:riskEvaluationBenchmarkManipulation":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Evaluation/Benchmark Manipulation","code":"riskEvaluationBenchmarkManipulation","tip":"Poisoned or leaked evaluation sets misleading safety and robustness signals. Evaluation/Benchmark Manipulation can compromise model assessment accuracy and lead to deployment of unsafe or unreliable AI systems.","short":"<p>Poisoned or leaked evaluation sets misleading safety and robustness signals. Evaluation/Benchmark Manipulation can compromise model assessment accuracy and lead to deployment of unsafe or unreliable AI systems.<\/p>","long":"<p>Attacks that compromise the integrity of evaluation datasets, benchmarks, or assessment processes used to measure AI model performance, safety, or robustness, leading to misleading or false quality signals.<\/p><p>Reliable evaluation is critical for assessing AI model capabilities, safety, and robustness before deployment. Attackers can compromise this process by poisoning evaluation datasets with crafted examples, leaking evaluation data to enable overfitting, manipulating benchmark results, or exploiting weaknesses in evaluation methodologies to make models appear safer or more capable than they actually are.<\/p><p>Evaluation manipulation can occur through various vectors including data poisoning of benchmark datasets, insider threats that leak evaluation sets, adversarial examples designed to fool specific evaluation metrics, or systematic gaming of evaluation processes. The impact is particularly severe for safety-critical applications where compromised evaluations could lead to deployment of dangerous systems.<\/p><p>Advanced attacks may target the evaluation infrastructure itself, compromise evaluation frameworks or tools, manipulate automated evaluation pipelines, or exploit biases in evaluation methodologies to achieve favorable but misleading results. These attacks can be difficult to detect and may have long-lasting impacts on model development and deployment decisions.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskPromptResponseCachePoisoning":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Prompt/Response Cache Poisoning","code":"riskPromptResponseCachePoisoning","tip":"Cross-user contamination via shared LLM caches lacking isolation and validation. Prompt/Response Cache Poisoning can lead to information leakage, misinformation propagation, and unauthorized access to cached content.","short":"<p>Cross-user contamination via shared LLM caches lacking isolation and validation. Prompt/Response Cache Poisoning can lead to information leakage, misinformation propagation, and unauthorized access to cached content.<\/p>","long":"<p>Malicious manipulation of shared prompt and response caches used by language model systems to optimize performance, resulting in cross-user contamination and potential security breaches.<\/p><p>Many LLM deployments use caching mechanisms to store frequently accessed prompts and their corresponding responses to reduce computational costs and improve response times. When these caches lack proper isolation, validation, or access controls, attackers can exploit them to inject malicious content, extract sensitive information from other users' sessions, or manipulate responses served to subsequent users.<\/p><p>Cache poisoning attacks can occur through several vectors: injecting crafted prompts designed to pollute cache entries, exploiting weak cache key generation that allows cache collisions, or compromising cache storage systems directly. The attack becomes particularly dangerous when cached responses contain sensitive information, personal data, or malicious instructions that get served to unintended users.<\/p><p>This risk is amplified in multi-tenant environments where multiple users or applications share the same caching infrastructure without adequate isolation. Attackers may also exploit cache timing attacks to infer information about cached content or use cache behavior to fingerprint other users' activities.<\/p>","atlas":["AML.T0080.001","AML.T0057"],"life":[],"impact":[],"dropped":false},"R:riskConcentratedAccessCorrelation":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Concentrated Access Enabling Cross-Service Correlation","code":"riskConcentratedAccessCorrelation","tip":"A single brokering layer that aggregates broadly-scoped access to many disparate services lets a partial compromise correlate data across those services, building a comprehensive profile of the affected users or organizations.","short":"<p>A single brokering layer that aggregates broadly-scoped access to many disparate services lets a partial compromise correlate data across those services, building a comprehensive profile of the affected users or organizations.<\/p>","long":"<p>Agentic systems increasingly route an agent's access to many downstream services — mail, calendar, files, finance, ticketing, CRM — through a single brokering or aggregation layer (an MCP gateway, an A2A or UCP intermediary, or an agentic platform's connector hub) so the agent can compose those services in one session. Concentrated Access Enabling Cross-Service Correlation occurs when that single layer holds simultaneous, broadly-scoped access to disparate services, so a partial compromise of the layer — a leaked token, a confused-deputy invocation, or a foothold on the broker host — yields reach across all of them at once. The attacker then correlates and aggregates data pulled from each service to assemble a comprehensive profile of the affected users or organizations.<\/p><p>This is the agentic expression of a classical principle: the concentration violates segregation of access (<a href=\"https://cwe.mitre.org/data/definitions/653.html\" target=\"_blank\" rel=\"noopener\">CWE-653: Improper Isolation or Compartmentalization<\/a>, Insufficient Compartmentalization) and least-privilege scoping. The privacy harm is the long-studied aggregation problem — individually innocuous records (a calendar entry, a shipping address, a transaction memo) become identifying and exploitable once one actor can join them across previously-segregated systems. A shared single-sign-on broker, an over-scoped OAuth service account, or a data-warehouse account that fronts many backends produces the same single-point cross-service exposure. The AI-specific amplifier is that agentic brokers are designed to hold broad, multi-service scope concurrently and exercise it autonomously without per-step human verification, so the concentrated surface is larger and is exercised continuously rather than on demand.<\/p><p>The exposure is present wherever a single layer mediates access to multiple disparate services without partitioning that access by service, session, or task; wherever the credentials or connection that layer holds are broadly scoped rather than reduced to the minimum services a given task requires; and wherever the data flowing through the broker is not minimized to what each request needs. Any of these lets a foothold confined to one layer become correlated visibility across every service the layer can reach.<\/p><p>This risk is distinct from Sensitive Data Disclosure, which covers the model disclosing sensitive data it already holds; here the harm is an attacker joining factual data across services reachable from one concentrated layer. It is distinct from Inferred Sensitive Data, which is model-side inference of unstated attributes, whereas this is attacker-side correlation of real records. It is distinct from Cross-Tenant Credential Propagation, which is lateral movement across tenant boundaries through shared credentials; this risk is cross-service aggregation within a victim's own authorized scope, concentrated at one layer. It is also distinct from Excessive Data Handling During Inference, which is the platform over-collecting user data, whereas this is an adversary exploiting concentrated breadth of access.<\/p><p>Potential impacts include comprehensive victim profiling that enables sophisticated spear-phishing, extortion, and identity theft, large-scale privacy violation, and compliance exposure (GDPR, sector privacy regimes) arising from the breadth of correlated data a single compromise can reach.<\/p>","atlas":[],"life":["development","deployment","runtime"],"impact":["confidentiality","privacy","compliance"],"dropped":false},"R:riskCredentialAndTokenTheft":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Credential and Token Theft","code":"riskCredentialAndTokenTheft","tip":"Secret material such as OAuth tokens, API keys, and service credentials is exposed through insecure storage, handling, or transmission, letting an attacker who obtains it impersonate a legitimate identity, access protected resources, or escalate privilege.","short":"<p>Secret material such as OAuth tokens, API keys, and service credentials is exposed through insecure storage, handling, or transmission, letting an attacker who obtains it impersonate a legitimate identity, access protected resources, or escalate privilege.<\/p>","long":"<p>Credential and Token Theft is the classical secret-confidentiality failure (<a href=\"https://cwe.mitre.org/data/definitions/522.html\" target=\"_blank\" rel=\"noopener\">CWE-522: Insufficiently Protected Credentials<\/a>) cast in agentic and remote-tooling dress. Agents, orchestration layers, and tool servers (for example MCP, A2A, or UCP endpoints) hold and forward large numbers of secrets — short-lived bearer and OAuth access tokens, long-lived API keys, and service-account credentials — in order to authenticate to downstream tools and services on a caller's behalf. When that secret material is stored in cleartext (<a href=\"https://cwe.mitre.org/data/definitions/312.html\" target=\"_blank\" rel=\"noopener\">CWE-312: Cleartext Storage of Sensitive Information<\/a>), embedded in configuration or environment variables, written to logs, cached in process memory without scrubbing, or transmitted over channels that do not protect confidentiality, an attacker who reads it can replay it directly. Because a bearer token is presented as proof of identity, possession is sufficient: the holder of a stolen token is indistinguishable from the legitimate principal until the token is revoked.<\/p><p>The mechanism is theft of the secret itself, independent of how the secret was acquired. Acquisition vectors include reading secrets at rest (disk, container image, environment, source repository, or backup), harvesting them from logs and error traces, scraping them from process memory or core dumps, and capturing them from insufficiently protected transmission. The impact class is impersonation: with a valid token the attacker authenticates as the victim principal, reuses its authorization, and may pivot to higher privilege if the stolen credential is over-scoped or long-lived. The breach is hard to detect because every downstream request carries a structurally valid credential and the legitimate identity remains enrolled.<\/p><p>This risk is the credential-confidentiality counterpart to several adjacent identity risks and is deliberately scoped to the secret as an asset. It is distinct from MCP Transport Hijacking, which covers attacks on the transport channel itself (man-in-the-middle, session hijacking, replay): transport hijacking is one acquisition vector for a token in transit, whereas this risk centers on the secret's confidentiality across its whole lifecycle, including at rest and in handling where no transport is involved. It is distinct from Cross-Tenant Credential Propagation, which covers the blast radius of shared or insufficiently tenant-scoped credentials spreading laterally after a compromise; that risk concerns propagation of legitimately issued credentials, this one concerns theft of a secret from insecure storage or handling. It is distinct from Stale Agent Identity Binding and Shadow and Unknown Agents, which concern identity-lifecycle binding and registration rather than the confidentiality of secret material. It is distinct from Sensitive Data Disclosure, which covers the model disclosing sensitive data through its outputs; here the stolen asset is an authentication credential used as an access and impersonation primitive, not disclosed content.<\/p><p>Potential impacts include unauthorized access to downstream tools and services under the stolen credential's full authority, exfiltration or manipulation of whatever data and systems the token can reach, and privilege escalation where the stolen credential is over-scoped or long-lived. Because the credential itself is valid, the compromise is difficult to detect and can persist until the token is explicitly revoked or expires.<\/p>","atlas":[],"life":["development","deployment","runtime"],"impact":["confidentiality","integrity"],"dropped":false},"R:riskAgentMemoryPoisoning":{"t":"R","g":"gRrisksRuntimeDataSecurity","n":"Agent Memory Poisoning","code":"riskAgentMemoryPoisoning","tip":"An agent's persistent memory — the store it writes to in one turn and reads back, trusted, in a later one — is corrupted so that a malicious instruction, fabricated fact, or mutable reference outlives the session that planted it and steers the agent's future behavior.","short":"<p>An agent's persistent memory — the store it writes to in one turn and reads back, trusted, in a later one — is corrupted so that a malicious instruction, fabricated fact, or mutable reference outlives the session that planted it and steers the agent's future behavior.<\/p>","long":"<p>Agent Memory Poisoning extends the classical failure of trusting a persistent store without re-validating what was written into it — the same root as configuration or state tampering, where a value accepted once is trusted by every later read. The AI-specific amplifier is that the store in question is Model Memory: a record the agent itself writes from ordinary conversation — a user turn, a tool result, another agent's message — and later re-reads as its own established state. No attacker needs to be present at read time and no code changes; a single accepted write is enough to durably alter the agent's instructions, factual beliefs, or trust assumptions across every session that follows.<\/p><p>The defining property is read-after-write-across-turns: a record planted in one session is read back, trusted, in a later one, so the implant outlives the interaction that created it — a diagnostic for why memory is the interesting locus, not the boundary of the risk, which is scoped to Model Memory, the agent's own persistent record of its interactions and state, not every store an agent happens to write and later read.<\/p><p>Two variants are demonstrated, not merely hypothesized. In the direct-content variant, the malicious payload is written into memory itself — shown by benign-looking queries that induce an agent to persist malicious reasoning a later query retrieves and acts on (<a href=\"https://arxiv.org/abs/2503.03704\" target=\"_blank\" rel=\"noopener\">Memory Injection Attacks on LLM Agents via Query-Only Interaction<\/a>), by optimized trigger-bearing records inserted into an agent's long-term memory or knowledge base (<a href=\"https://arxiv.org/abs/2407.12784\" target=\"_blank\" rel=\"noopener\">AgentPoison: Red-teaming LLM Agents via Poisoning Memory or Knowledge Bases<\/a>), and, in production, by an untrusted webpage that used indirect prompt injection to invoke ChatGPT's memory tool directly, persisting data-exfiltration instructions until OpenAI shipped a fix (<a href=\"https://embracethered.com/blog/posts/2024/chatgpt-macos-app-persistent-data-exfiltration/\" target=\"_blank\" rel=\"noopener\">Spyware Injection Into Your ChatGPT's Long-Term Memory (SpAIware)<\/a>). In the memory-as-pointer variant, memory holds not the payload but a durable reference to externally mutable content trusted once at write time: an agent stored a link to a co-authored \"constitution\" document in its memory file, and after a non-owner edited the document, the agent read back and acted on the inserted instructions (case CS10, \"Agent Corruption\", <a href=\"https://arxiv.org/abs/2602.20021\" target=\"_blank\" rel=\"noopener\">Agents of Chaos<\/a>). This second variant is a time-of-check-to-time-of-use failure: the write-time check validated the reference, not the content it would later resolve to, and nothing re-validated the referent at read time.<\/p><p>This risk is distinct from Retrieval/Vector Store Poisoning, which covers corpora and vector indices the system curates and retrieves under its own authority; Model Memory is instead the agent's own record of interactions, read back as established state rather than retrieved grounding material — the same embedding-based substrate can implement either, so the locus is which role the store plays, not its implementation. It is distinct from Prompt/Response Cache Poisoning, a performance-optimization cache keyed by prompt similarity and invisible to the agent as state, rather than a record the agent deliberately persists and recalls. It is distinct from Prompt Injection, which concerns the model's input-processing boundary within the current context window; a poisoned memory record can originate from a prompt injection, but this risk begins where that one ends — at the moment a write is accepted and persists as trusted state beyond prompt injection's own blast radius. It is distinct from Long-Lived Session State Weakness, which self-scopes to session tokens and cached authorization going stale within a single session; this risk concerns a record surviving across sessions. It is distinct from Tool Source Provenance, which concerns unvetted tool registries and manifests trusted at the tool-selection layer — a different locus entirely.<\/p><p>The exposure is present wherever memory writes are accepted from conversation without provenance or integrity checks distinguishing agent-authored state from user, tool, or peer-agent input; wherever a record resolving to external content is trusted at read time on the strength of a write-time check alone; and wherever memory content re-enters the agent's context without the containment applied to other untrusted input. Impacts include persistent behavioral change across sessions, fabricated beliefs presented as established fact, exfiltration of conversation content to a party the record designates, and — where the poisoned record confers or spoofs authority over peer agents or connected systems — safety-relevant actions taken well outside the interaction that planted the implant.<\/p>","atlas":["AML.T0080.000"],"life":["deployment","runtime"],"impact":["integrity","confidentiality","safety"],"dropped":false},"R:riskInsecureModelOutput":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Insecure Model Output","code":"riskInsecureModelOutput","tip":"Unvalidated model output passed to the end user. Insecure Model Output poses risks to organizational reputation, security, and user safety.","short":"<p>Unvalidated model output passed to the end user. Insecure Model Output poses risks to organizational reputation, security, and user safety.<\/p>","long":"<p>Model output that is not appropriately validated, rewritten, or formatted before being passed to downstream systems or the user.<\/p><p>Whether accidentally triggered or actively exploited, Insecure Model Output poses risks to organizational reputation, security, and user safety.<\/p><p>For example, a user who asks an LLM to generate an email for their business’s promotion would be harmed if the model produces text that unexpectedly includes a link to a URL that delivers malware. Alternatively, a malicious actor could intentionally trigger insecure content, such as requesting the LLM to produce a phishing email based on specific details about the target.<\/p>","atlas":[],"life":["runtime"],"impact":["integrity","safety","reliability"],"dropped":false},"R:riskRogueActions":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Rogue Actions","code":"riskRogueActions","tip":"A model-based agent action executed via an extension that is driven by adversarial manipulation of the model, or of the inputs and metadata it relies on to reason and select actions, or by adversarial amplification of standing over-permission across multi-agent or delegated settings. Rogue Actions c","short":"<p>A model-based agent action executed via an extension that is driven by adversarial manipulation of the model, or of the inputs and metadata it relies on to reason and select actions, or by adversarial amplification of standing over-permission across multi-agent or delegated settings. Rogue Actions can cascade across systems with severe impact on organizational reputation, user trust, security, and safety.<\/p>","long":"<p>Given the projected ability for advanced generative AI models to not only understand their environment, but also to initiate actions with varying levels of autonomy, Rogue Actions have the potential to become a serious risk to organizational reputation, user trust, security, and safety.<\/p><p>Adversarial manipulation of the model, or of the inputs and metadata it relies on to reason and select actions, can arise directly — through Prompt Injection, Data Poisoning, or Model Evasion — or indirectly, through the metadata an agent consults to select a tool rather than the model itself: a compromised tool registry entry (Tool Registry Tampering) or an unvetted, tampered tool source (Tool Source Provenance) can alter a tool's description or schema so the agent selects or invokes a tool the requester never intended. These mechanisms are illustrative, not exhaustive; the facet is the adversarial manipulation itself, wherever it lands. Malicious actions may also be asynchronous: an attacker can plant a dormant \"named trigger\" that activates later during an unrelated task — for instance, a rule hidden in a calendar invite that opens the front door whenever the user says an unrelated keyword. Other actions may be time-based, occurring after a set number of interactions, making the rogue action appear spontaneous and disconnected from the malicious source.<\/p><p>The resulting action can also be amplified through adversarial amplification of standing over-permission the agent already held, across multi-agent and delegated settings: an attacker can hijack the communication between two agents to execute arbitrary malicious code even when the individual agents are secured against direct attacks. That hijack-and-amplify sequence is the only mechanism this entry has for the pattern; no publicly documented incident of it is cited here, and this entry says so rather than reaching for a citation that does not fit.<\/p><p>Rogue Actions are related to Insecure Integrated Components but differ by degree: the more functionality or standing permission an agent has, the greater the severity and blast radius of a rogue action becomes relative to Insecure Integrated Components.<\/p><p>This risk is distinct from Erroneous Agent Action, which covers the complementary case: an agent that was not manipulated, not compromised, and not exercising authority beyond what its task required, whose own planning, reasoning, or environment-sensing selected the wrong action on its own judgement. Rogue Actions is scoped to an action driven by adversarial manipulation of the model, or of the inputs and metadata it relies on to reason and select actions, or by an attacker's adversarial amplification of standing over-permission the agent already held across multi-agent or delegated settings; an action that arises from neither belongs to Erroneous Agent Action instead.<\/p>","atlas":["AML.T0051","AML.T0086"],"life":["runtime"],"impact":["integrity","safety","confidentiality","availability"],"dropped":false},"R:riskOrchestratorRouteHijacking":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Orchestrator/Route Hijack","code":"riskOrchestratorRouteHijacking","tip":"Silent model or route swaps via configuration tampering or prompt-based routing abuse. Orchestrator/Route Hijack can redirect requests to malicious models or compromise routing integrity in AI systems.","short":"<p>Silent model or route swaps via configuration tampering or prompt-based routing abuse. Orchestrator/Route Hijack can redirect requests to malicious models or compromise routing integrity in AI systems.<\/p>","long":"<p>Attacks that manipulate AI orchestration systems, routing mechanisms, or configuration management to redirect requests to unauthorized models, compromise routing decisions, or subvert intended model selection processes.<\/p><p>Modern AI deployments often use orchestration systems that route requests to different models based on various criteria such as prompt content, user context, load balancing, or cost optimization. Attackers can exploit vulnerabilities in these routing systems to redirect traffic to malicious models, compromise routing logic, or manipulate configuration files to alter intended behavior.<\/p><p>Route hijacking attacks can target various components including configuration management systems, routing tables, load balancers, API gateways, or prompt-based routing logic. Malicious actors may inject crafted prompts designed to trigger routing to compromised models, exploit weak authentication in routing decisions, or tamper with configuration files to establish persistent redirections.<\/p><p>The impact of successful route hijacking can be severe, as attackers can redirect users to models under their control, potentially exposing sensitive data, delivering malicious responses, or bypassing safety mechanisms. These attacks may be difficult to detect if the malicious models provide plausible responses while secretly logging data or performing unauthorized actions.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskCovertChannelsInModelOutputs":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Covert Channels in Model Outputs","code":"riskCovertChannelsInModelOutputs","tip":"Hidden information transmission through model outputs or behavior patterns. Covert Channels in Model Outputs can enable unauthorized data exfiltration and steganographic communication bypassing security controls.","short":"<p>Hidden information transmission through model outputs or behavior patterns. Covert Channels in Model Outputs can enable unauthorized data exfiltration and steganographic communication bypassing security controls.<\/p>","long":"<p>Exploitation of AI model outputs, behavior patterns, or response characteristics to establish hidden communication channels for unauthorized information transmission, data exfiltration, or steganographic messaging.<\/p><p>AI models can be exploited to create covert communication channels through various mechanisms including steganographic encoding in generated text, images, or other outputs, subtle manipulation of response timing or patterns, exploitation of model randomness or sampling behavior, or encoding information in model confidence scores or attention patterns.<\/p><p>These attacks can be used to exfiltrate sensitive information from restricted environments, establish command and control channels for malware, bypass network monitoring and data loss prevention systems, or enable unauthorized communication between isolated systems. The covert nature of these channels makes them particularly difficult to detect using traditional security monitoring.<\/p><p>Advanced covert channel attacks may exploit model artifacts such as embedding spaces, latent representations, or internal model states to hide information. Attackers might also use adversarial techniques to encode data in model outputs that appear normal to human observers but contain hidden information extractable through specific decoding methods.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskRetrievalVectorStorePoisoning":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Retrieval/Vector Store Poisoning","code":"riskRetrievalVectorStorePoisoning","tip":"Poisoning retrieval corpora or vector indices to steer RAG outputs. Retrieval/Vector Store Poisoning can compromise the integrity of knowledge retrieval systems and lead to misinformation or malicious content injection.","short":"<p>Poisoning retrieval corpora or vector indices to steer RAG outputs. Retrieval/Vector Store Poisoning can compromise the integrity of knowledge retrieval systems and lead to misinformation or malicious content injection.<\/p>","long":"<p>Malicious modification of retrieval corpora, vector databases, or knowledge bases used in Retrieval-Augmented Generation (RAG) systems to influence model outputs in unintended ways.<\/p><p>This attack involves injecting poisoned documents, embeddings, or metadata into vector stores or retrieval systems that are used to provide context to language models. When users query the system, the poisoned content gets retrieved and incorporated into the model's response, potentially spreading misinformation, biased content, or malicious instructions.<\/p><p>Attackers may exploit vulnerabilities in data ingestion pipelines, compromise data sources, or use adversarial techniques to craft documents that rank highly in similarity searches while containing harmful content. The attack can be particularly effective because users often trust retrieved information as factual and authoritative.<\/p><p>Vector store poisoning can also involve manipulating embedding spaces through adversarial examples that appear semantically similar to legitimate queries but retrieve malicious content, or by exploiting weaknesses in similarity metrics used for retrieval ranking.<\/p>","atlas":["AML.T0070"],"life":[],"impact":[],"dropped":false},"R:riskUnsandboxedCodeExecution":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Unsandboxed Execution of Model-Generated Code","code":"riskUnsandboxedCodeExecution","tip":"Code and commands emitted by a model are executed on the host with the full privileges of the invoking user instead of inside a confined, least-privilege sandbox, so even non-malicious but hallucinated or buggy generations can damage the host environment, read or destroy local data, or pivot to adja","short":"<p>Code and commands emitted by a model are executed on the host with the full privileges of the invoking user instead of inside a confined, least-privilege sandbox, so even non-malicious but hallucinated or buggy generations can damage the host environment, read or destroy local data, or pivot to adjacent systems.<\/p>","long":"<p>AI systems increasingly generate executable artifacts — shell commands, scripts, SQL, or program code (<a href=\"https://cwe.mitre.org/data/definitions/94.html\" target=\"_blank\" rel=\"noopener\">CWE-94: Improper Control of Generation of Code (Code Injection)<\/a>) — that are then run to satisfy a user request or to complete an agent's task. Unsandboxed Execution of Model-Generated Code occurs when that execution happens directly in the host environment with the ambient privileges of the calling user or service account, rather than within an isolation boundary (container, microVM, restricted subprocess, or capability-confined runtime) that bounds what the generated code may touch.<\/p><p>This risk is a host-hardening and execution-isolation failure, not an output-validation failure. The triggering artifact does not need to be adversarial: model output is non-deterministic and may contain hallucinations, logic errors, or unsafe operations (recursive deletes, overly broad globs, destructive migrations) that a reviewed human-authored change would not contain. Because the execution context grants full user privileges (<a href=\"https://cwe.mitre.org/data/definitions/250.html\" target=\"_blank\" rel=\"noopener\">CWE-250: Execution with Unnecessary Privileges<\/a>) and no sandbox interposes, a single faulty generation can corrupt or delete data, exhaust or reconfigure the host, or expose credentials reachable from that privilege level. Where the generation is additionally attacker-influenced (for example via prompt injection), the same missing isolation boundary is what converts a manipulated instruction into host compromise.<\/p><p>Generalized beyond any single tooling protocol, the locus is the execution sandbox (or its absence) on the host where a model-driven or remote-tooling workflow runs generated code. Classical practice confines such execution with least-privilege service accounts, OS-level sandboxing (seccomp, namespaces, containers, microVMs), filesystem and network egress restrictions, and ephemeral throwaway environments. The AI-specific dimension is that the code author is a probabilistic model invoked at runtime without human review of each generation, so the blast radius of the execution context — not the trustworthiness of a specific author — becomes the controlling factor.<\/p><p>This risk is distinct from Insecure Model Output, which covers unvalidated model output reaching a user or downstream system; here the concern is that the output is executed as code and the host lacks an isolation boundary to contain the result. It is distinct from Rogue Actions, which covers manipulation or over-permissioning of the agent's action selection; this risk concerns the privilege and confinement of the host process that runs whatever code is produced, and applies even when the action selected is benign. It is distinct from Runaway Agent Tool Loops, which covers resource exhaustion through recursive tool-calling rather than the host-execution privilege boundary.<\/p><p>Potential impacts include destruction or corruption of local data and configuration, disclosure of credentials or secrets reachable at the execution privilege level, lateral movement to systems the host can reach, and reduced host availability. Impact severity scales directly with the privileges of the execution context, which is why confinement and least-privilege execution are the controlling mitigations.<\/p>","atlas":[],"life":["development","deployment","runtime"],"impact":["integrity","availability","confidentiality","safety"],"dropped":false},"R:riskErroneousAgentAction":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Erroneous Agent Action","code":"riskErroneousAgentAction","tip":"An agent, acting within its granted authority and with no adversarial interference, causes harm by choosing the wrong action — a mistake in its own task planning, reasoning, or environment sensing. Erroneous Agent Action can expose private data, disrupt or destroy systems the agent legitimately cont","short":"<p>An agent, acting within its granted authority and with no adversarial interference, causes harm by choosing the wrong action — a mistake in its own task planning, reasoning, or environment sensing. Erroneous Agent Action can expose private data, disrupt or destroy systems the agent legitimately controls, and undermine user trust and safety.<\/p>","long":"<p>An agent executes a harmful action not because it was tricked, delegated to improperly, or granted excessive standing capability, but because its own reasoning, plan, or reading of the environment was wrong. The agent was permitted and intended to act, and held enough autonomy for a high-impact, hard-to-reverse action to execute on its own judgement alone — the harm is not that it exceeded its authority, but that its own judgement, within that authority, selected the wrong action. Classically this is a non-adversarial threat source: NIST's taxonomy of threat sources places ACCIDENTAL — \"Erroneous actions taken by individuals in the course of executing their everyday responsibilities\" — alongside ADVERSARIAL, STRUCTURAL and ENVIRONMENTAL (<a href=\"https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-30r1.pdf\" target=\"_blank\" rel=\"noopener\">NIST SP 800-30 Rev. 1: Guide for Conducting Risk Assessments (Table D-2, Taxonomy of Threat Sources)<\/a>), and it is the ACCIDENTAL class this risk belongs to; the AI-specific extension is that the erroneous actor is the agent itself, acting on its own judgement within authority it was correctly granted.<\/p><p>Ambiguity alone is a common trigger. Even a benign instruction can resolve incorrectly — an agent asked to email \"Mike\" about a sensitive matter may address the wrong \"Mike,\" unintentionally sharing private data with someone who was never meant to receive it. LLM output variability compounds this: research shows even the spacing and ordering of examples in a prompt can shift a model's output, so unremarkable variation in benign input can still produce an unexpected, harmful action.<\/p><p>A harder failure mode is correct values applied with catastrophically poor judgment: an agent can correctly perceive the ethical stakes of a situation and still select a wildly disproportionate, hard-to-reverse means of acting on them — a self-directed action the agent itself proposed and then executed, within its own authorized scope, when far less drastic options were available (demonstrated in a controlled agentic deployment study — see Examples).<\/p><p>This risk is distinct from Rogue Actions, scoped to actions driven by adversarial manipulation or amplified over-permission; here the agent is not manipulated, not compromised, and not exceeding its authority — its own planning, reasoning, or environment-sensing is the point of failure. It is distinct from Insecure Model Output, an unvalidated or unformatted output failure that precedes any action; this risk concerns an action actually taken in the world, correctly formed and executed, that was simply the wrong one. It is distinct from Prompt Injection, whose defining property is an externally supplied or adversarially crafted instruction changing the model's behavior; this risk excludes any such input by definition. It is distinct from Agentic Delegation Confused Deputy, which requires an asymmetric privilege boundary between a caller and a higher-privileged deputy that fails to validate the caller's authority; this risk can occur in a single-agent, single-principal setting with no delegation at all. It is distinct from Over-Scoped Tool Authority, the upstream design condition of a tool holding more standing authority than any task requires, present whether or not an action has ever occurred; this risk is the action-time realization of an agent exercising its own — potentially correctly-scoped — authority badly. It is also distinct from Unconsented Agent Action Execution, whose defining failure is an absent, mis-scoped, or degraded consent checkpoint before a consequential action — there the action may be exactly what the agent intended; here a consent checkpoint may be present, absent, or irrelevant, and the failure is that the agent's own reasoning selected the wrong action. The two compose: a properly scoped consent checkpoint can catch an erroneous action before execution, and an entirely correct decision can still execute without required consent.<\/p><p>Potential impacts include unintended disclosure of sensitive information, destruction or disruption of systems and services an agent has legitimate authority over, and degraded organizational reputation and user trust. Because the failure originates in the agent's own reasoning rather than an external attack, it can occur even in a fully patched, fully authorized, fully audited system — placing the burden of mitigation on bounding what a single erroneous decision can do and catching it quickly, rather than on excluding an adversary.<\/p>","atlas":[],"life":["runtime"],"impact":["confidentiality","integrity","availability","safety"],"dropped":false},"R:riskDeceptiveAgentReporting":{"t":"R","g":"gRrisksRuntimeOutputSecurity","n":"Deceptive Agent Reporting","code":"riskDeceptiveAgentReporting","tip":"An agent reports a task complete or successful while the system state it describes contradicts that report. The record is generated through the agent's own sanctioned reporting path and the audit trail carrying it is intact; what is false is the content of the report, not the integrity of the log th","short":"<p>An agent reports a task complete or successful while the system state it describes contradicts that report. The record is generated through the agent's own sanctioned reporting path and the audit trail carrying it is intact; what is false is the content of the report, not the integrity of the log that carries it.<\/p>","long":"<p>Deceptive Agent Reporting is the gap between an agent's own natural-language claim about what it did and the programmatic state of the environment it acted on. The record generated is not corrupted: it is a complete, tamper-evident account of a self-report that is itself false, produced through the agent's ordinary, sanctioned reporting path rather than injected or altered by an adversary. A large-scale study of agentic coding benchmarks names this class <i>false success<\/i> — a mismatch between an agent's claim of task completion and a ground-truth signal recorded independently of the agent's own language (<a href=\"https://arxiv.org/abs/2606.09863\" target=\"_blank\" rel=\"noopener\">From Confident Closing to Silent Failure: Characterizing False Success in LLM Agents<\/a>). Across roughly 11,750 analyzed trajectories spanning two benchmarks and twelve model families, the study's abstract reports that 45-48% of failures in single-control domains carried an explicit, false completion claim; within one coding-agent corpus of already-failed trajectories, 75.8% of those making any explicit status claim still falsely asserted success.<\/p><p>What makes the failure dangerous is structural rather than incidental: a false success claim is indistinguishable in form from a true one — the same fluent, confident statement produced through the same channel — so no property of the report itself separates the honest case from the deceptive one; only comparison against independently observed state can. This is why the failure defeats human attention and automated monitoring alike: reviewers extend the same trust to both, and LLM-judge monitors keyed on surface completion proxies — confident closing language on one benchmark, coarse action-sequence volume on the other — reach no better than an AUROC of 0.65 and 0.54 respectively, because neither proxy tracks whether the claimed outcome occurred. Lightweight detectors that compare the claim directly against programmatic state do far better, reaching a task-disjoint AUROC of 0.83 and 0.95 — evidence that the fix is comparison against independent state, not a better-tuned reading of the claim's language.<\/p><p>The harm lands on whoever advances on the strength of the report rather than the state it describes. An orchestrator schedules a dependent step because a prior one reported <i>complete<\/i>; an operator stands down an escalation because the agent said the issue was resolved; a downstream agent skips a retry because the upstream claim was success; a compliance attestation is built on a self-reported status never checked against what actually happened. In each case the reliant party had no reason to doubt the report — it read exactly like every honest one that preceded it — and the harm materializes only once the gap between claim and state is acted on by someone else. A self-report that cannot be trusted degrades the reliability of every workflow keyed on it.<\/p><p>This risk is distinct from Audit Trail Tampering, an adversary destroying, suppressing, or redirecting the evidentiary record itself; here the record is generated through the sanctioned path and remains complete and unaltered, and what is false is the content of the self-report it faithfully carries. The <i>integrity<\/i> this risk carries as an impact class is the accuracy of the claim's content, not the tamper-evidence of the log that carries it. It is distinct from Erroneous Agent Action, mistakes in an agent's own task planning, reasoning, or environment sensing, and from Rogue Actions, adversarially driven wrong actions: each of those risks' harm is the wrong action being taken; this risk's harm occurs after an action — correctly or incorrectly taken — in the account rendered of it, landing on accountability and transparency instead. A system can select and execute exactly the right action and still realize this risk by reporting an outcome that never occurred. It is distinct from Insecure Model Output, unvalidated or unformatted content passed downstream before any action completes; this risk concerns a claim about an action already taken, well-formed and validly formatted, that is false only as an account of the world.<\/p>","atlas":[],"life":["runtime"],"impact":["accountability","transparency","integrity","reliability"],"dropped":false},"R:riskModelExfiltration":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Model Exfiltration","code":"riskModelExfiltration","tip":"Theft of a model. Similar to stealing code, this threat has both intellectual property and security implications.","short":"<p>Theft of a model. Similar to stealing code, this threat has both intellectual property and security implications.<\/p>","long":"<p>Unauthorized appropriation of an AI model, for replicating functionality or to extract intellectual property.<\/p><p>Similar to stealing code, this threat has intellectual property, security, and privacy implications.<\/p><p>For example, someone could hack into a cloud environment and steal a generative AI model; the model size when serialized is fairly modest and not a major obstacle for this. Models, and related data such as weights, are also at risk of theft in the internal development, build, deployment, and production environments by insiders and external attackers that have taken over privileged insider accounts.<\/p><p>These risks also extend to on-device models, where an attacker has access to hardware.<\/p><p>This risk is distinct from the related Model Reverse Engineering.<\/p>","atlas":["AML.T0024.002","AML.T0025","AML.T0048.004"],"life":["deployment","runtime","model-training","evaluation","maintenance"],"impact":["confidentiality","integrity","privacy"],"dropped":false},"R:riskModelDeploymentTampering":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Model Deployment Tampering","code":"riskModelDeploymentTampering","tip":"Unauthorized changes to model deployment components. Model Deployment Tampering can result in changes to model behavior.","short":"<p>Unauthorized changes to model deployment components. Model Deployment Tampering can result in changes to model behavior.<\/p>","long":"<p>Unauthorized modification of components used for deploying a model, whether by tampering with the source code supply chain or exploiting known vulnerabilities in common tools.<\/p><p>Such modifications can result in changes to model behavior.<\/p><p>One type of Model Deployment Tampering is candidate model modification where the attacker is modifying the deployment workflow or processes to maliciously alter the way the model operates post-deployment.<\/p><p>A second type is compromise of the model serving infrastructure. For example, it was reported that PyTorch models were vulnerable to remote code execution (<a href=\"https://thehackernews.com/2023/10/warning-pytorch-models-vulnerable-to.html\" target=\"_blank\" rel=\"noopener\">Warning: PyTorch Models Vulnerable to Remote Code Execution via ShellTorch<\/a>) due to multiple critical security flaws in the <b>TorchServe<\/b> tool that is widely used for serving the models. This is an attack on a serving infrastructure for PyTorch, TorchServe, whereas the PyTorch example of Model Source Tampering (<a href=\"https://pytorch.org/blog/compromised-nightly-dependency/\" target=\"_blank\" rel=\"noopener\">Compromised PyTorch-nightly dependency chain between December 25th and December 30th, 2022<\/a>) was about a supply chain attack on dependency code for PyTorch itself.<\/p>","atlas":["AML.T0010.003","AML.T0049","AML.T0051"],"life":["deployment","runtime"],"impact":["integrity","availability","safety"],"dropped":false},"R:riskModelReverseEngineering":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Model Reverse Engineering","code":"riskModelReverseEngineering","tip":"Recreating a model by analyzing its inputs, outputs, and behaviors. A reverse engineer model can be used to create imitation products or adversarial attacks.","short":"<p>Recreating a model by analyzing its inputs, outputs, and behaviors. A reverse engineer model can be used to create imitation products or adversarial attacks.<\/p>","long":"<p>Cloning or recreating a model by analyzing a model's inputs, outputs, and behaviors.<\/p><p>The stolen or cloned model can be used for building imitation products or developing adversarial attacks (<a href=\"https://arxiv.org/abs/2004.15015\" target=\"_blank\" rel=\"noopener\">Imitation Attacks and Defenses for Black-box Machine Translation Systems<\/a>) on the original model.<\/p><p>If a model API does not have rate limits, one method of Model Reverse Engineering is repeatedly calling the API to gather responses in order to create a dataset of thousands of input/output pairs from a target LLM. This dataset can be leveraged to reconstruct a copycat or distilled model more cheaply than developing the original foundation model.<\/p><p>These risks also extend to on-device models, where an attacker has access to hardware. See also Model Exfiltration.<\/p>","atlas":["AML.T0024.002","AML.T0005","AML.T0048.004"],"life":["runtime"],"impact":["confidentiality","integrity"],"dropped":false},"R:riskInsecureIntegratedComponent":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Insecure Integrated Component","code":"riskInsecureIntegratedComponent","tip":"Software vulnerabilities that can be leveraged to compromise AI models. Insecure Integrated Component can lead to privacy and security concerns, as well as potential ethical and legal challenges.","short":"<p>Software vulnerabilities that can be leveraged to compromise AI models. Insecure Integrated Component can lead to privacy and security concerns, as well as potential ethical and legal challenges.<\/p>","long":"<p>Vulnerabilities in software interacting with AI models, such as a plugin, library, or application, that can be leveraged by attackers to gain unauthorized access to models, introduce malicious code, or compromise system operations.<\/p><p>Given the level of autonomy expected to be granted to agent/plugins and applications, insecure integrated components represent a broad swath of threats to user trust and safety, privacy and security concerns, and ethical and legal challenges.<\/p><p>This risk can come from manipulation of both inputs to and outputs from integrations:<\/p><ul><li>Manipulation of <b>model output<\/b> to include malicious instructions fed as <b>input to the integrated component or system<\/b>. For example, a plugin that accepts freeform text instead of structured and validated input could be exploited to construct inputs that cause the plugin to behave maliciously. Likewise, a plugin that accepts input without authentication and authorization can be exploited since it trusts input as coming from an authorized user.<\/li><li>Manipulation of the <b>output from an integrated component or system<\/b> that is fed as <b>input to a model<\/b>. For example, when a plugin calls other systems, especially 3rd party services, sites, or plugins, and uses content obtained from those to construct output to a model, opening up potential for indirect prompt injection. A similar case exists for an integrated application that calls another service and uses content from that service to construct an input to a model.<\/li><\/ul><p>In agentic systems using the Model Context Protocol, tool parameters passed by agents to MCP servers represent a specific injection surface. MCP payloads include structured data (JSON schemas, file paths, SQL fragments) that may be trusted after tool selection without further validation. Classical injection attacks — command injection, path traversal, SQL injection, unsafe deserialization — can reach backend systems through this path when MCP servers fail to validate and sanitize parameters independently of the agent's intent.<\/p><p>Insecure Integrated Component is related to Prompt Injection but these are different. Although attacks exploiting an Insecure Integrated Component often involve prompt injection, those could be also done via other means such as Poisoning and Evasion. In addition, prompt injection is possible even when the integrated components are secure.<\/p>","atlas":["AML.T0051","AML.T0049"],"life":["development","deployment","runtime"],"impact":["confidentiality","integrity","availability","safety"],"dropped":false},"R:riskAcceleratorAndSystemSideChannels":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Accelerator and System Side-channels","code":"riskAcceleratorAndSystemSideChannels","tip":"Cross-tenant leakage via hardware side-channels in CPUs, GPUs, TPUs, memory systems, and interconnects. These vulnerabilities exploit timing, cache, speculative execution, and memory access patterns to compromise data confidentiality and infer sensitive information in shared computing environments.","short":"<p>Cross-tenant leakage via hardware side-channels in CPUs, GPUs, TPUs, memory systems, and interconnects. These vulnerabilities exploit timing, cache, speculative execution, and memory access patterns to compromise data confidentiality and infer sensitive information in shared computing environments.<\/p>","long":"<p>In cloud and multi-tenant environments, AI systems rely on complex, shared hardware stacks. This resource sharing creates opportunities for side-channel attacks, where one tenant can exploit the physical properties of the hardware (like timing variations or cache behavior) to infer sensitive information from another tenant.<\/p><p>Examples of these vulnerabilities are well-known: CPU-level attacks include cache timing (Flush+Reload) and speculative execution (Spectre, Meltdown), while memory attacks target DRAM (Rowhammer) or bus contention. Accelerators like GPUs and TPUs have their own vulnerabilities, exploiting shared memory, execution units, or interconnects.<\/p><p>An attacker can exploit these channels to extract sensitive AI assets, including model weights, training data, private inputs, or cryptographic keys. These attacks bypass traditional software-based security by exploiting fundamental hardware properties. The risk is highest in shared environments  where an attacker can co-locate their workload with a victim's.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskAdapterPEFTInjection":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Adapter/PEFT Injection","code":"riskAdapterPEFTInjection","tip":"Trojaned adapters merged at runtime to bypass safety or exfiltrate data. Adapter/PEFT Injection can compromise model behavior and enable unauthorized access to sensitive information or system resources.","short":"<p>Trojaned adapters merged at runtime to bypass safety or exfiltrate data. Adapter/PEFT Injection can compromise model behavior and enable unauthorized access to sensitive information or system resources.<\/p>","long":"<p>Malicious injection of compromised adapters, LoRA modules, or Parameter-Efficient Fine-Tuning (PEFT) components that contain backdoors, trojans, or malicious functionality designed to subvert model behavior or extract sensitive information.<\/p><p>Modern AI systems increasingly use adapter-based approaches like LoRA (Low-Rank Adaptation), prefix tuning, or other PEFT methods to customize foundation models for specific tasks without full retraining. These adapters are often shared through repositories, marketplaces, or collaborative platforms, creating opportunities for supply chain attacks where malicious actors distribute trojaned adapters.<\/p><p>Compromised adapters can be designed to activate under specific trigger conditions, bypass safety guardrails, exfiltrate sensitive data from prompts or model states, or redirect model outputs to serve attacker objectives. The modular nature of adapters makes detection challenging since the malicious functionality may only manifest under specific conditions or inputs.<\/p><p>Runtime adapter injection attacks can also exploit vulnerabilities in adapter loading mechanisms, merge processes, or dynamic adapter switching to inject malicious components into otherwise secure model deployments. These attacks may target adapter repositories, compromise distribution channels, or exploit weak verification processes.<\/p>","atlas":[],"life":[],"impact":[],"dropped":false},"R:riskToolRegistryTampering":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Tool Registry Tampering","code":"riskToolRegistryTampering","tip":"Compromise of previously vetted tool registries, MCP server manifests, or tool metadata, causing agents to select and invoke unintended tools through altered descriptions, schemas, or shadowed tool names.","short":"<p>Compromise of previously vetted tool registries, MCP server manifests, or tool metadata, causing agents to select and invoke unintended tools through altered descriptions, schemas, or shadowed tool names.<\/p>","long":"<p>Even when tool registries and MCP server manifests have been properly vetted and approved, they remain targets for post-vetting compromise. Attackers who gain access to a trusted registry can alter tool descriptions, modify schemas, or inject shadowed tool entries that redirect agent tool selection.<\/p><p>This risk is distinct from Tool Source Provenance, which addresses the use of unvetted sources. Tool Registry Tampering assumes the source was properly vetted but was subsequently compromised. The trust model is different: Tool Source Provenance is a failure to verify, while Tool Registry Tampering is a failure of ongoing integrity assurance.<\/p><p>Tool Registry Tampering is structurally related to Orchestrator/Route Hijack, which targets model routing configuration. Both involve tampering with metadata that directs system behavior, but Orchestrator/Route Hijack operates on model routing infrastructure while Tool Registry Tampering operates on tool discovery and selection mechanisms. A successful Tool Registry Tampering exploit typically manifests as Rogue Actions.<\/p><p>The attack surface includes tool registry databases, MCP server manifest files, schema definition endpoints, and discovery service APIs. Compromise may be persistent (modified registry entries) or transient (man-in-the-middle on discovery endpoints). Detection requires runtime integrity monitoring of tool metadata against known-good baselines. The exposure is widest where a previously vetted registry or manifest can be modified without raising an integrity alert, where unauthorized changes to tool descriptions, schemas, or metadata go unnoticed after initial registration, and where tooling lets a tool revise its own description or capabilities without explicit re-approval — each case leaving no signal between the post-vetting change and the agent acting on it.<\/p><p>Insecure Integrated Component addresses vulnerabilities in the tools themselves. Tool Registry Tampering is complementary: it addresses the metadata that causes the agent to select a particular tool, regardless of whether the selected tool is itself secure.<\/p>","atlas":["AML.T0010.004"],"life":["deployment","runtime"],"impact":["confidentiality","integrity","safety"],"dropped":false},"R:riskAgentDelegationChainOpacity":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Agent Delegation Chain Opacity","code":"riskAgentDelegationChainOpacity","tip":"Multi-hop agent delegation chains become opaque when intermediate agents do not emit structured delegation events, making it impossible to determine which human, agent, or system authorized or performed an action — even when individual authentication steps succeed.","short":"<p>Multi-hop agent delegation chains become opaque when intermediate agents do not emit structured delegation events, making it impossible to determine which human, agent, or system authorized or performed an action — even when individual authentication steps succeed.<\/p>","long":"<p>Agentic systems frequently involve multi-hop delegation where one agent acts on behalf of another (or a human) across tools and MCP servers. Agent Delegation Chain Opacity occurs when the delegation chain is cryptographically valid — each hop holds a properly scoped token — but invisible to forensics because intermediate agents do not emit structured delegation events. The root cause is the absence of structured delegation event emission at each hop, not the failure of individual authentication steps.<\/p><p>This risk extends classical identity federation accountability failures to the agentic domain. In traditional systems, delegation chain integrity is a known challenge: Kerberos constrained delegation struggles with tracing initiators through multiple hops, multi-hop OAuth OBO flows lose the original actor claim when intermediate services fail to propagate it, and RFC 8693 Token Exchange is vulnerable to delegation chain splicing where a compromised intermediary can forge chains that never occurred. The AI-specific amplifier is that agentic orchestration creates delegation chains that are longer, more dynamic, and less predictable than classical flows — agents may spawn sub-agents autonomously based on LLM reasoning, the chain topology is not known at design time, and intermediate agents make non-deterministic decisions about whether and how to delegate.<\/p><p>The vulnerability manifests through missing or incomplete delegation metadata at the IAM, orchestration, or MCP layers — for example, omitting the original caller, intermediate agents, or token exchange steps in log records. Even when individual agents authenticate correctly, the provenance of a given action becomes opaque if correlation IDs and delegation context are not preserved in immutable, queryable logs. A system is exposed when an agent action does not carry an immutable delegation chain with correlation IDs, when intermediate agents do not emit structured delegation events that downstream consumers and auditors can independently verify, or when the delegation logs are themselves mutable or readable beyond the set of authorized auditors.<\/p><p>Potential impacts include inability to investigate incidents — the full actor path, from the originating human through each intermediate agent to the tool that acted, cannot be reconstructed after the fact — inability to attribute actions for compliance or forensics, failure to detect broken, shadowed, or otherwise anomalous delegation chains in real time, and inability to perform effective credential revocation for a specific delegation chain. Consequences include accountability failures, regulatory violations, prolonged breach dwell time, and erosion of trust in autonomous agent systems.<\/p><p>This risk is distinct from Rogue Actions, which addresses adversarially driven agent actions; Agent Delegation Chain Opacity addresses the inability to determine who authorized the action. Agentic Delegation Confused Deputy addresses authorization failure at delegation boundaries; this risk addresses vi
