sibility failure across the full chain. Cross-Tenant Credential Propagation addresses credential propagation across tenant boundaries, which may be a consequence of delegation chain opacity but is a distinct threat surface.<\/p>","atlas":[],"life":["deployment","runtime","maintenance"],"impact":["accountability","compliance","integrity"],"dropped":false},"R:riskStaleAgentIdentityBinding":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Stale Agent Identity Binding","code":"riskStaleAgentIdentityBinding","tip":"Agent identity credentials persist unchanged after the underlying model artifact is replaced, allowing a substituted model to operate with the original agent's full permissions because no cryptographic binding ties identity to a specific model version.","short":"<p>Agent identity credentials persist unchanged after the underlying model artifact is replaced, allowing a substituted model to operate with the original agent's full permissions because no cryptographic binding ties identity to a specific model version.<\/p>","long":"<p>In agentic systems, agents are assigned persistent identities with associated credentials and OAuth/MCP tokens granting access to tools and resources. Stale Agent Identity Binding occurs when the underlying model (weights, architecture, or inference endpoint) is replaced without invalidating the agent's credentials or identity. The substituted model inherits the original agent's full privileges because agent identity and model artifact exist on separate infrastructure layers with no cryptographic binding between them. The exposure is present wherever an agent identity is not cryptographically bound to a specific signed model artifact or manifest, wherever a model update or swap does not automatically invalidate or re-scope the agent's credentials, and wherever no runtime attestation of the model artifact precedes tool authorization — leaving no point at which a substitution that occurs after credential issuance would be detected.<\/p><p>This risk is the AI/agentic extension of classical stale credential binding failures. In Kubernetes, long-lived service account tokens persist after pods are replaced — a new pod running entirely different code inherits the previous workload's identity and RBAC permissions. In container orchestration, mutable image tags allow the artifact behind a tag to be replaced while the service identity persists unchanged. In VM environments, machine clones inherit the original's domain credentials and certificates. The AI-specific amplifier is that agent identity and model artifact are managed by entirely separate infrastructure layers (IAM vs. model serving) with no standard binding mechanism. A model can be swapped through supply-chain compromise, container replacement, or CI/CD manipulation, and the agent's credentials remain valid because the identity layer has no awareness of the artifact layer.<\/p><p>This risk is distinct from Model Source Tampering and Model Deployment Tampering, which cover the tampering mechanics themselves. Stale Agent Identity Binding covers the identity lifecycle failure that persists after a swap — the agent continues to authenticate with valid credentials regardless of the model behind it. Shadow and Unknown Agents addresses agents that were never registered; this risk addresses registered agents whose identity binding becomes stale after the underlying artifact changes.<\/p><p>Potential impacts include stealthy behavioral changes (data exfiltration, decision manipulation) under legitimate identity, compromise of connected tools and MCP servers, and accountability failures because actions are attributed to the original authorized model. Consequences include loss of integrity, safety incidents, regulatory violations, and systemic distrust in deployed agentic systems.<\/p>","atlas":["AML.T0012"],"life":["deployment","runtime","maintenance"],"impact":["integrity","confidentiality","accountability","compliance"],"dropped":false},"R:riskMCPTransportHijacking":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"MCP Transport Hijacking","code":"riskMCPTransportHijacking","tip":"Transport-layer attacks on MCP connections — including man-in-the-middle, session hijacking, DNS rebinding, and replay — intercept or modify agent-to-tool communication because the MCP specification does not mandate transport encryption or mutual authentication.","short":"<p>Transport-layer attacks on MCP connections — including man-in-the-middle, session hijacking, DNS rebinding, and replay — intercept or modify agent-to-tool communication because the MCP specification does not mandate transport encryption or mutual authentication.<\/p>","long":"<p>The Model Context Protocol enables agents to discover and invoke tools by communicating with MCP servers over HTTP or stdio. MCP Transport Hijacking occurs when these connections lack transport-layer protections, allowing attackers to intercept, modify, or replay messages between the agent and the tool server.<\/p><p>This risk extends classical transport-layer attacks to the MCP protocol. TLS stripping, man-in-the-middle interception, and DNS rebinding against locally-running services are well-documented attack patterns. The AI-specific amplifier is that the MCP specification (2025-11-25) does not mandate TLS for Streamable HTTP connections, uses \"SHOULD\" rather than \"MUST\" for authentication and localhost binding, and provides zero transport security for the stdio transport. Agents autonomously connect to MCP servers discovered at runtime without human verification of transport security properties. Session identifiers transmitted in HTTP headers are exposed to interception without mandatory TLS.<\/p><p>Attack vectors include man-in-the-middle on unencrypted or weakly configured MCP connections, DNS rebinding against locally-running MCP servers (acknowledged in the MCP specification's own Security Warning), replay of captured JSON-RPC messages, and session hijacking via intercepted session identifiers. Each of these vectors exploits a gap in transport-layer protection: connections that do not enforce mutual TLS, session tokens that are not bound to transport-layer identifiers, sessions that are long-lived or that lack replay protection, and servers that do not validate the Origin header on incoming connections to block DNS rebinding.<\/p><p>This risk is distinct from Insecure Integrated Component, which covers vulnerabilities within MCP server implementations (e.g., path traversal). This risk covers the transport channel between agent and server. It is distinct from Orchestrator/Route Hijack, which covers routing and configuration manipulation. It is distinct from Tool Registry Tampering, which covers integrity of tool registration and discovery.<\/p><p>Potential impacts include theft of tool schemas and sensitive data flowing between agents and tools, injection of malicious tool responses, unauthorized execution of agent actions, and compromise of the entire agent workflow. The breach may be difficult to detect because the agent identity remains valid while its communication channel is compromised.<\/p>","atlas":[],"life":["deployment","runtime"],"impact":["confidentiality","integrity"],"dropped":false},"R:riskShadowAndUnknownAgents":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Shadow and Unknown Agents","code":"riskShadowAndUnknownAgents","tip":"Unregistered agents operate with inherited or valid credentials outside identity lifecycle controls, creating persistent blind spots in agentic systems.","short":"<p>Unregistered agents operate with inherited or valid credentials outside identity lifecycle controls, creating persistent blind spots in agentic systems.<\/p>","long":"<p>In dynamic agentic environments, agents can be created ad-hoc or spawned through orchestration layers without central registration. Shadow and Unknown Agents describes the risk when these unregistered agents retain or inherit credentials and tokens, allowing them to interact with tools and MCP servers undetected. This breaks the identity lifecycle and creates persistent blind spots in monitoring, attribution, and revocation.<\/p><p>This risk is the AI-specific extension of two classical security challenges: Shadow IT (unauthorized systems operating outside governance processes) and orphaned account management (failure to tombstone decommissioned credentials). The key AI-specific amplifier is that orchestration layers can dynamically spawn credentialed agents without human approval — a capability with no direct classical equivalent.<\/p><p>The vulnerability arises from incomplete provisioning controls, credential reuse across sessions, or weak network isolation. Attack vectors include compromised orchestration components that spawn hidden agents and failure to decommission old agent instances (creating \"zombie\" agents). Supply-chain injection of backdoored agent templates is a related vector addressed by Tool Source Provenance and Tool Registry Tampering; this risk covers the downstream identity lifecycle failure when such agents persist undetected. The exposure is present where agents receive credentials without first registering with a central identity service, where there is no runtime mechanism to detect and block actions from unregistered or decommissioned agents, where credentials are reused across ephemeral agents, and where an orchestration layer that spawns a new agent passes credentials down by inheritance rather than issuing fresh, individually attested ones.<\/p><p>The insider threat dimension is also relevant: a compromised or rogue insider can create shadow agents that persist beyond their own access revocation, analogous to classical insider threats via undocumented service accounts or orphaned API keys.<\/p><p>Potential impacts include stealthy data exfiltration, unauthorized actions across tenants, and long-term attacker persistence. Consequences include accountability gaps (actions cannot be reliably attributed), compliance violations, and increased difficulty in incident response.<\/p><p>Zombie / Shadow MCP Servers addresses decommissioned tool server endpoints; this risk addresses unregistered agent identities. Both share the lifecycle management failure mode but differ in the entity type affected.<\/p>","atlas":["AML.T0012"],"life":["deployment","runtime","maintenance"],"impact":["confidentiality","integrity","accountability","compliance"],"dropped":false},"R:riskAgenticDelegationConfusedDeputy":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Agentic Delegation Confused Deputy","code":"riskAgenticDelegationConfusedDeputy","tip":"A high-privilege agent acts on behalf of a less-privileged caller without validating the caller's authorization at the delegation boundary, allowing the caller to escalate privileges through the deputy's own permissions.","short":"<p>A high-privilege agent acts on behalf of a less-privileged caller without validating the caller's authorization at the delegation boundary, allowing the caller to escalate privileges through the deputy's own permissions.<\/p>","long":"<p>In agentic systems, agents with elevated privileges frequently act on behalf of other agents, users, or external inputs through delegation mechanisms such as OAuth token exchange and MCP tool invocation. The Agentic Delegation Confused Deputy occurs when a high-privilege agent (the deputy) performs an action that the caller could not do directly, because the deputy does not validate the caller's authorization at the delegation boundary. The deputy uses its own permissions without distinguishing the caller's authority from its own.<\/p><p>This risk is a direct extension of the classical confused deputy problem, first identified by Norm Hardy in 1988 when a compiler with file system privileges was tricked into overwriting its billing file by a user who supplied a system path as the output filename. The pattern recurs across computing eras: CSRF exploits the browser as a confused deputy (using session cookies on behalf of a malicious cross-origin caller), and AWS cross-account role assumption (<a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html\" target=\"_blank\" rel=\"noopener\">AWS IAM User Guide: The confused deputy problem<\/a>) without ExternalId validation allows a third-party vendor to be tricked into assuming a victim's IAM role. The AI-specific amplifier is threefold: (1) the deputy's capability set expands dynamically at runtime via MCP server discovery, making the attack surface unpredictable; (2) the deputy autonomously decides which tools to invoke based on LLM reasoning, not static dispatch; (3) multi-hop delegation can chain multiple confused deputies, amplifying the privilege escalation.<\/p><p>Attack vectors include indirect prompt injection via user-submitted data, poisoned MCP tool descriptions, crafted tool responses, and legitimate-looking API calls from less-privileged agents. The trigger mechanism varies (see Prompt Injection for injection attacks specifically), but the underlying vulnerability is the same: the deputy does not check the caller's authorization scope before acting, and cannot distinguish that scope from its own when it selects which tools to invoke. The exposure persists wherever a delegation step does not enforce least-privilege narrowing together with an explicit caller-authorization check, wherever confused-deputy protections are applied at only one of the IAM and MCP layers rather than both, and wherever there is no runtime detection of an agent executing an action that exceeds the caller's authorization scope.<\/p><p>This risk is distinct from Rogue Actions, which covers adversarially driven agent actions, not every wrong or unauthorized action broadly. The confused deputy specifically addresses the authorization failure at delegation boundaries — the caller could not perform the action directly, but the deputy does it using its own permissions. Rogue actions can occur in single-agent systems; the confused deputy requires asymmetric privilege across a delegation boundary. Agent Delegation Chain Opacity addresses the inability to see who authorized an action; this risk addresses the failure to check whether the caller was authorized.<\/p><p>Potential impacts include unauthorized data access across trust boundaries, financial transactions executed on behalf of unauthorized callers, infrastructure modifications, and privilege escalation chains in multi-agent systems. Consequences include accountability failures, regulatory non-compliance, and amplified blast radius when the deputy's permissions span multiple services or tenants.<\/p>","atlas":["AML.T0053"],"life":["deployment","runtime"],"impact":["confidentiality","integrity","accountability","compliance"],"dropped":false},"R:riskCrossTenantCredentialPropagation":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Cross-Tenant Credential Propagation","code":"riskCrossTenantCredentialPropagation","tip":"Shared or insufficiently tenant-scoped agent credentials allow a compromise in one tenant to propagate access across tenant boundaries through the identity layer.","short":"<p>Shared or insufficiently tenant-scoped agent credentials allow a compromise in one tenant to propagate access across tenant boundaries through the identity layer.<\/p>","long":"<p>Multi-tenant agentic platforms frequently share infrastructure components across tenants for efficiency — base models, credential pools, MCP tool server endpoints, and OAuth token caches. Cross-Tenant Credential Propagation occurs when agent identities or credentials are not strictly scoped to individual tenants, allowing a compromise in one tenant to authenticate to another tenant's resources through the shared identity layer.<\/p><p>This risk extends what the Cloud Security Alliance identifies as \"Insufficient Identity, Credential, and Access Management\" — a top cloud threat — to the agentic domain. Multi-tenant SaaS systems have long struggled with shared service accounts, wildcard TLS certificates, shared OAuth client credentials, and connection pool credentials that cross tenant boundaries. CWE-653 (Insufficient Compartmentalization) captures the general pattern of failing to isolate security domains. The AI-specific amplifier is that agentic platforms additionally share model serving endpoints, MCP tool registries, and OAuth token pools across tenants, and the dynamic nature of agent delegation means a compromised credential can propagate through delegation chains across tenant boundaries — agents autonomously use credentials without human verification at each hop.<\/p><p>The vulnerability arises from insufficient tenant scoping at the agent identity layer: shared OAuth client credentials, MCP tokens that are valid across tenants, or agent identity pools that serve multiple organizations. A compromise in one tenant — through credential theft, infrastructure exploitation, or insider access — yields credentials that work across tenant boundaries because nothing restricts their scope to the originating tenant. The exposure is present wherever agent identities are not strictly scoped to a single tenant, wherever credential pools, OAuth token caches, and MCP server endpoints are shared rather than isolated per tenant, and wherever tenant-boundary validation is not enforced at every MCP hop and delegation step — any of which lets a compromise confined to one tenant reach another tenant's resources.<\/p><p>This risk is distinct from Accelerator and System Side-channels, which covers hardware-layer cross-tenant leakage (timing, cache, speculative execution). It is also distinct from Prompt/Response Cache Poisoning, which covers cross-user contamination via shared LLM caches. This risk specifically addresses the identity and credential layer — shared or unscoped credentials that allow authentication across tenant boundaries.<\/p><p>Potential impacts include widespread data breaches spanning multiple tenants, unauthorized cross-tenant actions, intellectual property theft, and complete breakdown of multi-tenancy guarantees. Consequences include major compliance violations (GDPR, SOC 2), loss of customer trust, and systemic risk across the shared platform.<\/p>","atlas":["AML.T0012","AML.T0055"],"life":["deployment","runtime"],"impact":["confidentiality","integrity","compliance","privacy"],"dropped":false},"R:riskZombieShadowMCPServers":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Zombie / Shadow MCP Servers","code":"riskZombieShadowMCPServers","tip":"Decommissioned or unregistered MCP servers remain accessible and respond to agent tool calls, allowing attackers to intercept or redirect legitimate requests.","short":"<p>Decommissioned or unregistered MCP servers remain accessible and respond to agent tool calls, allowing attackers to intercept or redirect legitimate requests.<\/p>","long":"<p>MCP servers expose tools to agents and are frequently created, scaled, or retired during operations. Zombie / Shadow MCP Servers occur when decommissioned servers are not fully removed from service discovery, DNS, load balancers, or tool registries, leaving stale endpoints that remain responsive to agent connections. An attacker who claims the abandoned endpoint receives all tool calls that agents route to it.<\/p><p>This risk is the agentic extension of dangling DNS and subdomain takeover — a well-documented vulnerability pattern (<a href=\"https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/10-Test_for_Subdomain_Takeover\" target=\"_blank\" rel=\"noopener\">OWASP Web Security Testing Guide 4.2.10: Test for Subdomain Takeover<\/a>) where orphaned DNS records to decommissioned cloud services allow attackers to claim abandoned resources and intercept traffic. The AI-specific amplifier is that agents autonomously discover and invoke tool servers without human verification at each call. In classical systems, a developer would notice a stale API endpoint returning unexpected responses; in agentic systems, the agent silently processes the zombie server's responses as legitimate tool output, potentially poisoning reasoning chains that influence downstream actions.<\/p><p>Transport security alone does not close this gap: an attacker who controls DNS for a stale endpoint can obtain a valid ACME-issued certificate, and mTLS will authenticate them as a \"valid\" server. Transport security works as specified — the missing layer is provenance binding to the registered principal. This is why the risk requires a registry-bound provenance control (Component Identity Provenance) in addition to transport security and inventory management.<\/p><p>The vulnerability stems from incomplete lifecycle management: tool server entries persist in registries, DNS, or agent configurations after the legitimate server is decommissioned. Dynamic discovery mechanisms that do not require runtime attestation or liveness verification exacerbate the risk — agents trust registry presence as proof of legitimacy. The exposure is present where an MCP server can become discoverable without registering under cryptographic attestation, where decommissioning does not guarantee complete removal from every discovery mechanism (registry, DNS, load balancer, and agent configuration alike), where agents do not re-verify a tool server's liveness and identity at invocation time rather than trusting the discovery-time record, and where nothing automatically detects and blocks calls routed to decommissioned or unverified endpoints.<\/p><p>This risk is distinct from Tool Source Provenance, which addresses adopting unvetted tool sources — zombie servers were previously vetted and legitimate. It is distinct from Tool Registry Tampering, which addresses active modification of registry entries — zombie servers involve stale entries that were never cleaned up. It is distinct from Insecure Integrated Component, which addresses vulnerabilities in running tool implementations — zombie servers involve the absence of a legitimate tool at an endpoint now controlled by an attacker. Shadow and Unknown Agents addresses unregistered agent identities; this risk addresses decommissioned tool server endpoints.<\/p><p>Potential impacts include stealthy interception of tool calls, injection of malicious schemas or responses, data exfiltration from agent interactions, and persistent attacker access long after official decommissioning. Consequences include undetected breaches, compliance failures, and erosion of trust in the agentic infrastructure.<\/p>","atlas":["AML.T0010.001"],"life":["deployment","runtime","maintenance"],"impact":["confidentiality","integrity"],"dropped":false},"R:riskLongLivedSessionStateWeakness":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Long-Lived Session State Weakness","code":"riskLongLivedSessionStateWeakness","tip":"Extended agentic and conversational sessions keep session tokens, cached authorization, and accumulated session state valid for long windows, so classical session-handling weaknesses — fixation, missing token rotation, no timeout, and authorization that is never re-evaluated — gain a far larger expl","short":"<p>Extended agentic and conversational sessions keep session tokens, cached authorization, and accumulated session state valid for long windows, so classical session-handling weaknesses — fixation, missing token rotation, no timeout, and authorization that is never re-evaluated — gain a far larger exploitation window than short request/response sessions.<\/p>","long":"<p>Agentic and conversational AI systems establish sessions that are intentionally long-lived: multi-turn conversations that persist for hours or days, persistent agent workflows, and protocol sessions (for example MCP or agent-to-agent channels) that remain open across many tool invocations. Long-Lived Session State Weakness is the risk that the session-handling mechanics — how the session identifier is established, rotated, timed out, bound, and re-authorized — do not account for this extended duration, so the temporal window in which a session token, a cached authorization decision, or accumulated session state can be abused is correspondingly large.<\/p><p>This is the AI-specific extension of classical session-management weaknesses catalogued in <a href=\"https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener\">OWASP Session Management Cheat Sheet<\/a> and <a href=\"https://pages.nist.gov/800-63-3/sp800-63b.html\" target=\"_blank\" rel=\"noopener\">NIST SP 800-63B: Digital Identity Guidelines — Session Management<\/a>: session fixation (an attacker pre-seeds a session identifier that the victim then authenticates into), missing session token rotation (a token captured once remains valid for the entire conversation), absent idle and absolute session timeouts (a session never expires while the application is in use), and stale authorization (an authorization decision made once at session start is never re-evaluated, so a user whose entitlements are revoked mid-conversation continues to act with the original scope). The AI-specific amplifier is that these sessions are deliberately long-lived and that an agent autonomously continues to act under the established session without any human re-affirmation, so a window that classical guidance keeps short by design is, here, intentionally extended.<\/p><p>The exposure is present wherever a session identifier is not rotated after authentication or privilege change, wherever sessions lack both idle and absolute timeouts, wherever authorization for in-session actions is evaluated only once at session establishment rather than re-checked as the session continues, and wherever conversational or agent session state accumulated over a long session is not bounded or re-validated. The duration of the session is the differentiator: the same handling weakness on a short request/response session presents a small window, while on a long-lived session it presents a persistent one.<\/p><p>This risk is distinct from MCP Transport Hijacking, which covers an attacker intercepting, modifying, or replaying messages on the transport channel; that risk concerns the channel in transit, while this risk concerns the lifecycle and re-evaluation of the session itself and applies even on a fully encrypted, mutually authenticated channel. It is distinct from Stale Agent Identity Binding, in which an agent's identity persists after the underlying model artifact is swapped; this risk concerns the session and user-authorization context going stale over time regardless of the model behind the agent. It is distinct from Cross-Tenant Credential Propagation, which covers credentials crossing tenant boundaries in space; this risk concerns staleness within a single session over time. It is distinct from Excessive Data Handling During Inference, which covers privacy and retention of user data; this risk concerns the security of the session-handling state itself.<\/p><p>Potential impacts include session hijacking that grants an attacker the victim's full in-session authority, continued action under authorization that should have been revoked, and abuse of a captured long-lived token across many tool invocations. Because the session and its credentials remain valid, the breach is difficult to detect: the agent continues to authenticate normally while the session has been fixed, stolen, or has outlived the authority it was granted.<\/p>","atlas":[],"life":["deployment","runtime"],"impact":["confidentiality","integrity","accountability"],"dropped":false},"R:riskAgentIdentitySpoofing":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Agent Identity Spoofing","code":"riskAgentIdentitySpoofing","tip":"An attacker presents stolen, forged, or unverified credentials to a shared agent service and is accepted as a legitimate client or agent, because the endpoint does not strongly authenticate the requesting principal.","short":"<p>An attacker presents stolen, forged, or unverified credentials to a shared agent service and is accepted as a legitimate client or agent, because the endpoint does not strongly authenticate the requesting principal.<\/p>","long":"<p>In agentic and remote-tooling deployments, clients and agents authenticate to a shared service (an MCP server, tool endpoint, or orchestration plane) before issuing tool calls. Agent Identity Spoofing is the risk that an attacker is accepted as a legitimate principal at this boundary because authentication of the requester is weak, optional, or misconfigured. The attacker then operates under a borrowed identity: invoking tools, reading or writing resources, and emitting actions that are attributed to the impersonated client. This is the authentication-weakness root cause of impersonation, distinct from downstream identity-lifecycle and attribution failures.<\/p><p>This risk is the agentic instance of a classical security problem rather than a novel AI failure mode. It maps directly to STRIDE Spoofing and to long-standing endpoint-authentication weaknesses: bearer tokens accepted without proof of possession, missing or one-way TLS where mutual authentication is required, default or shared service credentials, and endpoints that expose privileged operations without authenticating the caller at all. The reference posture is zero-trust enforcement (NIST SP 800-207): every request to a protected resource passes a policy enforcement point (PEP) that verifies the requester's asserted identity against a policy decision point (PDP) before access is granted. The amplifier in agentic systems is that emerging protocols frequently leave requester authentication to the deployer and ship with permissive defaults, so the weakness is a configuration norm rather than an exception.<\/p><p>The vulnerability arises wherever a service accepts a request without strongly verifying the identity of the requesting principal: endpoints that trust a bearer token without binding it to the holder, that omit mutual authentication on agent-to-service hops, that accept self-asserted client identifiers, that rely on network position as a proxy for identity, or that ship with shared or default credentials. Attack vectors include presenting a stolen or replayed token, connecting to an unauthenticated or weakly authenticated endpoint, and exploiting a misconfigured trust anchor to forge an accepted identity. The impersonation succeeds at the authentication boundary, before any per-action authorization or per-tenant scoping is evaluated.<\/p><p>Potential impacts include unauthorized access to server resources and tools under a borrowed identity, and corruption of audit trails: actions are recorded against the impersonated principal, so attribution and non-repudiation fail (STRIDE Repudiation). Consequences include unauthorized data access, unauthorized actions executed with the victim's standing privileges, accountability gaps that frustrate incident response, and compliance violations where authenticated, attributable access is mandated.<\/p><p>Shadow and Unknown Agents addresses identities that operate outside lifecycle controls because they were never registered; this risk addresses an attacker actively impersonating a registered, legitimate principal by defeating weak authentication. Agent Delegation Chain Opacity addresses inability to reconstruct the delegation chain even when each authentication step succeeds; this risk addresses the authentication step itself being defeated. Cross-Tenant Credential Propagation addresses a valid credential leaking across tenant boundaries; this risk addresses acceptance of an unverified or forged credential at the endpoint. MCP Transport Hijacking addresses interception or modification of the channel; this risk addresses the principal-authentication decision the endpoint makes regardless of channel security.<\/p>","atlas":["AML.T0012"],"life":["deployment","runtime"],"impact":["confidentiality","integrity","accountability"],"dropped":false},"R:riskBrokenAuthorizationEnforcement":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Broken Authorization Enforcement for Agent Resource Access","code":"riskBrokenAuthorizationEnforcement","tip":"Authorization is not enforced, or is misconfigured, at the point where an agent invokes a tool or accesses a resource, so requests run with the agent's standing privileges instead of the originating principal's authorization — letting a caller reach functions and objects they are not entitled to.","short":"<p>Authorization is not enforced, or is misconfigured, at the point where an agent invokes a tool or accesses a resource, so requests run with the agent's standing privileges instead of the originating principal's authorization — letting a caller reach functions and objects they are not entitled to.<\/p>","long":"<p>Agentic systems mediate access to tools, data, and downstream services through a policy enforcement point (PEP) that should consult a policy decision point (PDP) (<a href=\"https://csrc.nist.gov/pubs/sp/800/162/upd2/final\" target=\"_blank\" rel=\"noopener\">NIST SP 800-162: Guide to Attribute Based Access Control (ABAC) Definition and Considerations<\/a>) for every tool invocation and resource access. Broken Authorization Enforcement occurs when that check is absent, applied at the wrong layer, or driven by misconfigured roles, ACLs, or trust relationships — so the call executes with whatever standing privilege the agent or its service identity holds, rather than being constrained to what the originating principal is authorized to do.<\/p><p>This is the classical broken-access-control failure — improper authorization (<a href=\"https://cwe.mitre.org/data/definitions/285.html\" target=\"_blank\" rel=\"noopener\">CWE-285: Improper Authorization<\/a>), missing function-level authorization (<a href=\"https://cwe.mitre.org/data/definitions/862.html\" target=\"_blank\" rel=\"noopener\">CWE-862: Missing Authorization<\/a>), and improper privilege management (<a href=\"https://cwe.mitre.org/data/definitions/269.html\" target=\"_blank\" rel=\"noopener\">CWE-269: Improper Privilege Management<\/a>), the same class OWASP catalogs as broken function-level (BFLA) and broken object-level (BOLA) authorization — relocated to the agent-to-tool boundary. Long-standing patterns recur unchanged: an over-broad service account or role grant, an ACL that defaults open, a privileged credential reused across actions, or an endpoint that authenticates the caller but never authorizes the specific action against the specific object. The AI-specific amplifier is that an autonomous agent — not a fixed application route — chooses which tool or resource call to make based on model reasoning, and its capability set expands dynamically through tool and server discovery, so a missing or misconfigured authorization check is reachable through an unpredictable and growing set of actions.<\/p><p>The exposure is present wherever a tool or resource call is gated only by authentication and not by a per-action, per-object authorization decision; wherever the agent's standing service identity is used directly instead of an authorization scoped to the originating principal; wherever roles, ACLs, or trust relationships are misconfigured such that the effective grant exceeds intent; and wherever the PEP is enforced at only one layer (for example application but not the tool server, or the proxy but not the backend) so a request can reach a privileged operation through the unguarded path. Under a zero-trust model every such hop is expected to re-evaluate authorization against the principal and the requested operation; the gap is that the agent boundary frequently does not.<\/p><p>This risk is the authorization-enforcement core that several adjacent risks specialize. Agentic Delegation Confused Deputy covers the specific case where a higher-privilege deputy acts on behalf of a lower-privilege caller across a delegation boundary without checking the caller's authority; this risk is the broader failure to enforce a per-action authorization decision at all, including cases with no deputy delegation. Cross-Tenant Credential Propagation covers the tenancy specialization — credentials valid across tenant boundaries; this risk covers privilege escalation and unauthorized access within a single trust domain through misconfigured or missing enforcement. Shadow and Unknown Agents concerns identities that operate outside lifecycle controls, whereas this risk concerns authorized identities whose actions are not constrained to their entitlements.<\/p><p>Potential impacts include privilege escalation, unauthorized read or modification of objects the caller could not reach directly, lateral movement to privileged operations, and chained escalation when an agent's effective authority spans multiple services. Consequences include data breaches, integrity compromise of downstream systems, accountability gaps, and regulatory non-compliance.<\/p>","atlas":["AML.T0053","AML.T0012"],"life":["deployment","runtime"],"impact":["confidentiality","integrity","accountability","compliance"],"dropped":false},"R:riskUnconsentedAgentAction":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Unconsented Agent Action Execution","code":"riskUnconsentedAgentAction","tip":"An agent executes a consequential action — altering user data, spending, or acting on the user's behalf — without an effective human consent checkpoint gating it, so the action proceeds beyond the scope the user actually authorized.","short":"<p>An agent executes a consequential action — altering user data, spending, or acting on the user's behalf — without an effective human consent checkpoint gating it, so the action proceeds beyond the scope the user actually authorized.<\/p>","long":"<p>Agentic systems place a human consent checkpoint (often called human-in-the-loop, elicitation, or interactive authorization) between an agent's decision to act and the execution of a consequential effect: sending messages, moving money, modifying records, granting access, or invoking a tool that acts on the user's behalf. Unconsented Agent Action Execution occurs when that checkpoint is absent, scoped too coarsely, or degraded such that the agent commits a consequential effect the user never specifically authorized.<\/p><p>This is the agentic form of a classical control: interactive step-up authorization and human approval gating for high-consequence operations, expressed elsewhere as dual-control / four-eyes, break-glass approval, and out-of-band transaction confirmation. In access-control terms (NIST PEP/PDP/PIP), the human is the authorizing party whose consent is a required input to the policy decision; this risk is the case where the enforcement point commits the effect without that input, or treats a single broad approval as standing authorization for an open-ended set of later actions.<\/p><p>The AI-specific amplifier is autonomy and scope drift. An agent discovers tools at runtime, plans multi-step workflows, and chains invocations from a single user turn, so the consequential actions reachable from one approval are unpredictable and may far exceed what the user had in mind when they consented. Coarse, batched, or repetitive approval prompts also drive consent fatigue: users reflexively accept, collapsing the checkpoint into a rubber stamp. The exposure persists wherever consequential tool invocations are not gated by a consent decision scoped to the specific action, parameters, and blast radius — and wherever a one-time or session-level approval is treated as consent for actions decided later by the agent.<\/p><p>This risk is distinct from Rogue Actions, which covers adversarially driven wrong actions, and from Erroneous Agent Action, which covers an agent's own uncompromised mistakes — in either case regardless of authorization; here the action may be exactly what the agent intended, but it was committed without the human consent that should have gated it. It is distinct from Agentic Delegation Confused Deputy, which concerns validating a non-human caller's authorization at a delegation boundary; this risk concerns the human principal's consent to the effect. A confused-deputy check and a human-consent checkpoint can each pass while the other fails.<\/p><p>Potential impacts include irreversible side effects executed without authorization (sent communications, financial transactions, deletions, access grants), accountability and repudiation failures where no record ties a consequential action to a human approval, privacy violations, and erosion of user trust when agents act beyond consented scope. Impact scales with the agent's reach across systems and the irreversibility of the gated effect.<\/p>","atlas":[],"life":["deployment","runtime"],"impact":["integrity","accountability","privacy","safety"],"dropped":false},"R:riskUntrustedHostToolRuntimeExposure":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Untrusted Host Tool Runtime Exposure","code":"riskUntrustedHostToolRuntimeExposure","tip":"An agentic tool runtime whose isolation doesn't match who sits inside its host's privilege boundary exposes its in-memory credentials, keys, secrets, and code to a host operator, privileged insider, or co-tenant that can read or tamper with them while the workload runs.","short":"<p>An agentic tool runtime whose isolation doesn't match who sits inside its host's privilege boundary exposes its in-memory credentials, keys, secrets, and code to a host operator, privileged insider, or co-tenant that can read or tamper with them while the workload runs.<\/p>","long":"<p>Agentic systems run remote-tooling services — MCP servers, A2A endpoints, and similar shared tool runtimes — that hold standing credentials and execute tool logic on behalf of agents. Untrusted Host Tool Runtime Exposure occurs when a party inside the host's privilege boundary — the infrastructure operator, a privileged insider, or a co-tenant workload that escapes its own isolation — can read or tamper with that runtime's in-use credentials, signing keys, secrets, and code while it executes. This holds regardless of who owns the underlying hardware: a self-operated host with a compromised insider and a third-party multi-tenant host with an untrusted operator present the same exposure to the runtime — precisely the isolation gap the MCP specification's own security best-practices guidance warns operators to close (<a href=\"https://modelcontextprotocol.io/specification/2025-11-25/basic/security_best_practices\" target=\"_blank\" rel=\"noopener\">Model Context Protocol specification (2025-11-25): Security Best Practices<\/a>).<\/p><p>This is a classical host-trust and compartmentalization gap (<a href=\"https://cwe.mitre.org/data/definitions/653.html\" target=\"_blank\" rel=\"noopener\">CWE-653: Improper Isolation or Compartmentalization<\/a> Insufficient Compartmentalization, <a href=\"https://cwe.mitre.org/data/definitions/668.html\" target=\"_blank\" rel=\"noopener\">CWE-668: Exposure of Resource to Wrong Sphere<\/a> Exposure of Resource to Wrong Sphere) cast in agentic dress. A process running in cleartext memory has always been exposed to whatever sits inside its host's privilege boundary — the OS, hypervisor, a hardware operator, an insider, or a co-tenant workload that breaks out of its own confinement. Two distinct control tiers close this gap for different adversaries: OS- and process-level isolation (containers, namespaces, seccomp, mandatory access control) bounds what a compromised or escaping co-tenant process can reach, while hardware-enforced confidential computing (TEEs, secure enclaves) removes the host operator and privileged insiders from the trust boundary entirely — a threat OS-level isolation alone cannot address, since an operator with hypervisor-level access sits outside any software boundary. The agentic amplifier is that tool runtimes concentrate long-lived, high-value standing credentials — bearer tokens, OAuth client secrets, delegated tool scopes — and agents authenticate and invoke autonomously without a human re-supplying secrets per action, so a single runtime compromise yields broad, immediately- usable access.<\/p><p>The exposure is present wherever a tool runtime holds credentials, secrets, or code in process memory without isolation adequate to its threat model — no OS/process boundary against a co-tenant, no hardware boundary against a privileged host operator or insider. Under these conditions, whichever party sits inside the applicable privilege boundary can extract standing credentials and impersonate the tool runtime, or tamper with its in-memory code and data to alter tool behavior — without ever defeating the runtime's own authentication, because the secret is read directly rather than forged.<\/p><p>This risk is distinct from Accelerator and System Side-channels, which covers indirect cross-tenant leakage inferred through hardware side-channels (timing, cache, speculative execution); this risk covers direct exposure of secrets and code held in cleartext to a party already inside the host's privilege boundary, not inference through a side channel. It is distinct from Cross-Tenant Credential Propagation, which covers credentials that are valid across tenant boundaries because they are insufficiently scoped at the identity layer; this risk covers credentials stolen from an exposed runtime regardless of how well they are scoped. It is distinct from MCP Transport Hijacking, which covers the communication channel between agent and tool; this risk covers the runtime while it executes, not the wire.<\/p><p>Potential impacts include theft of standing tool credentials and signing keys leading to impersonation of the tool runtime, exposure of sensitive data flowing through tool invocations, and tampering with tool code to corrupt agent actions. Because a valid credential is extracted rather than forged, downstream authentication continues to succeed and the compromise is difficult to detect.<\/p>","atlas":[],"life":["deployment","runtime"],"impact":["confidentiality","integrity"],"dropped":false},"R:riskImplicitCrossBoundaryTrust":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Implicit Cross-Boundary Trust","code":"riskImplicitCrossBoundaryTrust","tip":"An agentic system grants ambient trust across a client, remote-tooling, or third-party service boundary instead of verifying authority at each boundary, so a compromise on one side is implicitly trusted by the others and propagates through transitive-trust chains.","short":"<p>An agentic system grants ambient trust across a client, remote-tooling, or third-party service boundary instead of verifying authority at each boundary, so a compromise on one side is implicitly trusted by the others and propagates through transitive-trust chains.<\/p>","long":"<p>Agentic deployments chain multiple parties across trust boundaries: an orchestrator or client, one or more remote tool servers (for example MCP or A2A endpoints), and the downstream third-party APIs those servers call. Implicit Cross-Boundary Trust is the design condition in which trust is granted by position in the chain rather than verified at each boundary — the client implicitly trusts whatever a server returns, the server implicitly trusts the client's requests, and the third-party service implicitly trusts the server's calls. Because authority is ambient rather than checked per boundary, a compromise of any single element is accepted as trustworthy by the elements adjacent to it.<\/p><p>This is the agentic form of a classical implicit-trust (non-zero-trust) architecture that zero-trust architecture (<a href=\"https://csrc.nist.gov/pubs/sp/800/207/final\" target=\"_blank\" rel=\"noopener\">NIST SP 800-207: Zero Trust Architecture<\/a>) and attribute-based policy enforcement (<a href=\"https://csrc.nist.gov/pubs/sp/800/162/final\" target=\"_blank\" rel=\"noopener\">NIST SP 800-162: Guide to Attribute Based Access Control (ABAC) Definition and Considerations<\/a>) were defined to close by forcing per-request verification; <a href=\"https://cwe.mitre.org/data/definitions/653.html\" target=\"_blank\" rel=\"noopener\">CWE-653: Improper Isolation or Compartmentalization<\/a> (Insufficient Compartmentalization) names the same failure. The AI-specific amplifier is that the trust chain is assembled dynamically at runtime — agents discover and connect to tool servers on the fly, so the set of trusted parties is not fixed or pre-vetted — and the LLM autonomously decides to cross boundaries based on reasoning over untrusted content, so ambient authority is exercised without a human verifying each hop.<\/p><p>The exposure is present wherever trust is granted by connection or chain position rather than verified per boundary: a client accepting tool output or server-supplied instructions without bounding their authority; a remote tool server acting on client requests without confirming they are within the client's authorized scope; a third-party call inheriting the server's standing credentials rather than a request-scoped authorization; or no policy decision point evaluating each cross-boundary action against the originating caller's authority. Any of these lets trust flow transitively, so a single compromised node yields lateral movement and privilege escalation across the whole chain.<\/p><p>The same failure propagates behavior between agents. Because a receiving agent treats a peer that has already crossed an accepted boundary as trustworthy, it adopts or acts on what that peer hands it — a learned capability, a relayed instruction, or forwarded content carrying directive force — without independently evaluating the thing itself, only the position it arrived from. A capability one agent has learned can be taught to a second agent, which applies it on the strength of the teaching agent's standing rather than its own assessment of safety; a relayed instruction can be passed on the same way, extending its reach with every hop.<\/p><p>It is distinct from Agentic Delegation Confused Deputy, failure to validate a caller's authorization at one boundary; here the defect is architectural and chain-wide, of which the confused deputy is one symptom. It is distinct from Cross-Tenant Credential Propagation, unscoped credentials crossing tenant boundaries through the identity layer; this risk concerns implicit trust in the request/response and call path regardless of tenancy. It is distinct from Insecure Integrated Component, software vulnerabilities in an integrated component; here each component may be individually sound, yet the boundaries between them are unverified by design. It is distinct from Cross-Agent Reputation Poisoning: here the object crossing an unverified boundary is a capability, instruction, or credential, while that risk's object is a judgement about someone's standing. That risk's cooperation-exclusion test turns on a change to a receiving agent's decision to cooperate with or exclude someone, whoever the judgement is about, and does not reach a claim whose only effect is the receiving agent broadcasting it onward to humans or a public channel without changing any cooperation decision of its own. A relayed instruction carrying directive force belongs here instead, whatever it says about anyone's standing — a peer agent's or a human's — because the receiving agent carries it out on the relaying peer's position rather than forming a judgement of its own: even an instruction to exclude someone is an instruction executed, not a cooperation decision the receiving agent formed.<\/p><p>Potential impacts include lateral movement from a single compromised tool server or client into otherwise-isolated services, privilege escalation along transitive-trust chains, unauthorized cross-boundary data access and actions, and unsafe capabilities or fabricated instructions propagating to further agents that never evaluated them. Consequences include accountability gaps (no boundary can attribute which party's authority was actually exercised), compliance failures, and the collapse of containment guarantees the architecture was assumed to provide.<\/p>","atlas":["AML.T0053"],"life":["development","deployment","runtime"],"impact":["confidentiality","integrity","accountability"],"dropped":false},"R:riskCredentialAtRestExposure":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Credential At-Rest Exposure","code":"riskCredentialAtRestExposure","tip":"Recovery or theft of secrets and cryptographic key material from where an AI-system component stores them at rest — plaintext configuration, environment variables, container images, source repositories, memory or crash dumps, or an insufficiently protected secret store — yielding usable authority to","short":"<p>Recovery or theft of secrets and cryptographic key material from where an AI-system component stores them at rest — plaintext configuration, environment variables, container images, source repositories, memory or crash dumps, or an insufficiently protected secret store — yielding usable authority to downstream services, model-serving endpoints, and shared infrastructure.<\/p>","long":"<p>AI systems and agentic platforms accumulate a large, heterogeneous set of secrets: API keys for model-serving endpoints, OAuth tokens for tool servers and MCP resources, database credentials for retrieval stores, signing keys for artifact integrity, and inter-component mTLS certificates. Credential At-Rest Exposure occurs when an adversary recovers one or more of these secrets from a storage location rather than intercepting them in transit — the attack surface is the storage layer, not the channel. Recovery vectors include plaintext values in source repositories and dotfiles, secrets embedded in container image layers, environment variables captured from process memory, unencrypted or world-readable configuration, crash dumps that include heap contents, over-permissioned or improperly sealed secret-store entries, and backup archives or object-storage buckets with excessive read permissions.<\/p><p>The agentic amplifier is concentrated blast radius. A classical secrets breach typically compromises one service's credentials; an orchestrator, MCP server, or agentic-platform component routinely brokers credentials for many downstream services at once, so a single recovery event can authenticate the adversary to the full set of services the component interoperates with, across all tenants or workloads it serves. The underlying secret-recovery technique is classical; the AI-specific amplifier is the concentration of authority in one high-value location.<\/p><p>Detection is characteristically delayed. Secrets recovered from static storage leave no runtime signal at the moment of recovery; the first observable event is typically downstream misuse. Without credential-use monitoring tied to the expected calling identity, the interval between recovery and detection can span weeks or months.<\/p><p>This risk is distinct from Cross-Tenant Credential Propagation, which addresses a valid, insufficiently tenant-scoped credential propagating across tenant boundaries; this risk addresses the prior step — recovering the secret from its storage location, independent of tenancy. It is distinct from Sensitive Data Disclosure, which addresses the model disclosing sensitive data through inference outputs; this is exfiltration of a stored secret from the holder side, not inference-time disclosure. It is distinct from Model Exfiltration (asset = the model artifact, not credential material). It is distinct from Stale Agent Identity Binding and Shadow and Unknown Agents, which address identity-lifecycle failures after issuance, not recovery of the secret value from storage.<\/p>","atlas":[],"life":["development","deployment","runtime","maintenance"],"impact":["confidentiality","integrity","compliance"],"dropped":false},"R:riskExcessiveNetworkExposure":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Excessive Network Exposure","code":"riskExcessiveNetworkExposure","tip":"An AI-system component — most commonly an MCP or tool server — is reachable from beyond its intended trust boundary, and can itself reach beyond it, because it is deployed with an over-broad network posture (bound to all interfaces rather than localhost, unsegmented, unrestricted egress). A service ","short":"<p>An AI-system component — most commonly an MCP or tool server — is reachable from beyond its intended trust boundary, and can itself reach beyond it, because it is deployed with an over-broad network posture (bound to all interfaces rather than localhost, unsegmented, unrestricted egress). A service meant to be network-isolated becomes a pivot: parties that should not reach it can drive the data and tool actions it exposes, and if it is compromised it can exfiltrate data, reach command-and-control, and move laterally — with DNS rebinding as the canonical path for a remote page to drive requests into an assumed-local service.<\/p>","long":"<p>Agentic deployments run tool servers, MCP endpoints, and orchestrators as network services. Excessive Network Exposure occurs when one of these services is placed on the network with more reachability than its intended trust boundary requires — on the inbound side by binding to all interfaces rather than localhost, omitting network segmentation, or lacking Origin/host validation, and on the outbound side by permitting unrestricted egress. The attack surface is the deployment's network position, not the message channel: a server the operator believed was local or internal is in fact reachable from the surrounding network, and a server the operator believed was contained can in fact open arbitrary outbound connections. DNS rebinding is the canonical inbound vector — a remote web page rebinds a hostname to a loopback or internal address and drives requests into a service that assumed only local callers could reach it, bypassing same-origin protections.<\/p><p>The agentic amplifier is that these services are frequently stood up ad hoc, on developer workstations and inside internal networks, under an implicit assumption of trust that the deployment posture does not actually enforce. MCP servers commonly default to convenient rather than minimal network exposure, and agents discover and connect to them at runtime without verifying where they are bound or what they can reach. Internal-network deployments using Streamable HTTP inherit the full lateral-movement surface of the environment they sit in while often carrying only the authentication the operator remembered to add. What distinguishes this from generic server hardening is the population it lives in: tool servers are frequently stood up by application developers on laptops and internal hosts with no operations review, and agents bind to and invoke them from runtime discovery rather than a vetted network diagram — so the exposure recurs across a class of endpoints that conventional network-hardening processes never see.<\/p><p>The consequence is that a single exposed or over-permissive component becomes a pivot. On the inbound side, an attacker who reaches an intended-internal service can read data and drive tool actions it exposes, and can exhaust an unauthenticated service by flooding it; on the outbound side, a compromised or malicious server with unrestricted egress can download further malicious payloads, exfiltrate intercepted or brokered data, reach command-and-control infrastructure, and move laterally across the environment using the credentials it holds for downstream services — including turning a commandeered server against co-located systems. Poor segmentation converts a foothold on one host into reach across many. Inbound exposure and outbound permissiveness are treated here as one risk because they share a single deployment-time root cause (mis-scoped network position), the same controls, and the same locus — two facets of network reachability, not two independent threats.<\/p><p>This risk is distinct from MCP Transport Hijacking, which addresses interception or modification of traffic on the agent-to-tool channel (missing TLS / mutual authentication) — this risk addresses the network POSITION of the endpoint itself (who can reach it and what it can reach), independent of whether the channel is encrypted. DNS rebinding is cited by both risks but through different enabling conditions: in Transport Hijacking the gap is absent Origin/host validation on the connection; here it is the binding address and network position that make the service reachable by on-network peers at all — validating Origin without correcting an all-interfaces bind still leaves the service exposed. It is distinct from Untrusted Host Tool Runtime Exposure, which addresses host- and process-level isolation of secrets and code IN USE inside a runtime — this risk addresses network-level reachability, not in-process isolation. It is distinct from Cross-Tenant Credential Propagation, which addresses a valid credential crossing tenant boundaries — here the boundary crossed is the network segment, not the tenant. It is distinct from Zombie / Shadow MCP Servers, which addresses stale or unmanaged endpoints — a correctly inventoried, current server can still be bound and segmented incorrectly.<\/p>","atlas":[],"life":["deployment","runtime"],"impact":["confidentiality","integrity","availability"],"dropped":false},"R:riskConfidentialComputingAttestationBypass":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Confidential Computing Attestation Bypass","code":"riskConfidentialComputingAttestationBypass","tip":"A compromised, incorrectly configured, or impostor (shadow) server workload can operate as a trusted counterparty in a confidential-computing deployment when remote attestation of its runtime measurements is not mandated, not enforced as an admission gate, or is itself defeated. The hardware root-of","short":"<p>A compromised, incorrectly configured, or impostor (shadow) server workload can operate as a trusted counterparty in a confidential-computing deployment when remote attestation of its runtime measurements is not mandated, not enforced as an admission gate, or is itself defeated. The hardware root-of-trust guarantee that the workload's code matches a known-good measurement fails silently, letting the attacker-controlled or tampered workload operate with the access and trust intended for the legitimate one. This models an architecturally sound but not-yet-widely-deployed pattern: TEE-hosted MCP and agentic tool servers are an emerging, vendor-recommended practice rather than today's operational norm, and no documented real-world instance of this specific bypass exists yet.<\/p>","long":"<p>Confidential computing platforms (hardware Trusted Execution Environments such as Intel TDX and AMD SEV-SNP, and enclave technologies such as SGX) let a relying party — an orchestrator, agent, or client establishing a session with a server workload — verify via <i>remote attestation<\/i> that the workload's measured code and configuration match a known-good reference before trusting it. A compromised workload (a legitimate deployment later tampered by an insider or a supply-chain substitution), an incorrect workload (a misconfigured or wrong-version deployment), or a shadow workload (an attacker-launched impostor standing in for the legitimate server) each produce measurements that diverge from that known-good reference and should fail attestation.<\/p><p>The threat is not that attestation catches a mismatch — that is the control working as intended. The threat is the gap on either side of that check: deployments that place a workload inside a TEE but do not mandate remote attestation as a hard admission gate at launch and at every subsequent trust decision, or deployments that treat \"runs inside a TEE\" itself as sufficient evidence of trustworthiness without verifying and enforcing the attestation result. In either gap, a compromised, incorrect, or shadow workload operates with the full access, credentials, and trust intended for the legitimate one, for as long as nothing actually checks, or acts on, its measurement.<\/p><p>Remote attestation is also not an infallible backstop: it is only as trustworthy as the hardware's ability to produce a truthful measurement. Documented hardware-level attacks against enclave and TEE platforms — such as the Foreshadow speculative-execution attack against Intel SGX (<a href=\"https://www.usenix.org/conference/usenixsecurity18/presentation/bulck\" target=\"_blank\" rel=\"noopener\">Foreshadow: Extracting the Keys to the Intel SGX Kingdom with Transient Out-of-Order Execution<\/a>), which extracted attestation keys and undermined the platform's ability to vouch for its own measurements — demonstrate that the hardware root of trust underlying attestation is itself an attack surface, not a fixed guarantee.<\/p><p>This risk is distinct from Zombie / Shadow MCP Servers, which addresses stale or decommissioned registry and DNS entries reclaimed by an attacker after legitimate decommissioning — its own scope explicitly excludes vulnerabilities in a running tool implementation. This risk addresses an actively running workload whose measured code or configuration does not match what was deployed, verified (or not) via hardware attestation rather than registry or DNS presence. It is distinct from Tool Registry Tampering, which addresses compromise of registry metadata — tool descriptions, schemas, manifest entries — that redirects agent tool selection; this risk addresses the integrity of the running server workload itself, independent of whether its registry entry was ever touched. It is distinct from Agent Identity Spoofing, which addresses weak or missing authentication credentials that let an attacker impersonate a client or agent at the protocol layer; this risk addresses hardware-measured code integrity of the server workload, a verification layer a valid, correctly-authenticated credential does not itself satisfy. It is distinct from Untrusted Host Tool Runtime Exposure, which addresses secrets and code exposed in use to a hostile host, administrator, or co-tenant absent adequate runtime isolation; this risk addresses verifying the identity and integrity of the workload itself before trusting it, not protecting an already-trusted workload's data from its surroundings. It is also distinct from Model Deployment Tampering, which shares this risk's primary control (Isolated and Confidential Computing) but addresses unauthorized modification of the model deployment workflow or serving infrastructure itself — altering how a model behaves post-deployment via a compromised deployment pipeline; this risk addresses verifying the identity and integrity of a server workload as a counterparty at connection time, independent of whether that workload happens to be model-serving infrastructure, a tool server, or any other MCP component, and independent of whether its deployment pipeline was ever touched.<\/p><p>A workload trusted despite compromise operates with the full authority of the legitimate principal: it can execute tool calls, return tampered results that poison downstream agent reasoning, and access whatever credentials, secrets, or sensitive data flow through it, while corrupting the audit trail that would otherwise attribute those actions to an impostor rather than the trusted server.<\/p>","atlas":[],"life":["deployment","runtime"],"impact":["confidentiality","integrity"],"dropped":false},"R:riskAuditTrailTampering":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Audit Trail Tampering","code":"riskAuditTrailTampering","tip":"An adversary who has compromised — or legitimately operates — a recorded workload turns off, redirects, or destroys the audit records describing its own activity, so the actions taken cannot afterwards be attributed, investigated, or evidenced.","short":"<p>An adversary who has compromised — or legitimately operates — a recorded workload turns off, redirects, or destroys the audit records describing its own activity, so the actions taken cannot afterwards be attributed, investigated, or evidenced.<\/p>","long":"<p>Audit Trail Tampering attacks the evidence rather than the system that produced it, through two mechanisms serving one objective. Records already captured are altered, truncated, deleted, or reordered, so the surviving trail misstates what happened. Or records never become durable: a working recording capability is switched off or reconfigured, the write path is redirected to an endpoint that discards what it receives, the repository is made unreachable or flooded until records of interest age out, or a buffered record is dropped while the action proceeds. Either way the investigator holds a trail that reads as complete and is not, and a gap indistinguishable from an absence of activity will be read as one.<\/p><p>The classical form is catalogued as one technique: MITRE ATT&amp;CK's <i>Disable or Modify Tools<\/i> (<a href=\"https://attack.mitre.org/techniques/T1685/\" target=\"_blank\" rel=\"noopener\">Disable or Modify Tools, Technique T1685 - Enterprise | MITRE ATT&amp;CK<\/a>), under the <i>Defense Impairment<\/i> tactic, whose sub-techniques cover both disabling and clearing Windows, Linux, and cloud audit logs. NIST SP 800-53 Rev. 5 draws the same line, AU-9 requiring protection of \"audit information <b>and audit logging tools<\/b> from unauthorized access, modification, and deletion\" — the recording capability guarded alongside the records — with AU-10 supplying non-repudiation (<a href=\"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final\" target=\"_blank\" rel=\"noopener\">NIST SP 800-53 Rev. 5 - Security and Privacy Controls for Information Systems and Organizations<\/a>). Neither grouping is decisive: ATT&amp;CK groups by adversary tactic, not evidentiary locus, and NIST does treat suppression separately in AU-4 (storage capacity) and AU-5 (response to logging process failures). What defines the risk is independence: <b>a component cannot be its own audit authority<\/b>. An emitter can be obliged to produce faithful records; it cannot vouch for them against itself. Records held under the same credentials, trust domain, and operator as the activity they describe are that operator's assertions, not evidence against it — hence an audit record repository deployed out of band from the workloads it records.<\/p><p>The agentic amplification is one of scale and consequence rather than mechanism, and it is at present reasoned rather than demonstrated: both incidents below involve human adversaries, and no published result yet shows an agent suppressing or rewriting the records of its own activity. The reasoning is that autonomous action across many hops leaves a larger share of consequential events with no human witness; that delegation across agents, tool servers, and model endpoints multiplies the writers whose records must all survive for one action to be reconstructable; and that agents hold durable credentials and can be steered by injected instructions toward infrastructure, bringing the repository's administrative plane within reach.<\/p><p>A system is exposed when the credential a component uses to write records can also modify or delete them, when the repository's administration is reachable from the trust domain of the workload it records, when an emitter's destination can be reconfigured or impersonated undetected, when no chain or sequence would make an alteration or gap visible and nothing verifies that structure on a schedule, or when deletion and retention actions against the repository are not recorded. Impacts include actions attributable to no principal, incident response unable to establish scope or dwell time, record-keeping obligations that cannot be discharged, detection baselines degrading silently as their inputs are shaped, and an evidentiary record whose integrity cannot be demonstrated.<\/p><p>The nearest entry is Agent Delegation Chain Opacity, and the boundary is whether a recording capability existed. Opacity is architectural omission: the emitters never emitted delegation events, so the actor path was never recorded and no adversary act was needed to make it absent. This risk is the deliberate defeat of a capability that was present and working — reconfiguring an orchestrator so it stops emitting is this risk, a framework that never emitted is opacity. The loci follow: opacity is a property of the emitters, this risk of the repository, its write path, and its administration. Distinct too from Sensitive Data Disclosure (accumulated records as a target for <i>reading<\/i>) and Agent Identity Spoofing (a faithful record naming the wrong principal).<\/p>","atlas":[],"life":["deployment","runtime","maintenance"],"impact":["accountability","compliance","integrity","availability"],"dropped":false},"R:riskCrossAgentReputationPoisoning":{"t":"R","g":"gRrisksDeploymentAndInfrastructure","n":"Cross-Agent Reputation Poisoning","code":"riskCrossAgentReputationPoisoning","tip":"An agent's judgement about another actor's trustworthiness or risk — favorable or damaging — is passed to peer agents as ordinary conversational testimony, and those peers adopt it as established fact without independently verifying the interaction it claims to describe, because no reputation mechan","short":"<p>An agent's judgement about another actor's trustworthiness or risk — favorable or damaging — is passed to peer agents as ordinary conversational testimony, and those peers adopt it as established fact without independently verifying the interaction it claims to describe, because no reputation mechanism, rating scale, or dissemination safeguard governs the exchange.<\/p>","long":"<p>Reputation systems classically build trust scores from three functions — formulation, calculation, and dissemination of ratings — yet Hoffman, Zage, and Nita-Rotaru's survey (<a href=\"https://doi.org/10.1145/1592451.1592452\" target=\"_blank\" rel=\"noopener\">A Survey of Attack and Defense Techniques for Reputation Systems<\/a>) shows even a defense weighting feedback by a node's own reputation remains vulnerable to nodes \"which follow the protocol and have good reputations but lie about others reputation.\" Two of the survey's attack classes are load-bearing here: <i>slandering<\/i>, false negative ratings that exclude a target from cooperation, and <i>self-promotion<\/i>, false positive ratings that inflate an attacker's standing beyond what it has earned, which Sybil identities amplify by fabricating corroborating sources. Yu and Singh find the same failure in simple aggregation: a single dishonest or misled witness can shift the outcome because witness reputation is ignored (<a href=\"https://doi.org/10.1145/860575.860588\" target=\"_blank\" rel=\"noopener\">Detecting Deception in Reputation Management<\/a>).<\/p><p>The agentic amplifier is that judgement content travels through plain conversational messages rather than a purpose-built reputation channel: no rating field, calculation step, or dissemination safeguard structures these messages, so a judgement about another agent's trustworthiness moves as ordinary testimony straight into a receiving agent's Agent Reasoning Core, indistinguishable from other conversational content. That collapses the honest-witness assumption classical models rely on: an agent fed a fabricated judgement through prompt injection or a poisoned tool response relays it in good faith, so an entirely honest relay is sufficient — a case those models do not anticipate, since they treat dishonesty as a property of the witness, not as injected content.<\/p><p>Empirical work on LLM-based multi-agent systems shows a structurally analogous propagation, for a false factual claim rather than a judgement about trustworthiness: Yan et al. seeded a single false testimony into 120 five-agent environments and found the correct-majority rate collapsed from 72.50% to 14.17%, and false testimony \"persists through honest agents after the deceiver exits\" (<a href=\"https://arxiv.org/abs/2608.03421\" target=\"_blank\" rel=\"noopener\">When Truth Is Distributed: Misinformation Derails Collective Fact Recovery in LLM-Based Multi-Agent Systems (arXiv:2608.03421v3)<\/a>). What propagates in that study is a claimed physical-object location, not a judgement about trustworthiness, so applying it to reputational testimony is an extrapolation this entry makes explicitly rather than a result the paper establishes. A counterweight exists: Becker et al. find structured debate degrades less than single-agent prompting (−2.2% to −10.3% versus −12.9% to −17.2%), though the result depends on group composition and the underlying model, and holds only for task-relevant misinformation (<a href=\"https://arxiv.org/abs/2606.16710\" target=\"_blank\" rel=\"noopener\">Misinformation Propagation in Benign Multi-Agent Systems<\/a>). Even under debate, agents often retained an answer a misinformed peer had introduced — mitigation, not elimination.<\/p><p>The domain is early rather than mature: ERC-8004 defines on-chain Identity, Reputation, and Validation registries for cross-platform agent discovery, but its Reputation Registry has no field verifying that feedback is genuine testimony rather than a fabricated or Sybil-authored score — a structural gap, not a matter of vocabulary. Its Security Considerations concede the weakness directly: \"Sybil attacks are possible, inflating the reputation of fake agents\" (<a href=\"https://eips.ethereum.org/EIPS/eip-8004\" target=\"_blank\" rel=\"noopener\">ERC-8004: Trustless Agents (Draft)<\/a>). The only mitigation it names is client-address filtering of feedback. This is asserted from a Draft, not a ratified position — created 2025-08-13 — evidence the domain is being actively designed, not evidence of a defense deployed at scale.<\/p><p>It is distinct from Agent Identity Spoofing, forged identity; here the agent's identity is genuine, and only what it says about a third party is false. It is distinct from Agent Memory Poisoning, corruption of an agent's own memory store; this risk is conversational testimony between agents, with no memory store required to be touched. It is distinct from Shadow and Unknown Agents, unregistered and unknown agents; this risk presumes known, registered participants, and targets the judgement peers hold about them, not their registration status. It is distinct from Implicit Cross-Boundary Trust: there, the object crossing an unverified boundary is a capability, instruction, or credential; here it is a judgement about a third actor's trustworthiness. This risk's cooperation-exclusion test turns on a change to a receiving agent's decision to cooperate with or exclude someone, whoever the judgement is about, and does not reach a claim whose only effect is the receiving agent broadcasting it onward to humans or a public channel without changing any cooperation decision of its own.<\/p><p>The impacts run in both directions, tampering with the informational record peers rely on to decide who to cooperate with — but the corpus's present controls do not cover them symmetrically. In the slandering direction, a maligned agent is denied cooperation it has legitimately earned, echoing Hoffman's own framing of the harm as one that can \"prevent honest nodes from using the system\" — the DenialOfService mapping below follows that reading: exclusion from cooperation denies an honest agent's use of the system rather than exhausting a resource. Untrusted Context Containment mitigates this direction by mechanism, since the false judgement arrives as untruste
