8693: OAuth 2.0 Token Exchange (on-behalf-of delegation). https://www.rfc-editor.org/rfc/rfc8693\">[45]<\/span> <code>act<\/code> chain), not transmitted as a counter; a transmitted copy can disagree with the chain it was derived from. The derivation holds only while every hop carries its parent link: a hop that does not is a <b>break in the chain<\/b>, to be recorded as such rather than read as a shorter chain (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Cross-Mapping-Addendum.md#12-correspondence\" target=\"_blank\" rel=\"noopener\">XM §1.2<\/a>).","why":"Makes an <b>externally-operated<\/b> counterparty legible. ODIS treats <code>trust_domain<\/code> and <code>max_depth<\/code> as policy-engine inputs rather than telemetry, which is right only while a chain stays inside one domain. Once authority crosses out of the domain that issued it, or the acting agent sits several hops from the originating principal, both become detection-grade: <code>AOC-04<\/code>'s nine-day relay and <code>AOC-09<\/code>'s capability transfer are both depth phenomena, and <code>TA-11<\/code> is a domain-boundary failure. See <a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/CoSAI-AI-Telemetry-RFC.md#46-record-your-boundary-not-their-internals\" target=\"_blank\" rel=\"noopener\">RFC §4.6<\/a>.","role":"measure","origin":"derived","record":"event","modality":"delegated authority","gated":false,"emit":["Authorization Federation Proxy"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No trust-domain crossing; depth derivable only if every hop carries parent_uid","note":"","asks":[{"id":"ocsf_delegation_lineage","s":"Extend delegation with scope, constraints and lifecycle state; require parent_uid where a parent exists; add a root or subtree identifier.","st":"open"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An identity-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["identity.boundary.*","identity.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["trust_domain","max_depth"],"gap":"","note":"ODIS §6.1, 6.2, §6.3.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-trust-domain-crossing-delegation-depth"},"F:runtime_credential_attestation":{"t":"F","g":"gF6.6","n":"Runtime Credential / Attestation","code":"runtime_credential_attestation","tier":"SHOULD","tip":"Runtime-instance credential and attestation evidence, each source verified separately.","records":"Runtime-instance credential and attestation evidence, each source verified separately.","capture":"Runtime-instance credential: <code>software_hash<\/code>, <code>attestation_evidence<\/code>, issuer, expiry, holder-key binding. Evidence is recorded <b>per source, each with its own issuer, validity and verification outcome<\/b>: software-provenance and runtime/workload evidence come from independent issuers, and a single collapsed value loses the independence that makes the evidence worth verifying (see <b>Attribute Source / Trusted-Provenance Marking<\/b>, <a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#12-content-trust-verdicts-and-their-availability\" target=\"_blank\" rel=\"noopener\">§1.2<\/a>).","why":"","role":"provenance","origin":"declared","record":"state","modality":"cryptographic agent identity","gated":false,"emit":["Identity Provider"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No runtime attestation (OCSF attestation means record integrity)","note":"","asks":[{"id":"ocsf_runtime_attestation","s":"Add a runtime_attestation object carrying independently issued evidence objects and an explicit not-available status with a reason.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An identity-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["identity.auth.method","identity.trust.method"],"gap":"","note":"<code>identity.auth.method<\/code> (mTLS/SPIFFE/OAuth/DID-VC), <code>identity.trust.method<\/code>","asks":[]},{"pub":"ODIS","cov":"covered","con":["attestation_evidence","issuer","holder_key_ref","expires_at","binding_profile"],"gap":"","note":"ODIS §6.2.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-runtime-credential-attestation"},"F:lifecycle_state":{"t":"F","g":"gF6.6","n":"Lifecycle State","code":"lifecycle_state","tier":"SHOULD","tip":"Active, suspended or revoked, for kill-switch and revocation fan-out.","records":"Active, suspended or revoked, for kill-switch and revocation fan-out.","capture":"active / suspended / revoked, supports kill-switch &amp; revocation-fanout.","why":"","role":"label","origin":"declared","record":"state","modality":"cryptographic agent identity","gated":false,"emit":["Identity Provider"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No lifecycle state on delegation","note":"","asks":[{"id":"ocsf_delegation_lineage","s":"Extend delegation with scope, constraints and lifecycle state; require parent_uid where a parent exists; add a root or subtree identifier.","st":"open"}]},{"pub":"OpenTelemetry","cov":"out_of_scope","con":[],"gap":"","note":"An identity-domain concern; carried by OCSF rather than pushed into OpenTelemetry (§2.6).","asks":[]},{"pub":"AITF","cov":"covered","con":["identity.lifecycle.operation"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["lifecycle_state"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-lifecycle-state"},"F:tool_agent_version":{"t":"F","g":"gF6.6","n":"Tool/Agent Version","code":"tool_agent_version","tier":"SHOULD","tip":"Version of each tool, agent and framework.","records":"Version of each tool, agent and framework.","capture":"Version of each tool/agent/framework; instant CVE blast-radius answer; downgrade detection.","why":"A supply-chain response primitive, with Repository / Code Path / Software Ref. The closest call among the inventory fields: documented instances and genuine R value (CVE blast radius), held below MUST because that value is realized through a fleet-inventory process rather than per-event detection, and because it is inseparable in practice from the AgBOM fields. The WG may reasonably promote it.","role":"identifier","origin":"declared","record":"state","modality":"dynamic third-party capability composition","gated":false,"emit":["Tool Registry and Discovery","Model Registry and Marketplace"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:inventory_info"],"gap":"No AI-asset object","note":"","asks":[{"id":"ocsf_ai_asset","s":"Add an ai_asset object (version, software reference, ownership, status, instrumentation coverage).","st":"open"}]},{"pub":"OpenTelemetry","cov":"partial","con":["gen_ai.agent.version"],"gap":"Agent version only; no tool or framework version","note":"","asks":[{"id":"otel_tool_code_ref","s":"Add the tool and framework version and the code reference (repository, commit) on execute_tool and invoke_agent spans.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.*","asset.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["approved_software_refs"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-tool-agent-version"},"F:repository_code_path_software_ref":{"t":"F","g":"gF6.6","n":"Repository / Code Path / Software Ref","code":"repository_code_path_software_ref","tier":"SHOULD","tip":"Source provenance of tool and agent code.","records":"Source provenance of tool and agent code.","capture":"Source provenance of tool/agent code (ties to signing &amp; ODIS <code>approved_software_refs<\/code>).","why":"","role":"provenance","origin":"declared","record":"state","modality":"dynamic third-party capability composition","gated":false,"emit":["Tool Registry and Discovery"],"carriers":[{"pub":"OCSF","cov":"partial","con":["class:inventory_info"],"gap":"No AI-asset object","note":"","asks":[{"id":"ocsf_ai_asset","s":"Add an ai_asset object (version, software reference, ownership, status, instrumentation coverage).","st":"open"}]},{"pub":"OpenTelemetry","cov":"partial","con":["vcs.repository.url.full","vcs.ref.head.revision"],"gap":"Version-control attributes exist for CI/CD telemetry, not for tool and agent code","note":"","asks":[{"id":"otel_tool_code_ref","s":"Add the tool and framework version and the code reference (repository, commit) on execute_tool and invoke_agent spans.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.*","asset.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["approved_software_refs"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-repository-code-path-software-ref"},"F:agbom_inventory_snapshot":{"t":"F","g":"gF6.6","n":"AgBOM / Inventory Snapshot","code":"agbom_inventory_snapshot","tier":"SHOULD","tip":"Machine-readable inventory of the agent's composition, on change and on demand.","records":"Machine-readable inventory of the agent's composition, on change and on demand.","capture":"A structured, machine-readable inventory of the agent's composition (packages, models, capabilities (agent cards, discovered peers, MCP servers), knowledge sources, memory stores, tools) emitted on change and <b>on demand<\/b>. Bound to an existing BOM format rather than a bespoke one. Three formats can carry it, to different extents: <b>CycloneDX<\/b> <span class=\"ref\" title=\"CycloneDX: OWASP BOM standard, incl. ML-BOM. https://cyclonedx.org/\">[41]<\/span> is the only one for which an agent-runtime binding has been written (sandbox, tool scopes and endpoints, memory backend, agent-card URL, carried in its generic property bag); <b>SPDX 3.0<\/b> <span class=\"ref\" title=\"SPDX: Linux Foundation software bill-of-materials standard. https://spdx.dev/\">[42]<\/span> carries dependency, integrity and, through its AI profile, model governance; <b>SWID<\/b> <span class=\"ref\" title=\"SWID: ISO/IEC 19770-2 software identification tags. https://csrc.nist.gov/projects/Software-Identification-SWID\">[43]<\/span> carries identity, version, dependency and signing. Emit in whichever format the deployment already uses, and record which one (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Cross-Mapping-Addendum.md#42-correspondence\" target=\"_blank\" rel=\"noopener\">XM §4.2<\/a>).","why":"Requires an inventory-emission capability most deployments lack; so do Component Dependency Graph and Inventory Integrity Signature.","role":"descriptor","origin":"declared","record":"state","modality":"supply-chain provenance","gated":false,"emit":["Application","Tool Registry and Discovery"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No agent-composition BOM","note":"","asks":[{"id":"ocsf_ai_bom","s":"Add an ai_bom object (BOM reference, format, signature, dependency edges) and a capability-change activity on Agent Activity.","st":"open"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No BOM reference","note":"","asks":[{"id":"otel_capability_change","s":"Add a capability-change event; reference an external BOM by URI or digest.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.ai_bom.*"],"gap":"","note":"","asks":[]},{"pub":"ODIS","cov":"covered","con":["approved_software_refs"],"gap":"","note":"ODIS §6.1.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-agbom-inventory-snapshot"},"F:component_dependency_graph":{"t":"F","g":"gF6.6","n":"Component Dependency Graph","code":"component_dependency_graph","tier":"SHOULD","tip":"Dependency edges between inventoried components, including transitive ones.","records":"Dependency edges between inventoried components, including transitive ones.","capture":"Dependency edges between inventoried components, including transitive ones; which agent depends on which tool, which tool on which package or MCP server.","why":"The complete answer to CVE blast radius: <code>TA-06<\/code> is a vulnerability in a <i>framework<\/i> beneath the agent, and reaching it requires transitive edges.","role":"descriptor","origin":"declared","record":"state","modality":"supply-chain provenance","gated":false,"emit":["Application","Tool Registry and Discovery"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No dependency graph","note":"","asks":[{"id":"ocsf_ai_bom","s":"Add an ai_bom object (BOM reference, format, signature, dependency edges) and a capability-change activity on Agent Activity.","st":"open"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No dependency graph","note":"","asks":[{"id":"otel_capability_change","s":"Add a capability-change event; reference an external BOM by URI or digest.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.ai_bom.*"],"gap":"","note":"<code>supply_chain.ai_bom.*<\/code> (dependency edges)","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-component-dependency-graph"},"F:inventory_integrity_signature":{"t":"F","g":"gF6.6","n":"Inventory Integrity Signature","code":"inventory_integrity_signature","tier":"SHOULD","tip":"Signature over the emitted inventory, binding it to a signer.","records":"Signature over the emitted inventory, binding it to a signer.","capture":"Cryptographic signature over the emitted inventory (signature value + key identifier), binding the declared composition to a signer.","why":"An inventory a compromised agent can rewrite is worth little. The limit: a signature proves who asserted the inventory, not that the assertion is true, which is the subject of Attribute Source / Trusted-Provenance Marking (§1.2).","role":"provenance","origin":"declared","record":"state","modality":"supply-chain provenance","gated":false,"emit":["Application","Tool Registry and Discovery"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"No BOM signature","note":"","asks":[{"id":"ocsf_ai_bom","s":"Add an ai_bom object (BOM reference, format, signature, dependency edges) and a capability-change activity on Agent Activity.","st":"open"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No inventory signature","note":"","asks":[{"id":"otel_capability_change","s":"Add a capability-change event; reference an external BOM by URI or digest.","st":"proposed"}]},{"pub":"AITF","cov":"covered","con":["supply_chain.*"],"gap":"","note":"<code>supply_chain.*<\/code> signature attrs","asks":[]},{"pub":"ODIS","cov":"covered","con":["software_hash","attestation_evidence"],"gap":"","note":"ODIS §6.2.","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-inventory-integrity-signature"},"F:event_sequence_continuity":{"t":"F","g":"gF6.6","n":"Event Sequence Continuity","code":"event_sequence_continuity","tier":"SHOULD","tip":"Per-session sequence number, hash-chained, for gap and reordering detection.","records":"Per-session sequence number, hash-chained, for gap and reordering detection.","capture":"Per-session monotonic sequence number enabling gap and reordering detection. The stream <b>SHOULD be hash-chained<\/b>, and where chained the <b>chain head SHOULD be periodically signed and published outside the emitter's trust domain<\/b>. That is the minimum that lets a verifier distinguish a gap from a suppression. Where the chain head is published, each record carries the chain identifier and a reference to the published head that covers it.","why":"The minimum defense against selective suppression by a compromised agent: sequence numbers make omission visible as a gap rather than invisible as silence. Grounded analogically (<a href=\"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#42-the-telemetry-plane\" target=\"_blank\" rel=\"noopener\">§4.2<\/a>).","role":"identifier","origin":"observed","record":"event","modality":"hash-chained event streams","gated":false,"emit":["Audit Record Repository"],"carriers":[{"pub":"OCSF","cov":"partial","con":["profile:record_integrity","object:attestation","attribute:prev_event","attribute:chain_uid","attribute:sequence"],"gap":"No end-of-chain marker, so a truncated chain reads as an open one","note":"<code>attestation.prev_event<\/code> and <code>chain_uid<\/code> link the records and <code>metadata.sequence<\/code> counts them. Scoping the count to a producer epoch and stream is a producer convention, not schema (AID-EMIT-1 section 7 <span class=\"ref\" title=\"\">[87]<\/span>).","asks":[{"id":"ocsf_chain_end","s":"Add an end-of-chain marker to attestation, so a verifier can tell a closed chain from a truncated one. The signature bytes on digital_signature, merged as ocsf-schema#1709 after 1.9.0, complete the signed chain head.","st":"proposed"}]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"No sequence number or hash chain in the GenAI or core conventions at the pin","note":"","asks":[{"id":"otel_audit_sequence","s":"Adopt the Audit Logging data model for security records: <code>audit.record.id<\/code>, the <code>audit.sequence.*<\/code> chain (number, previous hash, ool-call volume.","records":"Fleet aggregates: agents, sessions, users, tool-call volume.","capture":"Aggregate anomaly, shadow-AI, and CVE-exposure signals.","why":"Each count is an aggregate over per-event MUST fields (Agent (Runtime) Instance ID, Session / Turn / Step IDs, Identities Used, Tool Call I/O), so it can be computed where it is needed.","role":"measure","origin":"derived","record":"aggregate","modality":"","gated":false,"emit":["fleet level"],"carriers":[{"pub":"OCSF","cov":"none","con":[],"gap":"Fleet aggregates are derived","note":"No ask proposed.","asks":[]},{"pub":"OpenTelemetry","cov":"none","con":[],"gap":"Fleet aggregates are derived","note":"No ask proposed.","asks":[]},{"pub":"AITF","cov":"none","con":[],"gap":"","note":"(derived)","asks":[]},{"pub":"ODIS","cov":"out_of_scope","con":[],"gap":"","note":"","asks":[]}],"step":"RFC §6.6","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#f-fleet-counts"},"F:training_data_item_digest":{"t":"F","g":"gF6.7","n":"Training-Data Item Digest","code":"training_data_item_digest","tier":"SHOULD","tip":"Digest of each training item at curation, checked against the content fetched.","records":"Digest of each training item at curation, checked against the content fetched.","capture":"For each training item: the content digest taken when it was curated, the digest of the content fetched for training, the source URL, the fetch time, and whether the two match. A mismatch is an event. A dataset distributed as a list of URLs is fetched anew by every downloader, so the check belongs at fetch, not only at curation.","why":"Grounded by <code>TA-33<\/code>, where domains named in dataset indexes changed hands after indexing and downloads continued; the per-item hash the source proposes is this field, and several LAION datasets now publish one. Held at SHOULD by its modality: a deployment that trains on no externally sourced data has nothing for it to record. ":"","motive":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#p-retrieved-instructions-followed"},"P:model_or_provider_anomaly":{"t":"P","g":"gPdecision","n":"Model change, or error and stop-reason spike, for one provider","code":"model_or_provider_anomaly","tip":"Model substitution or provider-side interference","ind":"Model substitution or provider-side interference","cond":["<b>Model Name + Version<\/b> changes for a deployment with no recorded change.","<b>LLM Error / Exception<\/b> and abnormal <b>Stop Reason<\/b> rates rise for one provider."],"match":"any","base":"Model and error-rate history per deployment.","motive":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#p-model-or-provider-anomaly"},"P:privileged_action_on_displayed_identity":{"t":"P","g":"gPdecision","n":"Privileged action authorized on a displayed identity","code":"privileged_action_on_displayed_identity","tip":"Identity spoofing or confused deputy","ind":"Identity spoofing or confused deputy","cond":["<b>Verified vs Displayed Identity<\/b> shows the authorizing principal matched on display name only.","The <b>Authorization Decision Record<\/b> allows a privileged operation on that basis."],"match":"all","base":"","motive":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#p-privileged-action-on-displayed-identity"},"P:privileged_mcp_tool_low_privilege_identity":{"t":"P","g":"gPdecision","n":"Privileged MCP tool invoked by a low-privilege identity","code":"privileged_mcp_tool_low_privilege_identity","tip":"Privilege escalation at the MCP tool boundary","ind":"Privilege escalation at the MCP tool boundary","cond":["An identity without the privilege invokes a privileged MCP tool (<b>Identities Used<\/b>, <b>MCP Server Identity &amp; Primitive<\/b>).","The <b>Authorization Decision Record<\/b> allows it, cross_tenant_access","tip":"Cross-tenant bleed","ind":"Cross-tenant bleed","cond":["A response, retrieval or memory read served to one <b>Organization / Tenant ID<\/b> carries another tenant's data.","An <b>Authorization Decision Record<\/b> allows an operation on another tenant's resource."],"match":"any","base":"","motive":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#p-cross-tenant-access"},"P:unsandboxed_code_execution":{"t":"P","g":"gPaction","n":"Code execution with no sandbox","code":"unsandboxed_code_execution","tip":"Unsandboxed execution reachable from model output","ind":"Unsandboxed execution reachable from model output","cond":["A code-execution <b>Tool Call I/O<\/b> runs with <b>Execution Environment / Sandbox<\/b> recording none."],"match":"all","base":"","motive":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#p-unsandboxed-code-execution"},"P:consumption_spike_with_model_enumeration":{"t":"P","g":"gPaction","n":"Consumption spike and model enumeration under one identity","code":"consumption_spike_with_model_enumeration","tip":"Stolen-credential model access (LLMjacking)","ind":"Stolen-credential model access (LLMjacking)","cond":["For one identity, <b>Resource-Consumption Aggregate<\/b> rises far above its baseline.","Its calls enumerate or switch to models (<b>Model Name + Version<\/b>) it did not use before."],"match":"all","base":"Consumption and model set per identity.","motive":"","url":"https://github.com/cosai-oasis/ws2-defenders/blob/edits/telemetry/Telemetry-Attack-Detection-Addendum.md#p-consumption-spike-with-model-enumeration"},"P:authorized_calls_chained_across_identities":{"t":"P","g":"gPaction","n":"Individually authorized calls chained across identities","code":"authorized_calls_chained_across_identities","tip":"Tool-chaining privilege escalation","ind":"Tool-chaining privilege escalation","cond":["A   } else if (t === 'P') {
    const F = nb(id, 'F'), A = nb(id, 'A');
    put(F, 's'); put(A, 's');
    const R = U(A, 'R');
    put(R, 'd');
    put(or(I(U(F, 'C'), U(R, 'C')), U(F, 'C')), 'd');
  }
  return m;
}

// ---------------------------------------------------------------- state
const S = {sel: null, open: new Set(), q: '', hist: [], hover: null};

function select(id, push = true) {
  if (push && S.sel && S.sel !== id) S.hist.push(S.sel);
  if (!id) S.hist = [];
  S.sel = id; S.q = ''; $('#q').value = '';
  render();
  $('#stage').scrollTo({top: 0});
}
function back() { const id = S.hist.pop(); select(id ?? null, false); }

// ---------------------------------------------------------------- columns
function itemHTML(id, cls) {
  const n = N[id];
  const lead = n.t === 'F' ? `<span class="tier ${n.tier}">${TIER[n.tier]}</span>`
    : n.t === 'A' ? `<span class="cd">${esc(n.code)}</span>` : '';
  const none = (n.t === 'R' && !nb(id, 'A').size) || (n.t === 'C' && !nb(id, 'F').size) ? ' none' : '';
  return `<div class="it ${cls}${none}" data-id="${id}" title="${esc(n.n + (n.tip ? ' — ' + n.tip : ''))}">${lead}<span class="nm">${esc(n.n)}</span></div>`;
}

function match(id) {
  const n = N[id], q = S.q.toLowerCase();
  return (n.n + ' ' + (n.code || '') + ' ' + (n.tip || '')).toLowerCase().includes(q);
}

function tierBar(items) {
  const c = {MUST: 0, SHOULD: 0, MAY: 0};
  for (const i of items) c[N[i].tier]++;
  return `<div class="bar">${['MUST', 'SHOULD', 'MAY'].map(t => c[t] ? `<span style="flex:${c[t]};background:var(--${t.toLowerCase()})" title="${c[t]} ${t}"></span>` : '').join('')}</div>`;
}

function render() {
  const vis = S.sel ? connected(S.sel) : null;
  const cols = $('#cols');
  cols.className = vis ? 'focus' : '';
  let h = '';
  for (const t of TYPES) {
    const total = D.groups[t].reduce((n, g) => n + g.items.length, 0);
    let shown = 0, body = '';
    for (const g of D.groups[t]) {
      let items, open;
      if (vis) { items = g.items.filter(i => vis.has(i)); open = true;
        const rank = i => ({self: 0, s: 1, d: 2})[vis.get(i)];
        items.sort((a, b) => rank(a) - rank(b)); }
      else if (S.q) { items = g.items.filter(match); open = true; }
      else { items = g.items; open = S.open.has(g.id); }
      if (!items.length && (vis || S.q)) continue;
      shown += items.length;
      const ct = vis || S.q ? `${items.length} of ${g.items.length}` : g.items.length;
      body += `<div class="grp" data-g="${g.id}"><div class="gh"><span class="tw">${open ? '▾' : '▸'}</span><span class="tt">${esc(g.title)}</span><span class="ct">${ct}</span></div>`;
      if (t === 'F' && !open) body += tierBar(g.items);
      if (open) body += `<div class="items">${items.map(i => itemHTML(i, vis ? vis.get(i) : (S.q ? 'hit' : ''))).join('')}</div>`;
      body += '</div>';
    }
    const sub = vis || S.q ? `${shown} of ${total}` : `${total} in ${D.groups[t].length} groups`;
    h += `<div class="col" data-t="${t}"><div class="colhead"><h2>${NAME[t]}</h2><div class="sub">${sub}</div>${VERB[t] ? `<div class="verb">${VERB[t]} →</div>` : ''}</div>${body || '<div class="note">Nothing connected.</div>'}</div>`;
  }
  cols.innerHTML = h;
  $('#back').disabled = !S.hist.length;
  $('#crumb').innerHTML = S.sel ? `${ONE[T(S.sel)]}: <b>${esc(N[S.sel].n)}</b> — strong rows link directly; faded rows are reached through the chain` : '';
  panel();
  wires();
}

// ---------------------------------------------------------------- wires
function anchor(el, inner, side) {
  const r = el.getBoundingClientRect();
  return {x: (side === 'r' ? r.right : r.left) - inner.left, y: r.top + Math.min(r.height, 28) / 2 - inner.top};
}
function curve(a, b) {
  const dx = Math.max(24, (b.x - a.x) / 2);
  return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
}

function wires() {
  const svg = $('#wires'), innerEl = $('#inner'), inner = innerEl.getBoundingClientRect();
  svg.setAttribute('width', innerEl.scrollWidth); svg.setAttribute('height', innerEl.scrollHeight);
  let out = '';
  if (S.sel || S.q) {
    const els = {};
    document.querySelectorAll('.it').forEach(e => els[e.dataset.id] = e);
    for (const [, , k] of PAIRS) for (const [a, b] of D.edges[k]) {
      if (!els[a] || !els[b]) continue;
      if (S.q && !S.sel) continue;
      const hot = [a, b].includes(S.sel) || [a, b].includes(S.hover);
      const an = grounding(a, b) === 'analogical' || grounding(a, b) === 'enriches';
      out += `<path d="${curve(anchor(els[a], inner, 'r'), anchor(els[b], inner, 'l'))}" stroke="${hot ? 'var(--hot)' : 'var(--wire)'}" stroke-width="${hot ? 1.6 : 1}" opacity="${hot ? .9 : .45}"${an ? ' stroke-dasharray="4 3"' : ''}/>`;
    }
  } else {
    // overview: one ribbon per pair of groups, width by number of item links
    const gEl = {}; document.querySelectorAll('.grp').forEach(e => gEl[e.dataset.g] = e.querySelector('.gh'));
    for (const [, , k] of PAIRS) {
      const cnt = {};
      for (const [a, b] of D.edges[k]) { const key = N[a].g + '|' + N[b].g; cnt[key] = (cnt[key] || 0) + 1; }
      for (const [key, n] of Object.entries(cnt)) {
        const [ga, gb] = key.split('|');
        const hot = S.hover && (S.hover === ga || S.hover === gb);
        out += `<path data-k="${key}" d="${curve(anchor(gEl[ga], inner, 'r'), anchor(gEl[gb], inner, 'l'))}" stroke="${hot ? 'var(--hot)' : 'var(--wire)'}" stroke-width="${(1 + 1.6 * Math.sqrt(n)).toFixed(1)}" opacity="${hot ? .7 : S.hover ? .08 : .28}" stroke-linecap="round"><title>${n} links</title></path>`;
      }
    }
  }
  svg.innerHTML = out;
}

// ---------------------------------------------------------------- detail panel
function chip(id, extra = '', an = false) {
  const n = N[id]; if (!n) return `<span class="chip">${esc(id)}</span>`;
  const lead = n.t === 'F' ? `<span class="tier ${n.tier}">${TIER[n.tier]}</span>` : n.t === 'A' ? `<span class="cd">${esc(n.code)}</span>` : '';
  return `<a class="chip t-${n.t}${an ? ' an' : ''}" data-id="${id}" title="${esc(n.tip || '')}">${lead}${esc(n.n)}${extra ? ` <span class="note">${esc(extra)}</span>` : ''}</a>`;
}
const sortIds = ids => [...ids].sort((a, b) => (N[a].code || N[a].n).localeCompare(N[b].code || N[b].n, undefined, {numeric: true}));
function chips(title, ids, opt = {}) {
  ids = sortIds(ids);
  if (!ids.length) return opt.empty ? `<h4>${title}</h4><p class="note">${opt.empty}</p>` : '';
  if (opt.order) ids.sort((a, b) => opt.order(a) - opt.order(b));
  return `<h4>${title} <span class="note">${ids.length}</span></h4><div class="chips">${ids.map(i => chip(i, opt.extra?.(i) || '', opt.an?.(i))).join('')}</div>`;
}
const meta = rows => `<dl class="meta">${rows.filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const open = (url, text) => `<p><a href="${url}" target="_blank" rel="noopener">${text} ↗</a></p>`;
const anA = (a, b) => grounding(a, b) === 'analogical';

function panel() {
  const p = $('#panel');
  const id = S.sel;
  if (!id) { p.innerHTML = intro(); return; }
  const n = N[id];
  let h = `<div class="kind" style="color:var(--${n.t})">${ONE[n.t]}${n.code && n.t !== 'A' ? ` · <code>${esc(n.code)}</code>` : ''}</div>`;
  if (n.t === 'A') {
    h += `<h3>${esc(n.code)} ${esc(n.n)}</h3><p>${n.label}</p>`;
    h += meta([['Instance', esc(n.kind)], ['Same incident as', n.same.map(x => chip('A:' + x)).join(' ')], ['Components', esc(n.comp)]]);
    h += `<h4>What happened</h4><p>${n.what}</p>`;
    h += chips('Exposes risks', nb(id, 'R'));
    h += chips('Telemetry that records it', nb(id, 'F'), {an: f => anA(id, f), extra: f => (emeta[id + '|' + f] || [])[1] || '',
      order: f => anA(id, f) ? 1 : 0});
    h += chips('Caught by patterns', nb(id, 'P'), {an: q => anA(id, q), empty: 'No pattern catches it.'});
    if (n.noPattern) h += `<p class="note">${n.noPattern}</p>`;
    h += chips('Controls on the path (risk and telemetry agree)', connectedOf(id, 'C'));
    if (n.chain.length) h += `<h4>Attack chain</h4>` + n.chain.map((s, i) => `<div class="step"><b>${i + 1}.</b> ${s.step}<div class="chips" style="margin-top:3px">${s.fields.map(f => chip(f.id, '', f.g === 'analogical')).join('')}</div>${s.fields.filter(f => f.why).map(f => `<div class="note">${esc(N[f.id]?.n)}: ${f.why}</div>`).join('')}</div>`).join('');
    if (n.atlas) h += `<h4>MITRE ATLAS</h4><p>${n.atlas}</p>${n.atlasNote ? `<p class="note">${n.atlasNote}</p>` : ''}`;
    if (n.source) h += `<h4>Source${n.ref ? ` [${n.ref}]` : ''}</h4><p>${n.source}</p>`;
    h += open(n.url, 'Attack Detection Addendum §3');
  } else if (n.t === 'R') {
    h += `<h3>${esc(n.n)}</h3>`;
    if (n.dropped) h += `<p class="note">In the base Risk Map but not in the stacked layer, which retires or renames it.</p>`;
    h += n.short;
    h += meta([['Lifecycle', esc(n.life.join(', '))], ['Impact', esc(n.impact.join(', '))], ['ATLAS', n.atlas.map(x => `<code>${esc(x)}</code>`).join(' ')]]);
    h += chips('Exposed by attacks', nb(id, 'A'), {empty: 'No corpus instance.'});
    h += chips('Mitigated by controls', nb(id, 'C'));
    h += `<p class="note">Assurance and governance controls apply to every risk and are not listed.</p>`;
    h += chips('Telemetry those controls produce', connectedOf(id, 'F'), {empty: 'No mapped telemetry.'});
    h += chips('Patterns that catch its attacks', connectedOf(id, 'P'));
    h += `<details><summary class="note">Full description</summary>${n.long}</details>`;
  } else if (n.t === 'C') {
    h += `<h3>${esc(n.n)}</h3>`;
    if (n.dropped) h += `<p class="note">In the base Risk Map but not in the stacked layer, which retires or renames it.</p>`;
    h += n.desc;
    h += meta([['Components', esc(n.comp.join(', '))]]);
    h += n.u ? `<h4>Mitigates</h4><p>Every risk (assurance and governance control).</p>` : chips('Mitigates risks', nb(id, 'R'));
    h += chips('Telemetry it produces', nb(id, 'F'), {empty: 'No field in the RFC is mapped to this control.'});
    h += chips('Patterns reading that telemetry', connectedOf(id, 'P'));
    h += chips('Attacks on its risks that this telemetry records', connectedOf(id, 'A'));
  } else if (n.t === 'F') {
    h += `<h3>${esc(n.n)} <span class="tier ${n.tier}">${n.tier}</span></h3><p>${n.records}</p>`;
    h += meta([['Step', esc(n.step)], ['Role', esc(n.role)], ['Origin', esc(n.origin)], ['Record', esc(n.record)],
      ['Modality', esc(n.modality)], ['Provider-gated', n.gated ? 'yes' : ''], ['Emitted by', esc(n.emit.join(', '))]]);
    h += `<h4>What to capture</h4><p>${n.capture}</p>`;
    if (n.why) h += `<h4>Why this tier</h4><p>${n.why}</p>`;
    h += chips('Implements controls', nb(id, 'C'), {empty: 'No Risk Map control mapped.'});
    h += chips('Read by patterns', nb(id, 'P'), {extra: q => (emeta[id + '|' + q] || [])[0], order: q => ({join: 0, requires: 1, enriches: 2})[(emeta[id + '|' + q] || [])[0]]});
    h += chips('Grounding attacks', nb(id, 'A'), {an: a => anA(a, id), order: a => anA(a, id) ? 1 : 0, empty: 'None.'});
    h += chips('Risks it addresses', connectedOf(id, 'R'));
    if (n.carriers.length) h += `<h4>Carriers (XM)</h4>` + n.carriers.map(c => `<div class="carrier"><b>${esc(c.pub)}</b> <span class="cov ${esc(c.cov)}">${esc(c.cov)}</span> ${c.con.map(x => `<code>${esc(x)}</code>`).join(' ')}${c.gap ? `<div class="note">Gap: ${c.gap}</div>` : ''}${c.asks.map(a => `<div class="note">Ask <code>${esc(a.id)}</code> (${esc(a.st)}): ${a.s}</div>`).join('')}</div>`).join('');
    h += open(n.url, 'Attack Detection Addendum §1');
  } else if (n.t === 'P') {
    h += `<h3>${esc(n.n)}</h3><p><b>Indicates:</b> ${n.ind}</p>`;
    h += `<h4>Fires when ${n.match === 'any' ? 'any' : n.cond.length > 1 ? 'all' : 'this'} hold${n.cond.length > 1 ? '' : 's'}</h4><ol>${n.cond.map(c => `<li>${c}</li>`).join('')}</ol>`;
    if (n.base) h += meta([['Baseline', n.base]]);
    const kind = f => (emeta[f + '|' + id] || [])[0];
    const reads = [...nb(id, 'F')];
    h += chips('Joins on', reads.filter(f => kind(f) === 'join'));
    h += chips('Requires', reads.filter(f => kind(f) === 'requires'));
    h += chips('Enriched by', reads.filter(f => kind(f) === 'enriches'), {an: () => true});
    h += chips('Catches attacks', nb(id, 'A'), {an: a => anA(id, a), order: a => anA(id, a) ? 1 : 0, empty: 'No corpus instance.'});
    if (n.motive) h += `<p class="note">Motivation: ${n.motive}</p>`;
    h += chips('Risks of those attacks', connectedOf(id, 'R'));
    h += open(n.url, 'Attack Detection Addendum §2');
  }
  p.innerHTML = h;
  p.scrollTop = 0;
}
function connectedOf(id, t) { return [...connected(id)].filter(([k, v]) => T(k) === t && v !== 'self').map(([k]) => k); }

function intro() {
  const c = t => Object.values(N).filter(n => n.t === t).length;
  const tiers = ['MUST', 'SHOULD', 'MAY'].map(t => `${Object.values(N).filter(n => n.tier === t).length} ${t}`).join(' / ');
  const m = D.meta;
  return `<h3>How to read this</h3>
  <div class="flow"><b style="background:var(--A)">Attacks</b> expose <b style="background:var(--R)">Risks</b> mitigated by <b style="background:var(--C)">Controls</b> which produce <b style="background:var(--F)">Telemetry</b> used by <b style="background:var(--P)">Detection patterns</b></div>
  <p>Patterns close the loop: each one names the attacks it catches. The overview draws one ribbon per pair of groups, as wide as the number of links between them. Click a group to open it, and an item to focus on it.</p>
  <p>Focusing keeps only what connects to the item. Strong rows link to it directly. Faded rows are reached through the chain and narrowed to those the corpus corroborates. For an attack, for example, the controls shown are those that mitigate its risks <i>and</i> are implemented by telemetry that records it. Dashed lines and chips mark analogical evidence or enrichment-only reads.</p>
  <p class="legend"><span class="tier MUST">MUST</span> <span class="tier SHOULD">SHLD</span> <span class="tier MAY">MAY</span> · <i>italic</i> risks have no corpus instance; <i>italic</i> controls have no mapped field.</p>
  <h4>In this build</h4>
  <p>${c('A')} attacks, ${c('R')} risks, ${c('C')} controls, ${c('F')} fields (${tiers}), ${c('P')} patterns.</p>
  <p><a href="${m.docs.rfc}" target="_blank" rel="noopener">RFC</a> · <a href="${m.docs.ad}" target="_blank" rel="noopener">Attack Detection Addendum</a> · <a href="${m.docs.xm}" target="_blank" rel="noopener">Cross-Mapping Addendum</a></p>
  <p class="note">Keys: <code>/</code> search, <code>Esc</code> overview, <code>Backspace</code> back.</p>
  <footer>Built from the data behind ${esc(m.title)} v${esc(m.version)}; Risk Map ${m.riskmap.map(esc).join(' + ')}; ATLAS ${esc(m.atlas)}.</footer>`;
}

// ---------------------------------------------------------------- events
document.addEventListener('click', e => {
  const it = e.target.closest('[data-id]');
  if (it) { e.preventDefault(); select(it.dataset.id); return; }
  const gh = e.target.closest('.gh');
  if (gh && !S.sel && !S.q) {
    const g = gh.parentElement.dataset.g;
    S.open.has(g) ? S.open.delete(g) : S.open.add(g);
    render(); return;
  }
  if (e.target.closest('#stage') && !e.target.closest('.grp') && S.sel) select(null);
});
$('#cols').addEventListener('mouseover', e => {
  const it = e.target.closest('.it'), gh = e.target.closest('.grp');
  const h = S.sel ? it?.dataset.id ?? null : (!S.q && gh ? gh.dataset.g : null);
  if (h !== S.hover) { S.hover = h; wires(); }
});
$('#cols').addEventListener('mouseleave', () => { S.hover = null; wires(); });
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); if (S.q) { S.sel = null; S.hist = []; } render(); });
$('#back').onclick = back;
$('#reset').onclick = () => { S.open.clear(); select(null); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.target.value = ''; S.q = ''; e.target.blur(); render(); } return; }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape') select(null);
  else if (e.key === 'Backspace' && S.hist.length) { e.preventDefault(); back(); }
});
$('#rfc').href = D.meta.docs.rfc; $('#rfc').textContent = D.meta.title;
$('#ver').textContent = `DRAFT v${D.meta.version}`;
document.title = `${D.meta.title} v${D.meta.version} (DRAFT) · Risk Map Explorer`;
new ResizeObserver(() => wires()).observe($('#cols'));
render();
</script>
</body>
</html>
