  status: proposed
- id: P:repeated_refusals
  type: pattern
  subject:
    pattern: repeated_refusals
  source: phase5
  proposal:
    id: repeated_refusals
    former_id: CP-34
    name: Repeated refusals
    indicates: An attack attempt in progress, resisted or probing
    stage: decision
    join: [session_turn_step_ids, identities_used_per_hop]
    conditions:
    - '**LLM Refusal** fires repeatedly within a session, or for one identity across sessions.'
