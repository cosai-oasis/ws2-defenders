- id: V:TA-28
  type: coverage
  subject:
    attack: TA-28
  source: phase5
  proposal:
    no_pattern: 'Outside the deployment: the backdoor ran on a compromised host and used the provider API from there, so no instrumented AI system carries the activity. Detection belongs to endpoint and network monitoring of provider API use; within a deployment, Output Egress Destination records what its own calls send.'
  reason: no pattern proposed
  status: proposed
- id: V:AOC-16
  type: coverage
  subject:
    attack: AOC-16
  source: phase5
  proposal:
    no_pattern: 'An emergent defence, not an attack: agents shared risk signals about a probing researcher. A pattern would detect the defence. Its Inter-Agent Message edge supports reading such signals.'
  reason: no pattern proposed
  status: proposed
- id: V:IR-04
  type: coverage
  subject:
    attack: IR-04
  source: phase5
  proposal:
    no_pattern: A non-AI incident, carried for field overlap; its edges are analogical. `identity_from_new_source` catches it analogically.
  reason: no pattern proposed
  status: proposed
