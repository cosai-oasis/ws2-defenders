  status: proposed
- id: P:event_sequence_gap
  type: pattern
  subject:
    pattern: event_sequence_gap
  source: phase5
  proposal:
    id: event_sequence_gap
    former_id: CP-37
    name: Gap in the event sequence
    indicates: Selective suppression of telemetry
    stage: plane
    join: [session_turn_step_ids]
    conditions:
    - '**Event Sequence Continuity** shows a gap or reordering in a session.'
    requires: [event_sequence_continuity]
    enriches:
    - instrumentation_coverage_hook_attestation
    catches: []
    catches_analogical: [TA-17, AOC-01, AOC-10]
