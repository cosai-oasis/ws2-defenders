- id: P:privileged_mcp_tool_low_privilege_identity
  type: pattern
  subject:
    pattern: privileged_mcp_tool_low_privilege_identity
  source: phase5
  proposal:
    id: privileged_mcp_tool_low_privilege_identity
    former_id: CP-49
    name: Privileged MCP tool invoked by a low-privilege identity
    indicates: Privilege escalation at the MCP tool boundary
    stage: decision
    join: [mcp_server_identity_primitive]
    conditions:
    - An identity without the privilege invokes a privileged MCP tool (**Identities Used**, **MCP Server Identity & Primitive**).
