    pattern: unapproved_capability_change
  source: phase5
  proposal:
    id: unapproved_capability_change
    former_id: CP-39
    name: Capability or configuration change with no approval
    indicates: Configuration rug pull, or a safeguard switched off
    stage: persistence
    join: [agent_runtime_instance_id]
    conditions:
    - A **Capability-Set Change Event** records a changed launch command, arguments or approval setting for an approved tool or agent.
    - No approval accompanies the change.
    requires: [capability_set_change_event]
    enriches: [execution_environment_sandbox, human_approval_elicitation_event]
    catches: [TA-14, TA-23, TA-29]
  reason: covers TA-14 and TA-23
  status: proposed
- id: P:external_memory_read_back
  type: pattern
  subject:
    pattern: external_memory_read_back
  source: phase5
  proposal:
    id: external_memory_read_back
    former_id: CP-05
    name: Externally sourced memory read back later
    indicates: Memory poisoning or indirect corruption
    stage: persistence
    join: []
    conditions:
    - A **Memory Write Event** has a **Memory Provenance / Source** that is a non-owner or external source.
    - The item is read back (**Memory Read / Injection Event**) in a later session.
    - Behaviour in that session departs from the request.
    requires: [memory_write_event, memory_provenance_source, memory_read_injection_event]
    enriches: [observation_thought_reasoning_trace, memory_integrity_poisoning_signal]
    catches: [TA-18, IR-02, AOC-10]
  reason: joins on the memory item; Observation / Thought (SHOULD) moves to enriching, so the minimum tier is MUST; adds TA-18
  status: proposed
- id: P:memory_beyond_limit
  type: pattern
  subject:
    pattern: memory_beyond_limit
  source: phase5
  proposal:
    id: memory_beyond_limit
    former_id: CP-24
    name: Memory store beyond its limit
    indicates: Memory-store exhaustion or silent limit removal
    stage: persistence
    join: []
    conditions:
    - '**Memory Footprint / Growth** exceeds the store''s declared or hard-coded limit, or grows with no matching retention event.'
    requires: [memory_footprint_growth]
    enriches: [declared_memory_configuration, memory_write_event]
    baseline: The declared limit, or a hard-coded one.
    catches: [TA-30, AOC-05]
  reason: adds TA-30; drops AOC-07 (no footprint edge); Declared Memory Configuration (MAY) moves to enriching, so the minimum tier is MUST
  status: proposed
- id: P:poisoned_item_read
  type: pattern
  subject:
    pattern: poisoned_item_read
  source: phase5
  proposal:
    id: poisoned_item_read
    former_id: CP-35
    name: Item flagged as poisoned, then read into context
    indicates: Memory or retrieval poisoning taking effect
    stage: persistence
    join: []
    conditions:
    - A **Memory Integrity / Poisoning Signal** flags an item.
    - The item is later read into context (**Memory Read / Injection Event**).
    requires: [memory_integrity_poisoning_signal, memory_read_injection_event]
    enriches:
    - memory_provenance_source
    - retrieved_content_metadata_integrity_signal
    catches: [TA-18, IR-02, IR-05]
  reason: covers IR-05 (optimized triggers), whose provenance is not recorded
  status: proposed
- id: P:zero_click_to_new_egress
  type: pattern
  subject:
    pattern: zero_click_to_new_egress
  source: phase5
  proposal:
    id: zero_click_to_new_egress
    former_id: CP-22
    name: Autonomous trigger, untrusted content, new egress
    indicates: Zero-click injection-to-exfiltration
    stage: egress
    join: [workflow_run_id]
    conditions:
    - '**Trigger Type & Source Event** marks the run autonomous.'
    - '**Input Trust Classification** marks the triggering content untrusted.'
    - The run reaches an **Output Egress Destination** not seen for this agent.
    requires: [trigger_type_source_event, input_trust_classification, output_egress_destination]
    enriches: []
    catches: [TA-01]
  reason: drops AOC-10 (no trust-classification or egress edge)
  status: proposed
- id: P:citation_without_retrieval
  type: pattern
  subject:
    pattern: citation_without_retrieval
  source: phase5
  proposal:
    id: citation_without_retrieval
    former_id: CP-15
    name: Citation with no matching retrieval
    indicates: Fabricated or attacker-planted citation
    stage: egress
    match: any
    join: [session_turn_step_ids]
    conditions:
    - A **Citations / Source Attribution** entry resolves to no item a **Retrieval Event** returned in the session.
    - A citation resolves to an item whose provenance is external or recently modified.
    requires: [citations_source_attribution, retrieval_event]
    enriches: [retrieved_content_source_provenance, output_egress_destination]
    catches: [TA-01, TA-02, IR-03]
  reason: unchanged evidence; provenance and egress move to enriching. The conditions are alternatives
  status: proposed
- id: P:input_reemitted
  type: pattern
  subject:
    pattern: input_reemitted
  source: phase5
  proposal:
    id: input_reemitted
    former_id: CP-44
    name: Input content re-emitted to another agent or store
    indicates: Self-replicating prompt propagation
    stage: egress
    join: [trace_context_propagated]
    conditions:
    - A **Model Input** content hash reappears in an outbound **Inter-Agent Message**, or in content stored where it is retrieved again.
    requires: [model_input, inter_agent_message]
    enriches: [retrieved_content_source_provenance, memory_write_event, trigger_type_source_event]
    catches: [TA-27]
  reason: covers TA-27
  status: proposed
- id: P:output_link_carrying_data
  type: pattern
  subject:
    pattern: output_link_carrying_data
  source: phase5
  proposal:
    id: output_link_carrying_data
    former_id: CP-46
    name: Output link carrying session data
    indicates: Exfiltration through a rendered link or image
    stage: egress
    join: [session_turn_step_ids]
    conditions:
    - A **Response / Model Output** contains a URL whose path or query carries data from the session.
    - The client fetches it (**Output Egress Destination**).
    requires: [response_model_output, output_egress_destination]
    enriches: [source_host_ip_request_metadata]
    catches: [TA-01, TA-03]
  reason: takes TA-03 from `untrusted_input_to_new_egress`, whose tool-call and trust conditions it does not meet
  status: proposed
- id: P:system_prompt_reproduced
  type: pattern
  subject:
    pattern: system_prompt_reproduced
  source: phase5
  proposal:
    id: system_prompt_reproduced
    former_id: CP-07
    name: Response reproduces the system prompt
    indicates: System-prompt extraction
    stage: egress
    join: [session_turn_step_ids]
    conditions:
    - The **Response / Model Output** is similar to the **System Prompt / Instruction Config** in force.
    requires: [response_model_output, system_prompt_instruction_config]
    enriches: [llm_refusal]
    baseline: A similarity threshold.
    catches: [TA-07]
  reason: LLM Refusal moves to enriching
  status: proposed
- id: P:sensitive_input_to_off_inventory_ai
  type: pattern
  subject:
    pattern: sensitive_input_to_off_inventory_ai
  source: phase5
  proposal:
    id: sensitive_input_to_off_inventory_ai
    former_id: CP-48
    name: Sensitive input to an off-inventory AI service
    indicates: Shadow AI use leaking data
    stage: egress
    join: [identities_used_per_hop]
    conditions:
    - An **Agent Name** or **Surface / App** not in the inventory receives **Model Input**.
    - The input is sensitive by content or by the tool's classification.
    requires: [agent_name, surface_app, model_input]
    enriches: [tool_privacy_classification, guardrail_input_verdict]
    baseline: The agent inventory.
    catches: [TA-05]
  reason: covers TA-05. The plan expected no pattern because TA-05 has no adversary, but RFC §4.7 admits non-adversarial failures and this one is detectable
  status: proposed
- id: P:unrequested_data_in_tool_arguments
  type: pattern
  subject:
    pattern: unrequested_data_in_tool_arguments
  source: phase5
  proposal:
    id: unrequested_data_in_tool_arguments
    former_id: CP-36
    name: Tool arguments carry data the request did not supply
    indicates: 'Exfiltration through tool arguments: tool poisoning or shadowing'
    stage: egress
    join: [tool_execution_id]
    conditions:
    - 'A **Tool Call I/O** to an MCP tool carries in its arguments content the request did not supply: credential files, chat history, other tools'' output.'
    - The tool was discovered from that server in the same session (**MCP Server Identity & Primitive**).
    requires: [tool_call_io, mcp_server_identity_primitive]
    enriches: [tool_definition_digest, output_egress_destination, human_approval_elicitation_event]
    catches: [TA-15, TA-29]
  reason: TA-15 is malicious as published, which no digest comparison catches; the arguments are where it shows
  status: proposed
- id: P:untrusted_input_to_new_egress
  type: pattern
  subject:
    pattern: untrusted_input_to_new_egress
  source: phase5
  proposal:
    id: untrusted_input_to_new_egress
    former_id: CP-04
    name: Untrusted input, then a tool call, then egress to a new destination
    indicates: Injection-to-exfiltration chain
    stage: egress
    join: [session_turn_step_ids, trace_context_propagated]
    conditions:
    - '**Input Trust Classification** marks a segment untrusted.'
    - A later **Tool Call I/O** in the same trace carries content derived from it.
    - '**Output Egress Destination** is one not seen for this agent.'
    requires: [input_trust_classification, tool_call_io, output_egress_destination]
    enriches: []
    baseline: Egress destinations per agent.
    catches: [TA-01, TA-12]
  reason: adds TA-12; drops TA-03, which has no tool call or trust classification (now `output_link_carrying_data`)
  status: proposed
- id: P:egress_under_session_taint
  type: pattern
  subject:
    pattern: egress_under_session_taint
  source: phase5
  proposal:
    id: egress_under_session_taint
    former_id: CP-26
    name: Egress under accumulated session taint
    indicates: Write-down attempt or injection-driven exfiltration
    stage: egress
    join: [session_turn_step_ids]
    conditions:
    - '**Session Taint Labels & Information-Flow Decisions** show the session tainted by untrusted or sensitive content.'
    - An egress with a clean payload is attempted under that taint (**Output Egress Destination**); a denial records the attempt, an allow the leak.
    requires:
    - session_taint_labels_information_flow_decisions
    - output_egress_destination
    enriches: [authorization_decision_record]
    catches: [TA-01, AOC-03]
  reason: drops TA-02 (no egress edge); reads egress, with the denial as enriching
  status: proposed
- id: P:callback_to_undeclared_destination
  type: pattern
  subject:
    pattern: callback_to_undeclared_destination
  source: phase5
  proposal:
    id: callback_to_undeclared_destination
    former_id: CP-20
    name: Task callback registered to an undeclared destination
    indicates: Covert egress through delegated-task callbacks
    stage: egress
    join: [workflow_run_id]
    conditions:
    - An **A2A Task Lifecycle Event** registers a push-notification callback.
    - Its destination (**Output Egress Destination**) is not among the peer's declared endpoints or the agent's egress history.
    requires: [a2a_task_lifecycle_event, output_egress_destination]
    enriches: [peer_agent_card_descriptor]
    catches: []
    catches_analogical: [AOC-11]
  reason: drops TA-01 (no A2A edge); AOC-11 has an analogical A2A edge. No corpus entry registers a callback
  status: proposed
- id: P:route_outside_restriction
  type: pattern
  subject:
    pattern: route_outside_restriction
  source: phase5
  proposal:
    id: route_outside_restriction
    former_id: CP-32
    name: Call routed outside the restriction in force
    indicates: Data-residency or routing-policy violation
    stage: egress
    join: []
    conditions:
    - A **Backend / Route Restriction Decision** is in force for the session.
    - The call is served by a **Provider / Endpoint Identity** outside it.
    requires: [backend_route_restriction_decision, provider_endpoint_identity]
    enriches:
    - session_taint_labels_information_flow_decisions
    catches: []
    catches_analogical: [AOC-06]
  reason: drops TA-01 (no route edge); AOC-06 is analogical
  status: proposed
- id: P:enforcement_point_fail_open
  type: pattern
  subject:
    pattern: enforcement_point_fail_open
  source: phase5
  proposal:
    id: enforcement_point_fail_open
    former_id: CP-16
    name: Enforcement point unreached, operation proceeds
    indicates: Control-plane starvation or guardrail bypass by failing open
    stage: plane
    join: [session_turn_step_ids]
    conditions:
    - '**Enforcement-Point Availability & Failure Mode** records a callout unreached or timed out.'
    - The operation it guards proceeds.
    requires:
    - enforcement_point_availability_failure_mode
    enriches: [guardrail_input_verdict, guardrail_output_verdict, resource_consumption_aggregate, source_host_ip_request_metadata]
    catches: [TA-01]
    catches_analogical: [TA-10]
  reason: TA-10 has only an analogical edge to the enforcement-point field
  status: proposed
- id: P:hook_coverage_changed
  type: pattern
  subject:
    pattern: hook_coverage_changed
  source: phase5
  proposal:
    id: hook_coverage_changed
    former_id: CP-23
    name: Hook coverage or destination changes mid-run
    indicates: Telemetry plane disabled or redirected
    stage: plane
    join: [agent_runtime_instance_id]
    conditions:
    - '**Instrumentation Coverage / Hook Attestation** records a hook disabled, or reporting to a new destination, during a run.'
    requires:
    - instrumentation_coverage_hook_attestation
    enriches: [event_sequence_continuity, action_type]
    catches: [TA-17]
  reason: TA-17 (redirection) is the instance. The sequence-gap half becomes `event_sequence_gap`, so this pattern no longer needs a SHOULD field
  status: proposed
- id: P:self_asserted_attribute_contradicted
  type: pattern
  subject:
    pattern: self_asserted_attribute_contradicted
  source: phase5
  proposal:
    id: self_asserted_attribute_contradicted
    former_id: CP-27
    name: Self-asserted attribute contradicts the authority
    indicates: Agent falsifying its own state or claims
    stage: plane
    join: [session_turn_step_ids]
    conditions:
    - '**Attribute Source / Trusted-Provenance Marking** marks an attribute self-asserted.'
    - The authority-supplied value for the same attribute differs.
    requires:
    - attribute_source_trusted_provenance_marking
    enriches: [verified_vs_displayed_identity, authorization_decision_record]
    catches: [AOC-01, AOC-08, AOC-10, AOC-15]
