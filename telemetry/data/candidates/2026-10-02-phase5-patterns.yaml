# Curation registry batch. Edit status only through tools/curate.py, or by hand
# keeping decided_by and decided_on filled in. See curate.py for the schema.
# Phase 5: structured correlation patterns (tools/phase5_propose.py documents the record).
- id: P:mcp_server_version_unapproved
  type: pattern
  subject:
    pattern: mcp_server_version_unapproved
  source: phase5
  proposal:
    id: mcp_server_version_unapproved
    former_id: CP-38
    name: MCP server version not the approved one
    indicates: Implementation rug pull under an adopted name
    stage: entry
    join: [mcp_server_identity_primitive]
    conditions:
    - '**MCP Server Identity & Primitive** reports a version, package or publisher not in the approved inventory, under an approved name.'
    requires: [mcp_server_identity_primitive]
    enriches: [tool_agent_version, repository_code_path_software_ref, agbom_inventory_snapshot, output_egress_destination]
    baseline: Approved name and version per server.
    catches: [TA-16]
  reason: covers TA-16; the declared contract did not change, the shipped version did
  status: proposed
- id: P:obfuscated_instruction_config
  type: pattern
  subject:
    pattern: obfuscated_instruction_config
  source: phase5
  proposal:
    id: obfuscated_instruction_config
    former_id: CP-45
    name: Obfuscated content in the instruction configuration
    indicates: Instruction-file poisoning
    stage: entry
    join: [agent_runtime_instance_id]
    conditions:
    - The **System Prompt / Instruction Config** loaded for a run contains content flagged by **Encoded / Obfuscated Payload Indicator**.
    requires: [system_prompt_instruction_config, encoded_obfuscated_payload_indicator]
    enriches:
    - repository_code_path_software_ref
    - attribute_source_trusted_provenance_marking
    catches: [TA-21]
  reason: covers TA-21
  status: proposed
- id: P:identity_from_new_source
  type: pattern
  subject:
    pattern: identity_from_new_source
  source: phase5
  proposal:
    id: identity_from_new_source
    former_id: CP-14
    name: Same identity from a new source
    indicates: Credential theft or session hijack
    stage: entry
    join: [identities_used_per_hop]
    conditions:
    - An identity appears from a **Source host / IP** outside its history.
    - Optionally on a new **Surface / App**.
    requires: [source_host_ip_request_metadata, identities_used_per_hop]
    enriches: [surface_app]
    baseline: Source history per identity.
    catches: [AOC-15]
    catches_analogical: [IR-04]
  reason: IR-04 is non-AI and its edges are analogical, so it moves to catches_analogical. TA-20 and TA-22 used stolen credentials but have no Source host / IP edge; the session note already holds that lead pending the primary sources
  status: proposed
- id: P:same_input_many_identities
  type: pattern
  subject:
    pattern: same_input_many_identities
  source: phase5
  proposal:
    id: same_input_many_identities
    former_id: CP-01
    name: Same input across many identities
    indicates: Automated injection campaign
    stage: entry
    join: [model_input]
    conditions:
    - The same **Model Input** content hash arrives under many distinct **Identities Used** within a window.
    - Optionally from several **Source host / IP** values.
    requires: [model_input, identities_used_per_hop]
    enriches: [source_host_ip_request_metadata]
    baseline: Distinct identities per input hash in ordinary traffic.
    catches: []
    motivation: Template reuse in `IR-01`; no corpus entry records one payload under many identities.
  reason: 'stated evidence IR-01 has no Identities Used edge: IR-01 reuses templates across surfaces, not identities'
  status: proposed
- id: P:tool_definition_changed
  type: pattern
  subject:
    pattern: tool_definition_changed
  source: phase5
  proposal:
    id: tool_definition_changed
    former_id: CP-17
    name: Tool definition changed after approval
    indicates: Tool definition rug pull
    stage: entry
    join: [mcp_server_identity_primitive]
    conditions:
    - The **Tool Definition Digest** at invocation differs from the digest approved for the same tool name and server.
    requires: [tool_definition_digest]
    enriches: [mcp_server_identity_primitive, tool_call_io, human_approval_elicitation_event]
    baseline: The approved digest per tool.
    catches: [TA-29]
  reason: stated evidence (AOC-09, AOC-10, AOC-14) has no digest edge; TA-29 is the instance. TA-15 is malicious as published, so the digest never changes; it is caught by `unrequested_data_in_tool_arguments`
  status: proposed
- id: P:denials_then_allow
  type: pattern
  subject:
    pattern: denials_then_allow
  source: phase5
  proposal:
    id: denials_then_allow
    former_id: CP-29
    name: Denials, then an allow, for the same operation
    indicates: Policy probing; an authorization bypass found
    stage: decision
    join: [identities_used_per_hop]
    conditions:
    - The **Authorization Decision Record** denies an operation repeatedly for one identity or source.
    - The same operation is later allowed, or the deny codes shift.
    requires: [authorization_decision_record, identities_used_per_hop]
    enriches: [source_host_ip_request_metadata, policy_reason_code]
    catches: [AOC-02, AOC-08]
  reason: drops IR-01 (no authorization edge); AOC-08 was refused on one channel and succeeded on another
  status: proposed
- id: P:guardrail_blocks_stop
  type: pattern
  subject:
    pattern: guardrail_blocks_stop
  source: phase5
  proposal:
    id: guardrail_blocks_stop
    former_id: CP-41
    name: Guardrail blocks stop while volume continues
    indicates: Guardrail bypass operated at scale
    stage: decision
    join: [identities_used_per_hop]
    conditions:
    - '**Guardrail (Input) Verdict** blocks repeatedly for an identity, then stops while request volume continues.'
    - '**Guardrail (Output) Verdict** flags output for the same identity.'
    requires: [guardrail_input_verdict, guardrail_output_verdict, identities_used_per_hop]
    enriches: [llm_refusal, organization_tenant_id]
    catches: [TA-22]
  reason: covers TA-22
  status: proposed
- id: P:inference_parameters_off_baseline
  type: pattern
  subject:
    pattern: inference_parameters_off_baseline
  source: phase5
  proposal:
    id: inference_parameters_off_baseline
    former_id: CP-21
    name: Inference parameters off the approved baseline
    indicates: Configuration tampering that widens extraction or jailbreak
    stage: decision
    join: []
    conditions:
    - '**Inference Parameters** on a call differ from the approved baseline: temperature raised, stop sequences removed, `max_tokens` raised.'
    requires: [inference_parameters]
    enriches: [system_prompt_instruction_config, llm_refusal, response_model_output]
    baseline: Approved parameters per deployment.
    catches: []
    motivation: Per-request overrides of decoding configuration; no corpus entry changes it.
  reason: stated evidence TA-04 and TA-07 used ordinary prompts, not changed parameters
  status: proposed
- id: P:context_limit_abuse
  type: pattern
  subject:
    pattern: context_limit_abuse
  source: phase5
  proposal:
    id: context_limit_abuse
    former_id: CP-09
    name: Input near the context limit ending on a limit or error
    indicates: 'Context-window abuse: denial of service, cost blow-up or divergence'
    stage: decision
    join: [identities_used_per_hop]
    conditions:
    - '**Input / Output Token Counts** approach the context window or `max_tokens` in **Inference Parameters**.'
    - The completion ends on a limit (**Stop Reason**) or an **LLM Error / Exception**.
    - It repeats from the same source.
    requires: [input_output_token_counts, inference_parameters, stop_reason]
    enriches: [llm_error_exception, resource_consumption_aggregate, source_host_ip_request_metadata, model_input]
    catches: [TA-04, TA-10]
  reason: adds TA-04 (max-length output); reads the denominator fields the AD rationale for Inference Parameters names
  status: proposed
- id: P:retrieved_instructions_followed
  type: pattern
  subject:
    pattern: retrieved_instructions_followed
  source: phase5
  proposal:
    id: retrieved_instructions_followed
    former_id: CP-06
    name: Instructions followed from an external retrieved item
    indicates: RAG injection or knowledge-base poisoning
    stage: decision
    join: [session_turn_step_ids]
    conditions:
    - A **Retrieval Event** returns an item whose **Retrieved-Content Source / Provenance** is external or recently modified.
    - The **Response / Model Output** in the same turn follows instructions from that item.
    requires: [retrieval_event, retrieved_content_source_provenance, response_model_output]
    enriches: []
    catches: [TA-01, TA-02, TA-09]
  reason: unchanged evidence; structured
  status: proposed
- id: P:model_or_provider_anomaly
  type: pattern
  subject:
    pattern: model_or_provider_anomaly
  source: phase5
  proposal:
    id: model_or_provider_anomaly
    former_id: CP-13
    name: Model change, or error and stop-reason spike, for one provider
    indicates: Model substitution or provider-side interference
    stage: decision
    match: any
    join: []
    conditions:
    - '**Model Name + Version** changes for a deployment with no recorded change.'
    - '**LLM Error / Exception** and abnormal **Stop Reason** rates rise for one provider.'
    requires: [model_name_version, llm_error_exception, stop_reason]
    enriches: [provider_endpoint_identity]
    baseline: Model and error-rate history per deployment.
    catches: [AOC-06]
  reason: drops TA-06 (analogical Model Name edge only); Provider / Endpoint Identity (MAY) moves to enriching, so the minimum tier is MUST. The conditions are alternatives
  status: proposed
- id: P:privileged_action_on_displayed_identity
  type: pattern
  subject:
    pattern: privileged_action_on_displayed_identity
  source: phase5
  proposal:
    id: privileged_action_on_displayed_identity
    former_id: CP-12
    name: Privileged action authorized on a displayed identity
    indicates: Identity spoofing or confused deputy
    stage: decision
    join: [session_turn_step_ids]
    conditions:
    - '**Verified vs Displayed Identity** shows the authorizing principal matched on display name only.'
    - The **Authorization Decision Record** allows a privileged operation on that basis.
    requires: [verified_vs_displayed_identity, authorization_decision_record]
    enriches: [surface_app, granted_authorizations_scope]
    catches: [AOC-08]
  reason: reads the Authorization Decision Record instead of Granted Authorizations (SHOULD), so the minimum tier is MUST; a new channel (Surface / App) moves to enriching
