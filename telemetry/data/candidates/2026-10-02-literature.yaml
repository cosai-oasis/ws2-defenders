# Curation registry batch. Edit status only through tools/curate.py, or by hand
# keeping decided_by and decided_on filled in. See curate.py for the schema.
- id: C:memory_write_event:eviction
  type: capture
  subject:
    field: memory_write_event
  source: literature
  proposal:
    capture_addition: Deletions include evictions made by the store itself under a size or token budget, recorded with the policy that evicted the item, so an item lost to eviction is distinguishable from one that was retrieved poorly.
  reason: arXiv:2609.08279 (Shen, Sep 2026) measures that eviction under a token budget causes 60 to 73 percent of memory-related accuracy loss at 80k tokens and all of it at 8k, and that the loss is irreversible, unlike a retrieval miss. A benchmark measurement, not a documented instance, so it refines the capture definition without grounding a tier. With AOC-05 it gives the flooding-to-displacement shape that Memory Footprint would detect.
  status: accepted
  decided_by: jo5iah
  decided_on: '2026-10-02'
  applied: '2026-10-02'
