  release: v2026.08
  file: dist/v6/ATLAS-2026.08.yaml
  commit: 41d4f5ca4112f0e492ffaa3ebff07dc80a75afa5
  released: '2026-09-01'
  note: v2026.09 (2026-09-15) is available; AD §3.6 is verified against v2026.08. Re-verify before moving the pin.
