# Telemetry fields. Evidence is derived from attacks/ (tools/build.py).
- id: agent_name
  name: Agent Name
  tier: MUST
  role: identifier
  record: event
  origin: declared
  basis:
    evidence: [TA-05, TA-31]
  records: Logical name or type of the agent; exposes off-inventory agents.
  emitted_by: [componentReasoningCore]
  capture: Logical name/type of the agent (e.g. "Deep Research agent"). Detects off-inventory / "shadow" agents.
- id: agent_runtime_instance_id
  name: Agent (Runtime) Instance ID
  tier: MUST
  role: identifier
  record: event
  origin: observed
  basis:
    required_to_read:
    - identities_used_per_hop
    - source_host_ip_request_metadata
    - capability_set_change_event
    - instrumentation_coverage_hook_attestation
  records: The running instance an event belongs to, for per-instance quarantine.
  emitted_by: [componentReasoningCore]
  capture: UUID pinning an event to one running instance, not just the type. Enables per-instance kill/quarantine.
- id: workflow_run_id
  name: Workflow / Run ID
  tier: MUST
  role: identifier
  record: event
  origin: observed
  basis:
    required_to_read: [loop_step_count_signal, resource_consumption_aggregate]
  records: Groups one multi-step run or sub-agent tree into one execution.
  emitted_by: [componentReasoningCore]
  capture: Groups all activity of one multi-step run or sub-agent tree into a single traceable execution.
- id: session_turn_step_ids
  name: Session / Turn / Step IDs
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: The session, turn and step beneath a run, locating where behaviour changed.
  emitted_by: [componentApplication, componentReasoningCore]
  capture: 'The three-level execution hierarchy *beneath* the run: `session_id` (the conversation/engagement), `turn_id` (one request→response cycle), `step_id` (one action within a turn). Lets a detection point at *which* turn behaviour changed, not just which run.'
- id: trace_context_propagated
  name: Trace Context (propagated)
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: W3C trace context carried across every agent and tool hop.
  emitted_by_text: every hop
  capture: W3C `traceparent` / `trace_id` + `span_id` **propagated across every agent→tool→agent hop**, including MCP and A2A calls. Without propagation, multi-agent activity cannot be reassembled into one trace.
- id: organization_tenant_id
  name: Organization / Tenant ID
  tags: [AOS]
  tier: SHOULD
  role: identifier
  record: event
  origin: declared
  records: 'Owning tenant of the agent, the session and the invoking user. Modality: multi-tenancy.'
  emitted_by_text: agent, session and user records
  capture: The tenant/organization owning the agent, the session, and the invoking user, recorded on each. The primitive for detecting cross-tenant leakage and credential propagation.
- id: trigger_type_source_event
  name: Trigger Type & Source Event
  tags: [AOS]
  tier: MUST
  role: label
  record: event
  origin: observed
  compound: label plus identifier of the originating event
  records: User-initiated or autonomous, and for autonomous runs the originating event.
  emitted_by: [componentReasoningCore]
  capture: Whether this run was **user-initiated or autonomous**, and for autonomous runs the originating event (inbound email, chat message, webhook, schedule). Distinct from Surface/App, which records the *channel*, not who or what started the run.
- id: action_type
  name: Action Type
  tier: MUST
  role: label
  record: event
  origin: observed
  records: LLM call, tool call, memory operation or message send.
  emitted_by: [componentReasoningCore]
  capture: Distinguishes LLM-call vs tool-call vs memory-op vs message-send, the "think → act" boundary.
- id: execution_status
  name: Execution Status
  tier: MUST
  role: outcome
  record: event
  origin: observed
  compound: outcome plus duration (measure)
  records: Outcome and duration of an operation or turn.
  emitted_by: [componentReasoningCore]
  capture: Outcome of the operation or turn (complete / error / exit / aborted) + duration. Spikes/timeouts reveal probing, DoS, or mass failure. Distinct from **Stop Reason** below, which records why a *completion* ended.
- id: stop_reason
  name: Stop Reason
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: 'Why a completion ended: end of turn, token limit, tool use, cancellation, content filter.'
  emitted_by: [componentReasoningCore]
  capture: 'Normalized reason a model completion ended: end of turn, token limit, tool use pending, session stop (caller cancelled or disconnected), content filter. Separates a truncation from a clean stop and a guardrail kill from a crash; a `content_filter` stop is the completion-side view of a guardrail block (§1.3).'
- id: surface_app
  name: Surface / App
  tier: MUST
  role: label
  record: event
  origin: observed
  records: 'Entry point: CLI, web, IDE, email, chat, scheduler; internal or external.'
  emitted_by: [componentApplication]
  capture: Entry point (CLI, web, IDE, email, chat channel, cron/heartbeat; internal vs external service). Detects access from unexpected surfaces.
- id: system_prompt_instruction_config
  name: System Prompt / Instruction Config
  tier: MUST
  role: content
  record: state
  origin: asserted
  records: Instruction configuration in force for the call. Self-asserted.
  emitted_by: [componentAgentSystemInstruction]
  capture: The system/instruction configuration in force for the call. Detects unauthorized weakening and, by comparison against the response, system-prompt leakage/extraction.
- id: autonomy_level
  name: Autonomy Level
  tier: SHOULD
  role: label
  record: state
  origin: asserted
  records: 'Declared independence level the run is authorized for. Self-asserted. Modality: autonomous action.'
  emitted_by: [componentReasoningCore]
  capture: Declared independence level (e.g. L1 to L5) the run is authorized to operate at; sets oversight/delegation limits.
- id: model_input
  name: Model Input
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Every input to each model call, including tool output, retrieved context and messages.
  emitted_by: [componentApplicationInputHandling, componentAgentInputHandling]
  capture: Every input to each model call in the loop, user prompts, tool outputs, retrieved context, inter-agent messages. Not just the first user turn. Includes size/shape (large or repetitive inputs).
- id: input_source_channel
  name: Input Source / Channel
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: Which surface, tool, agent or document each input segment came from.
  emitted_by: [componentApplicationInputHandling, componentAgentInputHandling]
  capture: 'Provenance label for each input segment: which surface/tool/agent/document it came from.'
- id: input_trust_classification
  name: Input Trust Classification
  tier: MUST
  role: label
  record: event
  origin: observed
  records: 'Trusted or untrusted origin, crossed with the role assigned on entry: instruction or data.'
  emitted_by: [componentAgentInputHandling]
  capture: 'The origin authority of a segment crossed with how it was consumed: **trusted-instruction**, **trusted-data**, **untrusted-instruction**, **untrusted-data**. Owner command against environmental or third-party content, and instruction against data. **`untrusted-instruction` is the attack state**, the cell `TA-01` occupies.'
- id: source_host_ip_request_metadata
  name: Source host / IP + request metadata
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: Origin of the request, for geo, rate and credential-theft detection.
  emitted_by: [componentApplicationInputHandling]
  capture: Origin of the request; supports geo/impossible-travel, rate-limit, and credential-theft detection.
- id: guardrail_input_verdict
  name: Guardrail (Input) Verdict
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Input classifier result (pass, flag, block, modify) with detector and score.
  emitted_by: [componentApplicationInputHandling, componentAgentInputHandling]
  capture: 'Result of any input-side injection/jailbreak/PII/secret classifier: **pass / flag / block / modify**, with detector + score.'
- id: content_modality_attachment_identity
  name: Content Modality & Attachment Identity
  tags: [AOS]
  tier: MUST
  tier_mark: ‡
  role: label
  record: event
  origin: observed
  compound: label plus content hash
  records: Part type, MIME type, and for files name, size and hash, on every content-bearing field.
  emitted_by_text: every content-bearing field
  capture: '**Cross-cutting.** For every content-bearing field: the part type (text / file / structured data), MIME type, and for files the name, size, and content hash. Instructions that arrive as an image, PDF, or structured blob are invisible to text-only inspection and text-only logging.'
- id: guardrail_modification_record
  name: Guardrail Modification Record
  tags: [AOS]
  tier: MUST
  tier_mark: ‡
  role: outcome
  record: event
  origin: observed
  basis:
    required_to_read: [model_input, response_model_output, guardrail_input_verdict, guardrail_output_verdict]
  records: That an enforcement point rewrote a payload, which one, with before and after digests.
  emitted_by_text: any rewriting enforcement point
  capture: '**Cross-cutting.** When an enforcement point **rewrites rather than blocks**: masking, redacting, stripping, or rewriting a payload; record that a modification occurred, which enforcement point made it, and a before/after digest (plus a redaction map where policy permits). Applies on both the input and the output side.'
- id: threat_classification_atlas_technique_tag
  name: Threat Classification / ATLAS Technique Tag
  tier: MUST
  tier_mark: †
  role: label
  record: event
  origin: derived
  basis:
    conditional: when a detection fires
  records: MITRE ATLAS technique IDs on any event where a detection fires.
  emitted_by_text: any detector
  capture: '**Cross-cutting enrichment.** On any flagged or security-relevant event, the classified technique(s) as **MITRE ATLAS `AML.Txxxx`** IDs (plus a free-text threat type). Emitted by input/output guardrails and by tool/memory/retrieval detectors alike, so every alert carries a portable, ATT&CK-aligned technique reference.'
- id: encoded_obfuscated_payload_indicator
  name: Encoded / Obfuscated Payload Indicator
  tier: MAY
  role: label
  record: event
  origin: derived
  records: Flag and decoded form of base64, image-embedded or markup-authority input.
  emitted_by: [componentAgentInputHandling]
  capture: Flag + decoded form when input contains base64, image-embedded (OCR), or markup "authority" tags.
- id: response_model_output
  name: Response / Model Output
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Generated output at each step.
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: The generated output at each step. Where leakage, disclosure, verbatim training data, and embedded exfil URLs appear.
- id: output_egress_destination
  name: Output Egress Destination
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: 'Where output goes: recipients, URLs, channels, files, broadcast scope.'
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: 'Where output goes: recipient addresses, outbound URLs/domains, channels, file targets, broadcast scope.'
- id: citations_source_attribution
  name: Citations / Source Attribution
  tags: [AOS]
  tier: MUST
  role: outcome
  record: event
  origin: derived
  compound: asserted claim plus derived resolution outcome
  records: Sources the agent claims, and whether each resolves to a logged retrieval.
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: 'The sources the agent *claims* it drew on, per output: file ID/name/URL or site URL for each citation, **plus whether each resolves to an item actually returned by a logged Retrieval Event (§1.7)**. Unresolvable, fabricated, or attacker-supplied citations are the signal.'
- id: observation_thought_reasoning_trace
  name: Observation / Thought (reasoning trace)
  tier: SHOULD
  role: content
  record: event
  origin: asserted
  records: Reasoning trace, where the provider exposes it. Self-asserted. Provider-gated.
  emitted_by: [componentReasoningCore]
  capture: Chain-of-thought/observations *when the provider exposes it*. Reveals whether a harmful act was injected, misauthorized, or self-initiated.
- id: guardrail_output_verdict
  name: Guardrail (Output) Verdict
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Output filter result (pass, flag, block, modify).
  emitted_by: [componentApplicationOutputHandling, componentAgentOutputHandling]
  capture: 'Output-side filter result (PII/DLP, harmful content, exfil pattern): **pass / flag / block / modify**. Modifications are recorded via the **Guardrail Modification Record** (§1.2). Fired detections carry the **ATLAS Technique Tag** (see §1.2).'
- id: llm_refusal
  name: LLM Refusal
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Refusal status and reason.
  emitted_by: [componentAgentOutputHandling]
  capture: Status + reason when the model refuses. A refusal-then-success streak signals a jailbreak in progress; an *absent* refusal on clearly policy-violating output flags a guardrail gap.
- id: model_name_version
  name: Model Name + Version
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: Model and version that processed the request.
  emitted_by: [componentModelServing]
  capture: Model and version processing the request. "Which agents used the compromised model?"; pins a model-specific vulnerability for patching.
- id: provider_endpoint_identity
  name: Provider / Endpoint Identity
  tier: MAY
  role: identifier
  record: event
  origin: observed
  records: Which provider or endpoint served the call.
  emitted_by: [componentModelServing]
  capture: Which provider/endpoint served the call. The reason the completion ended is **Stop Reason** (§1.1).
- id: inference_parameters
  name: Inference Parameters
  tags: [AOS]
  tier: MUST
  role: descriptor
  record: state
  origin: declared
  records: Decoding parameters and declared context window in force for the call; the denominator for max-length-output and oversized-input detections.
  emitted_by: [componentModelServing]
  capture: 'The decoding/config parameters in force for the call: `temperature`, `top_p`/`top_k`, `max_tokens`, `stop` sequences, `seed`, and the **declared context-window size**. The runtime half of the configuration-integrity baseline that **System Prompt** (§1.1) covers for instructions.'
- id: input_output_token_counts
  name: Input / Output Token Counts
  tier: MUST
  role: measure
  record: event
  origin: observed
  records: Per-call token usage, which feeds the Resource-Consumption Aggregate budget check.
  emitted_by: [componentModelServing]
  capture: Per-call token usage, the primary resource-abuse and runaway-loop signal; max-length outputs flag extraction/DoS.
- id: llm_error_exception
  name: LLM Error / Exception
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Errors under adversarial conditions and provider-side silent failures.
  emitted_by: [componentModelServing]
  capture: Errors that occur under adversarial conditions (overflow, malformed encoding, context exhaustion); provider-side silent failures.
- id: model_provenance_signing_hash
  name: Model Provenance / Signing / Hash
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: 'Signed digest or provenance of the served model artifact. Modality: supply-chain attestation.'
  emitted_by: [componentModelServing, componentModelRegistry]
  capture: Signed digest / provenance of the served model artifact (supply-chain attestation).
- id: pre_forward_pass_state_digest_vector
  name: Pre-Forward-Pass State Digest/Vector
  tier: MAY
  role: content
  record: event
  origin: derived
  records: Digest of the exact inputs to a forward pass, for replay and drift detection.
  emitted_by: [componentTheModel]
  capture: Content-addressed digest (+ pooled vector) of the exact inputs to a forward pass, captured pre-inference for replay/drift detection.
- id: token_malformation_context_corruption_indicator
  name: Token Malformation / Context-Corruption Indicator
  tier: MAY
  role: label
  record: event
  origin: derived
  records: Token-entropy anomalies correlated with confabulation.
  emitted_by: [componentTheModel]
  capture: Signal of context-induced token-entropy anomalies correlated with confabulation.
- id: tool_call_io
  name: Tool Call I/O
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Full arguments and output of every tool or MCP call.
  emitted_by: [componentToolServer, componentTools]
  capture: Full input params **and** output for every tool/MCP call; what the agent actually *did* vs what it was asked. Reveals credentials passed between chained calls.
- id: tool_name
  name: Tool Name
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: The capability invoked, as the agent saw it.
  emitted_by: [componentToolServer]
  capture: Which capability was invoked. Detects off-manifest / sensitive-tool invocation, escalating tool sequences, and enumeration.
- id: tool_type_trust_boundary
  name: Tool Type / Trust Boundary
  tier: MUST
  role: label
  record: state
  origin: declared
  records: MCP, internal, direct-storage or code-execution.
  emitted_by: [componentTools]
  capture: MCP (cross-network) vs internal vs direct-storage vs code-execution, different trust models & policies.
- id: tool_id
  name: Tool ID
  tier: MAY
  role: identifier
  record: event
  origin: declared
  records: Unique tool-implementation ID across MCP servers.
  emitted_by: [componentTools]
  capture: Unique tool-implementation ID for unambiguous attribution across many MCP servers.
- id: tool_execution_id
  name: Tool Execution ID
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: observed
  records: Correlation ID pairing each tool request with its outcome.
  emitted_by: [componentToolServer]
  capture: Correlation ID minted at invocation and echoed on the result, pairing every request with its outcome.
- id: tool_definition_digest
  name: Tool Definition Digest
  tags: [AOS]
  tier: MUST
  role: provenance
  record: event
  origin: derived
  compound: derived digest plus comparison outcome against the baseline
  basis:
    evidence: [TA-15, TA-29]
  records: Hash of the tool contract as presented at invocation, compared with the approved baseline.
  emitted_by: [componentToolServer, componentToolRegistry]
  capture: 'Hash of the tool''s **declared contract as presented at invocation time**: name, description, argument schema, output schema, plus a comparison against the approved baseline. Detects a tool whose definition mutated after approval.'
- id: execution_environment_sandbox
  name: Execution Environment / Sandbox
  tags: [AOS]
  tier: MUST
  role: descriptor
  record: state
  origin: observed
  records: 'Isolation posture: sandbox mode, runtime, OS, timeout, egress policy.'
  emitted_by: [componentIsolationRuntime, componentToolHosting]
  capture: 'The isolation posture of the execution: sandbox mode (none / container / VM / WASM), language runtime and version, OS/architecture, timeout, and network-egress policy.'
- id: mcp_server_identity_primitive
  name: MCP Server Identity & Primitive
  tags: [AOS]
  tier: MUST
  role: identifier
  record: event
  origin: asserted
  compound: asserted server identity plus observed primitive (label)
  records: MCP server name, version, transport and endpoint, and the primitive exercised.
  emitted_by: [componentToolServer]
  capture: 'For MCP calls: server name, version, transport, and endpoint; **and which MCP primitive was exercised**: `tool`, `resource`, `prompt`, `sampling`, `elicitation`, or `roots`.'
- id: tool_error_exception
  name: Tool Error / Exception
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: Failed or blocked tool calls, including the probing that precedes exploitation.
  emitted_by: [componentToolServer, componentToolInputHandling]
  capture: 'Failed/blocked tool calls: rejected injection args, SSRF blocks, authz boundary hits, and the probing errors that precede successful exploitation.'
- id: tool_acl_required_scope
  name: Tool ACL / Required Scope
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: 'Authority a tool requires and who can invoke it. Modality: delegated authority.'
  emitted_by:
  - componentAuthorizationPolicyEnforcementPoint
  capture: The authority a tool requires and who may invoke it (the tool's security policy); individually-authorized calls that violate separation-of-duties as a chain.
- id: tool_privacy_classification
  name: Tool Privacy Classification
  tier: MAY
  role: label
  record: state
  origin: declared
  records: Sensitivity class of the data a tool touches.
  emitted_by: [componentTools]
  capture: Sensitivity class of data the tool touches, feeds DLP / data-flow governance.
- id: tool_selection_rationale
  name: Tool Selection Rationale
  tags: [AOS]
  tier: SHOULD
  role: content
  record: event
  origin: asserted
  records: The agent's stated reason for a tool call. Self-asserted. Provider-gated.
  emitted_by: [componentReasoningCore]
  capture: 'The agent''s stated reason for choosing *this* tool with *these* arguments, captured at the request step. Distinct from the §1.3 output-side reasoning trace: it is attached to the action, not the answer.'
- id: memory_write_event
  name: Memory Write Event
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Each create, update or delete of a persistent memory item, and by whom.
  emitted_by: [componentMemory]
  capture: 'Every create/update/delete to persistent or long-term memory: what changed, by which turn/actor. Deletions include evictions made by the store itself under a size or token budget, recorded with the policy that evicted the item, so an item lost to eviction is distinguishable from one that was retrieved poorly.'
- id: memory_read_injection_event
  name: Memory Read / Injection Event
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Which memory items were pulled into context for a call.
  emitted_by: [componentMemory]
  capture: Which memory items were pulled into context for a call.
- id: memory_provenance_source
  name: Memory Provenance / Source
  tier: MUST
  role: provenance
  record: state
  origin: observed
  records: Origin and mutability of a memory item, including externally editable sources.
  emitted_by: [componentMemory]
  capture: Origin & mutability of a memory item, self-authored, owner, non-owner, or **externally editable resource**.
- id: memory_integrity_poisoning_signal
  name: Memory Integrity / Poisoning Signal
  tier: SHOULD
  role: measure
  record: event
  origin: derived
  records: Integrity check or poisoning score; cross-session isolation flag. Provider-gated.
  emitted_by: [componentMemory]
  capture: Integrity check / poisoning-likelihood score, cross-session isolation flag.
- id: memory_footprint_growth
  name: Memory Footprint / Growth
  tier: MUST
  role: measure
  record: aggregate
  origin: observed
  basis:
    evidence: [AOC-05, TA-30]
  records: Size and growth of memory stores per user or session.
  emitted_by: [componentMemory]
  capture: Size/growth of memory stores (per user/session), resource-exhaustion signal.
- id: declared_memory_configuration
  name: Declared Memory Configuration
  tags: [AOS]
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  records: A memory store's declared identity, limits and retrieval settings.
  emitted_by: [componentMemory]
  capture: 'The memory store''s declared identity and limits: name, type, backend, size cap, retention, and retrieval spec (top-k, scoring). The baseline that **Memory Footprint** is measured against.'
- id: memory_write_rationale
  name: Memory Write Rationale
  tags: [AOS]
  tier: SHOULD
  role: content
  record: event
  origin: asserted
  records: The agent's stated reason for persisting an item. Self-asserted. Provider-gated.
  emitted_by: [componentMemory]
  capture: The agent's stated reason for persisting *this* item, captured at the write step.
- id: retrieval_event
  name: Retrieval Event
  tier: MUST
  role: content
  record: event
  origin: observed
  records: Query issued, items returned and their scores.
  emitted_by: [componentRAGContent]
  capture: Query issued + documents/chunks returned + retrieval scores.
- id: retrieved_content_source_provenance
  name: Retrieved-Content Source / Provenance
  tier: MUST
  role: provenance
  record: event
  origin: observed
  records: Origin, owner, trust level and freshness of each retrieved item.
  emitted_by: [componentRAGContent]
  capture: Origin, owner, trust level, and freshness (create/update time) of each retrieved item (internal doc, web, third-party, user upload).
- id: retrieved_content_metadata_integrity_signal
  name: Retrieved-Content / Metadata Integrity Signal
  tier: SHOULD
  role: measure
  record: event
  origin: derived
  records: Tamper or poisoning indicators on content or its metadata. Provider-gated.
  emitted_by: [componentRAGContent]
  capture: Tamper/poisoning indicators on content **or its metadata/tags**.
- id: declared_knowledge_source_configuration
  name: Declared Knowledge-Source Configuration
  tags: [AOS]
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  records: A knowledge source's declared identity, schema and search parameters.
  emitted_by: [componentRAGContent]
  capture: 'Each knowledge source''s declared identity and contract: name, description, index/collection identity, schema, and search parameters (top-k, filters, scoring, reranker).'
- id: inter_agent_message
  name: Inter-Agent Message
  tier: MUST
  role: content
  record: event
  origin: observed
  records: 'Agent-to-agent messages: sender, receiver, content, channel.'
  emitted_by: [componentReasoningCore]
  capture: 'Agent→agent messages: sender, receiver, content, channel, including capability/skill transfer.'
- id: a2a_task_lifecycle_event
  name: A2A Task Lifecycle Event
  tags: [AOS]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: 'Delegated-task state changes across A2A, including callback registration. Modality: A2A.'
  emitted_by: [componentReasoningCore, componentAgentToolTransport]
  capture: 'Delegated-task state transitions across the A2A surface: task submitted, streamed, polled, **cancelled**, resubscribed, and **push-notification config set or changed**, which registers an outbound callback destination.'
- id: peer_agent_card_descriptor
  name: Peer Agent Card / Descriptor
  tags: [AOS]
  tier: SHOULD
  role: descriptor
  record: state
  origin: asserted
  compound: asserted descriptor plus verification outcome
  records: 'A counterparty agent''s descriptor at contact, with change and verification outcome. Modality: A2A.'
  emitted_by: [componentReasoningCore]
  capture: 'The counterparty agent''s declared descriptor as presented at contact: name, URL, version, provider, and advertised skills/capabilities, with change detection against prior contacts **and the outcome of any verification attempted against it** (signature checked, inspection request answered or refused, or unverified).'
- id: background_scheduled_task_event
  name: Background / Scheduled Task Event
  tier: MUST
  role: descriptor
  record: event
  origin: observed
  records: Creation or change of cron jobs, heartbeats and self-scheduled loops.
  emitted_by: [componentReasoningCore]
  capture: Creation/modification of cron jobs, heartbeats, daemons, or self-scheduled loops, incl. presence/absence of a termination condition.
- id: loop_step_count_signal
  name: Loop / Step-Count Signal
  tier: MUST
  role: measure
  record: aggregate
  origin: derived
  records: Steps per run against baseline; circular exchanges between agents.
  emitted_by: [componentReasoningCore]
  capture: Steps or iterations per run vs baseline; circular agent-to-agent exchange detection.
- id: resource_consumption_aggregate
  name: Resource-Consumption Aggregate
  tier: MUST
  role: measure
  record: aggregate
  origin: derived
  records: Token, compute, storage and outbound totals per run against a budget.
  emitted_by: [componentReasoningCore]
  capture: 'Per-run/agent token, compute, storage, and outbound-volume totals against a budget, and, where authority is delegated, **accounted across the delegation subtree rather than per run**: individually modest runs can exhaust a principal''s budget in aggregate. Where a budget is enforced, the **consumed and remaining figures ride the record of the action that consumed them** and not only the metric series, because a total cannot be recomputed after the fact from records that never carried it. That is what separates a budget denial from a budget overrun discovered later.'
- id: task_intent_declaration
  name: Task / Intent Declaration
  tier: SHOULD
  role: descriptor
  record: state
  origin: asserted
  records: 'Declared purpose the run is authorized to pursue. Self-asserted. Modality: autonomous action.'
  emitted_by: [componentReasoningCore]
  capture: The declared purpose/task the run is authorized to pursue (for goal-drift detection).
- id: protocol_envelope_capture
  name: Protocol Envelope Capture
  tags: [AOS]
  tier: MAY
  role: content
  record: event
  origin: observed
  records: Raw MCP or A2A JSON-RPC envelope alongside the interpreted fields.
  emitted_by: [componentAgentToolTransport]
  capture: The raw MCP / A2A JSON-RPC envelope (method, id, params) alongside the interpreted fields, preserving protocol-level detail that framework-level abstraction discards.
- id: identities_used_per_hop
  name: Identities Used (per hop)
  tier: MUST
  role: identifier
  record: event
  origin: declared
  records: The identity behind each agent, tool and infrastructure action, per hop.
  emitted_by: [componentIdentityProvider]
  capture: Attribute every agent→user, agent→agent, agent→tool, tool→infra action to an identity + metadata; detect identity changes across a tool chain.
- id: verified_vs_displayed_identity
  name: Verified vs Displayed Identity
  tier: MUST
  role: identifier
  record: event
  origin: observed
  compound: two identifiers plus which one authorized (outcome)
  records: Verified identifier against spoofable display name, and which one authorized.
  emitted_by: [componentIdentityProvider]
  capture: Distinguish an immutable/verified identifier from a spoofable display identity; record which was used to authorize.
- id: originating_principal_on_behalf_of
  name: Originating Principal (on-behalf-of)
  tier: SHOULD
  role: identifier
  record: event
  origin: declared
  records: 'The human or service at the root of the delegation chain. Modality: delegated authority.'
  emitted_by: [componentIdentityProvider, componentFederationProxy]
  capture: The human/service sponsor at the root of the delegation chain.
- id: delegation_chain
  name: Delegation Chain
  tier: SHOULD
  role: provenance
  record: event
  origin: declared
  records: 'Ordered agent hops, each integrity-bound to its parent. Modality: delegated authority.'
  emitted_by: [componentFederationProxy]
  capture: Ordered lineage of prior agent hops carried across the call. Each hop carries an **integrity-protected reference to its parent** (issuer, delegation identifier, and a digest of the parent record), so lineage is verifiable from the records rather than asserted; a digest that does not match the resolved parent fails chain validation closed.
- id: granted_authorizations_scope
  name: Granted Authorizations / Scope
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  compound: declared scope plus narrowing-check outcome
  records: 'Authority in effect at this hop, with the narrowing check and its rules. Modality: delegated authority.'
  emitted_by: [componentFederationProxy]
  capture: 'Delegated authority in effect at this hop, with monotonic-narrowing check. Record the **rules the check ran against** (ODIS `attenuation_profile_ref`: a versioned identifier and content digest for the normalization and comparison rules), since "narrower" is a semantic comparison and two profiles can disagree on the same pair of scopes.'
- id: resource_indicators_constraints
  name: Resource Indicators + Constraints
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: 'Target audience and time, purpose, rate, locality and classification limits. Modality: delegated authority.'
  emitted_by: [componentFederationProxy]
  capture: Target resource audience + time/purpose/rate/locality/`data_classification` narrowing.
- id: credential_minting_scope_narrowing_check
  name: Credential Minting & Scope-Narrowing Check
  tags: [CPEX]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: 'Each credential exchange: grant type, whose identity, and whether scope narrowed. Modality: token exchange.'
  emitted_by: [componentFederationProxy, componentIdentityProvider]
  capture: 'The credential-exchange event at each hop: grant type (token exchange / client assertion / client credentials), whose identity the minted token represents (**end user / client application / calling workload / the enforcement point itself**), target **audience**, issuer, lifetime, and the **requested-vs-granted scope delta** verified after minting. Detects both over-broad credentials and forwarded inbound tokens that were never narrowed.'
- id: trust_domain_crossing_delegation_depth
  name: Trust-Domain Crossing & Delegation Depth
  tier: SHOULD
  role: measure
  record: event
  origin: derived
  compound: derived depth (measure) plus limit-crossed flag (outcome)
  records: 'Counterparty trust domain and delegation depth, and whether a limit was crossed. Modality: delegated authority.'
  emitted_by: [componentFederationProxy]
  capture: 'The counterparty''s **trust domain** and the **depth of the delegation chain** at this hop, plus whether either crossed a configured limit. Records that authority left the domain that issued it, and how many hops from the originating principal the acting agent now sits. Depth is **derived** from the chain (the OCSF `delegation.parent_uid` lineage or the RFC 8693 `act` chain), not transmitted as a counter; a transmitted copy can disagree with the chain it was derived from. The derivation holds only while every hop carries its parent link: a hop that does not is a **break in the chain**, to be recorded as such rather than read as a shorter chain ([XM §3.1](Telemetry-Cross-Mapping-Addendum.md#31-ocsf-coverage--gaps-by-field-cluster)).'
- id: runtime_credential_attestation
  name: Runtime Credential / Attestation
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: 'Runtime-instance credential and attestation evidence, each source verified separately. Modality: cryptographic agent identity.'
  emitted_by: [componentIdentityProvider]
  capture: 'Runtime-instance credential: `software_hash`, `attestation_evidence`, issuer, expiry, holder-key binding. Evidence is recorded **per source, each with its own issuer, validity and verification outcome**: software-provenance and runtime/workload evidence come from independent issuers, and a single collapsed value loses the independence that makes the attestation worth verifying (see **Attribute Source / Trusted-Provenance Marking**, [§1.12](#112-policy-enforcement--mediation)).'
- id: lifecycle_state
  name: Lifecycle State
  tier: SHOULD
  role: label
  record: state
  origin: declared
  records: 'Active, suspended or revoked, for kill-switch and revocation fan-out. Modality: cryptographic agent identity.'
  emitted_by: [componentIdentityProvider]
  capture: active / suspended / revoked, supports kill-switch & revocation-fanout.
- id: capability_set_change_event
  name: Capability-Set Change Event
  tags: [AOS]
  tier: MUST
  role: descriptor
  record: event
  origin: observed
  records: A tool, server, model, knowledge source or memory store added, removed or modified at runtime.
  emitted_by: [componentReasoningCore]
  capture: 'An event emitted whenever the agent''s usable capability set changes at runtime, a tool, MCP server, model, knowledge source, or memory store **discovered, added, removed, or modified**: with before/after identity and what triggered the change.'
- id: tool_agent_version
  name: Tool/Agent Version
  tier: SHOULD
  role: identifier
  record: state
  origin: declared
  records: 'Version of each tool, agent and framework. Modality: dynamic third-party capability composition.'
  emitted_by: [componentToolRegistry, componentModelRegistry]
  capture: Version of each tool/agent/framework; instant CVE blast-radius answer; downgrade detection.
- id: repository_code_path_software_ref
  name: Repository / Code Path / Software Ref
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: 'Source provenance of tool and agent code. Modality: dynamic third-party capability composition.'
  emitted_by: [componentToolRegistry]
  capture: Source provenance of tool/agent code (ties to signing & ODIS `approved_software_refs`).
- id: agbom_inventory_snapshot
  name: AgBOM / Inventory Snapshot
  tags: [AOS]
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: 'Machine-readable inventory of the agent''s composition, on change and on demand. Modality: supply-chain attestation.'
  emitted_by: [componentApplication, componentToolRegistry]
  capture: 'A structured, machine-readable inventory of the agent''s composition (packages, models, capabilities (agent cards, discovered peers, MCP servers), knowledge sources, memory stores, tools) emitted on change and **on demand**. Bound to an existing BOM format rather than a bespoke one. The three carry different amounts of it: **CycloneDX** is the only one for which an agent-runtime binding has been written (sandbox, tool scopes and endpoints, memory backend, agent-card URL, carried in its generic property bag); **SPDX 3.0** carries dependency, integrity and, through its AI profile, model governance; **SWID** carries identity, version, dependency and signing. Emit in whichever format the deployment already uses, and record which one ([XM §5.3](Telemetry-Cross-Mapping-Addendum.md#53-pillar-3-inspect)).'
- id: component_dependency_graph
  name: Component Dependency Graph
  tags: [AOS]
  tier: SHOULD
  role: descriptor
  record: state
  origin: declared
  records: 'Dependency edges between inventoried components, including transitive ones. Modality: supply-chain attestation.'
  emitted_by: [componentApplication, componentToolRegistry]
  capture: Dependency edges between inventoried components, including transitive ones; which agent depends on which tool, which tool on which package or MCP server.
- id: inventory_attestation_signature
  name: Inventory Attestation Signature
  tags: [AOS]
  tier: SHOULD
  role: provenance
  record: state
  origin: declared
  records: 'Signature over the emitted inventory, binding it to a signer. Modality: supply-chain attestation.'
  emitted_by: [componentApplication, componentToolRegistry]
  capture: Cryptographic signature over the emitted inventory (signature value + key identifier), binding the declared composition to a signer.
- id: tool_description
  name: Description
  tier: MAY
  role: content
  record: state
  origin: declared
  records: Declared purpose of a tool, against which behaviour is compared.
  emitted_by: [componentToolRegistry]
  capture: 'Declared purpose: detects misleadingly-described ("read-only" but writes) tools.'
- id: tool_status
  name: Status (active/disabled)
  tier: MAY
  role: label
  record: state
  origin: declared
  records: Whether a tool is meant to be reachable.
  emitted_by: [componentToolRegistry]
  capture: Detects calls to tools that should be unreachable.
- id: creator_id_oncall_creation_update_dates
  name: Creator ID / Oncall / Creation & Update dates
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  records: Ownership and change dates.
  emitted_by: [componentToolRegistry, componentModelRegistry]
  capture: Ownership, age-based risk, change-correlation for IR speed; recently-changed assets/content correlate with attack timelines.
- id: surfaces_supported
  name: Surfaces Supported
  tier: MAY
  role: descriptor
  record: state
  origin: declared
  records: Exposure map per tool.
  emitted_by: [componentToolRegistry]
  capture: Exposure map per tool.
- id: fleet_counts
  name: Fleet counts
  name_note: (agents by framework/type; sessions L1/L7/L28; users MAU/power-user; tool-call volume & agent↔tool map; surface & status breakdowns)
  tier: MAY
  role: measure
  record: aggregate
  origin: derived
  records: 'Fleet aggregates: agents, sessions, users, tool-call volume.'
  emitted_by_text: fleet level
  capture: Aggregate anomaly, shadow-AI, and CVE-exposure signals.
- id: enforcement_point_availability_failure_mode
  name: Enforcement-Point Availability & Failure Mode
  tier: MUST
  role: outcome
  record: event
  origin: observed
  basis:
    required_to_read: [guardrail_input_verdict, guardrail_output_verdict, authorization_decision_record]
  records: Whether each enforcement callout was reached, its latency, and fail-open or fail-closed.
  emitted_by_text: enforcement points
  capture: 'For each enforcement callout (guardrail, policy engine, external guardian): whether it was reached, its latency, and on failure whether the system **failed open or failed closed**, plus the action that was taken anyway.'
- id: instrumentation_coverage_hook_attestation
  name: Instrumentation Coverage / Hook Attestation
  tier: MUST
  role: descriptor
  record: state
  origin: observed
  basis:
    required_to_read: [llm_refusal, tool_execution_id, guardrail_input_verdict]
  records: Which hooks are active, their version, where each reports, and the sampling configuration in force.
  emitted_by_text: instrumentation layer
  capture: Which lifecycle hooks are instrumented and active for this agent/run, the instrumentation version, and **where each hook reports**, the difference between "no events", "not observed", and "observed by someone else."
- id: event_sequence_continuity
  name: Event Sequence Continuity
  tier: SHOULD
  role: identifier
  record: event
  origin: observed
  records: 'Per-session sequence number, hash-chained, for gap and reordering detection. Modality: self-attesting instrumentation.'
  emitted_by: [componentAuditRecordRepository]
  capture: Per-session monotonic sequence number enabling gap and reordering detection. The stream **SHOULD be hash-chained**, and where chained the **chain head SHOULD be periodically signed and published outside the emitter's trust domain**. That is the minimum that lets a verifier distinguish a gap from a suppression.
- id: policy_reason_code
  name: Policy Reason Code
  tier: MAY
  role: label
  record: event
  origin: observed
  records: Machine-readable reason code for an enforcement decision.
  emitted_by_text: enforcement points
  capture: Machine-readable reason code(s) for an enforcement decision, alongside the existing free-text detector name and score.
- id: authorization_decision_record
  name: Authorization Decision Record
  tags: [CPEX]
  tier: MUST
  role: outcome
  record: event
  origin: observed
  records: 'Per mediated operation: decision, reason code, deciding authority and rule.'
  emitted_by:
  - componentAuthorizationPolicyDecisionPoint
  - componentAuthorizationPolicyEnforcementPoint
  capture: 'Per mediated operation: the terminal decision (**allow / deny**, with **allow-after-modification** flagged), the deny **reason and machine-readable code** (a fail-closed enforcement failure arrives as a deny with its own code), the per-step actions that produced it including any **suppressed deny** (a plugin denied and was overridden by pipeline role) and any **abort**, the **deciding authority** (inline policy rule vs external PDP, and which; Cedar / CEL / OPA / custom), the **rule or policy identifier** that produced it, and any obligations attached. Distinct from a content-guardrail verdict: this is the *authorization* outcome, not a classifier score.'
- id: attribute_source_trusted_provenance_marking
  name: Attribute Source / Trusted-Provenance Marking
  tags: [CPEX]
  tier: MUST
  tier_mark: ‡
  role: provenance
  record: event
  origin: observed
  records: The authority that supplied each security-relevant attribute, or that it is self-asserted, and each counterparty's knowability tier.
  emitted_by_text: every security-relevant attribute
  capture: '**Cross-cutting.** For every security-relevant attribute, the **authority that supplied it**: verified IdP token, policy decision point, enforcement-owned session store, platform/runtime, versus **self-asserted by the agent or model**. Under assume-breach, an unmarked value is an unverified value.'
- id: session_taint_labels_information_flow_decisions
  name: Session Taint Labels & Information-Flow Decisions
  tags: [CPEX]
  tier: SHOULD
  role: label
  record: state
  origin: observed
  compound: label state plus taint-caused denials (events, outcome)
  records: 'Information-flow labels in force, and denials caused by accumulated taint. Modality: information-flow control.'
  emitted_by_text: enforcement points
  capture: 'Information-flow labels in force for the session or message: which labels are set, **scope** (session vs message), what operation applied each, and (critically) when an operation is **denied because of accumulated taint rather than anything in its own payload**. The write-down record.'
- id: human_approval_elicitation_event
  name: Human Approval / Elicitation Event
  tags: [CPEX]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: 'Approval lifecycle: status, identity-provider-verified approver, and whether it covers the executed arguments. Modality: out-of-band human approval.'
  emitted_by: [componentAgentConsentSurface, componentApplicationConsentSurface]
  capture: 'Out-of-band approval lifecycle for high-impact actions: correlation ID, status (pending / resolved / expired), outcome, **approver identity as verified by the identity provider** (not as reported by the agent), channel, and the **scope-binding validation result**: whether the approval still covers the arguments actually presented at execution time.'
- id: backend_route_restriction_decision
  name: Backend / Route Restriction Decision
  tags: [CPEX]
  tier: SHOULD
  role: outcome
  record: event
  origin: observed
  records: 'Candidate backends, the constraint applied, the choice made. Modality: policy-driven backend selection.'
  emitted_by_text: enforcement points
  capture: 'Where an operation was allowed to execute: the candidate backend/model set, the constraint that narrowed it (region, model, site, cost tier, custom label), the selection made, and the behaviour when **no candidate qualified**.'
- id: mediation_coverage_bypass_path
  name: Mediation Coverage & Bypass Path
  tags: [CPEX]
  tier: SHOULD
  role: label
  record: event
  origin: observed
  records: 'Whether an operation passed a reference monitor, where, and whether a bypass exists. Modality: reference monitor in the request path.'
  emitted_by_text: enforcement points
  capture: Whether this operation traversed a reference monitor at all, at which **placement** (inbound gateway / egress sidecar / in-process framework), and whether **unmediated paths to the same capability exist**.
