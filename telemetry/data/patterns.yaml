# AD §2 correlation patterns. Extracted verbatim (phase 1); fields_text is unreconciled.
- id: CP-01
  pattern: Same input hash across many identities
  indicates: Automated injection campaign
  fields_text: Model Input, Identities Used, Source IP
  evidence: [IR-01]
- id: CP-02
  pattern: Rising LLM Refusal → then Status=complete (same session)
  indicates: Jailbreak succeeded after probing
  fields_text: LLM Refusal, Execution Status, Model Input
  evidence: [IR-01, AOC-12]
- id: CP-03
  pattern: Tool-call spike + new Tool Name appears
  indicates: Agent reaching unauthorized capability
  fields_text: Tool Call I/O, Tool Name, Resource Aggregate
  evidence: [AOC-02, AOC-10]
- id: CP-04
  pattern: Untrusted input segment → tool call → outbound egress to new domain
  indicates: Injection-to-exfiltration chain
  fields_text: Input Trust Class, Tool Call I/O, Output Egress Destination
  evidence: [TA-01, TA-03]
- id: CP-05
  pattern: Memory write with non-owner/external provenance → later behavior change
  indicates: Memory poisoning / indirect corruption
  fields_text: Memory Write, Memory Provenance, Observation/Thought
  evidence: [IR-02, AOC-10]
- id: CP-06
  pattern: Retrieved item (external source, recently modified) quoted as instruction in output
  indicates: RAG injection / KB poisoning
  fields_text: Retrieval Event, Retrieved-Content Source, Response
  evidence: [TA-01, TA-02, TA-09]
- id: CP-07
  pattern: Response text ≈ logged System Prompt
  indicates: System-prompt extraction
  fields_text: System Prompt, Response, LLM Refusal
  evidence: [TA-07]
- id: CP-08
  pattern: Chain of individually-authorized tool calls; identity shifts mid-chain
  indicates: Tool-chaining privilege escalation
  fields_text: Tool Call I/O, Identities Used, Tool ACL/Scope, tool-call count
  evidence: [TA-08]
- id: CP-09
  pattern: Oversized/recursive input + max-length output + timeout/overflow error
  indicates: Context-window DoS / cost blow-up
  fields_text: Model Input, Token Counts, LLM Error, Resource Aggregate, Source IP
  evidence: [TA-10]
- id: CP-10
  pattern: Inter-agent messages loop + token/compute climbing, no terminating step
  indicates: Multi-agent resource-exhaustion loop
  fields_text: Inter-Agent Message, Loop Signal, Resource Aggregate
  evidence: [AOC-04]
- id: CP-11
  pattern: Background task created with no termination condition
  indicates: Runaway automation / persistence
  fields_text: Background Task Event, Action Type
  evidence: [AOC-04, AOC-10]
- id: CP-12
  pattern: Privileged action authorized on **displayed** (not verified) identity, esp. new channel
  indicates: Identity spoofing / confused deputy
  fields_text: Verified-vs-Displayed Identity, Granted Authorizations, Surface
  evidence: [AOC-08]
- id: CP-13
  pattern: Model Name/Provider change + Error/finish-reason spike
  indicates: Supply-chain compromise or provider-side interference
  fields_text: Model Name, Provider Identity, LLM Error
  evidence: [TA-06, AOC-06]
- id: CP-14
  pattern: Source IP shift + same identity
  indicates: Credential theft / session hijack
  fields_text: Source IP, Identities Used, Surface
  evidence: [AOC-15, IR-04]
- id: CP-15
  pattern: Cited source resolves to no logged retrieval, or to an external/recently-modified item
  indicates: Fabricated or attacker-planted citation; trust laundering
  fields_text: Citations, Retrieval Event, Retrieved-Content Source, Output Egress
  evidence: [TA-02, IR-03, TA-01]
- id: CP-16
  pattern: Enforcement point unreachable or timing out → action proceeds (fail-open)
  indicates: Control-plane starvation; guardrail bypass
  fields_text: Enforcement-Point Availability, Guardrail Verdict, Resource Aggregate, Source IP
  evidence: [TA-01, TA-10]
- id: CP-17
  pattern: Tool Definition Digest changes between sessions for an approved tool
  indicates: MCP tool rug-pull / description poisoning
  fields_text: Tool Definition Digest, MCP Server Identity, Tool Call I/O
  evidence: [AOC-10, AOC-14, AOC-09]
- id: CP-18
  pattern: Capability-Set Change (tool/MCP server added) shortly after an inter-agent message
  indicates: Cross-agent capability transfer
  fields_text: Capability-Set Change Event, Inter-Agent Message, Peer Agent Card
  evidence: [AOC-09, AOC-04]
- id: CP-19
  pattern: Code-execution tool invoked with sandbox = none
  indicates: Unsandboxed execution reachable from model output
  fields_text: Execution Environment/Sandbox, Tool Type, Tool Call I/O
  evidence: [TA-06, AOC-02]
- id: CP-20
  pattern: Push-notification callback registered to a new external domain
  indicates: Covert egress channel via delegated-task callbacks
  fields_text: A2A Task Lifecycle Event, Output Egress Destination, Peer Agent Card
  evidence: [TA-01, AOC-11]
- id: CP-21
  pattern: Inference parameters diverge from approved baseline (temperature ↑, stop removed, max_tokens ↑)
  indicates: Config tampering widening extraction/jailbreak surface
  fields_text: Inference Parameters, System Prompt, LLM Refusal, Response
  evidence: [TA-04, TA-07]
- id: CP-22
  pattern: Autonomous trigger + untrusted input segment + egress to new domain
  indicates: Zero-click injection-to-exfiltration
  fields_text: Trigger Type, Input Trust Class, Output Egress Destination
  evidence: [TA-01, AOC-10]
- id: CP-23
  pattern: Event-sequence gap, or hook coverage drops mid-run
  indicates: Telemetry suppression by a compromised agent
  fields_text: Event Sequence Continuity, Instrumentation Coverage, Action Type
  evidence: [AOC-10, AOC-01]
- id: CP-24
  pattern: Memory footprint exceeds declared cap, or the declared cap itself changes
  indicates: Memory-store exhaustion or silent limit removal
  fields_text: Memory Footprint, Declared Memory Configuration, Memory Write
  evidence: [AOC-05, AOC-07]
- id: CP-25
  pattern: Same tenant ID across identities that should be isolated
  indicates: Cross-tenant credential propagation / data bleed
  fields_text: Organization/Tenant ID, Identities Used, Memory Read, Retrieval Event
  evidence: [AOC-02, AOC-05]
- id: CP-26
  pattern: Egress operation denied on accumulated session taint, with a clean payload
  indicates: Write-down attempt / injection-driven exfiltration
  fields_text: Session Taint Labels, Authorization Decision Record, Output Egress Destination
  evidence: [TA-01, TA-02, AOC-03]
- id: CP-27
  pattern: Security attribute self-asserted by the agent contradicts the authority-supplied value
  indicates: Compromised agent falsifying its own state
  fields_text: Attribute Source Marking, Verified-vs-Displayed Identity, Authorization Decision Record
  evidence: [AOC-01, AOC-08, AOC-10]
- id: CP-28
  pattern: High-impact action executes with no approval record, or on an approval whose scope no longer covers the arguments
  indicates: Missing or replayed human authorization
  fields_text: Human Approval / Elicitation Event, Tool Call I/O, Authorization Decision Record
  evidence: [AOC-01, AOC-07, AOC-11]
- id: CP-29
  pattern: Deny-code distribution shifts, or the same rule denies repeatedly then allows
  indicates: Policy probing; authorization bypass found
  fields_text: Authorization Decision Record, Identities Used, Source IP
  evidence: [AOC-02, AOC-08, IR-01]
- id: CP-30
  pattern: Minted credential's granted scope exceeds requested, or inbound token forwarded unnarrowed
  indicates: Over-broad delegation / confused deputy
  fields_text: Credential Minting & Scope-Narrowing, Granted Authorizations, Identities Used
  evidence: [TA-08, AOC-08]
- id: CP-31
  pattern: Capability reached over a path with no mediation record
  indicates: Reference-monitor bypass
  fields_text: Mediation Coverage & Bypass Path, Tool Type/Trust Boundary, Tool Call I/O
  evidence: [AOC-14, AOC-02]
- id: CP-32
  pattern: Inference or tool routed to a backend outside the restriction in force
  indicates: Data-residency or routing-policy violation
  fields_text: Backend / Route Restriction Decision, Session Taint Labels, Provider/Endpoint Identity
  evidence: [AOC-06, TA-01]
