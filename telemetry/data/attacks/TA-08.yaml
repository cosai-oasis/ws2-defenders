# TA-08. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-08
name: Tool-chaining escalation
label: Agentic privilege escalation via tool chaining (2024 to 2025)
ref: 11
what_happened: A compromised agent chains individually-authorized calls (read email → find creds → authenticate → modify DB) into unauthorized escalation.
detecting_fields_text: Tool Call I/O (creds passed between calls), Identities Used (identity change across chain), Action Type (long Tool-Call sequence), Observation/Thought, Tool Name (escalating sequence), Tool ACL/Scope (separation-of-duties), tool-call count
fields:
- field: tool_call_io
  note: creds passed between calls
- field: identities_used_per_hop
  note: identity change across chain
- field: action_type
  note: long Tool-Call sequence
- observation_thought_reasoning_trace
- field: tool_name
  note: escalating sequence
- field: tool_acl_required_scope
  note: separation-of-duties
- loop_step_count_signal
components_text: Tools, Identity, ReasoningCore
atlas_text: '`AML.T0053` AI Agent Tool Invocation'
atlas_notes: Chained authorized calls → escalation
reference: 'Agentic AI threats: tool-chaining privilege escalation. Lakera. <https://www.lakera.ai/blog/agentic-ai-threats-p2>'
