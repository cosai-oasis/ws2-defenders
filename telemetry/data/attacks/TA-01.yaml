id: TA-01
name: EchoLeak
label: '**EchoLeak** (Microsoft 365 Copilot; CVE-2025-32711; disclosed Jun 2025)'
ref: 4
what_happened: 'Zero-click "LLM scope violation": a single crafted email, requiring no user interaction, is retrieved into Copilot''s context and treated as instruction, chaining bypasses of the XPIA injection classifier, link redaction, and CSP to exfiltrate internal SharePoint/OneDrive/Teams content through a trusted proxy domain.'
detecting_fields_text: Model Input + Input Trust Class, Trigger Type (autonomous), Retrieval Event, Retrieved-Content Source, Tool Call I/O, Output Egress Destination, Guardrail (Input) Verdict, Enforcement-Point Availability
components_text: AgentInputHandling, RAGContent, Tools, AgentOutputHandling
atlas_text: '`AML.T0051.001` Indirect Injection; `AML.T0057` Data Leakage; `AML.T0070` RAG Poisoning; `AML.T0067` LLM Trusted Output Components Manipulation'
atlas_notes: Zero-click chained exfil. ATLAS case study `AML.CS0059`
reference: 'EchoLeak, zero-click data exfiltration from Microsoft 365 Copilot (CVE-2025-32711, CVSS 9.3). Discovered and disclosed by **Aim Labs (Aim Security)**; reported to MSRC Jan 2025, fixed server-side and publicly disclosed Jun 2025. Microsoft advisory: <https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-32711> · CVE record: <https://nvd.nist.gov/vuln/detail/CVE-2025-32711> · **Technical analysis:** Reddy, P. & Gujral, A. *EchoLeak: The First Real-World Zero-Click Prompt Injection Exploit in a Production LLM System.* arXiv:2509.10540 (2025). <https://arxiv.org/abs/2509.10540>'
