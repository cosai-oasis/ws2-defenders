# TA-23. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-23
name: OpenClaw 1-click RCE
label: '**OpenClaw 1-click RCE with confirmation bypass** (CVE-2026-25253; DepthFirst, Feb 2026)'
ref: 58
what_happened: A malicious link executed script in the agent's context, stole its token, then **modified the agent's configuration to disable the user-confirmation step** and escaped the container to run shell commands on the host. The approval gate was not defeated by argument; it was switched off as configuration.
