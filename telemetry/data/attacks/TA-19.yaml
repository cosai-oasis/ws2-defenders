# TA-19. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-19
name: Delayed tool invocation
label: '**Delayed automatic tool invocation** (Google Gemini; Embrace The Red)'
ref: 22
what_happened: Untrusted content entering context in one turn plants instructions that fire on a **later** turn, defeating a control that forbids sensitive tool invocation in the same turn the untrusted data arrived. Invisible to any detection scoped to a single turn.
detecting_fields_text: Session / Turn / Step IDs, Input Trust Classification, Model Input, Tool Call I/O
