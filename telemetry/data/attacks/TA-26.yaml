what_happened: 'A prompt injection embedded in a **PDF** reached a computer-use agent when a user asked it to work with the file, used jailbreak and obfuscation to clear the guardrails, and invoked the agent''s `bash` tool to destroy user data. The corpus''s first computer-use instance: the capability is a shell, and the carrier is an attachment.'
