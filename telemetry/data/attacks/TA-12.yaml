# TA-12. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-12
name: Supabase MCP
label: '**Supabase MCP, private-table exposure via stored prompt injection** (Jul 2025)'
ref: 15
what_happened: Instructions planted in a customer support ticket were read by an agent operating the database through an MCP server under the `service_role` credential, which **bypasses row-level security**, causing it to execute attacker-supplied SQL and expose private tables. The published analysis names the precondition set, private-data access, untrusted content, and an external channel, as the *lethal trifecta*.
detecting_fields_text: Input Trust Classification, Retrieval Event, MCP Server Identity & Primitive, Tool Call I/O, Tool ACL / Required Scope, Authorization Decision Record, Output Egress Destination
fields: [input_trust_classification, retrieval_event, mcp_server_identity_primitive, tool_call_io, tool_acl_required_scope, authorization_decision_record, output_egress_destination]
components_text: AgentInputHandling, Tools, Identity, AgentOutputHandling
atlas_text: '`AML.T0051.001` Indirect Injection; `AML.T0053` AI Agent Tool Invocation; `AML.T0057` Data Leakage'
atlas_notes: Stored injection in ticket data → `service_role` MCP tool bypassing RLS → private tables
reference: 'Supabase MCP private-table exposure via stored prompt injection. General Analysis. <https://generalanalysis.com/blog/supabase-mcp-blog> · analysis applying the **"lethal trifecta"** framing (private data + untrusted content + external communication): S. Willison, 6 Jul 2025, <https://simonwillison.net/2025/Jul/6/supabase-mcp-lethal-trifecta/> · vendor response: <https://supabase.com/blog/defense-in-depth-mcp>'
