# TA-13. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-13
name: WordPress AI Engine
label: '**AI Engine (WordPress), MCP privilege escalation** (CVE-2025-5071, patched Jun 2025)'
ref: 16
what_happened: A subscriber-level authenticated caller could take full control of the plugin's MCP module and invoke privileged commands including `wp_update_user`, on a plugin installed on 100,000+ sites. Authorization was not enforced at the MCP tool boundary. A second flaw on the same surface (CVE-2025-11749, CVSS 9.8) later allowed **unauthenticated** retrieval of the MCP bearer token, yielding full administrative access.
detecting_fields_text: MCP Server Identity & Primitive, Authorization Decision Record, Identities Used, Granted Authorizations / Scope, Tool Error
components_text: Tools, Identity
atlas_text: '`AML.T0053` AI Agent Tool Invocation; MITRE **ATT&CK** privilege escalation'
atlas_notes: Authorization not enforced at the MCP tool boundary
reference: 'AI Engine (WordPress) MCP privilege escalation, **CVE-2025-5071** (CVSS 8.8, v2.8.0 to 2.8.3, disclosed 18 Jun 2025). <https://www.cve.org/CVERecord?id=CVE-2025-5071> · a second, unauthenticated flaw on the same MCP surface followed: **CVE-2025-11749** (CVSS 9.8, fixed in 3.1.4), <https://wpscan.com/vulnerability/b0d583a2-14e1-40bc-b875-3b48e992b803/> · <https://github.com/advisories/GHSA-q6x7-qqgq-h832>'
