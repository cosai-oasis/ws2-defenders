# TA-17. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-17
name: DifyTap
label: '**DifyTap, cross-tenant trace-configuration hijack** (Dify; CVE-2026-41947, CVSS 9.1; Jun 2026)'
ref: 20
what_happened: 'An authenticated editor could set and enable **trace configurations for any application regardless of tenant ownership**, redirecting every message and response of a victim tenant''s application to an attacker-controlled trace provider: a persistent exfiltration channel built out of the observability plane itself. Three of the four disclosed flaws carried cross-tenant impact.'
detecting_fields_text: Organization / Tenant ID, Instrumentation Coverage / Hook Attestation, Authorization Decision Record, Output Egress Destination, Identities Used
components_text: Application, Identity
atlas_text: '`AML.T0057` LLM Data Leakage; `AML.T0048` External Harms'
atlas_notes: Observability plane repurposed as the exfiltration channel
reference: DifyTap, four vulnerabilities in Dify enabling cross-tenant data exposure; **CVE-2026-41947** (CVSS 9.1) trace-configuration authorization bypass, with CVE-2026-41948/-41949/-41950. Zafran Security (Ido Shani, Gal Zaban), 22 June 2026; fixed in 1.14.2. <https://thehackernews.com/2026/06/researchers-detail-difytap-flaws-in.html>
