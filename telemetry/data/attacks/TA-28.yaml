# TA-28. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-28
name: SesameOp
label: '**SesameOp, provider API as command and control** (Microsoft DART, Jul 2025)'
ref: 63
what_happened: A backdoor used a **model provider's Assistants API as its C2 channel**, fetching commands and exfiltrating encrypted results through it for several months. The exfiltration destination is the same endpoint the application legitimately calls, so destination alone does not separate the two.
detecting_fields_text: Output Egress Destination, Provider / Endpoint Identity, Tool Call I/O, Identities Used
components_text: ModelServing, ApplicationOutputHandling
atlas_text: '`AML.T0086` Exfiltration via AI Agent Tool Invocation; `AML.T0040` AI Model Inference API Access'
atlas_notes: Provider API as C2. ATLAS case study `AML.CS0042`
reference: 'SesameOp: backdoor abusing the OpenAI Assistants API as a covert command-and-control and exfiltration channel over several months. Microsoft Incident Response (DART), 3 November 2025. MITRE ATLAS case study **`AML.CS0042`**. <https://www.microsoft.com/en-us/security/blog/2025/11/03/sesameop-novel-backdoor-uses-openai-assistants-api-for-command-and-control/>'
