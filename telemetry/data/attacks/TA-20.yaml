# TA-20. Extracted verbatim from AD §3 (phase 1); *_text cells are unreconciled.
id: TA-20
name: LLMjacking
label: '**LLMjacking, stolen cloud credentials reselling model access** (Sysdig, May 2024)'
ref: 55
what_happened: Stolen cloud credentials were used to reach cloud-hosted models, enumerate which models a victim account had enabled, and stand up a **reverse proxy reselling that access** to third parties. Cost lands on the victim; the activity is legitimate inference traffic under a valid identity.
detecting_fields_text: Resource-Consumption Aggregate, Input / Output Token Counts, Identities Used, Provider / Endpoint Identity, Model Name + Version (enumeration)
components_text: ModelServing, Identity
atlas_text: '`AML.T0034.000` Cost Harvesting: Excessive Queries; `AML.T0012` Valid Accounts; `AML.T0040` AI Model Inference API Access'
atlas_notes: Stolen credentials resold as model access
reference: 'LLMjacking: stolen cloud credentials used to access cloud-hosted models and resell that access via a reverse proxy. Sysdig Threat Research Team, 6 May 2024. MITRE ATLAS case study **`AML.CS0030`**. <https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/>'
