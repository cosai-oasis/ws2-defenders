- resource_consumption_aggregate
- input_output_token_counts
- identities_used_per_hop
- provider_endpoint_identity
- field: model_name_version
  note: enumeration
components_text: ModelServing, Identity
atlas_text: '`AML.T0034.000` Cost Harvesting: Excessive Queries; `AML.T0012` Valid Accounts; `AML.T0040` AI Model Inference API Access'
atlas_notes: Stolen credentials resold as model access
reference: 'LLMjacking: stolen cloud credentials used to access cloud-hosted models and resell that access via a reverse proxy. Sysdig Threat Research Team, 6 May 2024. MITRE ATLAS case study **`AML.CS0030`**. <https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/>'
risks: [riskCredentialAndTokenTheft, riskEconomicDenialOfWallet]
